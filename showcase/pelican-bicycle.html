<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5e9cf">
  <title>The Fish Run — a pelican on a bicycle</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f5e9cf; }
    body { display: grid; place-items: center; }
    svg { display: block; width: min(100vw, 1600px); height: auto; }
  </style>
</head>
<body>
  <!-- One illustration, one SVG. No images, fonts, libraries, JavaScript, or canvas. -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="art-title art-description">
    <title id="art-title">The Fish Run: a pelican riding a bicycle</title>
    <desc id="art-description">An animated, hand-drawn pelican pedals a teal bicycle along a sunny seaside road. Its wheels spin, its feet pedal, and its red scarf flutters in the breeze.</desc>
    <defs>
      <linearGradient id="sky" x2="0" y2="1">
        <stop offset="0" stop-color="#e8f5e9"/>
        <stop offset=".63" stop-color="#f9eed4"/>
        <stop offset="1" stop-color="#f5d7b5"/>
      </linearGradient>
      <linearGradient id="sea" x2="0" y2="1">
        <stop stop-color="#8bc8b8"/>
        <stop offset="1" stop-color="#5fa8a5"/>
      </linearGradient>
      <radialGradient id="sun">
        <stop offset="0" stop-color="#fff2ad"/>
        <stop offset=".72" stop-color="#f8c975"/>
        <stop offset="1" stop-color="#f1aa71"/>
      </radialGradient>
      <linearGradient id="feathers" x1="0" y1="0" x2=".8" y2="1">
        <stop stop-color="#fff9e9"/>
        <stop offset=".6" stop-color="#f8ecd0"/>
        <stop offset="1" stop-color="#dfd7b9"/>
      </linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2=".3" y2="1">
        <stop stop-color="#f6be6e"/>
        <stop offset=".53" stop-color="#ed975c"/>
        <stop offset="1" stop-color="#cc7057"/>
      </linearGradient>
      <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#ffe1a1"/>
        <stop offset="1" stop-color="#eca45d"/>
      </linearGradient>
      <pattern id="flecks" width="38" height="38" patternUnits="userSpaceOnUse">
        <circle cx="5" cy="6" r="1" fill="#876b56" opacity=".24"/>
        <circle cx="27" cy="21" r=".8" fill="#876b56" opacity=".22"/>
        <circle cx="15" cy="33" r=".65" fill="#876b56" opacity=".22"/>
      </pattern>
      <path id="spoke" d="M0 -14V-116" stroke="#78959a" stroke-width="2.3" stroke-linecap="round"/>
      <g id="spokes">
        <use href="#spoke"/>
        <use href="#spoke" transform="rotate(20)"/>
        <use href="#spoke" transform="rotate(40)"/>
        <use href="#spoke" transform="rotate(60)"/>
        <use href="#spoke" transform="rotate(80)"/>
        <use href="#spoke" transform="rotate(100)"/>
        <use href="#spoke" transform="rotate(120)"/>
        <use href="#spoke" transform="rotate(140)"/>
        <use href="#spoke" transform="rotate(160)"/>
        <use href="#spoke" transform="rotate(180)"/>
        <use href="#spoke" transform="rotate(200)"/>
        <use href="#spoke" transform="rotate(220)"/>
        <use href="#spoke" transform="rotate(240)"/>
        <use href="#spoke" transform="rotate(260)"/>
        <use href="#spoke" transform="rotate(280)"/>
        <use href="#spoke" transform="rotate(300)"/>
        <use href="#spoke" transform="rotate(320)"/>
        <use href="#spoke" transform="rotate(340)"/>
      </g>
      <g id="wheel-rings">
        <circle r="135" fill="#f9e9cc" fill-opacity=".3" stroke="#293f45" stroke-width="19"/>
        <circle r="122" fill="none" stroke="#f9ebd1" stroke-width="9"/>
        <circle r="117" fill="none" stroke="#537f82" stroke-width="5"/>
        <circle r="113" fill="none" stroke="#fff8df" stroke-width="1.5" opacity=".7"/>
      </g>
      <path id="frame" d="M360 548 522 414 563 548 360 548 M522 414 730 397 563 548" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <style>
        /* Everything visible is SVG; the CSS only moves SVG parts. */
        .road-marks { animation: passing 2.6s linear infinite; }
        .ribbon { transform-box: fill-box; transform-origin: right center; animation: flutter 1.6s ease-in-out infinite alternate; }
        .tail-tip { transform-box: fill-box; transform-origin: right center; animation: tail 2.2s ease-in-out infinite alternate; }
        @keyframes passing { to { transform: translateX(-210px); } }
        @keyframes flutter { to { transform: rotate(-9deg) translateY(-6px); } }
        @keyframes tail { to { transform: rotate(5deg); } }
        @media (prefers-reduced-motion: reduce) {
          .road-marks, .ribbon, .tail-tip { animation: none; }
        }
      </style>
    </defs>

    <!-- A small coastal postcard, not a pasted-on photo. -->
    <path fill="url(#sky)" d="M0 0h1200v760H0z"/>
    <circle cx="1001" cy="136" r="77" fill="url(#sun)"/>
    <circle cx="1001" cy="136" r="96" fill="none" stroke="#f4cf9a" stroke-width="2" opacity=".7"/>
    <g fill="#fffaf0" opacity=".8">
      <path d="M36 258c12-22 39-23 53-6 12-14 36-12 45 6 23-7 41 6 44 24H25c0-10 4-18 11-24Z"/>
      <path d="M827 87c10-18 32-20 44-6 10-13 29-10 37 5 20-4 35 8 38 23H819c-1-9 2-17 8-22Z"/>
      <path d="M1051 325c8-15 26-18 37-5 10-10 25-9 32 4 17-4 32 7 34 20h-112c-1-9 2-15 9-19Z"/>
    </g>
    <path d="M0 474c134-15 257-7 357 14 115-23 209-23 300-3 148-31 312-24 543-4v155H0Z" fill="#d7e4c7"/>
    <path d="M0 524q175-24 350 0t350 0 500 0v124H0Z" fill="url(#sea)"/>
    <path d="M0 543q180-18 365 5t325-2 510-3M0 580q157-15 317 0t319-2 564-3" fill="none" stroke="#f3f6db" stroke-width="4" opacity=".65"/>
    <path d="M0 589q150-20 302 7 143-26 279-7 177-23 328 4 177-18 291-3v170H0Z" fill="#dfd2a9"/>
    <path d="M0 646q110-19 201-6 118-27 233-7 168-24 300 0 224-21 466-11v138H0Z" fill="#efc89d"/>
    <path d="M0 675q250-18 450 2 233-14 421-9 149 4 329-11v103H0Z" fill="#dba982"/>
    <path d="M0 675q250-18 450 2 233-14 421-9 149 4 329-11" fill="none" stroke="#fff0c8" stroke-width="5" opacity=".7"/>
    <path fill="url(#flecks)" d="M0 570h1200v190H0z"/>
    <g fill="none" stroke="#638e76" stroke-width="4" stroke-linecap="round" opacity=".75">
      <path d="M93 636q-6-19-15-25m15 25q3-17 13-27m-13 27q16-11 28-9"/>
      <path d="M1118 605q-5-21-16-28m16 28q5-20 18-30m-18 30q16-12 28-9"/>
      <path d="M1076 660q-4-18-15-22m15 22q5-16 17-22"/>
    </g>
    <path d="M0 720h1200" stroke="#f8e1bd" stroke-width="4" stroke-dasharray="14 17" opacity=".7"/>
    <g class="road-marks" stroke="#fff0d1" stroke-width="7" stroke-linecap="round" opacity=".7">
      <path d="M-110 740h63M100 740h63M310 740h63M520 740h63M730 740h63M940 740h63M1150 740h63M1360 740h63"/>
    </g>

    <!-- All lettering is part of the SVG, too. -->
    <g fill="#304a4e">
      <text x="78" y="71" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="5" font-size="15">A LITTLE SEASIDE STORY</text>
      <path d="M79 91h68" stroke="#e18d65" stroke-width="5" stroke-linecap="round"/>
      <text x="72" y="147" font-family="Georgia, Times New Roman, serif" font-weight="700" font-style="italic" font-size="63" letter-spacing="-2">The fish run.</text>
      <text x="78" y="179" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.2" fill="#6c7770">Two wheels. One very big beak.</text>
    </g>

    <!-- The wheels sit on the road; only the spokes rotate. -->
    <ellipse cx="602" cy="695" rx="445" ry="19" fill="#72574d" opacity=".17"/>
    <g transform="translate(360 548)">
      <use href="#wheel-rings"/>
      <g>
        <use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite"/>
      </g>
      <circle r="19" fill="#f3e1bb" stroke="#30464a" stroke-width="5"/>
      <circle r="7" fill="#486c70"/>
    </g>
    <g transform="translate(840 548)">
      <use href="#wheel-rings"/>
      <g>
        <use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite"/>
      </g>
      <circle r="19" fill="#f3e1bb" stroke="#30464a" stroke-width="5"/>
      <circle r="7" fill="#486c70"/>
    </g>

    <!-- Rear rack and wicker fish basket. Its diagonal weave is actual paths. -->
    <path d="M284 413h129l-28 8H302Z" fill="#467b78" stroke="#30484c" stroke-width="5" stroke-linejoin="round"/>
    <path d="M320 418 360 548m35-130-35 130" fill="none" stroke="#496a6a" stroke-width="7" stroke-linecap="round"/>
    <path d="M278 366h130l-21 68H298Z" fill="#b8794f" stroke="#775741" stroke-width="5" stroke-linejoin="round"/>
    <path d="M277 366h133M284 378h121M290 397h107M296 415h95M317 370l-17 61m40-62-11 64m35-64-5 64m29-65-2 60" fill="none" stroke="#edbe83" stroke-width="3.5" opacity=".9"/>
    <path d="M317 346q14-11 24 3l-3 20h-24Z" fill="#b6d2c7" stroke="#315459" stroke-width="3"/>
    <path d="m338 351 18-10-3 15-13 5" fill="#8abcb4" stroke="#315459" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="325" cy="355" r="2.6" fill="#2e4d51"/>
    <path d="M360 340q14-12 25 2l-4 27h-25Z" fill="#c3dad0" stroke="#315459" stroke-width="3"/>
    <path d="m383 343 17-11-1 18-14 8" fill="#8abcb4" stroke="#315459" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="369" cy="350" r="2.6" fill="#2e4d51"/>
    <path d="M279 363h129" fill="none" stroke="#744f3b" stroke-width="8" stroke-linecap="round"/>

    <!-- Chain, sprockets, and the far leg go behind the frame. -->
    <path d="M360 531 562 509M360 565 562 578" fill="none" stroke="#37494a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="360" cy="548" r="17" fill="none" stroke="#826d58" stroke-width="5"/>
    <circle cx="563" cy="548" r="39" fill="none" stroke="#344a4a" stroke-width="7"/>
    <circle cx="563" cy="548" r="32" fill="none" stroke="#ba8e5a" stroke-width="3" stroke-dasharray="4 7"/>

    <path d="M504 381Q470 411 483 451Q488 479 528 513" fill="none" stroke="#9e5842" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" calcMode="linear" keyTimes="0;.25;.5;.75;1" values="M504 381Q470 411 483 451Q488 479 528 513;M504 381Q544 405 558 447Q579 477 598 513;M504 381Q536 416 581 472Q589 529 598 583;M504 381Q468 414 484 478Q488 536 528 583;M504 381Q470 411 483 451Q488 479 528 513"/>
    </path>
    <path d="M504 381Q470 411 483 451Q488 479 528 513" fill="none" stroke="#e79260" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" calcMode="linear" keyTimes="0;.25;.5;.75;1" values="M504 381Q470 411 483 451Q488 479 528 513;M504 381Q544 405 558 447Q579 477 598 513;M504 381Q536 416 581 472Q589 529 598 583;M504 381Q468 414 484 478Q488 536 528 583;M504 381Q470 411 483 451Q488 479 528 513"/>
    </path>

    <!-- Real bicycle triangles: rear stays, top/down/seat tubes and fork. -->
    <use href="#frame" stroke="#30494c" stroke-width="21"/>
    <use href="#frame" stroke="#429b93" stroke-width="12"/>
    <path d="M527 418 730 400" fill="none" stroke="#b3d8bf" stroke-width="2.5" opacity=".85"/>
    <path d="M738 400q52 76 102 148" fill="none" stroke="#30494c" stroke-width="20" stroke-linecap="round"/>
    <path d="M738 400q52 76 102 148" fill="none" stroke="#74b8aa" stroke-width="11" stroke-linecap="round"/>
    <path d="M710 406h44" stroke="#2d4a4a" stroke-width="27" stroke-linecap="round"/>
    <path d="M712 406h40" stroke="#d8c995" stroke-width="7" stroke-linecap="round"/>
    <path d="M512 390v32" stroke="#30494c" stroke-width="12" stroke-linecap="round"/>
    <path d="M474 380q15-14 45-10 18 2 43 13-2 8-22 8h-51q-12 0-15-11Z" fill="#8e5849" stroke="#30494c" stroke-width="5"/>
    <path d="M485 378q25-7 53 3" fill="none" stroke="#d59b71" stroke-width="3" stroke-linecap="round"/>
    <path d="M735 399 751 351 789 344" fill="none" stroke="#30494c" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M735 399 751 351 789 344" fill="none" stroke="#8cc6b2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M778 343q26-4 31 14l-4 24" fill="none" stroke="#30494c" stroke-width="12" stroke-linecap="round"/>
    <path d="M779 343q17-1 21 10" fill="none" stroke="#e2ac76" stroke-width="5" stroke-linecap="round"/>
    <path d="M758 343q2-13 15-11 9 0 10 11" fill="#e8b761" stroke="#30494c" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="773" cy="335" r="3" fill="#fff1bd"/>
    <path d="M804 380v12" stroke="#30494c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="805" cy="396" r="9" fill="#ffeab8" stroke="#30494c" stroke-width="4"/>

    <!-- A tiny frame badge, still vector lettering. -->
    <g transform="translate(619 454) rotate(-43)">
      <rect x="-25" y="-9" width="50" height="18" rx="8" fill="#f3dbad" stroke="#2c4c4d" stroke-width="3"/>
      <text x="0" y="4" text-anchor="middle" fill="#305e5d" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">TIDE</text>
    </g>
    <g>
      <path d="M563 548 598 583m-35-35-35-35" fill="none" stroke="#30494c" stroke-width="11" stroke-linecap="round"/>
      <path d="M563 548 598 583m-35-35-35-35" fill="none" stroke="#d3b478" stroke-width="5" stroke-linecap="round"/>
      <path d="M586 583h25M516 513h25" stroke="#30494c" stroke-width="10" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 563 548" to="360 563 548" dur="3s" repeatCount="indefinite"/>
    </g>
    <circle cx="563" cy="548" r="13" fill="#f3d7a2" stroke="#30494c" stroke-width="5"/>
    <circle cx="563" cy="548" r="4" fill="#5e8d86"/>

    <!-- Foreground leg; the bird's body will cover the hip naturally. -->
    <path d="M539 380Q581 393 617 463Q610 518 598 583" fill="none" stroke="#9e5842" stroke-width="29" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" calcMode="linear" keyTimes="0;.25;.5;.75;1" values="M539 380Q581 393 617 463Q610 518 598 583;M539 380Q535 412 547 470Q540 526 528 583;M539 380Q500 414 508 449Q511 482 528 513;M539 380Q560 409 584 448Q599 481 598 513;M539 380Q581 393 617 463Q610 518 598 583"/>
    </path>
    <path d="M539 380Q581 393 617 463Q610 518 598 583" fill="none" stroke="#f3a466" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" calcMode="linear" keyTimes="0;.25;.5;.75;1" values="M539 380Q581 393 617 463Q610 518 598 583;M539 380Q535 412 547 470Q540 526 528 583;M539 380Q500 414 508 449Q511 482 528 513;M539 380Q560 409 584 448Q599 481 598 513;M539 380Q581 393 617 463Q610 518 598 583"/>
    </path>

    <!-- Pelican silhouette: tail, rounded body, S-neck, pouch, long hooked bill. -->
    <g class="tail-tip" fill="url(#feathers)" stroke="#344c4d" stroke-width="5" stroke-linejoin="round">
      <path d="M465 308q-64-16-101-58 8 56 69 91Z"/>
      <path d="M463 320q-76-1-111-32 28 52 91 55Z"/>
      <path d="M461 337q-57 15-83-2 26 35 83 26Z"/>
    </g>
    <path d="M444 260c-48 18-72 77-43 118 22 33 83 48 146 40 51-6 96-31 113-67 17-33-5-69-48-89-54-26-124-24-168-2Z" fill="url(#feathers)" stroke="#344c4d" stroke-width="6"/>
    <path d="M433 357q75 74 180 13-38 56-129 46-34-7-51-59Z" fill="#dfd6b6" opacity=".65"/>
    <path d="M588 337q37-26 31-78c-3-30-20-49-18-72 2-32 23-60 55-68 34-9 69 9 77 38 7 29-7 49-31 57-23 8-48-3-54-29-2 26 17 65 12 106-4 40-18 61-49 81Z" fill="url(#feathers)" stroke="#344c4d" stroke-width="6" stroke-linejoin="round"/>
    <path d="M614 258q18 40 0 77" fill="none" stroke="#d6d0af" stroke-width="6" stroke-linecap="round"/>
    <path d="M647 170q-14-28 10-45" fill="none" stroke="#fffdf0" stroke-width="6" stroke-linecap="round" opacity=".8"/>

    <!-- Three little head feathers and a watchful eye. -->
    <path d="M656 125q-11-24 2-35m9 30q0-29 15-34m-5 37q18-27 29-23" fill="none" stroke="#344c4d" stroke-width="5" stroke-linecap="round"/>
    <path d="M658 122q-5-20 2-27m9 26q3-23 12-29" fill="none" stroke="#f8efd5" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="699" cy="156" rx="13" ry="14" fill="#fff9e7" stroke="#344c4d" stroke-width="4"/>
    <circle cx="704" cy="157" r="5.6" fill="#304a4e"/>
    <circle cx="706" cy="154" r="2" fill="#fff"/>
    <path d="M688 136q13-8 25 2" fill="none" stroke="#ac8d6f" stroke-width="3" stroke-linecap="round"/>

    <!-- The orange pouch is distinct from the hard upper bill. -->
    <path d="M714 186c62 20 219 33 319 4-16 43-38 81-90 99-72 27-149 7-193-32-24-22-34-47-36-71Z" fill="url(#pouch)" stroke="#9b6150" stroke-width="5" stroke-linejoin="round"/>
    <path d="M750 219q36 62 118 71m35-74q44 49 91 19" fill="none" stroke="#fff0b1" stroke-width="4" opacity=".35" stroke-linecap="round"/>
    <path d="M717 165q81-13 164-1c58 8 127 9 154 10 15 0 22 7 15 16l-10 22c-4 7-15 6-16-2l-2-8c-92 16-205 14-306-15-14-4-15-15 1-22Z" fill="url(#bill)" stroke="#9b6150" stroke-width="5" stroke-linejoin="round"/>
    <path d="M742 173q137-4 267 12" fill="none" stroke="#fff4ce" stroke-width="5" stroke-linecap="round" opacity=".75"/>
    <path d="M746 188q123 36 271 13" fill="none" stroke="#c17a54" stroke-width="3" opacity=".7"/>
    <ellipse cx="758" cy="174" rx="5.5" ry="2.5" fill="#95644f"/>

    <!-- Wind in the scarf; a folded wing actually reaches the handlebar. -->
    <path class="ribbon" d="M629 243q-60-29-99-12 27 7 39 20-33-3-53 10 62-3 114 8Z" fill="#d4685b" stroke="#825a50" stroke-width="4" stroke-linejoin="round"/>
    <path d="M619 236q24 8 41-5l-2 21q-16 16-36 7Z" fill="#e97c63" stroke="#825a50" stroke-width="4"/>
    <path d="M629 243q15 6 26-2" fill="none" stroke="#ffd7a8" stroke-width="3" stroke-linecap="round"/>
    <path d="M502 289c45-27 90-15 132 14 29 19 44 37 69 39 20 2 42-8 64-6 18-4 31 2 34 11 3 11-11 19-28 17-27 7-60 10-91-9l-32-19c-42 41-103 48-146 18-20-13-23-44-2-65Z" fill="#f4ecd2" stroke="#344c4d" stroke-width="6" stroke-linejoin="round"/>
    <path d="M518 318q36 38 91 11m-78 22q33 22 71-1m17-55q28 18 40 32" fill="none" stroke="#d0c9ad" stroke-width="6" stroke-linecap="round"/>
    <path d="M754 348q27-10 41-4" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round"/>

    <!-- Both webbed feet trace the same circles as the two opposing cranks. -->
    <g transform="translate(528 513)">
      <path d="M-9-7q6-5 12 2l6 8 14 4q8 3 5 10-2 5-10 4l-29-1q-10-1-13-7-3-9 6-11Z" fill="#dd8255" stroke="#8e5846" stroke-width="4" stroke-linejoin="round"/>
      <path d="m6 9 13 7m-20-7 10 8" stroke="#a96349" stroke-width="2.5" stroke-linecap="round"/>
      <animateMotion path="M0 0 A49.5 49.5 0 0 1 70 0 A49.5 49.5 0 0 1 70 70 A49.5 49.5 0 0 1 0 70 A49.5 49.5 0 0 1 0 0" additive="sum" dur="3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(598 583)">
      <path d="M-9-7q6-5 12 2l6 8 14 4q8 3 5 10-2 5-10 4l-29-1q-10-1-13-7-3-9 6-11Z" fill="#f4aa70" stroke="#8e5846" stroke-width="4" stroke-linejoin="round"/>
      <path d="m6 9 13 7m-20-7 10 8" stroke="#b97550" stroke-width="2.5" stroke-linecap="round"/>
      <animateMotion path="M0 0 A49.5 49.5 0 0 1 -70 0 A49.5 49.5 0 0 1 -70 -70 A49.5 49.5 0 0 1 0 -70 A49.5 49.5 0 0 1 0 0" additive="sum" dur="3s" repeatCount="indefinite"/>
    </g>

    <path d="M24 24h1152v712H24z" fill="none" stroke="#fff9e8" stroke-width="3" opacity=".72"/>
    <path d="M73 705h126m802 0h126" stroke="#f9e2bb" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </svg>
</body>
</html>
