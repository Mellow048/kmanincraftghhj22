<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a bike — SVG test</title>
<style>
  html, body { height: 100%; margin: 0; background: #bfe6f7; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">A pelican riding a bicycle</title>
  <desc id="d">A white pelican with a long orange beak and pouch rides a red bicycle.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8ee"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky and ground -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="90" fill="url(#sun)"/>
  <circle cx="660" cy="110" r="34" fill="#ffef9e"/>
  <rect y="535" width="800" height="65" fill="#8fce7a"/>
  <rect y="535" width="800" height="6" fill="#6fb45c"/>
  <ellipse cx="400" cy="540" rx="300" ry="12" fill="#000" opacity=".10"/>

  <g id="rig">
    <!-- ===== bicycle ===== -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- wheels -->
      <g fill="none" stroke="#2b2f33" stroke-width="9">
        <circle cx="270" cy="475" r="72"/>
        <circle cx="530" cy="475" r="72"/>
      </g>
      <!-- spokes (spin) -->
      <g stroke="#9aa4ab" stroke-width="2">
        <g id="rear-spokes">
          <animateTransform attributeName="transform" type="rotate"
            from="0 270 475" to="360 270 475" dur="1.6s" repeatCount="indefinite"/>
          <line x1="270" y1="403" x2="270" y2="547"/>
          <line x1="198" y1="475" x2="342" y2="475"/>
          <line x1="219" y1="424" x2="321" y2="526"/>
          <line x1="321" y1="424" x2="219" y2="526"/>
        </g>
        <g id="front-spokes">
          <animateTransform attributeName="transform" type="rotate"
            from="0 530 475" to="360 530 475" dur="1.6s" repeatCount="indefinite"/>
          <line x1="530" y1="403" x2="530" y2="547"/>
          <line x1="458" y1="475" x2="602" y2="475"/>
          <line x1="479" y1="424" x2="581" y2="526"/>
          <line x1="581" y1="424" x2="479" y2="526"/>
        </g>
      </g>
      <!-- hubs -->
      <circle cx="270" cy="475" r="6" fill="#c9d2d8"/>
      <circle cx="530" cy="475" r="6" fill="#c9d2d8"/>

      <!-- frame -->
      <g fill="none" stroke="#e0473c" stroke-width="10">
        <path d="M270 475 L380 470 L335 355 Z"/>        <!-- chain stay + seat tube -->
        <path d="M380 470 L492 352 L335 355"/>          <!-- down tube + top tube -->
        <path d="M270 475 L335 355"/>                   <!-- seat stay -->
        <path d="M492 352 L530 475"/>                   <!-- fork -->
      </g>
      <!-- seat cluster + saddle -->
      <path d="M335 355 L323 343" stroke="#8e2b24" stroke-width="8" stroke-linecap="round"/>
      <path d="M300 340 q34 -12 64 -3 q-8 11 -28 11 q-24 0 -36 -8 z" fill="#31363b"/>
      <!-- head tube / stem / handlebar -->
      <path d="M492 352 L486 330" stroke="#8e2b24" stroke-width="10" stroke-linecap="round"/>
      <path d="M486 330 q22 -12 40 4" fill="none" stroke="#31363b" stroke-width="7" stroke-linecap="round"/>
      <path d="M520 334 q14 2 16 16" fill="none" stroke="#31363b" stroke-width="9" stroke-linecap="round"/>

      <!-- crank + pedals -->
      <circle cx="380" cy="470" r="16" fill="none" stroke="#8e2b24" stroke-width="6"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 380 470" to="360 380 470" dur="1.6s" repeatCount="indefinite"/>
        <line x1="380" y1="470" x2="404" y2="492" stroke="#545c63" stroke-width="6" stroke-linecap="round"/>
        <line x1="380" y1="470" x2="356" y2="448" stroke="#545c63" stroke-width="6" stroke-linecap="round"/>
        <rect x="396" y="488" width="22" height="7" rx="2" fill="#31363b"/>
        <rect x="342" y="441" width="22" height="7" rx="2" fill="#31363b"/>
      </g>
      <circle cx="380" cy="470" r="6" fill="#c9d2d8"/>
    </g>

    <!-- ===== pelican ===== -->
    <g id="pelican">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="1.6s" repeatCount="indefinite"/>

      <!-- tail feathers behind body -->
      <path d="M302 264 q-40 4 -54 24 q34 8 58 -8 z" fill="#e6eef2"/>
      <path d="M302 264 q-40 4 -54 24" fill="none" stroke="#bccbd4" stroke-width="2.5"/>

      <!-- far leg, reaching the upper pedal -->
      <g stroke="#d98a25" stroke-width="9" fill="none" stroke-linecap="round">
        <path d="M336 320 L348 380 L352 438"/>
      </g>
      <path d="M352 438 q18 -2 20 8 q-10 8 -22 4 z" fill="#d98a25"/>

      <!-- body -->
      <ellipse cx="352" cy="272" rx="72" ry="58" fill="url(#body)"/>
      <ellipse cx="326" cy="260" rx="44" ry="32" fill="#ffffff" opacity=".7"/>

      <!-- near leg, reaching the lower pedal -->
      <g stroke="#f0a23b" stroke-width="10" fill="none" stroke-linecap="round">
        <path d="M360 318 L394 392 L406 470"/>
      </g>
      <path d="M408 470 q20 -2 22 8 q-12 10 -24 4 z" fill="#f0a23b"/>

      <!-- neck -->
      <path d="M382 250 q26 -20 30 -50 q2 -18 16 -22"
            fill="none" stroke="#f4f8fa" stroke-width="34" stroke-linecap="round"/>
      <path d="M382 250 q26 -20 30 -50 q2 -18 16 -22"
            fill="none" stroke="#dbe6ec" stroke-width="34" stroke-linecap="round" opacity=".25"/>

      <!-- head -->
      <circle cx="432" cy="168" r="26" fill="#f8fbfc"/>
      <path d="M432 142 q20 -6 24 12" fill="#f5c96b" opacity=".9"/>

      <!-- beak: upper mandible + pouch -->
      <path d="M450 160 q56 4 92 22 q-46 8 -90 2 q-6 -12 -2 -24 z" fill="#f2a13c"/>
      <path d="M452 176 q44 6 84 1 q-30 42 -74 36 q-18 -10 -10 -37 z" fill="#f7b64f"/>
      <path d="M456 180 q34 20 74 6" fill="none" stroke="#d9832a" stroke-width="2" opacity=".7"/>
      <path d="M450 160 q56 4 92 22" fill="none" stroke="#d9832a" stroke-width="2" opacity=".6"/>

      <!-- eye -->
      <circle cx="440" cy="162" r="4.6" fill="#2b2f33"/>
      <circle cx="441.6" cy="160.6" r="1.6" fill="#fff"/>

      <!-- near wing reaching forward to the handlebar -->
      <path d="M362 230
               C 418 236, 478 280, 512 324
               L 524 342
               C 500 350, 470 340, 442 318
               C 404 290, 370 258, 356 236 Z"
            fill="#f4f8fa" stroke="#d5e1e8" stroke-width="2"/>
      <path d="M392 258 C 424 288, 456 312, 490 334" fill="none" stroke="#d5e1e8" stroke-width="2.5"/>
      <path d="M374 246 C 408 276, 442 302, 478 324" fill="none" stroke="#d5e1e8" stroke-width="2.5"/>
      <path d="M416 288 C 442 308, 466 322, 494 332" fill="none" stroke="#d5e1e8" stroke-width="2.5"/>
      <!-- wing tip wraps the grip -->
      <path d="M508 322 q20 4 22 22 q-14 10 -26 -2 q-8 -10 4 -20 z" fill="#fbfdfe"
            stroke="#d5e1e8" stroke-width="2"/>
    </g>

    <!-- little dust puffs behind the rear wheel -->
    <g fill="#ffffff" opacity=".55">
      <circle cx="196" cy="524" r="9">
        <animate attributeName="opacity" values=".55;0;.55" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="176" cy="512" r="6">
        <animate attributeName="opacity" values="0;.55;0" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
</body>
</html>
