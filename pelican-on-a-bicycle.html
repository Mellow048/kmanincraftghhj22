<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coastal Cruise — Pelican Riding a Bicycle</title>
  <style>
    :root {
      --bg-deep: #0d1b26;
      --bg-glow: #183246;
      --card-border: rgba(255, 224, 178, 0.16);
      --ink: #f6efe2;
      --muted: #b3c4cf;
      --accent: #f49b38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 25%, var(--bg-glow) 0%, var(--bg-deep) 74%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      color: var(--ink);
    }

    .gallery-frame {
      width: min(1160px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      background: #2b5d82;
    }

    .stage svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 4px 6px;
    }

    .title-group h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }

    #pause-toggle {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .pause-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 214, 153, 0.32);
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .pause-btn:hover {
      background: rgba(244, 155, 56, 0.16);
      border-color: var(--accent);
    }

    .pause-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #55d694;
      box-shadow: 0 0 8px rgba(85, 214, 148, 0.7);
    }

    .pause-btn .label-paused { display: none; }

    #pause-toggle:checked ~ .caption-bar .pause-btn .dot {
      background: var(--accent);
      box-shadow: none;
    }
    #pause-toggle:checked ~ .caption-bar .pause-btn .label-playing { display: none; }
    #pause-toggle:checked ~ .caption-bar .pause-btn .label-paused { display: inline; }

    #pause-toggle:checked ~ .stage svg * {
      animation-play-state: paused !important;
    }

    /* ========================================================================
       PURE CSS ANIMATIONS (Exact 2:1 Gear Ratio & 36-Step 2-Bone IK)
       ======================================================================== */
    svg * {
      transform-box: view-box;
    }

    .wheel-spin {
      transform-origin: 0px 0px;
      animation: wheelSpin 0.8s linear infinite;
    }

    .chainring-spin {
      transform-origin: 0px 0px;
      animation: crankNearSpin 1.6s linear infinite;
    }

    .chain-march {
      animation: chainMarch 1.6s linear infinite;
    }

    .crank-near { transform-origin: 0px 0px; animation: crankNearSpin 1.6s linear infinite; }
    .pedal-near { transform-origin: 0px 0px; animation: pedalNearSpin 1.6s linear infinite; }
    .crank-far  { transform-origin: 0px 0px; animation: crankFarSpin 1.6s linear infinite; }
    .pedal-far  { transform-origin: 0px 0px; animation: pedalFarSpin 1.6s linear infinite; }

    .hip-near   { transform-origin: 0px 0px; animation: hipNearBob 1.6s linear infinite; }
    .thigh-near { transform-origin: 0px 0px; animation: thighNearRot 1.6s linear infinite; }
    .shin-near  { transform-origin: 0px 0px; animation: shinNearRot 1.6s linear infinite; }
    .foot-near  { transform-origin: 0px 0px; animation: footNearRot 1.6s linear infinite; }

    .hip-far    { transform-origin: 0px 0px; animation: hipFarBob 1.6s linear infinite; }
    .thigh-far  { transform-origin: 0px 0px; animation: thighFarRot 1.6s linear infinite; }
    .shin-far   { transform-origin: 0px 0px; animation: shinFarRot 1.6s linear infinite; }
    .foot-far   { transform-origin: 0px 0px; animation: footFarRot 1.6s linear infinite; }

    .pelican-upper {
      transform-origin: 500px 315px;
      animation: bodyBob 1.6s linear infinite;
    }

    .scarf-flutter {
      transform-origin: 540px 195px;
      animation: scarfFlutter 0.7s ease-in-out infinite alternate;
    }

    .crest-flutter {
      transform-origin: 572px 118px;
      animation: crestFlutter 0.9s ease-in-out infinite alternate;
    }

    .cloud-slow {
      animation: cloudDriftSlow 38s linear infinite;
    }
    .cloud-mid {
      animation: cloudDriftMid 26s linear infinite;
    }
    .sea-glint {
      animation: shimmer 3.2s ease-in-out infinite alternate;
    }
    .beacon-pulse {
      animation: beaconGlow 3.6s ease-in-out infinite alternate;
    }
    .oat-sway {
      transform-origin: 0px 0px;
      animation: oatSway 2.8s ease-in-out infinite alternate;
    }
    .breeze-streak {
      animation: breezeSlide 1.4s linear infinite;
    }
    .breeze-streak-2 {
      animation: breezeSlide 1.9s linear infinite -0.7s;
    }

    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes chainMarch {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -201.062; }
    }

    @keyframes cloudDriftSlow {
      0%   { transform: translateX(-60px); }
      50%  { transform: translateX(40px); }
      100% { transform: translateX(-60px); }
    }
    @keyframes cloudDriftMid {
      0%   { transform: translateX(35px); }
      50%  { transform: translateX(-55px); }
      100% { transform: translateX(35px); }
    }
    @keyframes shimmer {
      0%   { opacity: 0.62; }
      100% { opacity: 0.96; }
    }
    @keyframes beaconGlow {
      0%   { opacity: 0.45; }
      100% { opacity: 0.92; }
    }
    @keyframes scarfFlutter {
      0%   { transform: rotate(-3deg) skewY(-1deg); }
      100% { transform: rotate(4deg) skewY(2deg); }
    }
    @keyframes crestFlutter {
      0%   { transform: rotate(-2deg); }
      100% { transform: rotate(3deg); }
    }
    @keyframes oatSway {
      0%   { transform: rotate(-2.5deg); }
      100% { transform: rotate(3.5deg); }
    }
    @keyframes breezeSlide {
      0%   { transform: translateX(55px); opacity: 0; }
      20%  { opacity: 0.55; }
      80%  { opacity: 0.45; }
      100% { transform: translateX(-95px); opacity: 0; }
    }
