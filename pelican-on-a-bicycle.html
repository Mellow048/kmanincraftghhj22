<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 60%, #fef3c7 100%);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }

    .frame {
      width: min(920px, 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      border: 4px solid #ffffff;
      background: #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes drift {
      0%, 100% {
        transform: translateX(0px);
      }
      50% {
        transform: translateX(18px);
      }
    }

    .wheel-spin {
      animation: spin 3.2s linear infinite;
    }

    .rear-wheel {
      transform-origin: 295px 410px;
    }

    .front-wheel {
      transform-origin: 605px 410px;
    }

    .crank-spin {
      transform-origin: 425px 410px;
      animation: spin 3.2s linear infinite;
    }

    .pelican-bob {
      animation: bob 1.6s ease-in-out infinite;
    }

    .cloud-drift {
      animation: drift 9s ease-in-out infinite;
    }

    .cloud-drift-slow {
      animation: drift 13s ease-in-out infinite reverse;
    }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pelican riding a bicycle along a sunny coastal boardwalk">
      <defs>
        <!-- Sky & Ocean Gradients -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="55%" stop-color="#bae6fd" />
          <stop offset="100%" stop-color="#fef9c3" />
        </linearGradient>

        <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0284c7" />
          <stop offset="100%" stop-color="#0369a1" />
        </linearGradient>

        <linearGradient id="boardwalkGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d97706" />
          <stop offset="100%" stop-color="#92400e" />
        </linearGradient>

        <!-- Pelican & Bike Gradients -->
        <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.4">
          <stop offset="0%" stop-color="#fbbf24" />
          <stop offset="70%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fcd34d" />
          <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>

        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="75%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e2e8f0" />
          <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ef4444" />
          <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
      </defs>

      <!-- SKY -->
      <rect width="900" height="360" fill="url(#skyGrad)" />

      <!-- SUN -->
      <circle cx="760" cy="92" r="46" fill="#fde047" opacity="0.95" />
      <circle cx="760" cy="92" r="62" fill="#fef08a" opacity="0.35" />

      <!-- CLOUDS -->
      <g class="cloud-drift" fill="#ffffff" opacity="0.9">
        <ellipse cx="160" cy="95" rx="52" ry="22" />
        <ellipse cx="195" cy="85" rx="38" ry="24" />
        <ellipse cx="130" cy="98" rx="32" ry="18" />
      </g>

      <g class="cloud-drift-slow" fill="#ffffff" opacity="0.85">
        <ellipse cx="520" cy="72" rx="46" ry="18" />
        <ellipse cx="552" cy="64" rx="32" ry="20" />
        <ellipse cx="492" cy="76" rx="28" ry="15" />
      </g>

      <!-- DISTANT OCEAN -->
      <rect x="0" y="330" width="900" height="75" fill="url(#oceanGrad)" />
      <!-- Subtle water sparkles -->
      <g stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.55">
        <line x1="90" y1="350" x2="145" y2="350" />
        <line x1="260" y1="362" x2="310" y2="362" />
        <line x1="650" y1="348" x2="720" y2="348" />
        <line x1="760" y1="366" x2="825" y2="366" />
      </g>

      <!-- BOARDWALK / ROAD -->
      <rect x="0" y="395" width="900" height="165" fill="url(#boardwalkGrad)" />
      <line x1="0" y1="395" x2="900" y2="395" stroke="#78350f" stroke-width="4" />

      <!-- Boardwalk planks -->
      <g stroke="#78350f" stroke-width="2" opacity="0.35">
        <line x1="0" y1="435" x2="900" y2="435" />
        <line x1="0" y1="485" x2="900" y2="485" />
        <line x1="120" y1="395" x2="60" y2="560" />
        <line x1="270" y1="395" x2="230" y2="560" />
        <line x1="450" y1="395" x2="450" y2="560" />
        <line x1="630" y1="395" x2="670" y2="560" />
        <line x1="780" y1="395" x2="840" y2="560" />
      </g>

      <!-- GROUND SHADOW -->
      <ellipse cx="450" cy="496" rx="215" ry="14" fill="#451a03" opacity="0.32" />

      <!-- BICYCLE: REAR WHEEL -->
      <g class="wheel-spin rear-wheel">
        <!-- Tire -->
        <circle cx="295" cy="410" r="82" fill="none" stroke="#1e293b" stroke-width="14" />
        <!-- Rim -->
        <circle cx="295" cy="410" r="73" fill="none" stroke="#cbd5e1" stroke-width="4" />
        <!-- Spokes -->
        <g stroke="#94a3b8" stroke-width="2">
          <line x1="295" y1="337" x2="295" y2="483" />
          <line x1="222" y1="410" x2="368" y2="410" />
          <line x1="243" y1="358" x2="347" y2="462" />
          <line x1="347" y1="358" x2="243" y2="462" />
          <line x1="267" y1="343" x2="323" y2="477" />
          <line x1="323" y1="343" x2="267" y2="477" />
          <line x1="228" y1="382" x2="362" y2="438" />
          <line x1="362" y1="382" x2="228" y2="438" />
        </g>
        <!-- Hub -->
        <circle cx="295" cy="410" r="10" fill="#475569" stroke="#e2e8f0" stroke-width="2" />
      </g>

      <!-- BICYCLE: FRONT WHEEL -->
      <g class="wheel-spin front-wheel">
        <!-- Tire -->
        <circle cx="605" cy="410" r="82" fill="none" stroke="#1e293b" stroke-width="14" />
        <!-- Rim -->
        <circle cx="605" cy="410" r="73" fill="none" stroke="#cbd5e1" stroke-width="4" />
        <!-- Spokes -->
        <g stroke="#94a3b8" stroke-width="2">
          <line x1="605" y1="337" x2="605" y2="483" />
          <line x1="532" y1="410" x2="678" y2="410" />
          <line x1="553" y1="358" x2="657" y2="462" />
          <line x1="657" y1="358" x2="553" y2="462" />
          <line x1="577" y1="343" x2="633" y2="477" />
          <line x1="633" y1="343" x2="577" y2="477" />
          <line x1="538" y1="382" x2="672" y2="438" />
          <line x1="672" y1="382" x2="538" y2="438" />
        </g>
        <!-- Hub -->
        <circle cx="605" cy="410" r="10" fill="#475569" stroke="#e2e8f0" stroke-width="2" />
      </g>

      <!-- BICYCLE: CHAIN -->
      <path d="M 295 402 L 425 390 L 425 430 L 295 418 Z" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="5 3" />

      <!-- BICYCLE: FRAME -->
      <g fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <!-- Rear triangle -->
        <line x1="295" y1="410" x2="425" y2="410" /> <!-- Chainstay -->
        <line x1="295" y1="410" x2="395" y2="295" /> <!-- Seatstay -->
        <!-- Main triangle -->
        <line x1="425" y1="410" x2="385" y2="275" /> <!-- Seat tube -->
        <line x1="395" y1="295" x2="535" y2="290" /> <!-- Top tube -->
        <line x1="425" y1="410" x2="540" y2="305" /> <!-- Down tube -->
        <!-- Head tube & Fork -->
        <line x1="532" y1="275" x2="546" y2="315" /> <!-- Head tube -->
        <line x1="546" y1="315" x2="605" y2="410" /> <!-- Front fork -->
      </g>

      <!-- SEATPOST & SADDLE -->
      <line x1="385" y1="275" x2="378" y2="255" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <path d="M 352 253 Q 380 245 405 256 Q 395 266 355 262 Z" fill="#1e293b" />

      <!-- HANDLEBARS & BELL -->
      <line x1="532" y1="275" x2="522" y2="236" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <path d="M 522 236 Q 535 225 552 232 Q 560 237 550 245" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" />
      <!-- Grip -->
      <line x1="543" y1="230" x2="557" y2="237" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
      <!-- Brass Bell -->
      <path d="M 524 228 A 7 7 0 0 1 538 228 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />

      <!-- CRANKSET & PEDALS -->
      <g class="crank-spin">
        <circle cx="425" cy="410" r="22" fill="#475569" stroke="#cbd5e1" stroke-width="3" />
        <circle cx="425" cy="410" r="12" fill="#1e293b" />
        <!-- Crank arm -->
        <line x1="425" y1="410" x2="452" y2="442" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
        <line x1="425" y1="410" x2="398" y2="378" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
        <!-- Pedals -->
        <rect x="442" y="438" width="22" height="8" rx="3" fill="#0f172a" />
        <rect x="387" y="374" width="22" height="8" rx="3" fill="#0f172a" />
      </g>

      <!-- PELICAN -->
      <g class="pelican-bob">
        <!-- Far leg (behind) -->
        <path d="M 382 246 L 395 320 L 408 374" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Far webbed foot -->
        <path d="M 398 376 L 418 376 L 414 382 L 396 382 Z" fill="#f97316" />

        <!-- Tail feathers -->
        <path d="M 332 215 Q 295 205 286 225 Q 305 232 332 230 Z" fill="#94a3b8" />
        <path d="M 335 224 Q 298 224 292 240 Q 312 243 340 236 Z" fill="#64748b" />

        <!-- Main Body -->
        <ellipse cx="385" cy="212" rx="58" ry="44" transform="rotate(-12 385 212)" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2" />

        <!-- Neck -->
        <path d="M 418 188 Q 452 155 446 112 Q 442 92 426 92 Q 410 94 410 120 Q 410 152 388 180 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2" />

        <!-- Head -->
        <circle cx="436" cy="96" r="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

        <!-- Crest feathers -->
        <path d="M 420 78 Q 402 65 408 82 Q 396 74 405 88" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

        <!-- Little Sailor Cap -->
        <path d="M 416 78 Q 436 62 454 78 Z" fill="#1d4ed8" />
        <rect x="414" y="75" width="42" height="6" rx="3" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5" />

        <!-- Eye -->
        <circle cx="445" cy="92" r="5" fill="#0f172a" />
        <circle cx="446.5" cy="90.5" r="1.8" fill="#ffffff" />

        <!-- Iconic Pelican Bill & Gular Pouch -->
        <!-- Lower pouch -->
        <path d="M 454 102 Q 515 112 562 106 Q 535 142 478 134 Q 455 128 450 108 Z" fill="url(#pouchGrad)" stroke="#d97706" stroke-width="2" />
        <!-- Upper bill -->
        <path d="M 454 94 Q 520 92 568 104 Q 565 111 556 109 Q 510 105 454 103 Z" fill="url(#beakGrad)" stroke="#d97706" stroke-width="2" />
        <!-- Hooked tip -->
        <path d="M 564 103 Q 572 106 566 113 Q 562 110 562 106 Z" fill="#ea580c" />

        <!-- Wing (reaching to handlebars) -->
        <path d="M 378 195 Q 425 185 480 212 Q 515 225 546 234 Q 518 248 475 236 Q 420 228 372 222 Z" fill="url(#wingGrad)" stroke="#64748b" stroke-width="2" />
        <!-- Wing feather accents -->
        <path d="M 405 206 Q 438 205 462 218" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 395 215 Q 428 216 452 227" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

        <!-- Near leg (in front) -->
        <path d="M 392 252 L 418 335 L 448 438" fill="none" stroke="#f97316" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Near webbed foot on pedal -->
        <path d="M 438 438 L 464 438 L 460 445 L 436 445 Z" fill="#ea580c" />
      </g>
    </svg>
  </div>
</body>
</html>
