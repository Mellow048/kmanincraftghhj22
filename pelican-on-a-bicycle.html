<title>Pelican, Harbour Road</title>
<!--
  PELICAN, HARBOUR ROAD
  One HTML file. One inline SVG. No JavaScript, no images, no fonts, no network.
  Every movement is a native SVG <animate> / <animateTransform>.

  The drawing is built on real numbers, not eyeballed:
    - Tyre radius is 720 / 2pi = 114.592 px, so one wheel turn (0.9 s) rolls
      exactly 720 px of road. The paving marks repeat every 180 px: four to a turn.
    - Chainring 40 teeth, rear cog 20 teeth, so the cranks turn once every 1.8 s
      while the wheels turn twice. The pedals are counter-rotated to stay level.
    - Each leg is a two-bone solve (thigh 200, shin 150). Seventy-two keyframes per
      crank turn keep the webbed foot on the pedal. Nothing is computed at run time.
    - The near and far legs are half a crank turn apart, and each pedal stays level
      because it is counter-rotated against its crank.
    - The frame is a real roadster: 74.5 deg seat tube, 69.6 deg head tube, 580 px
      wheelbase, 24 px bottom-bracket drop, fork rake drawn as a curve.
  The scene loops seamlessly: sky, sea, gulls and grass are on their own periods,
  the road is locked to the wheel.
-->

  html, body { height: 100%; margin: 0; background: #17262b; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
