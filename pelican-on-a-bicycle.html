<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pelican Rides the Coast Road</title>
<meta name="description" content="An original illustration of a pelican riding a bicycle along a seaside road, drawn entirely as inline SVG inside a single HTML file. No JavaScript, no external assets.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(120% 100% at 50% 0%, #182530 0%, #0d141c 60%, #080d13 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  figure { margin: 0; display: grid; place-items: center; height: 100vh; width: 100vw; }
  svg { height: 100vh; width: 100vw; display: block; }
  figcaption {
    position: fixed; left: 18px; bottom: 14px;
    color: #e8e2d2; opacity: 0.38; font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; user-select: none; pointer-events: none;
  }
  @media (max-aspect-ratio: 1/1) { figcaption { font-size: 10px; } }
</style>
<!-- ============================================================================
     THE PELICAN RIDES THE COAST ROAD
     ---------------------------------------------------------------------------
     Original artwork, built for this repository. Nothing here was traced, copied
     or adapted from any existing drawing, vector pack or film.

     Constraints honoured on purpose:
       - pure inline SVG + HTML + SMIL/CSS animation
       - no JavaScript, no external files, no fonts, no images
       - one file, open it anywhere
     ============================================================================ -->
</head>
<body>
<figure>
<svg viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="A cream pelican in a flowing red scarf pedals a coral-red city bicycle with a wicker baguette basket along a seaside road at golden hour, a seagull riding on the back rack.">
  <title>A pelican riding a bicycle along the coast road</title>
  <desc>Golden-hour seaside scene: sun low over the sea, headlands and a small lighthouse, a sailboat and a buoy on the water, a coastal road with a moving dashed centre line, and a large pelican with a fish in its pouch riding a coral city bicycle with a baguette in the front basket. All animation is declarative (SMIL); there is no JavaScript.</desc>

  <defs>
    <!-- ===== gradients ===== -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6da6cd"/>
      <stop offset="0.34" stop-color="#8fbcd4"/>
      <stop offset="0.62" stop-color="#c3d6ce"/>
      <stop offset="0.84" stop-color="#f3d6a3"/>
      <stop offset="1" stop-color="#fce7b8"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="0.55" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#f5a94e"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#ffd98a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5f82"/>
      <stop offset="0.45" stop-color="#40707f"/>
      <stop offset="1" stop-color="#75908c"/>
    </linearGradient>
    <linearGradient id="sunPathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d6a7"/>
      <stop offset="1" stop-color="#d3bd87"/>
    </linearGradient>
    <linearGradient id="farGrassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9c5a"/>
      <stop offset="1" stop-color="#4d6f3e"/>
    </linearGradient>
    <linearGradient id="nearGrassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a28"/>
      <stop offset="1" stop-color="#1d301b"/>
    </linearGradient>
    <linearGradient id="asphaltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#53575f"/>
      <stop offset="0.12" stop-color="#4c5058"/>
      <stop offset="1" stop-color="#3e4148"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="0.42" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.62" stop-color="#f4ead7"/>
      <stop offset="1" stop-color="#ddceb2"/>
    </radialGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b9a1"/>
      <stop offset="0.6" stop-color="#e69a80"/>
      <stop offset="1" stop-color="#cd7f66"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc95e"/>
      <stop offset="0.45" stop-color="#f0a34a"/>
      <stop offset="1" stop-color="#dd7f2c"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ece0"/>
      <stop offset="0.45" stop-color="#b9b4a4"/>
      <stop offset="1" stop-color="#76725f"/>
    </linearGradient>
    <radialGradient id="goldGrad" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffeda0"/>
      <stop offset="0.55" stop-color="#e3ac42"/>
      <stop offset="1" stop-color="#8f6114"/>
    </radialGradient>
    <linearGradient id="wickerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6b071"/>
      <stop offset="0.5" stop-color="#c39a55"/>
      <stop offset="1" stop-color="#a8864d"/>
    </linearGradient>
    <linearGradient id="baguetteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b96c"/>
      <stop offset="0.55" stop-color="#cf9a4e"/>
      <stop offset="1" stop-color="#a96f33"/>
    </linearGradient>
    <radialGradient id="vignetteGrad" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#050a10" stop-opacity="0.42"/>
    </radialGradient>

    <!-- ===== reusable wheel (drawn around 0,0 = hub) ===== -->
    <g id="wheelArt">
      <circle r="128" fill="none" stroke="#232328" stroke-width="26"/>
      <circle r="128" fill="none" stroke="#3a3a41" stroke-width="2.5" stroke-dasharray="7 15" opacity="0.8"/>
      <circle r="101" fill="none" stroke="#ded7c7" stroke-width="11"/>
      <circle r="101" fill="none" stroke="#a49e8d" stroke-width="1.6" opacity="0.9"/>
      <g stroke="#c7c2b2" stroke-width="3.4" opacity="0.85">
        <line x1="0" y1="-14" x2="0" y2="-96"/>
        <line x1="12" y1="-10.4" x2="83.1" y2="-72"/>
        <line x1="14" y1="7" x2="96" y2="48"/>
        <line x1="4.8" y1="13.2" x2="33" y2="90.7"/>
        <line x1="-6.4" y1="12.4" x2="-44" y2="85.5"/>
        <line x1="-13.6" y1="3.1" x2="-93.3" y2="21.3"/>
        <line x1="-13.6" y1="-3.1" x2="-93.3" y2="-21.3"/>
        <line x1="-6.4" y1="-12.4" x2="-44" y2="-85.5"/>
        <line x1="4.8" y1="-13.2" x2="33" y2="-90.7"/>
        <line x1="12.1" y1="-6.9" x2="83.1" y2="-47.6"/>
        <line x1="12.1" y1="6.9" x2="83.1" y2="47.6"/>
        <line x1="9.7" y1="9.7" x2="67.9" y2="67.9"/>
      </g>
      <circle r="13" fill="#c9c3b3"/>
      <circle r="5.2" fill="#57544a"/>
    </g>

    <!-- ===== one far-grass post + tuft (pattern tile, world coords) ===== -->
    <g id="farTile">
      <rect x="-130" y="1392" width="11" height="58" rx="2" fill="#e8e4d8"/>
      <rect x="-130" y="1392" width="11" height="12" rx="2" fill="#b33a2e"/>
      <rect x="490" y="1392" width="11" height="58" rx="2" fill="#e8e4d8"/>

      <rect x="1110" y="1392" width="11" height="58" rx="2" fill="#e8e4d8"/>

      <path d="M120,1450 C126,1418 122,1408 132,1388 C133,1412 141,1418 148,1450 Z" fill="#5d8147"/>
      <path d="M660,1450 C668,1422 664,1410 674,1392 C676,1418 684,1424 690,1450 Z" fill="#557a42"/>

      <circle cx="960" cy="1447" r="3.1" fill="#f2efe4" opacity="0.9"/>

    <!-- ===== foreground blade (pattern tile, world coords) ===== -->
    <g id="nearTile">
      <path d="M40,1920 C36,1830 62,1790 34,1705 C74,1785 66,1852 78,1920 Z" fill="#2c4630"/>
      <path d="M128,1920 C126,1825 104,1788 136,1690 C138,1795 158,1848 154,1920 Z" fill="#243c28"/>
      <path d="M238,1920 C246,1845 224,1810 252,1740 C246,1830 262,1875 268,1920 Z" fill="#2e4a32"/>
      <path d="M342,1920 C336,1855 366,1812 344,1745 C382,1828 366,1870 376,1920 Z" fill="#243c28"/>
      <path d="M452,1920 C458,1835 438,1805 468,1725 C458,1830 486,1868 478,1920 Z" fill="#2c4630"/>
      <!-- daisies -->
      <g transform="translate(185,1815)">
        <line x1="0" y1="105" x2="0" y2="12" stroke="#3a5a35" stroke-width="7"/>
        <g fill="#f5f2e4">
          <ellipse cx="0" cy="-8" rx="7" ry="14"/>
          <ellipse cx="0" cy="-8" rx="7" ry="14" transform="rotate(60)"/>
          <ellipse cx="0" cy="-8" rx="7" ry="14" transform="rotate(120)"/>
        </g>
        <circle cx="0" cy="0" r="6.4" fill="#e8c15a"/>
      </g>
      <g transform="translate(415,1858) scale(0.72)">
        <line x1="0" y1="95" x2="0" y2="12" stroke="#3a5a35" stroke-width="7"/>
        <g fill="#f5f2e4">
          <ellipse cx="0" cy="-8" rx="7" ry="14"/>
          <ellipse cx="0" cy="-8" rx="7" ry="14" transform="rotate(60)"/>
          <ellipse cx="0" cy="-8" rx="7" ry="14" transform="rotate(120)"/>
        </g>
        <circle cx="0" cy="0" r="6.4" fill="#e8c15a"/>
      </g>
      <!-- one red poppy, echoing the frame -->
      <g transform="translate(305,1786)">
        <line x1="0" y1="134" x2="0" y2="14" stroke="#3a5a35" stroke-width="6"/>
        <path d="M0,-16 C16,-16 20,6 0,10 C-20,6 -16,-16 0,-16 Z" fill="#d9483b"/>
        <path d="M0,-10 C8,-10 10,4 0,7 C-10,4 -8,-10 0,-10 Z" fill="#a92e25"/>
        <circle cx="0" cy="-2" r="3" fill="#2c1a12"/>
      </g>
    </g>

    <clipPath id="roadClip"><rect x="0" y="1448" width="1080" height="216"/></clipPath>
    <clipPath id="seaClip"><rect x="0" y="1155" width="1080" height="135"/></clipPath>
  </defs>

  <!-- ================= SKY ================= -->
  <rect x="0" y="0" width="1080" height="1160" fill="url(#skyGrad)"/>

  <!-- sun: slow ray sweep behind, core on top -->
  <g transform="translate(215,1012)" opacity="0.9">
    <g opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" values="0;360" keyTimes="0;1" dur="160s" repeatCount="indefinite" calcMode="linear"/>
      <g fill="#ffdf9e" opacity="0.16">
        <path d="M0,-260 L18,-96 L-18,-96 Z" transform="rotate(0)"/>
        <path d="M0,-260 L18,-96 L-18,-96 Z" transform="rotate(45)"/>
        <path d="M0,-260 L18,-96 L-18,-96 Z" transform="rotate(90)"/>
        <path d="M0,-260 L18,-96 L-18,-96 Z" transform="rotate(135)"/>
        <path d="M0,-260 L18,-96 L-18,-96 Z" transform="rotate(180)"/>
        <path d="M0,-260 L18,-96 L-18,-96 Z" transform="rotate(225)"/>
        <path d="M0,-260 L18,-96 L-18,-96 Z" transform="rotate(270)"/>
        <path d="M0,-260 L18,-96 L-18,-96 Z" transform="rotate(315)"/>
      </g>
    </g>
  </g>
  <circle cx="215" cy="1012" r="236" fill="url(#sunGlow)"/>
  <circle cx="215" cy="1012" r="92" fill="url(#sunGrad)"/>

  <!-- clouds: slow drift, ping-pong -->
  <g fill="#fdf8ec">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-28 0; 34 0" keyTimes="0;1" dur="23s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" additive="sum"/>
      <g transform="translate(205,285)" opacity="0.96">
        <ellipse cx="0" cy="0" rx="86" ry="30"/>
        <ellipse cx="-52" cy="10" rx="48" ry="22"/>
        <ellipse cx="55" cy="9" rx="52" ry="23"/>
        <ellipse cx="8" cy="-21" rx="46" ry="22"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="26 0; -30 0" keyTimes="0;1" dur="29s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/>
      <g transform="translate(735,195) scale(0.72)" opacity="0.92">
        <ellipse cx="0" cy="0" rx="86" ry="30"/>
        <ellipse cx="-52" cy="10" rx="48" ry="22"/>
        <ellipse cx="55" cy="9" rx="52" ry="23"/>
        <ellipse cx="8" cy="-21" rx="46" ry="22"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-22 0; 30 0" keyTimes="0;1" dur="27s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/>
      <g transform="translate(430,470) scale(0.88)" opacity="0.9">
        <ellipse cx="0" cy="0" rx="80" ry="26"/>
        <ellipse cx="-46" cy="9" rx="42" ry="19"/>
        <ellipse cx="48" cy="8" rx="46" ry="19"/>
        <ellipse cx="4" cy="-18" rx="40" ry="18"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="18 0; -26 0" keyTimes="0;1" dur="31s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/>
      <g transform="translate(905,575) scale(0.5)" opacity="0.85">
        <ellipse cx="0" cy="0" rx="78" ry="25"/>
        <ellipse cx="-44" cy="8" rx="40" ry="18"/>
        <ellipse cx="46" cy="8" rx="43" ry="18"/>
      </g>
    </g>
  </g>

  <!-- two gulls gliding -->
  <g stroke="#3a4750" stroke-width="4.5" fill="none" stroke-linecap="round">
    <g transform="translate(340 386)">
      <animateTransform attributeName="transform" type="translate" values="-120 400; 1200 335" keyTimes="0;1" dur="58s" repeatCount="indefinite" calcMode="linear"/>
      <path d="M-26,0 Q-13,-12 0,0 Q13,-12 26,0"/>
    </g>
    <g transform="translate(700 505)">
      <animateTransform attributeName="transform" type="translate" values="-160 560; 1200 470" keyTimes="0;1" dur="74s" begin="-30s" repeatCount="indefinite" calcMode="linear"/>
      <path d="M-21,0 Q-10.5,-10 0,0 Q10.5,-10 21,0" opacity="0.9"/>
    </g>
  </g>

  <!-- ================= HEADLANDS + LIGHTHOUSE ================= -->
  <path d="M0,1156 L0,1036 C96,1002 188,1008 268,1072 C312,1108 348,1132 385,1152 L385,1156 Z" fill="#4c7280"/>
  <path d="M0,1156 L0,1078 C84,1054 158,1060 226,1112 C258,1138 286,1148 312,1154 L312,1156 Z" fill="#435f6d" opacity="0.65"/>

    <rect x="-9" y="-64" width="18" height="56" fill="#f2ede0"/>

      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>

  </g>
  <path d="M1080,1156 L1080,1080 C1012,1056 948,1060 884,1100 C838,1130 806,1146 772,1154 L772,1156 Z" fill="#557786"/>

  <!-- ================= SEA ================= -->
  <rect x="0" y="1155" width="1080" height="137" fill="url(#seaGrad)"/>
  <rect x="0" y="1153" width="1080" height="3.5" fill="#fbeec8" opacity="0.85"/>
  <g clip-path="url(#seaClip)">
    <path d="M168,1155 L262,1155 L322,1290 L108,1290 Z" fill="url(#sunPathGrad)"/>
    <g fill="#ffe9b0">
      <ellipse cx="158" cy="1178" rx="17" ry="2.6"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="1.7s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="248" cy="1192" rx="13" ry="2.3"><animate attributeName="opacity" values="0.85;0.15;0.85" dur="2.2s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="202" cy="1208" rx="21" ry="2.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.4s" begin="-0.6s" repeatCount="indefinite"/></ellipse>

      <ellipse cx="268" cy="1236" rx="15" ry="2.2"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="1.9s" begin="-0.3s" repeatCount="indefinite"/></ellipse>

    </g>

  <!-- sailboat -->
  <g transform="translate(243,1222)">

  <!-- ================= BEACH ================= -->
  <rect x="0" y="1290" width="1080" height="60" fill="url(#sandGrad)"/>
  <rect x="0" y="1288" width="1080" height="5" fill="#b3a077" opacity="0.8"/>
  <circle cx="150" cy="1324" r="2.5" fill="#c9b183"/>
  <circle cx="520" cy="1338" r="2.1" fill="#c9b183"/>
  <circle cx="880" cy="1318" r="2.7" fill="#c9b183"/>
  <path d="M345,1346 C350,1332 348,1326 354,1316 C355,1330 361,1334 365,1346 Z" fill="#7d8a4d"/>
  <path d="M672,1348 C677,1334 675,1328 681,1318 C682,1332 688,1336 692,1348 Z" fill="#758552"/>

  <!-- ================= FAR GRASS (moves, slow) ================= -->
  <rect x="0" y="1348" width="1080" height="96" fill="url(#farGrassGrad)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -1240 0" keyTimes="0;1" dur="2s" repeatCount="indefinite" calcMode="linear"/>
    <use href="#farTile" x="0" y="0"/>
    <use href="#farTile" x="1240" y="0"/>
    <use href="#farTile" x="2480" y="0"/>
    <use href="#farTile" x="-1240" y="0"/>
  </g>

  <!-- ================= ROAD ================= -->
  <rect x="0" y="1444" width="1080" height="228" fill="url(#asphaltGrad)"/>
  <rect x="0" y="1444" width="1080" height="5" fill="#6d727c" opacity="0.9"/>
  <rect x="0" y="1667" width="1080" height="5" fill="#2f323a"/>
  <g clip-path="url(#roadClip)">
    <g fill="#cfc9b1" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0 0; -220 0" keyTimes="0;1" dur="0.22s" repeatCount="indefinite" calcMode="linear"/>
      <rect x="-220" y="1551" width="96" height="12" rx="6"/>
      <rect x="0" y="1551" width="96" height="12" rx="6"/>
      <rect x="220" y="1551" width="96" height="12" rx="6"/>
      <rect x="440" y="1551" width="96" height="12" rx="6"/>
      <rect x="660" y="1551" width="96" height="12" rx="6"/>
      <rect x="880" y="1551" width="96" height="12" rx="6"/>
