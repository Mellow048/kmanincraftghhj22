<desc id="pDesc">A hand-drawn vector pelican with a long orange beak and a red scarf pedals a teal city bicycle along a sandy coastal path. One wing steers the handlebar, a fish rides in the front basket, and the wheels, cranks, legs, scarf and clouds all move.</desc>
