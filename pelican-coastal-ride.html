<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pelican · Coastal Ride — an animated SVG</title>
<!--
  A pelican riding a bicycle along a sea wall, at golden hour.
  One file: inline SVG + one small script. No images, no fonts, no libraries,
  no network requests.

  Nothing here is keyframed by eye. The whole picture is one pure function of
  time — pose(t) — and every moving part is derived from a single number, the
  distance the bicycle has travelled:

    dist      = SPEED * t
    wheel     = dist / R                    (rolls without slipping)
    crank     = dist / (R * GEAR)           (GEAR = 2, a 30/15 pair)
    pedals    = the crank circle around the bottom bracket
    legs      = a two-bar hip -> knee -> ankle linkage solved from the pedal
                every frame (circle/circle intersection, knee forced forward),
                so the webbed feet stay pinned to the pedals all the way round
    chain     = links travel at ring-radius x crank speed
    road      = scrolled by exactly `dist`, so the contact patch never skates
    parallax  = every distance layer scrolled by a fraction of `dist`

  Because pose(t) is pure, the film can be paused, scrubbed or single-stepped
  and always draws the same frame for the same t.

  Small echoes of that one clock: the rider bobs twice per crank revolution,
  the head lags the bob, and the pouch jiggles a beat behind the head.

  Controls: Space = pause, arrow keys = one frame, drag the slider to scrub.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: clamp(10px, 2.5vw, 26px);
    background: radial-gradient(120% 80% at 50% -10%, #1d2b40 0%, #0d141d 55%, #070a0f 100%);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #b9c6d4;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: min(1200px, 100%);
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow: 0 0 0 1px #2a3a4d, 0 0 0 7px #0a1119, 0 30px 80px -26px #000;
    line-height: 0;
  }
  svg { display: block; width: 100%; height: auto; }

  .bar {
    width: min(1200px, 100%);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    padding: 0 2px;
    color: #8ea0b4;
  }
  .bar button {
    font: inherit;
    color: #d7e3ef;
    background: #16202c;
    border: 1px solid #2b3c4f;
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .bar button:hover { background: #1d2a39; border-color: #3d5570; color: #fff; }
  .bar button:focus-visible { outline: 2px solid #f0a868; outline-offset: 2px; }
  .bar .scrub { flex: 1 1 240px; min-width: 160px; accent-color: #f0a868; }
  .bar .read { font-variant-numeric: tabular-nums; color: #7d8fa3; white-space: nowrap; }
  .bar .hint { margin-left: auto; color: #617385; white-space: nowrap; }
  .bar .hint kbd {
    font: inherit;
    color: #93a6ba;
    background: #131d28;
    border: 1px solid #293848;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 4px;
  }
  @media (max-width: 620px) { .bar .hint { display: none; } }
</style>
</head>

<script>
(() => {
  "use strict";

  /* =======================================================================
     SCENE CONSTANTS, in SVG user units. One source of truth.
     ======================================================================= */
  const K = {
    R: 88,                  // wheel radius
    RH: [430, 472],         // rear hub
    FH: [710, 472],         // front hub
    BB: [542, 490],         // bottom bracket
    CRANK: 32,              // crank arm
    RING: 30,               // chainring radius
    COG: 17,                // rear cog radius
    GEAR: 2,                // wheel turns per crank turn
    SPEED: 672,             // ground units per second
    CRANK_PHASE: -0.42,
    HIP_N: [506, 358],      // near hip
    HIP_F: [496, 360],      // far hip
    THIGH: 70,
    SHIN: 100,
    CONTACT: [430, 560],
    TILE: { cloud: 300, head: 400, rail: 160, wave: 200, dash: 240, tex: 260, tex2: 320, grass: 220 },
    V: { cloud: 26, head: 44, rail: 150, wave: 30, tex: 672 * 1.12, tex2: 672 * 1.3,
         grass: 672 * 1.55, light: 22 }
  };

  const DEG = 180 / Math.PI;
  const f = (n) => Math.round(n * 100) / 100;
  const mod = (a, n) => ((a % n) + n) % n;

  /* =======================================================================
     pose(t) — the whole frame, pure: no DOM, nothing read from the page.
     Every value comes from `dist`, the distance the bicycle has travelled.
     Returns { elementId: { attribute: value } }.
     ======================================================================= */
  function pose(t) {
    const out = {};
    const set = (id, attrs) => { out[id] = attrs; };
    const dist = K.SPEED * t;

    /* ---- wheels: angle = distance / radius, so nothing slips ---- */
    const wheelDeg = (dist / K.R) * DEG;
    set("wheel-rear",  { transform: `rotate(${f(wheelDeg)} ${K.RH[0]} ${K.RH[1]})` });
    set("wheel-front", { transform: `rotate(${f(wheelDeg)} ${K.FH[0]} ${K.FH[1]})` });

    /* ---- crank: the wheel turns GEAR times per crank turn ---- */
    const crankRad = dist / (K.R * K.GEAR) + K.CRANK_PHASE;
    const crankDeg = crankRad * DEG;
    const pedalN = [K.BB[0] + K.CRANK * Math.cos(crankRad), K.BB[1] + K.CRANK * Math.sin(crankRad)];
    const pedalF = [K.BB[0] - K.CRANK * Math.cos(crankRad), K.BB[1] - K.CRANK * Math.sin(crankRad)];
    const pedalLocal = `${K.BB[0] + K.CRANK} ${K.BB[1]}`;   // pedal centre before rotation

    set("crank-near", { transform: `rotate(${f(crankDeg)} ${K.BB[0]} ${K.BB[1]})` });
    set("pedal-near", { transform: `rotate(${f(-crankDeg)} ${pedalLocal})` });
    set("crank-far",  { transform: `rotate(${f(crankDeg + 180)} ${K.BB[0]} ${K.BB[1]})` });
    set("pedal-far",  { transform: `rotate(${f(-crankDeg - 180)} ${pedalLocal})` });

    /* ---- chain: links run at ring radius x crank speed ---- */
    const chainSpeed = K.RING * (K.SPEED / (K.R * K.GEAR));
    set("chain-links", { "stroke-dashoffset": f(-chainSpeed * t) });

    /* ---- body bob: twice per crank revolution ---- */
    const bob = 2.1 * Math.sin(crankRad * 2) + 0.8 * Math.sin(crankRad);
    const tilt = 0.85 * Math.sin(crankRad * 2 + 0.45);
    set("pelican", { transform: `translate(0 ${f(bob)}) rotate(${f(tilt)} ${K.HIP_N[0]} ${K.HIP_N[1]})` });

    /* ---- head lags the bob, the pouch lags the head ---- */
    const headRot = -tilt * 0.55 + 0.75 * Math.sin(crankRad * 2 + 0.95);
    set("head", { transform: `translate(0 ${f(-bob * 0.4)}) rotate(${f(headRot)} 646 196)` });
    set("pouch", { transform: `rotate(${f(1.6 * Math.sin(crankRad * 2 + 1.35))} 686 164)` });
    set("beak-upper", { transform: `rotate(${f(0.6 * Math.sin(crankRad * 2 + 1.9))} 684 145)` });
    set("wing", { transform: `rotate(${f(1.4 * Math.sin(crankRad * 2 + 0.8))} 552 230)` });

    /* ---- legs: two-bar linkage, feet pinned to the pedals ---- */
    const hipN = [K.HIP_N[0], K.HIP_N[1] + bob];
    const hipF = [K.HIP_F[0], K.HIP_F[1] + bob];
    const kneeN = solveKnee(hipN, pedalN, K.THIGH, K.SHIN);
    const kneeF = solveKnee(hipF, pedalF, K.THIGH, K.SHIN);

    set("nthigh-o", { x1: f(hipN[0]), y1: f(hipN[1]), x2: f(kneeN[0]), y2: f(kneeN[1]) });
    set("nthigh",   { x1: f(hipN[0]), y1: f(hipN[1]), x2: f(kneeN[0]), y2: f(kneeN[1]) });
    const ankleN = [pedalN[0], pedalN[1] - 10];
    const ankleF = [pedalF[0], pedalF[1] - 10];
    set("nshin-o",  { x1: f(kneeN[0]), y1: f(kneeN[1]), x2: f(ankleN[0]), y2: f(ankleN[1]) });
    set("nshin",    { x1: f(kneeN[0]), y1: f(kneeN[1]), x2: f(ankleN[0]), y2: f(ankleN[1]) });
    set("nfoot",    { transform: `translate(${f(ankleN[0])} ${f(ankleN[1])}) rotate(${f(footPitch(crankRad))})` });

    set("fthigh", { x1: f(hipF[0]), y1: f(hipF[1]), x2: f(kneeF[0]), y2: f(kneeF[1]) });
    set("fshin",  { x1: f(kneeF[0]), y1: f(kneeF[1]), x2: f(ankleF[0]), y2: f(ankleF[1]) });
    set("ffoot",  { transform: `translate(${f(ankleF[0])} ${f(ankleF[1])}) rotate(${f(footPitch(crankRad + Math.PI))})` });

    /* ---- scarf: a travelling wave through a tapered cloth ribbon ---- */
    const phase = t * 9.2;
    const pts = [];
    for (let i = 0; i <= 12; i++) {
      const k = i / 12;
      pts.push([
        612 - i * 17.5 + 5 * Math.sin(phase * 0.8 - i * 0.4) * k,
        222 - i * 2.6 + (1.5 + i * 1.9) * Math.sin(phase - i * 0.62) * (0.3 + k)
      ]);
    }
    set("scarf", { d: ribbon(pts, 18, 7) });
    set("scarf-hi", { d: smooth(pts.slice(0, 8).map(([x, y]) => [x, y - 3.4])) });

    /* ---- blink: deterministic, one every 2.6 s ---- */
    const bp = mod(t, 2.6);
    const open = bp < 0.15 ? Math.abs(Math.cos((bp / 0.15) * Math.PI)) : 1;
    set("eyelid", {
      transform: `translate(661 148) scale(1 ${f(0.02 + (1 - open) * 0.98)}) translate(-661 -148)`
    });

    /* ---- dust: eight puffs, emitted at the contact patch ---- */
    for (let i = 0; i < 8; i++) {
      const p = mod(t / 1.15 + i / 8, 1);
      set("dust" + i, {
        cx: f(K.CONTACT[0] - p * 170 - 6),
        cy: f(K.CONTACT[1] - 4 - p * 32 - p * p * 12),
        r: f(2.5 + p * 13),
        opacity: f(0.4 * Math.pow(1 - p, 1.5))
      });
    }

    /* ---- parallax layers ---- */
    set("clouds",    { transform: `translate(${f(-mod(K.V.cloud * t, K.TILE.cloud))} 0)` });
    set("gulls",     { transform: `translate(${f(-mod(K.V.cloud * 0.55 * t, 340))} ${f(6 * Math.sin(t * 0.9))})` });
    set("headland",  { transform: `translate(${f(-mod(K.V.head * t, K.TILE.head))} 0)` });
    set("lighthouse",{ transform: `translate(${f(-mod(K.V.light * t, 1400))} 0)` });
    set("railing",   { transform: `translate(${f(-mod(K.V.rail * t, K.TILE.rail))} 0)` });
    set("sea-waves", { transform: `translate(${f(-mod(K.V.wave * t, K.TILE.wave))} 0)` });
    set("road-dash", { transform: `translate(${f(-mod(dist, K.TILE.dash))} 0)` });
    set("road-tex",  { transform: `translate(${f(-mod(K.V.tex * t, K.TILE.tex))} 0)` });
    set("road-tex2", { transform: `translate(${f(-mod(K.V.tex2 * t, K.TILE.tex2))} 0)` });
    set("grass",     { transform: `translate(${f(-mod(K.V.grass * t, K.TILE.grass))} 0)` });

    /* ---- sun, glitter, bell ---- */
    set("sun-rays", { transform: `rotate(${f(mod(t * 3, 30))} 985 215)` });
    for (let i = 0; i < 10; i++) {
      const s = 0.5 + 0.5 * Math.sin(t * 1.7 + i * 1.9);
      set("glint" + i, { opacity: f(0.2 + 0.55 * s) });
    }
    const pingP = mod(t, 4.4) / 4.4;
    set("ping", {
      opacity: pingP < 0.3 ? f(0.45 * (1 - pingP / 0.3)) : 0,
      transform: `translate(702 333) scale(${f(0.7 + pingP * 1.6)}) translate(-702 -333)`
    });

    return out;
  }

  /* Circle/circle intersection: the knee is the solution pushed forward (+x),
     which is where a bird's knee actually goes. */
  function solveKnee(hip, foot, L1, L2) {
    const dx = foot[0] - hip[0];
    const dy = foot[1] - hip[1];
    const raw = Math.hypot(dx, dy) || 1;
    const d = Math.min(Math.max(raw, Math.abs(L1 - L2) + 0.5), L1 + L2 - 0.5);
    const ux = dx / raw, uy = dy / raw;
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const bx = hip[0] + ux * a, by = hip[1] + uy * a;
    return [bx + uy * h, by - ux * h];
  }

  /* The foot stays level, with a little ankle articulation. */
  function footPitch(crankRad) {
    return 4 * Math.sin(crankRad + 0.6) - 2;
  }

  /* A tapered cloth ribbon around a centre line: offsets both edges. */
  function ribbon(p, w0, w1) {
    const n = p.length, left = [], right = [];
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      const w = (w0 + (w1 - w0) * (i / (n - 1))) / 2;
      left.push([p[i][0] - dy * w, p[i][1] + dx * w]);
      right.push([p[i][0] + dy * w, p[i][1] - dx * w]);
    }
    const edge = (arr) => arr.map(([x, y]) => `L${f(x)} ${f(y)}`).join(" ");
    const [x0, y0] = left[0];
    return `M${f(x0)} ${f(y0)} ${edge(left)} ${edge(right.reverse())} Z`;
  }

  /* Smooth polyline as one path (quadratic through the midpoints). */
  function smooth(p) {
    let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    for (let i = 1; i < p.length - 1; i++) {
      const mx = (p[i][0] + p[i + 1][0]) / 2;
      const my = (p[i][1] + p[i + 1][1]) / 2;
      d += ` Q${f(p[i][0])} ${f(p[i][1])} ${f(mx)} ${f(my)}`;
    }
    const last = p[p.length - 1];
    return d + ` L${f(last[0])} ${f(last[1])}`;
  }

  /* =======================================================================
     DOM: apply a pose. That is the entire renderer.
     ======================================================================= */
  const cache = new Map();
  const node = (id) => {
    let n = cache.get(id);
    if (!n) { n = document.getElementById(id); if (n) cache.set(id, n); }
    return n;
  };
  function apply(p) {
    for (const id in p) {
      const el = node(id);
      if (!el) continue;
      const attrs = p[id];
      for (const k in attrs) el.setAttribute(k, attrs[k]);
    }
  }

  /* =======================================================================
     Clock and controls
     ======================================================================= */
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0, playing = !reduce, rate = 1, last = 0;

  const btnPlay = document.getElementById("play");
  const btnSpeed = document.getElementById("speed");
  const scrub = document.getElementById("scrub");
  const clock = document.getElementById("clock");

  function label() {
    btnPlay.textContent = playing ? "Pause" : "Play";
    btnPlay.setAttribute("aria-pressed", String(!playing));
    btnSpeed.textContent = rate + "×";
    clock.textContent = "t = " + t.toFixed(2) + " s";
  }
  function draw() { apply(pose(t)); }

  function frame(now) {
    if (!last) last = now;
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (playing) t += dt * rate;
    draw();
    scrub.value = String(mod(t, 20));
    label();
    requestAnimationFrame(frame);
  }

  btnPlay.addEventListener("click", () => { playing = !playing; last = 0; label(); });
  btnSpeed.addEventListener("click", () => {
    rate = rate === 1 ? 0.5 : rate === 0.5 ? 0.25 : 1;
    label();
  });
  scrub.addEventListener("input", () => { t = Number(scrub.value); last = 0; draw(); label(); });

  addEventListener("keydown", (e) => {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); playing = !playing; last = 0; label(); }
    if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
      e.preventDefault();
      playing = false;
      t = Math.max(0, t + (e.code === "ArrowRight" ? 1 : -1) / 60);
      last = 0; draw(); label();
    }
  });

  draw();
  label();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
