    :root {
      color-scheme: light;
      --paper: #f4e8cf;
      --ink: #243e33;
      --muted: #4c5946;
      --rust: #a44931;
      --rule: #bcaf91;
      --page-pad-block: clamp(12px, 2.45svh, 24px);
      --display: "Courier Display", Georgia, "Times New Roman", serif;
      --label: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: var(--page-pad-block) clamp(12px, 2.3vw, 32px);
      color: var(--ink);
      background: #1b332c radial-gradient(ellipse at 50% 20%, #345247, #1b332c 78%);
    }
    .postcard {
      --inset: clamp(12px, 1.6vw, 23px);
      --title-size: clamp(2.3rem, min(5.2vw, 7.2svh), 4rem);
      width: min(100%, 73rem);
      padding: var(--inset);
      background: var(--paper);
      box-shadow: 0 2px 0 #181f19, 0 18px 56px #12221ba0, inset 0 0 0 1px #fff4d9;
    }
    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 0 2px 15px;
    }
    .folio, .route, .actions {
      font: 600 11px/1.45 var(--label);
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .folio {
      display: flex;
      align-items: center;
      gap: .65em;
      margin: 0 0 6px;
      color: var(--muted);
    }
    .folio::before { content: ""; width: 19px; height: 2px; background: var(--rust); }
    h1 {
      margin: 0 0 0 -.025em;
      font: 600 var(--title-size)/1.02 var(--display);
      letter-spacing: -.043em;
      word-spacing: .06em;
    }
    h1 em { color: var(--rust); font-weight: 600; }
    .route {
      flex: none;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 0 3px;
      white-space: nowrap;
    }
    .route b, .route span { display: block; }
    .route span { color: var(--muted); font-size: .91em; }
    .compass { width: 37px; height: 37px; color: var(--rust); }
    figure { margin: 0; min-width: 0; }
    .scene {
      overflow: hidden;
      aspect-ratio: 1120 / 640;
      background: #9ab6a0;
      border: 1px solid #626b51;
    }
    #illustration { display: block; width: 100%; height: 100%; }
    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 9px 18px;
      padding: 12px 1px 0;
    }
    .caption {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font: italic 1rem/1.25 Georgia, "Times New Roman", serif;
    }
    .caption svg { width: 25px; height: 15px; flex: none; color: var(--rust); }
    .actions:not([hidden]) { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 5px 10px;
      border: 1px solid var(--rule);
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      letter-spacing: .05em;
      text-transform: inherit;
      white-space: nowrap;
      cursor: pointer;
    }
    button:hover { background: #e9dac0; border-color: #9c8e73; }
    button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
    button svg { width: 14px; height: 14px; }
    #toggle[data-playing="true"] .play, #toggle[data-playing="false"] .pause { display: none; }
    @media (min-width: 48rem) and (min-height: 35rem) {
      .postcard {
        /* Fit the 7:4 art plus the masthead, caption and mat in the viewport. */
        --mat-height: calc(5.5rem + 1.02 * var(--title-size) + .86 * var(--inset));
        width: min(100%, 73rem, calc((100svh - 2 * var(--page-pad-block) - var(--mat-height)) * 1.75));
      }
    }
    @media (max-width: 40rem) {
      .masthead {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 5px 8px;
        padding-bottom: 12px;
      }
      .masthead > div:first-child { display: contents; }
      .folio { margin: 0; font-size: 9px; grid-row: 1; grid-column: 1; }
      .route { grid-row: 1; grid-column: 2; padding: 0; font-size: 9px; gap: 6px; }
      .route span { display: none; }
      .compass { width: 18px; height: 18px; }
      h1 { grid-row: 2; grid-column: 1 / -1; font-size: clamp(1.65rem, 8.15vw, 3.3rem); }
      .scene { aspect-ratio: 1.1; }
      figcaption { padding-top: 10px; }
      button { min-height: 44px; }
    }
    @media (min-width: 27rem) and (max-width: 40rem) {
      .route b, .route span { display: inline; }
      .route span::before { content: " · "; }
    }
    @media print {
      body { display: block; min-height: 0; padding: 0; background: none; }
      .postcard { width: 100%; padding: 0; box-shadow: none; break-inside: avoid; }
      .scene { aspect-ratio: 1120 / 640; }
      .actions:not([hidden]) { display: none; }
    }
  </style>
</head>
<body>
  <main class="postcard">
    <header class="masthead">
      <div>
        <p class="folio">The Shoreline Press</p>
        <h1>The Coastal <em>Courier</em></h1>
      </div>
      <div class="route">
        <svg class="compass" viewBox="0 0 38 38" aria-hidden="true" fill="none" stroke="currentColor">
          <circle cx="19" cy="19" r="16.5"/>
          <circle cx="19" cy="19" r="13" stroke-dasharray="1 2.41" opacity=".7"/>
          <path d="m19 8 2.5 8.5L30 19l-8.5 2.5L19 30l-2.5-8.5L8 19l8.5-2.5Z" stroke-linejoin="round"/>
          <path d="m19 8 2.5 8.5L19 19l-2.5-2.5ZM19 19l2.5 2.5L19 30l-2.5-8.5Z" fill="currentColor" stroke="none"/>
        </svg>
        <div><b>Pelican Point</b><span>Route No. 01</span></div>
      </div>
    </header>

    <figure>
      <div class="scene">
        <svg id="illustration" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" preserveAspectRatio="xMidYMid slice"
             role="img" aria-labelledby="scene-title scene-description" stroke-linecap="round" stroke-linejoin="round">
          <title id="scene-title">The Coastal Courier</title>
          <desc id="scene-description">A white pelican in a red scarf pedals a coral bicycle by the sea. Its long golden bill catches the morning light, and a sealed letter peeks out of its front basket.</desc>
          <defs>
            <linearGradient id="sky" x2="0" y2="1">
              <stop stop-color="#81afa1"/>
              <stop offset="1" stop-color="#e1dbad"/>
            </linearGradient>
            <linearGradient id="sun" x2="0" y2="1">
              <stop stop-color="#f5ce78"/>
              <stop offset="1" stop-color="#eea34e"/>
            </linearGradient>
            <linearGradient id="sea" x2="0" y2="1">
              <stop stop-color="#73a491"/>
              <stop offset="1" stop-color="#32786b"/>
            </linearGradient>
            <linearGradient id="road" x2="0" y2="1">
              <stop stop-color="#dfa97a"/>
              <stop offset="1" stop-color="#edc292"/>
            </linearGradient>
            <linearGradient id="plumage" x1=".16" x2=".48" y2="1">
              <stop stop-color="#fff5db"/>
              <stop offset=".57" stop-color="#fff0d1"/>
              <stop offset="1" stop-color="#dcc29c"/>
            </linearGradient>
            <linearGradient id="wing-tone" x1=".36" x2=".58" y2="1">
              <stop stop-color="#fff3d6"/>
              <stop offset=".49" stop-color="#f5e4c0"/>
              <stop offset="1" stop-color="#d8be96"/>
            </linearGradient>
            <linearGradient id="pouch" x1=".46" x2=".58" y2="1">
              <stop stop-color="#e9a24d"/>
              <stop offset=".62" stop-color="#f7ca76"/>
              <stop offset="1" stop-color="#eab064"/>
            </linearGradient>
            <linearGradient id="upper-bill" x2="0" y2="1">
              <stop stop-color="#f8d58c"/>
              <stop offset=".65" stop-color="#f5b457"/>
              <stop offset="1" stop-color="#dc8546"/>
            </linearGradient>
            <pattern id="stipple" patternUnits="userSpaceOnUse" width="24" height="19">
              <path fill="#664d33" opacity=".7" d="M2 2h1v1H2zm7 5h1v1H9zm6-4h1v1h-1zm5 11h1v1h-1zM4 14h1v1H4zm9 2h1v1h-1z"/>
              <path fill="#664d33" opacity=".35" d="M6 4h.6v.6H6zm14-1h.7v.7H20zM2 10h.7v.7H2zm12 1h.7v.7H14zm-5 2h.6v.6H9zm6 5h.7v.7H15z"/>
            </pattern>

          <path d="M399 261c42-27 98-35 144-26 37 7 65 24 94 25 18 1 30-4 40-8 10-4 18 1 17 7-1 5-7 8-12 11 9-2 14 2 10 7-20 20-56 23-92 13-23-6-47-5-66 5-24 13-63 16-93 8-21-5-38-12-48-22-7-8-4-14 6-20Z" fill="url(#wing-tone)" stroke="#2b4133" stroke-width="3.3"/>

          <!-- Wicker front basket, with one important letter. -->
          <path d="M729 324c2-12 21-16 39-16s41 4 46 15" fill="none" stroke="#3d4936" stroke-width="4.8"/>

      <figcaption>
        <p class="caption">
          <svg viewBox="0 0 26 16" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
            <path d="M1 6h17c5 0 6-5 2-5-1.5 0-2.5.7-2.8 1.7M6 10h16c4 0 4 5 .9 5-1.5 0-2.3-.9-2.4-1.7M2 13h10" stroke-width="1.3"/>
          </svg>
          A tailwind for the morning post.
        </p>
        <div class="actions" id="actions" hidden>
          <button id="toggle" type="button" data-playing="false">
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path class="play" d="m5 3 8 5-8 5Z"/><path class="pause" d="M5.5 3v10m5-10v10"/>
            </svg>
            <span>Play ride</span>
          </button>
          <button id="save" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 2v8m-3-3 3 3 3-3M2.5 11v2.5h11V11"/>

  <script>
    (() => {
      const find = (id) => document.getElementById(id);
      const svg = find('illustration');
      const toggle = find('toggle');
      const preference = matchMedia('(prefers-reduced-motion: reduce)');
      const parts = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'chain-links', 'lane', 'ripples', 'scarf-tails', 'eye',
      ].map((id) => [id, find(id)]));
      const leg = (side, x, y, upper, lower, offset) => ({
        x, y, upper, lower, offset,
        limb: find(`${side}-leg`), feathers: find(`${side}-feathers`),
        crank: find(`${side}-crank`), foot: find(`${side}-foot`),
      });
      const legs = [leg('near', 536, 295, 92, 100, 0), leg('far', 499, 297, 93, 99, Math.PI)];
      const TAU = 2 * Math.PI;
      const DEG = 180 / Math.PI;
      const TIRE_RADIUS = 98;
      const GEAR_RATIO = 25 / 14.7;
      const CRANK_SPEED = TAU / 3.25;
      const point = (x, y) => `${x.toFixed(2)} ${y.toFixed(2)}`;
      const transform = (part, value) => part.setAttribute('transform', value);

      function pedal({ x, y, upper, lower, offset, limb, feathers, crank, foot }, angle) {
        angle += offset;
        const px = 534 + 43 * Math.cos(angle);
        const py = 457 + 43 * Math.sin(angle);
        const ax = px - 12, ay = py - 15;
        const dx = ax - x, dy = ay - y;
        const length = Math.hypot(dx, dy);
        // The knee is the forward intersection of the thigh and shin circles.
        const along = (upper ** 2 - lower ** 2 + length ** 2) / (2 * length);
        const bend = Math.sqrt(Math.max(0, upper ** 2 - along ** 2));
        const kx = x + (dx * along + dy * bend) / length;
        const ky = y + (dy * along - dx * bend) / length;
        const tx = x + .44 * (kx - x), ty = y + .44 * (ky - y);
        limb.setAttribute('d', `M${x} ${y}Q${point(x + .53 * (kx - x) + 4, (y + ky) / 2 - 3)} ${point(kx, ky)}Q${point(kx + .48 * (ax - kx) + 2, (ky + ay) / 2)} ${point(ax, ay)}`);
        feathers.setAttribute('d', `M${x} ${y}Q${point(x + .52 * (tx - x) + 2, (y + ty) / 2 - 1)} ${point(tx, ty)}`);
        transform(crank, `rotate(${(angle * DEG).toFixed(2)})`);
        transform(foot, `translate(${point(px, py)})`);
      }

      function draw(t) {
        const drive = t * CRANK_SPEED;
        const roll = drive * GEAR_RATIO;
        const travel = roll * TIRE_RADIUS;
        const wheel = `rotate(${(roll % TAU * DEG).toFixed(2)})`;
        transform(parts['rear-wheel'], wheel);
        transform(parts['front-wheel'], wheel);
        // A wheel turn advances the road by one circumference, without a jump at the tile seam.
        transform(parts.lane, `translate(${(-(travel % 245)).toFixed(2)} 0)`);
        parts['chain-links'].setAttribute('stroke-dashoffset', (-(roll * 14.7 % 5)).toFixed(2));
        transform(parts.ripples, `translate(${point(4 * Math.sin(t * 1.12), .8 * Math.sin(t * 1.6))})`);
        transform(parts['scarf-tails'], `rotate(${(1.7 * Math.sin(t * 6.1) + .75 * Math.sin(t * 10)).toFixed(2)} 551 207)`);
        const blink = Math.max(0, 1 - Math.abs(t % 5.8 - 4.8) / .105);
        transform(parts.eye, `scale(1 ${(1 - .94 * blink).toFixed(3)})`);
        for (const side of legs) pedal(side, 43 / DEG + drive % TAU);
      }

      let elapsed = 0, previous = null, frame = 0, playing = false;
      function tick(now) {
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, .064);
        previous = now;
        draw(elapsed);
        frame = requestAnimationFrame(tick);
      }
      function setPlaying(next) {
        cancelAnimationFrame(frame);
        previous = null;
        playing = next;
        toggle.dataset.playing = String(next);
        toggle.querySelector('span').textContent = next ? 'Pause ride' : 'Play ride';
        if (next) frame = requestAnimationFrame(tick);
      }

      toggle.addEventListener('click', () => setPlaying(!playing));
      preference.addEventListener('change', (event) => setPlaying(!event.matches));
      find('save').addEventListener('click', () => {
        const still = svg.cloneNode(true);
        const { width, height } = svg.viewBox.baseVal;
        still.setAttribute('width', width);
        still.setAttribute('height', height);
        still.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        const xml = new XMLSerializer().serializeToString(still);
        const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'the-coastal-courier.svg';
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      });
      find('actions').hidden = false;
      setPlaying(!preference.matches);
    })();
  </script>
