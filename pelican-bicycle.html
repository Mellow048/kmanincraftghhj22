<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican riding a bicycle</title>
<!--
  A pelican riding a bicycle. HTML + one inline SVG. No JavaScript, no images,
  no fonts, no libraries, no network. All motion is SVG <animate> elements.

  What is exact in it:
    - The wheels roll without slipping: one wheel turn (1.2 s) scrolls the road by one
      tyre circumference (2*pi*112 = 703.7 px), which is two marker posts.
    - The gearing is 2:1 (chainring r32, cog r16): cranks turn once per 2.4 s.
    - The legs are solved with two-bone inverse kinematics (thigh 142, shin 138),
      48 keyframes per crank turn, so each webbed foot stays on its pedal.
    - The pedals counter-rotate so they stay level; the far leg is half a turn behind.
-->
<style>
  html, body { height: 100%; margin: 0; background: #1b2233; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
