<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Evening Delivery — a pelican on a bicycle</title>
<style>
  :root { --ink:#f1e6d3; --muted:#b7a58f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 80% at 50% 0%, #2b2130 0%, #17121b 55%, #0e0b11 100%);
    color: var(--ink);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 34px 20px 26px;
  }
  .masthead { text-align: center; max-width: 900px; }
  .masthead h1 {
    margin: 0; font-size: clamp(17px, 2.2vw, 24px); font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: #f8ecd8;
  }
  .masthead p {
    margin: 7px 0 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 12.5px; letter-spacing: .05em; color: var(--muted);
  }
  .frame {
    width: min(1240px, 100%); border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,238,210,.14) inset, 0 30px 80px rgba(0,0,0,.62), 0 6px 24px rgba(0,0,0,.45);
    background: #1c1622;
  }
  .frame svg { display: block; width: 100%; height: auto; }
  .note {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 11.5px; letter-spacing: .055em; color: #8d7f72; text-align: center; margin: 0;
  }
  .note code { color: #c8b49b; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }

  /* ---------- motion ---------- */
  .spin      { animation: spin 1.05s linear infinite; transform-origin: 0px 0px; }
  .spin-slow { animation: spin 2.4s linear infinite; transform-origin: 0px 0px; }
  .pedal     { animation: spinBack 2.4s linear infinite; transform-origin: 0px 0px; }
  .chain     { animation: chain 0.9s linear infinite; }
  .bob       { animation: bob 1.2s ease-in-out infinite; transform-origin: 620px 500px; }
  .bob-head  { animation: bobHead 1.2s ease-in-out infinite; transform-origin: 790px 350px; }
  .look      { animation: look 9s ease-in-out infinite; transform-origin: 800px 340px; }
  .cloud-a   { animation: drift 140s linear infinite; }
  .cloud-b   { animation: drift 96s linear infinite; animation-delay: -34s; }
  .cloud-c   { animation: drift 180s linear infinite; animation-delay: -80s; }
  .wing-a    { animation: flap 1.55s ease-in-out infinite; transform-origin: 1005px 252px; }
  .wing-b    { animation: flap 1.2s ease-in-out infinite; animation-delay: -0.4s; transform-origin: 1062px 218px; }
  .fish      { animation: fish 2.1s ease-in-out infinite; transform-origin: 960px 552px; }
  .grass-a   { animation: sway 4.4s ease-in-out infinite; transform-origin: 96px 900px; }
  .grass-b   { animation: sway 5.2s ease-in-out infinite; animation-delay: -1.3s; transform-origin: 1300px 900px; }
  .dust-a    { animation: dust 4.8s linear infinite; }
  .dust-b    { animation: dust 6.1s linear infinite; animation-delay: -2.4s; }
  .dust-c    { animation: dust 5.5s linear infinite; animation-delay: -4s; }
  .blink     { animation: blink 6.4s linear infinite; transform-origin: 0px 0px; }
  .glow      { animation: glowPulse 7s ease-in-out infinite; }
  .glow-lamp { animation: lamp 3.2s ease-in-out infinite; }

  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes spinBack  { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  @keyframes chain     { to { stroke-dashoffset: -40; } }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-0.25deg); }
    50%      { transform: translateY(-2.8px) rotate(0.35deg); }
  }
  @keyframes bobHead {
    0%, 100% { transform: translateY(0) rotate(0.2deg); }
    50%      { transform: translateY(-1.6px) rotate(-0.35deg); }
  }
  @keyframes look {
    0%, 62%, 100% { transform: rotate(0deg); }
    70%, 82%      { transform: rotate(-3.2deg) translateY(1px); }
  }
  @keyframes drift  { from { transform: translateX(-50px); } to { transform: translateX(150px); } }
  @keyframes flap   { 0%,100% { transform: scaleY(1); } 45% { transform: scaleY(0.32); } }
  @keyframes fish   { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(8deg); } }
  @keyframes sway   { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.7deg); } }
  @keyframes dust {
    0%   { opacity: 0; transform: translate(0,0); }
    18%  { opacity: .55; }
    100% { opacity: 0; transform: translate(-150px,-46px); }
  }
  @keyframes blink {
    0%, 91.5%, 100% { transform: scaleY(0); }
    94%, 96%        { transform: scaleY(1); }
  }
  @keyframes glowPulse { 0%,100% { opacity: .55; } 50% { opacity: .8; } }
  @keyframes lamp { 0%,100% { opacity: .5; } 50% { opacity: .75; } }

  .thigh-near { animation: thighNear 2.4s linear infinite; transform-origin: 0px 0px; }
  .shin-near  { animation: shinNear  2.4s linear infinite; transform-origin: 0px 0px; }
  .foot-near  { animation: footNear  2.4s linear infinite; transform-origin: 0px 0px; }
  .thigh-far  { animation: thighFar  2.4s linear infinite; transform-origin: 0px 0px; }
  .shin-far   { animation: shinFar   2.4s linear infinite; transform-origin: 0px 0px; }
  .foot-far   { animation: footFar   2.4s linear infinite; transform-origin: 0px 0px; }

  @media (prefers-reduced-motion: reduce) {
    .spin, .spin-slow, .pedal, .chain, .bob, .bob-head, .look, .cloud-a, .cloud-b, .cloud-c,
    .wing-a, .wing-b, .fish, .grass-a, .grass-b, .dust-a, .dust-b, .dust-c, .blink, .glow, .glow-lamp,

      animation: none !important;

<body>
<header class="masthead">
  <h1>The Evening Delivery</h1>
  <p>a pelican, a bicycle, and the last light on the coast road</p>
</header>

     aria-labelledby="pelicanTitle pelicanDesc" preserveAspectRatio="xMidYMid meet">

  <desc id="pelicanDesc">A white pelican in a straw boater rides a teal bicycle at sunset along a dirt coast road. It has a fish in the front basket, the mail in a satchel on the back, and its wings, cranks, chain and webbed feet are all animated.</desc>
