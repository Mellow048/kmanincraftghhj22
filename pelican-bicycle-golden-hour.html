<title>Pelican on a Bicycle — golden hour</title>
<!--
  A pelican riding a bicycle. One hand-written SVG inside one HTML file:
  no JavaScript, no images, no fonts, no libraries, no network, no canvas.
  Every movement is a native SVG <animate> or <animateTransform>; the CSS only
  lets the drawing fill the window.

  WHAT IS TRUE IN IT (all of these are numbers in the file, not claims):

  Rolling.  The tyre radius is 95.5, so one turn carries 2*pi*95.5 = 600.0 px
  of tread.  A wheel turns in 1.1 s, so the road passes at 545.5 px/s.  The
  road is a 1240 px tile that crosses in 2.273 s, which is 545.5 px/s.  Same
  number, so the wheels do not slip.

  Gearing.  The cranks turn once per 2.2 s while the wheels turn twice: 2:1,
  like a chainring twice the rear cog.  The crank arms are 36 px, so the pedals
  ride an 72 px circle, twice per second of wheel.

  Legs.  Each leg is solved, not eyeballed: hip, ankle and two bone lengths
  (70 + 80) give the foot position for 24 crank angles, written out as 25
  path keyframes per leg.  The near foot always stays on the near pedal.

  Depth.  Four layers scroll behind the rider, each a 1240 px tile duplicated
  once so the loop has no seam: sunflower field 11 s, fence 4.5 s, road 2.273 s,
  clouds 90 s.  Closer is faster.  The foreground grass does not scroll: it
  sways, because it stands between the camera and the road.

  Light.  A low sun from the right (its rim is on the beak, the head, the chest
  and the top tube), a warm lamp pool thrown forward on the road, and the cool
  lavender the asphalt keeps in shadow.  Three sources with three jobs.

  Small life: eyelid blink on a 5.6 s cycle, a breath-and-bob on the pedal
  stroke, a scarf with two tails on different clocks, a beak pouch that gives
  with the bob, a fish in the basket whose tail keeps trying, windmill sails,
  gulls, pollen, road dust, and a scarecrow's hat that moves in the wind.

  Everything is drawn in one 1200 x 800 space; the page scales it to the window.
-->
<style>
  html, body { height: 100%; margin: 0; background: #2a1b22; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
