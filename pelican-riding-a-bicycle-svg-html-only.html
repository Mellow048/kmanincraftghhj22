<title>Pelican riding a bicycle — SVG + HTML only</title>
<!--
  A pelican riding a bicycle. One HTML file, one inline SVG. No JavaScript,
  no images, no fonts, no libraries, no network. All motion is native SVG
  SMIL (<animate> / <animateTransform>), so it runs offline in any browser
  that supports SMIL (Chrome, Firefox, Safari, Edge).

  What is mechanically true in this picture:
    * Wheels roll without slipping: wheel radius 110 px, circumference
      2*pi*110 = 691.2 px. One wheel turn (1.2 s) scrolls the road and the
      mid-ground by exactly 691.2 px, so ground speed = omega * r.
    * Gearing 2:1 (chainring 32T, cog 16T): wheels turn in 1.2 s, cranks
      in 2.4 s. The chain dash-offset is synced to the crank period.
    * Legs are solved, not guessed: two-bone inverse kinematics
      (thigh 135, shin 135, hip to bottom-bracket 172 px), 48 keyframes
      per crank turn, ankle bending backward like a real bird's ankle.
      Each webbed foot stays planted on its pedal; the far leg is
      exactly half a turn (180 deg) behind the near leg.
    * Pedals counter-rotate (-360 deg per crank turn) so they stay level.
    * Body bob, head bob, scarf flutter, blinking, drifting clouds and
      parallax (far sea slow, mid-ground and road at ground speed) are
      all synced to those two periods (1.2 s wheels / 2.4 s cranks).

  The pelican: white plumage, black flight feathers, long orange bill
  with a sagging gular pouch (a fish tail sticks out of it), S-curved
  neck, webbed feet, red helmet and scarf. The bicycle: teal diamond
  frame, fork, chain, spokes, reflectors, leather saddle and grips,
  front basket with a baguette and fish.
-->
