<title>A pelican riding a bicycle, at night</title>
<!--
  A pelican riding a bicycle down a night street. One inline SVG, nothing else.

  No JavaScript, no images, no fonts, no libraries, no network. Every movement is a
  native SVG <animate> or <animateTransform>. The two CSS rules below only make the
  drawing fill the window.

  The numbers, so you can check them:
    - 700c wheels: 128 units of tyre radius, drawn 1.15x. One revolution takes 1.2 s and
      covers exactly the tyre circumference, 804.25 units, and the road, the kerb, the
      markings and the puddle move that same distance in that same time. No slip.
    - 48-tooth chainring (r 33.19), 32-tooth cog (r 22.13), 12.7 mm chain pitch. That is
      1.5:1, so the cranks turn once every 1.8 s while the wheels turn once every 1.2 s.
      The chain is 48 links of 4.345 units and advances exactly one crank turn per loop.
    - The legs are two-bone IK, not guesswork. Thigh 158, shin 152, 48 samples per crank
      turn, both ankles solved onto their own pedal spindle, and the webbed foot is
      counter-rotated so it stays flat on the pedal through the whole stroke.
    - Parallax, as a fraction of the road speed: clouds 0.03, far skyline 0.07, the row
      houses 0.27, the lamp posts 0.87 (they stand a lane back), the near verge 1.35.
    - Light: the moon is the cold key and rims the bird on its far side; the street lamp
      is the warm practical and lights the bill, the wing and the basket; the lit windows
      are the fill, and the wet road keeps a piece of every one of them.

  Drawn at 1000 x 1778 (9:16). It scales to any window.
-->

  html, body { height: 100%; margin: 0; background: #04060d; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
