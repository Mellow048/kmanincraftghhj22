<title>Pelican · Morning Tide Run — a pelican riding a bicycle</title>
<!--
  A pelican riding a bicycle, along a coastal road. One HTML file, one inline SVG.
  No images, no fonts, no libraries, no network. The only script is at the bottom: it
  sets transforms from one clock, so every frame is a pure function of t. Add ?t=4.2 to
  the URL to freeze that frame; prefers-reduced-motion shows a solved still.

  Written from scratch for this branch. It is not built from, and does not reuse, any
  other pelican file in the repository.

  What is actually solved, not mimed
    * No-slip wheels. Wheel radius 110, one turn per 1.0 s, so the road must move
      2*pi*110 = 691.15 px per turn. The dashes, posts, pebbles and shells all scroll at
      exactly that rate on their own loop, so the tyres never skate.
    * Real gearing. 44-tooth chainring, 22-tooth cog: the cranks turn once per 2.0 s
      while the wheels turn twice. The far crank is half a turn behind the near one.
    * Two-bone legs, solved every frame (thigh 126, shin 130) from the moving hip to the
      pedal the crank is holding, knee forced forward. The webbed foot is pinned to the
      pedal and the pedal counter-rotates to stay level, so nothing slides through the
      stroke.
    * The body rides the pedals: it bobs and sways at twice the pedalling rate and the
      legs are re-solved from the moving hip, not a fixed point.
    * Parallax by depth. Sea 0.10, boat and clouds drift, far reeds 0.55, verge, posts,
      dashes, pebbles and shells 1.00, foreground grass 1.60. Each looping layer repeats
      exactly on its own period, so no seam can appear.
    * A camera that breathes: a slow drift and a 1.2 % push, centre-locked.
-->

<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;
  var WHEEL_R = 110;                 // px
  var WHEEL_PERIOD = 1.0;            // one wheel turn per second
  var GROUND_SPEED = TAU * WHEEL_R / WHEEL_PERIOD;   // 691.15 px/s, no slip
  var CRANK_PERIOD = 2.0;            // 44t chainring : 22t cog = 2 wheels per crank
  var CRANK_R = 44;
  var BB = [532, 574];               // bottom bracket (crank centre)
  var HIP = [500, 402];              // hip joint inside the body
  var THIGH = 126, SHIN = 130;

  var LAYERS = [
    { id: "waves",     period: 600, speed: 0.10 },
    { id: "reeds",     period: 400, speed: 0.55 },
    { id: "posts",     period: 300, speed: 1.00 },
    { id: "pebbles",   period: 400, speed: 1.00 },
    { id: "shells",    period: 400, speed: 1.00 },
    { id: "dashes",    period: 150, speed: 1.00 },
    { id: "nearGrass", period: 800, speed: 1.60 }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var el = {};
  ["wheelRear", "wheelFront", "spokesRear", "spokesFront", "cog", "chainring", "crank",
   "crankNear", "crankFar", "pedalNear", "pedalFar",
   "legNear", "thighNearRot", "shinNearRot", "footNear",
   "legFar", "thighFarRot", "shinFarRot", "footFar",
   "head", "pouch", "hat", "lid", "world", "waves", "posts", "pebbles", "dashes", "nearGrass", "reeds", "wing", "body", "fish",
   "gull1", "gull2", "gull3", "clouds", "boat", "world", "shells"].forEach(function (id) { el[id] = $(id); });
  LAYERS.forEach(function (l) { el[l.id] = $(l.id); });

  var deg = function (rad) { return rad * 180 / Math.PI; };
  var wrap = function (v, p) { return ((v % p) + p) % p; };

  // Two-bone IK: hip -> pedal, knee pushed forward. Returns absolute angles in radians.
  function solveLeg(hip, pedal) {
    var dx = pedal[0] - hip[0], dy = pedal[1] - hip[1];
    var d = Math.sqrt(dx * dx + dy * dy);
    d = Math.min(d, THIGH + SHIN - 0.01);
    var base = Math.atan2(dy, dx);
    var cosA = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    var a = Math.acos(Math.max(-1, Math.min(1, cosA)));
    var thigh = base - a;                                  // knee forward of the line
    var kx = hip[0] + THIGH * Math.cos(thigh);
    var ky = hip[1] + THIGH * Math.sin(thigh);
    var shin = Math.atan2(pedal[1] - ky, pedal[0] - kx);
    return { thigh: thigh, shin: shin };
  }

  function pedalAt(angle) {
    return [BB[0] + CRANK_R * Math.cos(angle), BB[1] + CRANK_R * Math.sin(angle)];
  }

  function draw(t) {
    var wheel = wrap(t / WHEEL_PERIOD, 1) * 360;
    var crankA = wrap(t / CRANK_PERIOD, 1) * TAU;

    // wheels, spokes and the cog all turn with the road
    el.wheelRear.setAttribute("transform", "translate(385,540) rotate(" + wheel.toFixed(3) + ")");
    el.wheelFront.setAttribute("transform", "translate(725,540) rotate(" + wheel.toFixed(3) + ")");
    el.cog.setAttribute("transform", "rotate(" + wheel.toFixed(3) + ")");
    el.chainring.setAttribute("transform", "rotate(" + (deg(crankA) % 360).toFixed(3) + ")");

    // cranks: near arm at the crank angle, far arm half a turn behind
    var crankDeg = deg(crankA);
    el.crankNear.setAttribute("transform", "rotate(" + crankDeg.toFixed(3) + ")");
    el.crankFar.setAttribute("transform", "rotate(" + (crankDeg + 180).toFixed(3) + ")");
    el.pedalNear.setAttribute("transform", "rotate(" + (-crankDeg).toFixed(3) + ")");
    el.pedalFar.setAttribute("transform", "rotate(" + (-(crankDeg + 180)).toFixed(3) + ")");

    // the body rides on the pedals: it rises twice per crank turn
    var bob = 2.6 * Math.sin(crankA * 2 + 0.4);
    var sway = 0.9 * Math.sin(crankA + 0.2);

    // legs are solved from the moving hip to the pedal the crank is holding
    var hip = [HIP[0] + sway * 0.5, HIP[1] + bob];
    var nearPedal = pedalAt(crankA), farPedal = pedalAt(crankA + Math.PI);

    el.legNear.setAttribute("transform", "translate(" + hip[0].toFixed(2) + "," + hip[1].toFixed(2) + ")");
    var n = solveLeg(hip, nearPedal);
    el.thighNearRot.setAttribute("transform", "rotate(" + deg(n.thigh).toFixed(3) + ")");
    el.shinNearRot.setAttribute("transform", "rotate(" + deg(n.shin - n.thigh).toFixed(3) + ")");
    el.footNear.setAttribute("transform", "rotate(" + (-deg(n.shin)).toFixed(3) + ")");

    el.legFar.setAttribute("transform", "translate(" + hip[0].toFixed(2) + "," + hip[1].toFixed(2) + ")");
    var f = solveLeg(hip, farPedal);
    el.thighFarRot.setAttribute("transform", "rotate(" + deg(f.thigh).toFixed(3) + ")");
    el.shinFarRot.setAttribute("transform", "rotate(" + deg(f.shin - f.thigh).toFixed(3) + ")");
    el.footFar.setAttribute("transform", "rotate(" + (-deg(f.shin)).toFixed(3) + ")");

    // head and body ride the bob, the head a beat late
    el.body.setAttribute("transform", "translate(0," + (bob * 0.8).toFixed(2) + ") rotate(" + (sway * 0.35).toFixed(2) + " 440 350)");
    el.head.setAttribute("transform", "translate(" + (sway * 0.4).toFixed(2) + "," + (bob * 1.1).toFixed(2) + ") rotate(" + (sway * 0.8).toFixed(2) + " 520 326)");
    el.wing.setAttribute("transform", "translate(0," + (bob * 0.7).toFixed(2) + ")");
    el.hat.setAttribute("transform", "rotate(-9 668 170) rotate(" + (sway * 1.5).toFixed(2) + " 668 172)");

    // the pouch swings on its hinge under the beak
    el.pouch.setAttribute("transform", "rotate(" + (1.5 * Math.sin(crankA * 2 - 0.9)).toFixed(3) + " 690 220)");

    // a blink every 3.6 s, quick and unannounced
    var b = (t % 3.6) / 3.6;
    var lid = b < 0.035 ? Math.sin((b / 0.035) * Math.PI) : 0;
    el.lid.setAttribute("transform", "translate(0,190) scale(1," + lid.toFixed(3) + ") translate(0,-190)");

    // the fish in the basket
    el.fish.setAttribute("transform", "translate(788,346) rotate(" + (7 * Math.sin(t * TAU * 1.9)).toFixed(2) + ")");

    // gulls: flap, drift, bob
    var g1 = t * TAU * 1.8, g2 = t * TAU * 1.5 + 1.2, g3 = t * TAU * 2.1 + 2.4;
    el.gull1.setAttribute("transform", "translate(" + (300 + Math.sin(t * 0.35) * 26).toFixed(1) + "," + (150 + Math.sin(t * 0.8) * 12).toFixed(1) + ") scale(1," + (0.55 + 0.45 * Math.abs(Math.cos(g1))).toFixed(3) + ")");
    el.gull2.setAttribute("transform", "translate(" + (392 + Math.sin(t * 0.3 + 1) * 22).toFixed(1) + "," + (196 + Math.sin(t * 0.7 + 0.6) * 10).toFixed(1) + ") scale(.72," + (0.72 * (0.55 + 0.45 * Math.abs(Math.cos(g2)))).toFixed(3) + ")");
    el.gull3.setAttribute("transform", "translate(" + (1080 + Math.sin(t * 0.25 + 2) * 30).toFixed(1) + "," + (96 + Math.sin(t * 0.6 + 1.4) * 9).toFixed(1) + ") scale(.55," + (0.55 * (0.55 + 0.45 * Math.abs(Math.cos(g3)))).toFixed(3) + ")");

    el.boat.setAttribute("transform", "translate(" + (238 + 26 * Math.sin(t * 0.13)).toFixed(1) + "," + (556 + 3.5 * Math.sin(t * 0.9)).toFixed(1) + ") rotate(" + (1.6 * Math.sin(t * 0.7)).toFixed(2) + ",0,20)");

    el.clouds.setAttribute("transform", "translate(" + (18 * Math.sin(t * 0.055)).toFixed(1) + "," + (3 * Math.sin(t * 0.11)).toFixed(1) + ")");

    // the shot itself: a slow drift and a 2 % push, so a still never looks paused
    var k = 1 + 0.012 * (0.5 - 0.5 * Math.cos(t * 0.21));
    var dx = 600 * (1 - k) + 4 * Math.sin(t * 0.23);
    var dy = 400 * (1 - k) + 5 * Math.sin(t * 0.19 + 1);
    el.world.setAttribute("transform", "translate(" + dx.toFixed(2) + "," + dy.toFixed(2) + ") scale(" + k.toFixed(5) + ")");

    // the ground, at exactly the speed the tyres are rolling
    LAYERS.forEach(function (l) {
      var x = -wrap(t * GROUND_SPEED * l.speed, l.period || 1200);
      el[l.id].setAttribute("transform", "translate(" + x.toFixed(2) + ",0)");
    });
  }

  // ---- clock ----
  // ?t=<seconds> freezes a frame; prefers-reduced-motion shows one still. Otherwise the
  // page runs on requestAnimationFrame and the first drawn frame is frame zero, never
  // the unsolved markup.
  var frozen = /(?:^|[?&])t=([\d.]+)/.exec(window.location.search);
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (frozen) {
    draw(parseFloat(frozen[1]));
  } else if (still) {
    draw(0);
  } else if (window.requestAnimationFrame) {
    var start = null;
    var tick = function (now) {
      if (start === null) start = now;
      draw((now - start) / 1000);
      window.requestAnimationFrame(tick);
    };
    window.requestAnimationFrame(tick);
  } else {
    draw(0);
  }

  window.pelicanFrame = draw;   // handle for a still frame, or a scrub bar
})();
</script>
</body>
</html>
