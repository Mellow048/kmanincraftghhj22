<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle — Animated SVG</title>
  <style>
    :root {
      --bg-outer: #13222d;
      --panel-bg: rgba(15, 29, 40, 0.72);
      --panel-border: rgba(255, 255, 255, 0.16);
      --text-main: #f8f5ec;
      --text-muted: rgba(248, 245, 236, 0.72);
      --accent: #f4a236;
      --accent-teal: #2a9d8f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #1d3547 0%, #0f1c26 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .stage-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .canvas-frame {
      position: relative;
      width: min(96vw, calc(92vh * 12 / 7));
      aspect-ratio: 12 / 7;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.12);
      background: #5ea9d6;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    .clickable {
      cursor: pointer;
    }

    /* Sleek unobtrusive HUD */
    .hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
      font-size: 13px;
      z-index: 10;
      transition: opacity 0.25s ease;
    }

    .hud-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.18s ease, transform 0.12s ease, border-color 0.18s ease;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.34);
    }

    .hud-btn:active {
      transform: scale(0.95);
    }

    .hud-btn.active {
      background: var(--accent);
      color: #1c1409;
      border-color: transparent;
    }

    .hud-btn.bell-btn {
      background: rgba(244, 162, 54, 0.22);
      border-color: rgba(244, 162, 54, 0.55);
      color: #ffdc9e;
    }

    .hud-btn.bell-btn:hover {
      background: rgba(244, 162, 54, 0.38);
    }

    .hud-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.16);
    }

    .speed-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .speed-wrap input[type="range"] {
      width: 82px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .mood-group {
      display: flex;
      gap: 4px;
    }

    .mood-group .hud-btn {
      padding: 5px 10px;
      font-size: 12px;
    }

    .hint-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 29, 40, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 11.5px;
      color: rgba(255, 252, 245, 0.86);
      letter-spacing: 0.02em;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .stage-wrapper { padding: 6px; }
      .canvas-frame { width: 100vw; border-radius: 12px; }
      .hud {
        bottom: 8px;
        gap: 6px;
        padding: 6px 10px;
        max-width: 96%;
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 16px;
      }
      .hint-badge { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage-wrapper">
    <div class="canvas-frame">
      <div class="hint-badge">Click the pelican or brass bell · Space to pause</div>

      <svg id="scene" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated pelican riding a coastal cruiser bicycle along a seaside boardwalk">
        <defs>
          <!-- ===== SKY & ATMOSPHERE GRADIENTS (updated smoothly per mood) ===== -->
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="skyStop0" offset="0%" stop-color="#4e9ed1" />
            <stop id="skyStop1" offset="48%" stop-color="#96cde3" />
            <stop id="skyStop2" offset="80%" stop-color="#f7d7a8" />
            <stop id="skyStop3" offset="100%" stop-color="#f4ab74" />
          </linearGradient>

          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop id="sunGlow0" offset="0%" stop-color="#fff8d6" stop-opacity="0.95" />
            <stop id="sunGlow1" offset="32%" stop-color="#ffe194" stop-opacity="0.55" />
            <stop id="sunGlow2" offset="70%" stop-color="#f7b267" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#f7b267" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="oceanStop0" offset="0%" stop-color="#2c8c99" />
            <stop id="oceanStop1" offset="42%" stop-color="#1f7082" />
            <stop id="oceanStop2" offset="100%" stop-color="#144e5e" />
          </linearGradient>

          <linearGradient id="horizonShimmer" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffd28c" stop-opacity="0" />
            <stop offset="50%" stop-color="#ffefc2" stop-opacity="0.72" />
            <stop offset="100%" stop-color="#ffd28c" stop-opacity="0" />
          </linearGradient>

          <linearGradient id="distantHillGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="hillStop0" offset="0%" stop-color="#5d8d9e" />
            <stop id="hillStop1" offset="100%" stop-color="#3c6b7c" />
          </linearGradient>

          <linearGradient id="promenadeWall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e3cfb4" />
            <stop offset="40%" stop-color="#c9b293" />
            <stop offset="100%" stop-color="#9e876a" />
          </linearGradient>

          <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7c7b84" />
            <stop offset="12%" stop-color="#696872" />
            <stop offset="86%" stop-color="#575661" />
            <stop offset="100%" stop-color="#484752" />
          </linearGradient>

          <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e2c394" />
            <stop offset="55%" stop-color="#cfa670" />
            <stop offset="100%" stop-color="#b58852" />
          </linearGradient>

          <!-- ===== BICYCLE MATERIAL GRADIENTS ===== -->
          <linearGradient id="frameTeal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5ad2c4" />
            <stop offset="35%" stop-color="#2a9d8f" />
            <stop offset="85%" stop-color="#1d746a" />
            <stop offset="100%" stop-color="#14564e" />
          </linearGradient>

          <linearGradient id="frameTealDiag" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#62dad0" />
            <stop offset="48%" stop-color="#2a9d8f" />
            <stop offset="100%" stop-color="#176158" />
          </linearGradient>

          <linearGradient id="frameTealDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#21796f" />
            <stop offset="100%" stop-color="#124741" />
          </linearGradient>

          <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="30%" stop-color="#d5dde2" />
            <stop offset="65%" stop-color="#8b99a3" />
            <stop offset="100%" stop-color="#e8eff2" />
          </linearGradient>

          <linearGradient id="leatherGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#df9353" />
            <stop offset="45%" stop-color="#b6642b" />
            <stop offset="100%" stop-color="#7c3e14" />
          </linearGradient>

          <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff0a8" />
            <stop offset="40%" stop-color="#e3ad3b" />
            <stop offset="85%" stop-color="#a87018" />
            <stop offset="100%" stop-color="#f2c963" />
          </linearGradient>

          <linearGradient id="basketGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e5b876" />
            <stop offset="55%" stop-color="#c9904a" />
            <stop offset="100%" stop-color="#9c692d" />
          </linearGradient>

          <linearGradient id="fishGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3f6e8c" />
            <stop offset="40%" stop-color="#a8d0e6" />
            <stop offset="72%" stop-color="#eef7fc" />
            <stop offset="100%" stop-color="#b8cad4" />
          </linearGradient>

          <!-- ===== PELICAN PLUMAGE & ANATOMY GRADIENTS ===== -->
          <linearGradient id="pelicanBodyGrad" x1="0.2" y1="0" x2="0.6" y2="1">
            <stop offset="0%" stop-color="#fffef9" />
            <stop offset="52%" stop-color="#f7f2e7" />
            <stop offset="82%" stop-color="#e4dccb" />
            <stop offset="100%" stop-color="#ccc3b2" />
          </linearGradient>

          <linearGradient id="pelicanNeckGrad" x1="0" y1="0" x2="1" y2="0.4">
            <stop offset="0%" stop-color="#eae3d3" />
            <stop offset="45%" stop-color="#fffdf8" />
            <stop offset="85%" stop-color="#fbf7ed" />
            <stop offset="100%" stop-color="#e8decb" />
          </linearGradient>

          <linearGradient id="wingCovertGrad" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#fffef8" />
            <stop offset="58%" stop-color="#f1ebdd" />
            <stop offset="100%" stop-color="#d5cdbc" />
          </linearGradient>

          <linearGradient id="wingFarGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ddd6c7" />
            <stop offset="100%" stop-color="#b6aea0" />
          </linearGradient>

          <linearGradient id="billUpperGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffd166" />
            <stop offset="32%" stop-color="#f7a436" />
            <stop offset="82%" stop-color="#e37224" />
            <stop offset="100%" stop-color="#c45616" />
          </linearGradient>

          <linearGradient id="pouchGrad" x1="0.3" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#fcbf49" />
            <stop offset="45%" stop-color="#f2952c" />
            <stop offset="86%" stop-color="#d96b1e" />
            <stop offset="100%" stop-color="#b84f14" />
          </linearGradient>

          <linearGradient id="legNearGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#e07424" />
            <stop offset="42%" stop-color="#f79f3b" />
            <stop offset="100%" stop-color="#cf631c" />
          </linearGradient>

          <linearGradient id="legFarGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ad5114" />
            <stop offset="50%" stop-color="#c76922" />
            <stop offset="100%" stop-color="#96420f" />
          </linearGradient>

          <linearGradient id="headlampBeam" x1="0" y1="0.5" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#fff4b8" stop-opacity="0.62" />
            <stop offset="55%" stop-color="#ffe085" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#ffe085" stop-opacity="0" />
          </linearGradient>

          <linearGradient id="lighthouseBeam" x1="0" y1="0.5" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#fff7c2" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#fff7c2" stop-opacity="0" />
          </linearGradient>

          <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur stdDeviation="5" />
          </filter>

          <filter id="sunBlur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" />
          </filter>

          <clipPath id="basketClip">
            <path d="M 709 348 L 784 348 L 774 409 Q 772 414 766 414 L 722 414 Q 716 414 714 409 Z" />
          </clipPath>

          <clipPath id="oceanClip">
            <rect x="0" y="370" width="1200" height="106" />
          </clipPath>
        </defs>

        <!-- ================================================================ -->
        <!-- LAYER 1: SKY, SUN, CLOUDS, DISTANT SEABIRDS                      -->
        <!-- ================================================================ -->
        <rect x="0" y="0" width="1200" height="378" fill="url(#skyGrad)" />

        <!-- Sunset stars (fade in smoothly in Sunset mode) -->
        <g id="sunset-stars" opacity="0">
          <circle cx="115" cy="52" r="1.5" fill="#fff9e2" opacity="0.85" />
          <circle cx="240" cy="84" r="1.2" fill="#fff9e2" opacity="0.7" />
          <circle cx="388" cy="40" r="1.8" fill="#fff9e2" opacity="0.9" />
          <circle cx="512" cy="74" r="1.1" fill="#fff9e2" opacity="0.65" />
          <circle cx="660" cy="46" r="1.6" fill="#fff9e2" opacity="0.8" />
          <circle cx="810" cy="68" r="1.3" fill="#fff9e2" opacity="0.75" />
          <circle cx="1078" cy="58" r="1.7" fill="#fff9e2" opacity="0.85" />
          <circle cx="1142" cy="96" r="1.2" fill="#fff9e2" opacity="0.65" />
        </g>

        <!-- Radiant Sun -->
        <g id="sun-group" transform="translate(950, 148)">
          <circle cx="0" cy="0" r="165" fill="url(#sunGlow)" />
          <circle cx="0" cy="0" r="64" fill="#ffe89c" opacity="0.32" filter="url(#sunBlur)" />
          <circle id="sun-disc" cx="0" cy="0" r="44" fill="#fff5cc" />
        </g>

        <!-- Parallax Cloud Layer (Slow) -->
        <g id="clouds-far"></g>
        <g id="clouds-near"></g>

        <!-- Distant Gliding Seabirds -->
        <g id="distant-birds"></g>

        <!-- ================================================================ -->
        <!-- LAYER 2: DISTANT HEADLAND, HILLS & LIGHTHOUSE                    -->
        <!-- ================================================================ -->
        <g id="coast-far"></g>

        <!-- ================================================================ -->
        <!-- LAYER 3: SHIMMERING OCEAN & BOBBING SAILBOATS                    -->
        <!-- ================================================================ -->
        <rect x="0" y="370" width="1200" height="106" fill="url(#oceanGrad)" />
        <!-- Sunlit horizon haze -->
        <rect x="0" y="370" width="1200" height="16" fill="#ffd9a0" opacity="0.22" />
        <!-- Shimmering sun reflection path on water -->
        <g id="water-shimmer" clip-path="url(#oceanClip)"></g>
        <!-- Gentle wave lines -->
        <g id="ocean-waves" clip-path="url(#oceanClip)"></g>
        <!-- Distant Sailboats -->
        <g id="sailboats"></g>

        <!-- ================================================================ -->
        <!-- LAYER 4: MIDGROUND SEAWALL, PALMS, LAMPPOSTS & BOARDWALK RAILING -->
        <!-- ================================================================ -->
        <!-- Low sandstone coastal seawall -->
        <rect x="0" y="468" width="1200" height="46" fill="url(#promenadeWall)" />
        <rect x="0" y="466" width="1200" height="6" fill="#f2e3cc" />
        <rect x="0" y="472" width="1200" height="3" fill="#b39a79" opacity="0.7" />
        <rect x="0" y="510" width="1200" height="6" fill="#8b7459" />

        <!-- Midground palms & vintage boardwalk lampposts -->
        <g id="midground-props"></g>

        <!-- Wooden coastal railing running behind the bike path -->
        <g id="railing-layer">
          <rect x="0" y="438" width="1200" height="6" fill="#e7d9c2" stroke="#9e876b" stroke-width="1" />
          <rect x="0" y="454" width="1200" height="4" fill="#d9c6aa" stroke="#9e876b" stroke-width="0.8" />
          <g id="railing-posts"></g>
        </g>

        <!-- ================================================================ -->
        <!-- LAYER 5: COASTAL BIKE PATH / PROMENADE                           -->
        <!-- ================================================================ -->
        <rect x="0" y="516" width="1200" height="132" fill="url(#roadGrad)" />
        <!-- Warm sunlit top curb highlight -->
        <rect x="0" y="516" width="1200" height="5" fill="#d9cab3" />
        <rect x="0" y="521" width="1200" height="4" fill="#4c4a54" opacity="0.55" />
        <!-- Subtle painted oceanfront bike path edge stripes -->
        <rect x="0" y="534" width="1200" height="3.5" fill="#f3e8d2" opacity="0.65" />
        <rect x="0" y="636" width="1200" height="4" fill="#f3e8d2" opacity="0.58" />
        <!-- Scrolling dashed centerline & asphalt texture pebbles (locked to tire ground speed!) -->
        <g id="road-markings"></g>

        <!-- Lower sandy dune verge -->
        <rect x="0" y="648" width="1200" height="52" fill="url(#sandGrad)" />
        <path d="M 0 648 Q 180 644 360 649 T 720 647 T 1080 650 L 1200 648 L 1200 655 L 0 655 Z" fill="#ebd0a4" opacity="0.7" />

        <!-- ================================================================ -->
        <!-- LAYER 6: GROUNDED CONTACT SHADOW                                 -->
        <!-- ================================================================ -->
        <g id="bike-shadow">
          <ellipse id="shadow-main" cx="590" cy="603" rx="228" ry="15" fill="#1b1c24" opacity="0.34" filter="url(#softShadow)" />
          <ellipse id="shadow-rear" cx="432" cy="600" rx="56" ry="6.5" fill="#12131a" opacity="0.45" />
          <ellipse id="shadow-front" cx="748" cy="600" rx="56" ry="6.5" fill="#12131a" opacity="0.45" />
        </g>

        <!-- ================================================================ -->
        <!-- LAYER 7: FAR SIDE (BEHIND BICYCLE FRAME — TRUE 3D STRADDLE!)     -->
        <!-- ================================================================ -->
        <!-- Far Wing (reaches across to far handlebar grip behind torso) -->
        <g id="pelican-far-wing">
          <path id="far-wing-shape" d="" fill="url(#wingFarGrad)" stroke="#9a9284" stroke-width="1.5" stroke-linejoin="round" />
          <path id="far-wing-tips" d="" fill="#38404b" stroke="#262c34" stroke-width="1.2" stroke-linejoin="round" />
        </g>

        <!-- Far Pedal & Far Crank Arm (behind frame) -->
        <g id="far-crank-group">
          <line id="far-crank-arm" x1="566" y1="520" x2="566" y2="558" stroke="#6f7a82" stroke-width="8" stroke-linecap="round" />
          <line id="far-crank-hl" x1="566" y1="520" x2="566" y2="558" stroke="#a6b2ba" stroke-width="2" stroke-linecap="round" />
        </g>

        <!-- Far Pedal Platform (underneath far foot) -->
        <g id="far-pedal-group">
          <rect x="-15" y="-3.5" width="30" height="7" rx="3" fill="#2c3138" stroke="#181b20" stroke-width="1.2" />
          <rect x="-10" y="-1.5" width="20" height="3" rx="1" fill="#c98d28" opacity="0.7" />
        </g>

        <!-- Far Pelican Leg & Webbed Foot (behind seat tube & down tube, foot ON TOP of far pedal!) -->
        <g id="pelican-far-leg">
          <!-- Articulated orange bird leg (upper joint -> knee -> ankle) -->
          <path id="far-leg-shin-outline" d="" fill="none" stroke="#7d390e" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" />
          <path id="far-leg-shin" d="" fill="none" stroke="#c76922" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Plump feathered upper drumstick -->
          <path id="far-leg-thigh" d="" fill="#d6cebe" stroke="#a69e8e" stroke-width="1.3" stroke-linejoin="round" />
          <circle id="far-ankle-joint" cx="0" cy="0" r="4.6" fill="#c76922" />
          <!-- Totipalmate webbed foot planted centered on far pedal -->
          <g id="far-foot-group">
            <path d="M -9 0 C -5 -6, 8 -5, 22 -1 L 31 3 C 26 7, 17 7, 12 6 C 5 7, -4 7, -11 4.5 Z" fill="#ba5918" stroke="#7d380c" stroke-width="1.3" stroke-linejoin="round" />
            <path d="M -1 -1 L 27 2.5 M -1 1 L 22 5.5 M -1 2.5 L 11 5.5" stroke="#8a3e0e" stroke-width="1.1" stroke-linecap="round" />
          </g>
        </g>

        <!-- Far bicycle stays & far fork blade -->
        <g id="bike-far-stays">
          <line x1="432" y1="512" x2="566" y2="520" stroke="url(#frameTealDark)" stroke-width="6.5" stroke-linecap="round" />
          <line x1="432" y1="512" x2="520" y2="390" stroke="url(#frameTealDark)" stroke-width="5.5" stroke-linecap="round" />
          <path d="M 690 422 Q 710 476 746 510" fill="none" stroke="url(#frameTealDark)" stroke-width="7.5" stroke-linecap="round" />
        </g>

        <!-- ================================================================ -->
        <!-- LAYER 8: WHEELS, DRIVETRAIN, MAIN FRAME, BASKET & HANDLEBARS     -->
        <!-- ================================================================ -->

        <!-- REAR WHEEL (Center: 432, 512 | Outer tire R=86) -->
        <g id="rear-wheel-assembly" transform="translate(432, 512)">
          <!-- Rotating spokes, rim details, tread ticks, valve -->
          <g id="rear-wheel-spin">
            <g id="rear-spokes"></g>
            <!-- Cream balloon tire body -->
            <circle cx="0" cy="0" r="80.5" fill="none" stroke="#efe3c6" stroke-width="11" />
            <!-- Outer dark rubber tread -->
            <circle cx="0" cy="0" r="84.2" fill="none" stroke="#2c2f36" stroke-width="4.2" />
            <!-- Subtle tread notches for crisp rolling perception -->
            <circle cx="0" cy="0" r="85.2" fill="none" stroke="#454a54" stroke-width="2" stroke-dasharray="5 9" />
            <!-- Subtle sidewall accent stripe -->

      const SVG_NS = "http://www.w3.org/2000/svg";

      function el(tag, attrs = {}, parent = null) {

          node.setAttribute(k, String(v));

        if (parent) parent.appendChild(node);

      // =========================================================================

      // =========================================================================
      // 2. PROCEDURAL PRECISION SVG PARTS (SPOKES, SPROCKETS, CHAIN, SCENERY)

      // Build tangential-style laced bicycle spokes (16 spokes per wheel)
      function buildSpokes(groupId) {
        const g = document.getElementById(groupId);
        const count = 16;
        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2;
          const hubOffset = (i % 2 === 0 ? 1 : -1) * 0.28;
          const x1 = Math.cos(a + hubOffset) * 7.5;
          const y1 = Math.sin(a + hubOffset) * 7.5;
          const x2 = Math.cos(a) * 69.2;
          const y2 = Math.sin(a) * 69.2;
          el("line", {
            x1: x1.toFixed(2),
            y1: y1.toFixed(2),
            x2: x2.toFixed(2),
            y2: y2.toFixed(2),
            stroke: i % 2 === 0 ? "#dfe7ec" : "#aebac2",
            "stroke-width": i % 2 === 0 ? "1.35" : "1.1",
            opacity: "0.92"
          }, g);
        }
      }
      buildSpokes("rear-spokes");
      buildSpokes("front-spokes");

      // Build sculpted gear sprocket with authentic teeth & 5-arm spider cutouts
      function buildSprocket(groupId, radius, teethCount, isChainring) {
        const g = document.getElementById(groupId);
        const rOuter = radius + 2.4;
        const rInner = radius - 1.6;
        let d = "";
        for (let i = 0; i < teethCount; i++) {
          const a0 = (i / teethCount) * Math.PI * 2;
          const a1 = ((i + 0.34) / teethCount) * Math.PI * 2;
          const a2 = ((i + 0.50) / teethCount) * Math.PI * 2;
          const a3 = ((i + 0.84) / teethCount) * Math.PI * 2;
          const p0x = Math.cos(a0) * rInner, p0y = Math.sin(a0) * rInner;
          const p1x = Math.cos(a1) * rOuter, p1y = Math.sin(a1) * rOuter;
          const p2x = Math.cos(a2) * rOuter, p2y = Math.sin(a2) * rOuter;
          const p3x = Math.cos(a3) * rInner, p3y = Math.sin(a3) * rInner;
          d += (i === 0 ? `M ${p0x.toFixed(2)} ${p0y.toFixed(2)} ` : `L ${p0x.toFixed(2)} ${p0y.toFixed(2)} `);
          d += `L ${p1x.toFixed(2)} ${p1y.toFixed(2)} L ${p2x.toFixed(2)} ${p2y.toFixed(2)} L ${p3x.toFixed(2)} ${p3y.toFixed(2)} `;
        }
        d += "Z";

        el("path", {
          d,
          fill: isChainring ? "#d7e0e5" : "#95a3ab",
          stroke: "#48535c",
          "stroke-width": "1.2"

        if (isChainring) {

            cx: 0, cy: 0, r: radius - 5.5,
            fill: "#263038",
            stroke: "#5b6870",
            "stroke-width": "1"

          for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2;
            el("line", {
              x1: 0, y1: 0,
              x2: (Math.cos(a) * (radius - 4)).toFixed(2),
              y2: (Math.sin(a) * (radius - 4)).toFixed(2),
              stroke: "#e3ebf0",
              "stroke-width": "3.6",
              "stroke-linecap": "round"
            }, g);
            el("circle", {
              cx: (Math.cos(a) * (radius - 6.5)).toFixed(2),
              cy: (Math.sin(a) * (radius - 6.5)).toFixed(2),
              r: "1.6",
              fill: "#4a565e"
            }, g);
          }
          el("circle", {
            cx: 0, cy: 0, r: "8.2",
            fill: "#cfd9df",
            stroke: "#525e66",
            "stroke-width": "1.2"
          }, g);
        } else {
          el("circle", {
            cx: 0, cy: 0, r: radius - 4.2,
            fill: "#5c6870",
            stroke: "#3c454c",
            "stroke-width": "1"
          }, g);
        }
      }
      buildSprocket("chainring-spin", R_CHAINRING, 26, true);
      buildSprocket("rear-cog-spin", R_COG, 14, false);

      // Compute exact external tangent chain loop between Rear Cog & Chainring
      function buildChainPath() {
        const dx = BB.x - RW.x;
        const dy = BB.y - RW.y;
        const dist = Math.hypot(dx, dy);
        const alpha = Math.atan2(dy, dx);
        const beta = Math.acos((R_COG - R_CHAINRING) / dist);
        const phiTop = alpha - beta;
        const phiBot = alpha + beta;

        const r1 = R_COG + 1.1;
        const r2 = R_CHAINRING + 1.1;

        const p1Top = { x: RW.x + r1 * Math.cos(phiTop), y: RW.y + r1 * Math.sin(phiTop) };
        const p2Top = { x: BB.x + r2 * Math.cos(phiTop), y: BB.y + r2 * Math.sin(phiTop) };
        const p2Bot = { x: BB.x + r2 * Math.cos(phiBot), y: BB.y + r2 * Math.sin(phiBot) };
        const p1Bot = { x: RW.x + r1 * Math.cos(phiBot), y: RW.y + r1 * Math.sin(phiBot) };

        const d = [
          `M ${p1Top.x.toFixed(2)} ${p1Top.y.toFixed(2)}`,
          `L ${p2Top.x.toFixed(2)} ${p2Top.y.toFixed(2)}`,
          `A ${r2.toFixed(2)} ${r2.toFixed(2)} 0 1 1 ${p2Bot.x.toFixed(2)} ${p2Bot.y.toFixed(2)}`,
          `L ${p1Bot.x.toFixed(2)} ${p1Bot.y.toFixed(2)}`,
          `A ${r1.toFixed(2)} ${r1.toFixed(2)} 0 0 1 ${p1Top.x.toFixed(2)} ${p1Top.y.toFixed(2)}`,
          "Z"
        ].join(" ");

        document.getElementById("chain-base").setAttribute("d", d);
        document.getElementById("chain-links").setAttribute("d", d);
      }
      buildChainPath();

      // Clouds (Far & Near — 3 distinct organic cumulus silhouettes!)

        { x: 130, y: 92, s: 0.94, op: 0.78, v: 0 },

      const cloudVariants = [
        {
          top: "M -72 18 C -75 2, -57 -11, -39 -7 C -31 -27, -2 -35, 19 -18 C 36 -28, 62 -17, 66 3 C 80 5, 83 18, 69 22 L -62 22 C -70 22, -73 20, -72 18 Z",

        {
          top: "M -84 20 C -85 6, -68 -5, -50 -2 C -42 -22, -18 -26, -4 -14 C 8 -34, 40 -34, 52 -12 C 68 -14, 84 -3, 82 14 C 81 19, 75 22, 68 22 L -74 22 C -80 22, -84 21, -84 20 Z",
          base: "M -74 22 L 70 22 C 76 20, 74 15, 64 15 L -68 15 C -76 15, -78 19, -74 22 Z"
        },
        {
          top: "M -64 18 C -66 4, -50 -6, -34 -3 C -26 -18, -4 -22, 12 -11 C 26 -19, 48 -14, 54 2 C 68 4, 72 16, 59 20 L -56 20 C -62 20, -64 19, -64 18 Z",
          base: "M -56 20 L 58 20 C 64 18, 62 13, 52 14 L -50 14 C -58 14, -60 18, -56 20 Z"
        }
      ];
      function makeCloud(parent, c) {
        const g = el("g", { opacity: c.op }, parent);
        const shape = cloudVariants[c.v % cloudVariants.length];

      const cloudsFar = cloudDefsFar.map(c => makeCloud(document.getElementById("clouds-far"), c));

      // Distant Gliding Seabirds
      const birdDefs = [
        { x: 240, y: 175, s: 0.85, phase: 0.2 },

      const distantBirds = birdDefs.map(b => {
        const p = el("path", {

      // Distant Headland & Classic Striped Coastal Lighthouse (wraps smoothly across 1800px tile)

      const coastTileW = 1800;
      const coastTiles = [0, 1].map(idx => {

        // Gallery rail & lantern room

      // =========================================================================
      // 4. KINEMATIC SOLVERS (2-BONE IK FOR LEGS & WINGS + SCARF WAVE RIBBON)
      // =========================================================================

      function solveIK(hipX, hipY, targetX, targetY, L1, L2, bendDir) {
        const dx = targetX - hipX;
        const dy = targetY - hipY;
        const rawD = Math.hypot(dx, dy) || 0.001;
        const d = Math.min(Math.max(rawD, Math.abs(L1 - L2) + 0.5), L1 + L2 - 0.5);
        const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
        const ux = dx / rawD;
        const uy = dy / rawD;
        const mx = hipX + a * ux;
        const my = hipY + a * uy;
        // Perpendicular (+uy, -ux) points RIGHT/UP for downward-right limb
        return {
          x: mx + h * uy * bendDir,
          y: my - h * ux * bendDir
        };
      }

      // Build sculpted feathered bird drumstick (nests seamlessly inside belly with rounded hip cap!)
      function buildDrumstickPaths(hx, hy, kx, ky, topR, botR) {
        const dx = kx - hx;
        const dy = ky - hy;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const nx = -uy, ny = ux;
        // Drumstick feathers cover top ~68% of thigh so the bare orange bird knee emerges cleanly!
        const ex = hx + dx * 0.68;
        const ey = hy + dy * 0.68;
        const mx = hx + dx * 0.34;
        const my = hy + dy * 0.34;

        const p1x = hx + nx * topR, p1y = hy + ny * topR;
        const p2x = ex + nx * botR, p2y = ey + ny * botR;
        const p3x = ex - nx * botR, p3y = ey - ny * botR;
        const p4x = hx - nx * topR, p4y = hy - ny * topR;
        const c1x = mx + nx * (topR * 0.90), c1y = my + ny * (topR * 0.90);
        const c2x = mx - nx * (topR * 0.82), c2y = my - ny * (topR * 0.82);

        const fillD = `M ${p1x.toFixed(1)} ${p1y.toFixed(1)} ` +
                      `Q ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${p2x.toFixed(1)} ${p2y.toFixed(1)} ` +
                      `Q ${(ex + ux * 6).toFixed(1)} ${(ey + uy * 6).toFixed(1)} ${p3x.toFixed(1)} ${p3y.toFixed(1)} ` +
                      `Q ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p4x.toFixed(1)} ${p4y.toFixed(1)} ` +
                      `Q ${(hx - ux * 10).toFixed(1)} ${(hy - uy * 10).toFixed(1)} ${p1x.toFixed(1)} ${p1y.toFixed(1)} Z`;

        // Side-only contour starting gracefully below the torso belly line!
        const contourD = `M ${(hx + dx * 0.24 + nx * topR * 0.88).toFixed(1)} ${(hy + dy * 0.24 + ny * topR * 0.88).toFixed(1)} ` +
                         `Q ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${p2x.toFixed(1)} ${p2y.toFixed(1)} ` +
                         `M ${p3x.toFixed(1)} ${p3y.toFixed(1)} ` +
                         `Q ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${(hx + dx * 0.20 - nx * topR * 0.82).toFixed(1)} ${(hy + dy * 0.20 - ny * topR * 0.82).toFixed(1)}`;

        // 3-tuft scalloped feather cuff wrapping the end of the drumstick
        const cuffD = `M ${(p2x + nx * 1.4).toFixed(1)} ${(p2y + ny * 1.4).toFixed(1)} ` +
                      `Q ${(ex + ux * 10 + nx * botR * 0.65).toFixed(1)} ${(ey + uy * 10 + ny * botR * 0.65).toFixed(1)} ` +
                      `${(ex + ux * 4 + nx * botR * 0.25).toFixed(1)} ${(ey + uy * 4 + ny * botR * 0.25).toFixed(1)} ` +
                      `Q ${(ex + ux * 11).toFixed(1)} ${(ey + uy * 11).toFixed(1)} ` +
                      `${(ex + ux * 4 - nx * botR * 0.25).toFixed(1)} ${(ey + uy * 4 - ny * botR * 0.25).toFixed(1)} ` +
                      `Q ${(ex + ux * 10 - nx * botR * 0.65).toFixed(1)} ${(ey + uy * 10 - ny * botR * 0.65).toFixed(1)} ` +
                      `${(p3x - nx * 1.4).toFixed(1)} ${(p3y - ny * 1.4).toFixed(1)} Z`;

        return { fillD, contourD, cuffD, endX: ex, endY: ey };
      }

      // Update a full pelican leg (near or far) from hip -> drumstick -> orange knee -> ankle -> centered webbed foot
      function updateLeg(prefix, hipX, hipY, pedalX, pedalY, crankPhase, isNear) {
        // Plant the ball of the webbed foot squarely centered on top of the pedal platform!
        const ankleX = pedalX - 8;

          `Q ${(GRIP_FAR.x + 5).toFixed(1)} ${(GRIP_FAR.y + 3).toFixed(1)} ${(GRIP_FAR.x - 4).toFixed(1)} ${(GRIP_FAR.y + 7).toFixed(1)}`,
          `Q ${(elF.x + 14).toFixed(1)} ${(elF.y + 9).toFixed(1)} ${(elF.x + 6).toFixed(1)} ${(elF.y + 6).toFixed(1)} Z`
        ].join(" ");
        document.getElementById("far-wing-tips").setAttribute("d", farTipsD);
      }

      // Dynamic Flowing Wind-Swept Coastal Scarf (two layered traveling wave ribbons!)
      function updateScarf(t, speedMul, bodyTiltDeg) {
        function buildRibbon(length, baseY, widthStart, widthEnd, phaseOffset, ampMul) {
          const steps = 14;
          const topPts = [];
          const botPts = [];
          const midPts = [];
          const startX = 534;
          const startY = baseY;
          const freq = 0.052;
          const waveSpeed = 7.2 * Math.max(0.6, speedMul);

          for (let i = 0; i <= steps; i++) {
            const u = i / steps;
            const x = startX - u * length;
            // Amplitude ramps smoothly from 0 at knot to lively flutter at tail
            const env = Math.pow(u, 1.35) * ampMul * (7 + 4.5 * speedMul);
            const yWave = Math.sin(u * length * freq - t * waveSpeed + phaseOffset) * env
                        + Math.sin(u * length * 0.11 - t * waveSpeed * 1.65 + phaseOffset) * env * 0.28;
            // Gentle downward gravity droop when slower, straighter when riding briskly!
            const droop = u * u * (24 / Math.max(0.55, speedMul)) - u * (bodyTiltDeg * 0.6);
            const cy = startY + yWave + droop;
            const halfW = (widthStart + (widthEnd - widthStart) * u) * 0.5;
            topPts.push(`${x.toFixed(1)},${(cy - halfW).toFixed(1)}`);
            botPts.unshift(`${x.toFixed(1)},${(cy + halfW).toFixed(1)}`);
            midPts.push(`${x.toFixed(1)},${cy.toFixed(1)}`);
          }
          const shape = `M ${topPts[0]} L ${topPts.slice(1).join(" L ")} L ${botPts.join(" L ")} Z`;
          const stripe = `M ${midPts[0]} L ${midPts.slice(1).join(" L ")}`;
          return { shape, stripe };
        }

        const front = buildRibbon(142, 276, 12.5, 16.5, 0.0, 1.0);
        document.getElementById("scarf-tail-front").setAttribute("d", front.shape);
        document.getElementById("scarf-stripe-front").setAttribute("d", front.stripe);

        const back = buildRibbon(112, 279, 10, 13.5, 1.9, 0.85);
        document.getElementById("scarf-tail-back").setAttribute("d", back.shape);
        document.getElementById("scarf-stripe-back").setAttribute("d", back.stripe);
      }

      // =========================================================================

      const MOODS = {

      // =========================================================================
      // 6. INTERACTIVE BELL CHIME (WEB AUDIO) & PELICAN JOY REACTION
      // =========================================================================
      let audioCtx = null;
      const bellEffectsG = document.getElementById("bell-effects");
      const activeRipples = [];
      let joyEnergy = 0; // triggers cheerful beak lift & pouch bounce!
      let bellShake = 0;

      function playBrassBellSound() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;
          // Classic twin metallic "bring-bring!" bell chime
          [0, 0.13].forEach(offset => {
            [1760, 2637, 4186].forEach((freq, idx) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(freq, now + offset);
              const amp = idx === 0 ? 0.12 : idx === 1 ? 0.065 : 0.028;
              gain.gain.setValueAtTime(0.0001, now + offset);
              gain.gain.exponentialRampToValueAtTime(amp, now + offset + 0.006);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + (idx === 0 ? 0.72 : 0.44));
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(now + offset);
              osc.stop(now + offset + 0.78);
            });
          });
        } catch (_) {
          // Graceful no-op if audio blocked
        }
      }

      function spawnBellRipple() {
        const ring = el("circle", {

        activeRipples.push({ ring, note, age: 0, vx: -18 - Math.random() * 14, vy: -34 - Math.random() * 16 });
      }

      function triggerBell(withAudio = true) {
        joyEnergy = 1.0;

        setTimeout(spawnBellRipple, 130);

      // =========================================================================
      // 7. MAIN SYNCHRONIZED ANIMATION LOOP
      // =========================================================================
      let paused = false;
      let speedMul = 1.0;
      let simTime = 0;
      let crankAngle = 0.55; // radians (start at a dynamic, visually iconic pedal angle!)
      let groundDist = 0;    // exact linear ground travel in SVG px
      let lastTs = null;
      let nextBlinkAt = 2.8;

      const BASE_CRANK_RPS = 0.72; // 43 RPM leisurely coastal cruiser cadence

      // Cached SVG element references for ultra-smooth 60fps updates
      const els = {
        rearWheelSpin: document.getElementById("rear-wheel-spin"),
        frontWheelSpin: document.getElementById("front-wheel-spin"),
        rearCogSpin: document.getElementById("rear-cog-spin"),
        chainringSpin: document.getElementById("chainring-spin"),
        chainLinks: document.getElementById("chain-links"),
        nearCrankOutline: document.getElementById("near-crank-outline"),
        nearCrankArm: document.getElementById("near-crank-arm"),
        nearCrankHl: document.getElementById("near-crank-hl"),
        farCrankArm: document.getElementById("far-crank-arm"),
        farCrankHl: document.getElementById("far-crank-hl"),
        nearPedal: document.getElementById("near-pedal-group"),
        farPedal: document.getElementById("far-pedal-group"),
        pelicanBody: document.getElementById("pelican-body"),
        pelicanHead: document.getElementById("pelican-head-group"),
        gularPouch: document.getElementById("gular-pouch-group"),
        crestFeathers: document.getElementById("crest-feathers"),
        pelicanTail: document.getElementById("pelican-tail"),
        eyeBlink: document.getElementById("eye-blink"),
        fishWiggle: document.getElementById("fish-wiggle"),
        bellStriker: document.getElementById("bell-striker"),
        shadowMain: document.getElementById("shadow-main")
      };

      function renderFrame(dt) {
        if (!paused) {
          simTime += dt;
          const dCrank = BASE_CRANK_RPS * Math.PI * 2 * speedMul * dt;
          crankAngle += dCrank;
          const dWheel = dCrank * GEAR_RATIO;
          groundDist += dWheel * R_TIRE;
        }

        // Decay interactive joy & bell effects smoothly
        joyEnergy = Math.max(0, joyEnergy - dt * 1.45);
        bellShake = Math.max(0, bellShake - dt * 3.0);

        // --- A. BICYCLE DRIVETRAIN (100% PHYSICALLY LOCKED) ---
        const wheelAngleRad = crankAngle * GEAR_RATIO;
        const wheelDeg = (wheelAngleRad * 180) / Math.PI;
        const crankDeg = (crankAngle * 180) / Math.PI;

        els.rearWheelSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.frontWheelSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.rearCogSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.chainringSpin.setAttribute("transform", `rotate(${crankDeg.toFixed(2)})`);

        // Chain linear motion = crankAngle * R_CHAINRING
        const chainOffset = -(crankAngle * (R_CHAINRING + 1.1));
        els.chainLinks.setAttribute("stroke-dashoffset", chainOffset.toFixed(2));

        // Near & Far Pedal Orbit Coordinates (180° opposite)
        const nearAngle = crankAngle;
        const farAngle = crankAngle + Math.PI;
        const nearPedalX = BB.x + Math.cos(nearAngle) * R_CRANK;
        const nearPedalY = BB.y + Math.sin(nearAngle) * R_CRANK;
        const farPedalX = BB.x + Math.cos(farAngle) * R_CRANK;
        const farPedalY = BB.y + Math.sin(farAngle) * R_CRANK;

        els.nearCrankOutline.setAttribute("x2", nearPedalX.toFixed(2));
        els.nearCrankOutline.setAttribute("y2", nearPedalY.toFixed(2));
        els.nearCrankArm.setAttribute("x2", nearPedalX.toFixed(2));
        els.nearCrankArm.setAttribute("y2", nearPedalY.toFixed(2));
        els.nearCrankHl.setAttribute("x2", nearPedalX.toFixed(2));
        els.nearCrankHl.setAttribute("y2", nearPedalY.toFixed(2));
        els.farCrankArm.setAttribute("x2", farPedalX.toFixed(2));
        els.farCrankArm.setAttribute("y2", farPedalY.toFixed(2));
        els.farCrankHl.setAttribute("x2", farPedalX.toFixed(2));
        els.farCrankHl.setAttribute("y2", farPedalY.toFixed(2));

        els.nearPedal.setAttribute("transform", `translate(${nearPedalX.toFixed(2)}, ${nearPedalY.toFixed(2)})`);
        els.farPedal.setAttribute("transform", `translate(${farPedalX.toFixed(2)}, ${farPedalY.toFixed(2)})`);

        // --- B. PELICAN ORGANIC BODY MOTION & HEAD STABILIZATION ---
        // Double-frequency gentle bob (one buoyant lift on each leg downstroke)
        const joyLift = Math.sin(joyEnergy * Math.PI * 3) * joyEnergy * 5;
        const bodyBobY = -3.4 * Math.sin(2 * crankAngle + 0.35) - Math.abs(joyLift) * 0.45;
        const bodySwayX = 1.6 * Math.sin(crankAngle);
        const bodyTiltDeg = 1.6 * Math.sin(crankAngle - 0.3) - joyEnergy * 2.2;

        els.pelicanBody.setAttribute(
          "transform",
          `translate(${bodySwayX.toFixed(2)}, ${bodyBobY.toFixed(2)}) rotate(${bodyTiltDeg.toFixed(2)} 520 330)`
        );

        // Avian head stabilization (gentle counter-tilt + joyful upward beak nod when clicked!)
        const headBobY = 1.8 * Math.sin(2 * crankAngle - 0.5);
        const headTilt = -bodyTiltDeg * 0.72 + Math.sin(simTime * 2.1) * 1.1 - joyEnergy * 11 * Math.sin(joyEnergy * Math.PI * 2.5);
        els.pelicanHead.setAttribute(
          "transform",
          `translate(588, ${(198 + headBobY).toFixed(2)}) rotate(${headTilt.toFixed(2)})`
        );

        // Supple, springy gular pouch secondary jiggle (phase-lagged behind pedal bounce!)
        const pouchScaleY = 1 + 0.052 * Math.sin(2 * crankAngle - 0.9) + Math.sin(joyEnergy * Math.PI * 5) * joyEnergy * 0.11;
        const pouchScaleX = 1 - (pouchScaleY - 1) * 0.32;
        els.gularPouch.setAttribute(
          "transform",
          `translate(85, 14) scale(${pouchScaleX.toFixed(3)}, ${pouchScaleY.toFixed(3)}) translate(-85, -14)`
        );

        // Wind-fluttering nape crest & tail feathers
        const crestFlutter = Math.sin(simTime * 9.5 * speedMul) * 3.8 + joyEnergy * 9;
        els.crestFeathers.setAttribute("transform", `rotate(${crestFlutter.toFixed(2)} -22 -4)`);
        const tailWag = Math.sin(2 * crankAngle + 1.1) * 3.2;
        els.pelicanTail.setAttribute("transform", `rotate(${tailWag.toFixed(2)} 464 326)`);

        // Periodic natural eye blink
        let eyeScaleY = 1;
        if (simTime > nextBlinkAt) {
          const blinkPhase = (simTime - nextBlinkAt) / 0.18;
          if (blinkPhase < 1) {
            eyeScaleY = Math.max(0.08, 1 - Math.sin(blinkPhase * Math.PI));
          } else {
            nextBlinkAt = simTime + 3.0 + (Math.sin(simTime * 7.3) * 0.5 + 0.5) * 2.4;
          }
        }
        els.eyeBlink.setAttribute("transform", `scale(1, ${eyeScaleY.toFixed(3)})`);

        // --- C. EXACT 2-BONE INVERSE KINEMATICS FOR BOTH LEGS & BOTH WINGS ---
        const hipNearX = 524 + bodySwayX;
        const hipNearY = 342 + bodyBobY;
        const hipFarX = 532 + bodySwayX;
        const hipFarY = 340 + bodyBobY;

        updateLeg("near", hipNearX, hipNearY, nearPedalX, nearPedalY, nearAngle, true);
        updateLeg("far", hipFarX, hipFarY, farPedalX, farPedalY, farAngle, false);
        updateWings(bodySwayX, bodyBobY, bodyTiltDeg);

        // --- D. FLOWING SCARF, BASKET FISH WIGGLE, BELL STRIKER & SHADOW ---
        updateScarf(simTime, speedMul, bodyTiltDeg);

        const fishTilt = Math.sin(simTime * 5.2) * 3.4 + joyEnergy * Math.sin(simTime * 22) * 8;
        els.fishWiggle.setAttribute("transform", `rotate(${fishTilt.toFixed(2)} 10 -6)`);

        if (bellShake > 0) {
          const strikeAngle = Math.sin(bellShake * Math.PI * 6) * 24;
          els.bellStriker.setAttribute("transform", `rotate(${strikeAngle.toFixed(1)} 8 1)`);
        } else {
          els.bellStriker.setAttribute("transform", "");
        }

        // Ground shadow breathes subtly with vertical bounce
        const shadowRx = 228 + bodyBobY * 1.4;
        els.shadowMain.setAttribute("rx", shadowRx.toFixed(1));

        // --- E. MULTI-LAYER PARALLAX SCENERY ---
        // Road dashes: exact 1.0x groundDist (ZERO tire slip!)
        const roadOff = groundDist % dashPeriod;
        roadDashes.forEach((g, i) => {
          const x = i * dashPeriod - roadOff - dashPeriod * 0.5;
          g.setAttribute("transform", `translate(${x.toFixed(1)}, 0)`);
        });

        // Boardwalk railing posts: 0.72x ground speed
        const railOff = (groundDist * 0.72) % postSpacing;
        railingPosts.forEach((g, i) => {
          const x = i * postSpacing - railOff;
          g.setAttribute("transform", `translate(${x.toFixed(1)}, 0)`);
        });

        // Midground palms & lampposts: 0.42x ground speed
        const midOff = (groundDist * 0.42) % midTileW;
        midTiles.forEach(tile => {
          let x = tile.offset - midOff;
          if (x < -midTileW) x += midTileW * 2;
          const visible = x < 1260 && x + midTileW > -60;
          tile.node.setAttribute("display", visible ? "inline" : "none");
          if (visible) tile.node.setAttribute("transform", `translate(${x.toFixed(1)}, 0)`);
        });

        // Distant coastal headland & lighthouse: 0.08x ground speed
        const coastOff = (groundDist * 0.08) % coastTileW;
        coastTiles.forEach(tile => {
          let x = tile.offset - coastOff;
          if (x < -coastTileW) x += coastTileW * 2;
          const visible = x < 1260 && x + coastTileW > -60;
          tile.node.setAttribute("display", visible ? "inline" : "none");
          if (visible) tile.node.setAttribute("transform", `translate(${x.toFixed(1)}, 0)`);
        });

        // Foreground dune grass tufts: 1.32x ground speed (crisp foreground depth!)
        const fgOff = (groundDist * 1.32) % grassTileW;
        grassTiles.forEach(tile => {
          let x = tile.offset - fgOff;
          if (x < -grassTileW) x += grassTileW * 3;
          const visible = x < 1260 && x + grassTileW > -60;
          tile.node.setAttribute("display", visible ? "inline" : "none");
          if (visible) tile.node.setAttribute("transform", `translate(${x.toFixed(1)}, 0)`);
        });

        // Clouds (slow sky drift)
        cloudsFar.forEach(c => {
          const x = ((c.x - groundDist * 0.025) % 1440 + 1440) % 1440 - 120;
          c.node.setAttribute("transform", `translate(${x.toFixed(1)}, ${c.y}) scale(${c.s})`);
        });
        cloudsNear.forEach(c => {
          const x = ((c.x - groundDist * 0.05) % 1480 + 1480) % 1480 - 140;
          c.node.setAttribute("transform", `translate(${x.toFixed(1)}, ${c.y}) scale(${c.s})`);
        });

        // Distant seabirds gently flapping
        distantBirds.forEach(b => {
          const x = ((b.x - simTime * 18 - groundDist * 0.03) % 1360 + 1360) % 1360 - 80;
          const flap = Math.sin(simTime * 4.2 + b.phase) * 5.5;
          const y = b.y + Math.cos(simTime * 2.1 + b.phase) * 3;
          const w = 13 * b.s;
          b.node.setAttribute(
            "d",
            `M ${(x - w).toFixed(1)} ${(y - flap * b.s).toFixed(1)} Q ${(x - w * 0.45).toFixed(1)} ${(y - 6 * b.s).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)} Q ${(x + w * 0.45).toFixed(1)} ${(y - 6 * b.s).toFixed(1)} ${(x + w).toFixed(1)} ${(y - flap * b.s).toFixed(1)}`
          );
        });

        // Ocean waves & golden sun shimmer
        waveItems.forEach(w => {
          const x = ((w.x - groundDist * w.speedFactor) % 1320 + 1320) % 1320 - 60;
          w.node.setAttribute("transform", `translate(${x.toFixed(1)}, ${w.y.toFixed(1)})`);
        });
        shimmerBars.forEach(s => {
          const sway = Math.sin(simTime * 2.4 + s.phase) * 14;
          const w = s.baseW + Math.cos(simTime * 3.1 + s.phase) * 16;
          s.node.setAttribute("x", (950 + sway - w / 2).toFixed(1));
          s.node.setAttribute("width", Math.max(20, w).toFixed(1));
        });

        // Sailboats gently bobbing on the sea
        sailboats.forEach(sb => {
          const x = ((sb.x - groundDist * sb.speed) % 1560 + 1560) % 1560 - 120;
          const bob = Math.sin(simTime * 1.9 + sb.phase) * 2.2;
          const rock = Math.cos(simTime * 1.6 + sb.phase) * 2.4;
          sb.node.setAttribute("transform", `translate(${x.toFixed(1)}, ${(sb.y + bob).toFixed(1)}) rotate(${rock.toFixed(2)}) scale(${sb.s})`);
        });

        // Subtle wind wisps
        windWisps.forEach(w => {
          const x = ((w.x - groundDist * w.speed * 0.95) % 1460 + 1460) % 1460 - 130;
          w.node.setAttribute("transform", `translate(${x.toFixed(1)}, ${w.y})`);
          w.node.setAttribute("opacity", (0.12 + 0.16 * Math.min(1.5, speedMul)).toFixed(2));
        });

        // Active bell sound rings & floating musical notes
        for (let i = activeRipples.length - 1; i >= 0; i--) {
          const r = activeRipples[i];
          r.age += dt;
          if (r.age > 0.95) {
            r.ring.remove();
            r.note.remove();
            activeRipples.splice(i, 1);
          } else {
            const p = r.age / 0.95;
            r.ring.setAttribute("r", (10 + p * 48).toFixed(1));
            r.ring.setAttribute("opacity", ((1 - p) * 0.9).toFixed(2));
            r.note.setAttribute("x", (688 + r.vx * r.age).toFixed(1));
            r.note.setAttribute("y", (306 + r.vy * r.age).toFixed(1));
            r.note.setAttribute("opacity", ((1 - p) * 0.95).toFixed(2));
          }
        }
      }

      function tick(ts) {
        if (lastTs === null) lastTs = ts;
        const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
        lastTs = ts;
        renderFrame(dt);
        requestAnimationFrame(tick);
      }

      // =========================================================================
      // 8. UI CONTROLS & KEYBOARD SHORTCUTS
      // =========================================================================
      const btnPlay = document.getElementById("btn-play");
      const btnBell = document.getElementById("btn-bell");
      const speedSlider = document.getElementById("speed-slider");

      function setPaused(next) {
        paused = next;
        btnPlay.textContent = paused ? "▶ Play" : "⏸ Pause";
        btnPlay.classList.toggle("active", !paused);
      }

      btnPlay.addEventListener("click", () => setPaused(!paused));
      btnBell.addEventListener("click", () => triggerBell(true));
      document.getElementById("brass-bell").addEventListener("click", (e) => {
        e.stopPropagation();
        triggerBell(true);
      });
      document.getElementById("pelican-body").addEventListener("click", () => triggerPelicanJoy());

      speedSlider.addEventListener("input", () => {
        speedMul = parseFloat(speedSlider.value);
      });

      document.querySelectorAll(".mood-group .hud-btn").forEach(btn => {
        btn.addEventListener("click", () => applyMood(btn.dataset.mood));
      });

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          setPaused(!paused);
        } else if (e.key === "b" || e.key === "B") {
          triggerBell(true);
        } else if (e.key === "1") {
          applyMood("morning");
        } else if (e.key === "2") {
          applyMood("golden");
        } else if (e.key === "3") {
          applyMood("sunset");
        }
      });

      // Expose deterministic hook for headless frame inspection
      window.__pelicanScene = {
        setState({ angle, time, mood, joy }) {
          if (typeof angle === "number") crankAngle = angle;
          if (typeof time === "number") simTime = time;
          if (typeof joy === "number") joyEnergy = joy;
          if (mood) applyMood(mood);
          groundDist = crankAngle * GEAR_RATIO * R_TIRE;
          renderFrame(0);
        }
      };

      // Initialize default mood, first frame, and start animation!
      applyMood("golden");
      renderFrame(0);

      const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (prefersReduced) {
        setPaused(true);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
