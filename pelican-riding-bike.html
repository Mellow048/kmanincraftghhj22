<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bike — Coastal Cruiser Animated SVG</title>
  <style>
    :root {
      --bg-outer: #0e1a24;
      --dock-bg: rgba(16, 26, 36, 0.72);
      --dock-border: rgba(255, 255, 255, 0.16);
      --dock-text: #f3f7fa;
      --dock-muted: rgba(235, 244, 252, 0.68);
      --accent: #f69b3a;
      --accent-2: #2ca89e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1d3549 0%, #0b141d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      color: var(--dock-text);
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0px, 1.2vw, 18px);
    }

    .canvas-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: min(100vw, calc(100vh * 1200 / 720));
      max-height: min(100vh, calc(100vw * 720 / 1200));
      aspect-ratio: 1200 / 720;
      border-radius: clamp(0px, 1.2vw, 18px);
      overflow: hidden;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.12);
      background: #4a9bd1;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    .interactive-hit {
      cursor: pointer;
    }

    /* Minimal floating HUD badge top-left */
    .title-chip {
      position: absolute;
      top: 14px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--dock-bg);
      border: 1px solid var(--dock-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--dock-text);
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .title-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .title-chip .sub {
      color: var(--dock-muted);
      font-weight: 500;
      font-size: 11.5px;
    }

    .stats-chip {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--dock-bg);
      border: 1px solid var(--dock-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      color: var(--dock-muted);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .stats-chip strong {
      color: var(--dock-text);
      font-weight: 600;
    }

    /* Bottom glass control dock */
    .controls {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--dock-bg);
      border: 1px solid var(--dock-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
      max-width: calc(100% - 24px);
      flex-wrap: wrap;
      justify-content: center;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .hud-hidden .title-chip,
    .hud-hidden .stats-chip,
    .hud-hidden .controls {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(14px);
    }

    .hud-hidden .title-chip,
    .hud-hidden .stats-chip {
      transform: translateY(-10px);
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: var(--dock-text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.active {
      background: rgba(246, 155, 58, 0.24);
      border-color: rgba(246, 155, 58, 0.65);
      color: #ffe3bc;
    }

    .btn.teal.active {
      background: rgba(44, 168, 158, 0.28);
      border-color: rgba(84, 214, 202, 0.65);
      color: #d6fffb;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.14);
      margin: 0 2px;
    }

    .slider-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 6px;
      font-size: 11.5px;
      color: var(--dock-muted);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 86px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    .hud-restore {
      position: absolute;
      right: 14px;
      bottom: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .hud-hidden .hud-restore {
      opacity: 0.72;
      pointer-events: auto;
    }

    .hud-restore:hover {
      opacity: 1;
    }

    @media (max-width: 720px) {
      .title-chip .sub, .stats-chip { display: none; }
      .controls { gap: 5px; padding: 6px 8px; bottom: 8px; }
      .btn { padding: 5px 9px; font-size: 11px; }
      input[type="range"] { width: 64px; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="canvas-frame">

        <defs>

  <script>
    (() => {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const el = (id) => document.getElementById(id);
      const svgEl = (tag, attrs = {}) => {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        return node;
      };

      // =========================================================================
      // 1. EXACT BICYCLE & ANATOMICAL CONSTANTS
      // =========================================================================
      const BIKE = {
        GROUND_Y: 594,
        R_TIRE: 94,
        REAR_HUB: { x: 412, y: 500 },
        FRONT_HUB: { x: 780, y: 500 },
        BB: { x: 564, y: 508 },
        R_CHAINRING: 34,
        R_COG: 17, // Exact 2:1 beach cruiser gear ratio
        L_CRANK: 45,
        GRIP_NEAR: { x: 662, y: 296 },
        GRIP_FAR: { x: 680, y: 282 },
        HIP_NEAR: { x: 512, y: 318 },
        HIP_FAR: { x: 524, y: 316 },
        SHOULDER_NEAR: { x: 534, y: 226 },
        SHOULDER_FAR: { x: 562, y: 224 },
        L_THIGH: 122,
        L_SHIN: 126,
        L_UPPER_WING: 82,
        L_LOWER_WING: 84,
      };
      const GEAR_RATIO = BIKE.R_CHAINRING / BIKE.R_COG; // 2.0

      // =========================================================================
      // 2. ANALYTICAL 2-BONE INVERSE KINEMATICS SOLVER
      // =========================================================================
      function solveIK(ax, ay, tx, ty, l1, l2, bendSign = 1) {
        const dx = tx - ax;
        const dy = ty - ay;
        const rawDist = Math.hypot(dx, dy);
        const minD = Math.abs(l1 - l2) + 2;
        const maxD = l1 + l2 - 1.5;
        const d = Math.max(minD, Math.min(maxD, rawDist));

        const baseAngle = Math.atan2(dy, dx);
        const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
        const clampedCos = Math.max(-1, Math.min(1, cosA));
        const offsetAngle = Math.acos(clampedCos);

        // bendSign = -1 bends knee forward (clockwise-up in SVG y-down coords),
        // bendSign = +1 bends elbow down-back
        const theta1 = baseAngle + bendSign * offsetAngle;
        const jx = ax + Math.cos(theta1) * l1;
        const jy = ay + Math.sin(theta1) * l1;
        return { x: jx, y: jy, angle1: theta1, angle2: Math.atan2(ty - jy, tx - jx) };
      }

      // Helper to build smoothly rounded, tapered organic limb capsule between two points
      function buildTaperedLimbPath(x1, y1, x2, y2, r1, r2, bulge = 0) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const mx = (x1 + x2) * 0.5;
        const my = (y1 + y2) * 0.5;

        const p1x = x1 + nx * r1, p1y = y1 + ny * r1;
        const p2x = x2 + nx * r2, p2y = y2 + ny * r2;
        const p3x = x2 - nx * r2, p3y = y2 - ny * r2;
        const p4x = x1 - nx * r1, p4y = y1 - ny * r1;

        const c1x = mx + nx * ((r1 + r2) * 0.5 + bulge);
        const c1y = my + ny * ((r1 + r2) * 0.5 + bulge);
        const c2x = mx - nx * ((r1 + r2) * 0.5 + bulge * 0.6);
        const c2y = my - ny * ((r1 + r2) * 0.5 + bulge * 0.6);

        // sweep = 0 sweeps convexly OUTWARD around both circular end-caps!
        return `M ${p1x.toFixed(1)} ${p1y.toFixed(1)}
                Q ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${p2x.toFixed(1)} ${p2y.toFixed(1)}
                A ${r2.toFixed(1)} ${r2.toFixed(1)} 0 0 0 ${p3x.toFixed(1)} ${p3y.toFixed(1)}
                Q ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p4x.toFixed(1)} ${p4y.toFixed(1)}
                A ${r1.toFixed(1)} ${r1.toFixed(1)} 0 0 0 ${p1x.toFixed(1)} ${p1y.toFixed(1)} Z`;
      }

      // Build ONE continuous sculpted organic bird-wing silhouette (Shoulder -> Elbow -> Grip)
      function buildUnifiedWingPath(sx, sy, ex, ey, gx, gy, rS, rE, rG) {
        const u1x = ex - sx, u1y = ey - sy;
        const l1 = Math.hypot(u1x, u1y) || 1;
        const n1x = -u1y / l1, n1y = u1x / l1; // outer/back side (below-left of upper arm)

        const u2x = gx - ex, u2y = gy - ey;
        const l2 = Math.hypot(u2x, u2y) || 1;
        const n2x = -u2y / l2, n2y = u2x / l2; // lower/back side (below forearm)

        // Average bisector normal at elbow
        let bnx = n1x + n2x, bny = n1y + n2y;
        const bl = Math.hypot(bnx, bny) || 1;
        bnx /= bl; bny /= bl;

        // Outer/trailing wing edge (plump feathered sweep around back of shoulder & elbow)
        const sOutX = sx + n1x * rS, sOutY = sy + n1y * rS;
        const eOutX = ex + bnx * (rE * 1.28), eOutY = ey + bny * (rE * 1.28);
        const gOutX = gx + n2x * rG, gOutY = gy + n2y * rG;

        // Inner/leading wing edge (clean curved shoulder -> inner elbow crook -> wrist)
        const gInX = gx - n2x * rG, gInY = gy - n2y * rG;
        const eInX = ex - bnx * (rE * 0.68), eInY = ey - bny * (rE * 0.68);
        const sInX = sx - n1x * (rS * 0.85), sInY = sy - n1y * (rS * 0.85);

        const cOuter1X = (sOutX + eOutX) * 0.5 + n1x * 12;
        const cOuter1Y = (sOutY + eOutY) * 0.5 + n1y * 12;
        const cOuter2X = (eOutX + gOutX) * 0.5 + n2x * 9;
        const cOuter2Y = (eOutY + gOutY) * 0.5 + n2y * 9;

        return `M ${sOutX.toFixed(1)} ${sOutY.toFixed(1)}
                Q ${cOuter1X.toFixed(1)} ${cOuter1Y.toFixed(1)} ${eOutX.toFixed(1)} ${eOutY.toFixed(1)}
                Q ${cOuter2X.toFixed(1)} ${cOuter2Y.toFixed(1)} ${gOutX.toFixed(1)} ${gOutY.toFixed(1)}
                A ${rG.toFixed(1)} ${rG.toFixed(1)} 0 0 0 ${gInX.toFixed(1)} ${gInY.toFixed(1)}
                Q ${eInX.toFixed(1)} ${eInY.toFixed(1)} ${sInX.toFixed(1)} ${sInY.toFixed(1)}
                A ${rS.toFixed(1)} ${rS.toFixed(1)} 0 0 0 ${sOutX.toFixed(1)} ${sOutY.toFixed(1)} Z`;
      }

      // =========================================================================
      // 3. BUILD STATIC PRECISION MECHANICAL GEOMETRY (SPOKES, GEARS, CHAIN, SCENERY)
      // =========================================================================
      function buildWheelSpokes(containerId, count = 16, rHub = 11, rRim = 74) {
        const g = el(containerId);
        g.innerHTML = "";
        for (let i = 0; i < count; i++) {
          const a1 = (i / count) * Math.PI * 2;
          // Tangential 2-cross lacing pattern for genuine bicycle wheel look!
          const cross = (i % 2 === 0 ? 1 : -1) * 0.34;
          const x1 = Math.cos(a1) * rHub;
          const y1 = Math.sin(a1) * rHub;
          const x2 = Math.cos(a1 + cross) * rRim;
          const y2 = Math.sin(a1 + cross) * rRim;
          g.appendChild(svgEl("line", {
            x1: x1.toFixed(1), y1: y1.toFixed(1),
            x2: x2.toFixed(1), y2: y2.toFixed(1),
            stroke: i % 2 === 0 ? "#dfe7f0" : "#9aa8b6",
            "stroke-width": i % 2 === 0 ? "1.35" : "1.1",
            opacity: i % 2 === 0 ? "0.9" : "0.7"
          }));
        }
      }

      function buildGearPath(teeth, rOuter, rInner) {
        let d = "";
        const step = (Math.PI * 2) / teeth;
        for (let i = 0; i < teeth; i++) {
          const a0 = i * step;
          const a1 = a0 + step * 0.28;
          const a2 = a0 + step * 0.5;
          const a3 = a0 + step * 0.78;
          const pts = [
            [Math.cos(a0) * rInner, Math.sin(a0) * rInner],
            [Math.cos(a1) * rOuter, Math.sin(a1) * rOuter],
            [Math.cos(a2) * rOuter, Math.sin(a2) * rOuter],
            [Math.cos(a3) * rInner, Math.sin(a3) * rInner],
          ];
          d += (i === 0 ? "M " : "L ") + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" L ") + " ";
        }
        return d + "Z";
      }

      function buildDrivetrain() {
        // Rear 12-tooth cassette cog
        const rearCog = el("rear-cog-spin");
        rearCog.appendChild(svgEl("path", {
          d: buildGearPath(12, BIKE.R_COG + 2.2, BIKE.R_COG - 1.5),
          fill: "url(#chromeGrad)", stroke: "#485461", "stroke-width": "1"
        }));
        rearCog.appendChild(svgEl("circle", { cx: 0, cy: 0, r: 9.5, fill: "#485461" }));
        rearCog.appendChild(svgEl("circle", { cx: 0, cy: 0, r: 5.5, fill: "#cfd8e2" }));

        // Front 34-tooth vintage beach-cruiser chainring with 5-arm star cutouts
        const ring = el("chainring-spin");
        ring.appendChild(svgEl("path", {
          d: buildGearPath(32, BIKE.R_CHAINRING + 2.5, BIKE.R_CHAINRING - 1.8),
          fill: "url(#chromeGrad)", stroke: "#4b5866", "stroke-width": "1.2"
        }));
        // Outer metallic ring face
        ring.appendChild(svgEl("circle", {
          cx: 0, cy: 0, r: BIKE.R_CHAINRING - 4,
          fill: "none", stroke: "#8d9ba8", "stroke-width": "1.6"
        }));
        // 5 classic circular vintage cruiser cutouts
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
          ring.appendChild(svgEl("circle", {
            cx: (Math.cos(a) * 19.5).toFixed(1),
            cy: (Math.sin(a) * 19.5).toFixed(1),
            r: 6.4,
            fill: "#2c3640",
            stroke: "#667483",
            "stroke-width": "1"
          }));
          // Inner spider bolts
          ring.appendChild(svgEl("circle", {
            cx: (Math.cos(a + 0.628) * 14).toFixed(1),
            cy: (Math.sin(a + 0.628) * 14).toFixed(1),
            r: 2.1,
            fill: "#4a5664"
          }));
        }

        // Exact Tangent Chain Loop connecting Front Chainring & Rear Cog
        const c1 = BIKE.REAR_HUB;
        const c2 = BIKE.BB;
        const r1 = BIKE.R_COG;
        const r2 = BIKE.R_CHAINRING;
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        const dist = Math.hypot(dx, dy);
        const phi = Math.atan2(dy, dx);
        const alpha = Math.acos((r2 - r1) / dist);

        // Top tangent points (clockwise outer wrap)
        const aTop = phi - (Math.PI - alpha);
        const aBot = phi + (Math.PI - alpha);
        const t1x = c1.x + Math.cos(aTop) * r1, t1y = c1.y + Math.sin(aTop) * r1;
        const t2x = c2.x + Math.cos(aTop) * r2, t2y = c2.y + Math.sin(aTop) * r2;
        const b2x = c2.x + Math.cos(aBot) * r2, b2y = c2.y + Math.sin(aBot) * r2;
        const b1x = c1.x + Math.cos(aBot) * r1, b1y = c1.y + Math.sin(aBot) * r1;

        const chainPath = `M ${t1x.toFixed(1)} ${t1y.toFixed(1)}
                           L ${t2x.toFixed(1)} ${t2y.toFixed(1)}
                           A ${r2} ${r2} 0 1 1 ${b2x.toFixed(1)} ${b2y.toFixed(1)}
                           L ${b1x.toFixed(1)} ${b1y.toFixed(1)}
                           A ${r1} ${r1} 0 0 1 ${t1x.toFixed(1)} ${t1y.toFixed(1)} Z`;
        el("chain-base").setAttribute("d", chainPath);
        el("chain-links").setAttribute("d", chainPath);
      }

      // Build Repeating Parallax World Elements
      function buildWorld() {
        // 1. Ocean Sun/Moon Shimmer Bars
        const shimmer = el("ocean-shimmer");
        for (let i = 0; i < 16; i++) {
          const t = i / 15;
          const y = 400 + t * 84;
          const w = 44 + t * 140 + (i % 3) * 18;
          const h = 1.6 + t * 2.6;
          const r = svgEl("rect", {
            class: "shimmer-bar",
            "data-base-x": (966 - w * 0.5).toFixed(1),
            "data-base-w": w.toFixed(1),
            "data-phase": (i * 0.85).toFixed(2),
            x: (966 - w * 0.5).toFixed(1),
            y: y.toFixed(1),
            width: w.toFixed(1),
            height: h.toFixed(1),
            rx: (h * 0.5).toFixed(1),
            fill: "#fff5cf",
            opacity: (0.72 - t * 0.35).toFixed(2)
          });
          shimmer.appendChild(r);
        }

        // 2. Three Rolling Ocean Wave Crest Bands
        const makeWaveBand = (id, yBase, amp, segW, count, color, sw) => {
          const g = el(id);
          let d = `M -200 ${yBase}`;
          for (let i = 0; i < count; i++) {
            const x = -200 + i * segW;
            d += ` Q ${(x + segW * 0.5).toFixed(0)} ${(yBase - amp).toFixed(1)} ${(x + segW).toFixed(0)} ${yBase}`;
          }
          g.appendChild(svgEl("path", {
            d, fill: "none", stroke: color, "stroke-width": sw, "stroke-linecap": "round"
          }));
        };
        makeWaveBand("wave-band-1", 418, 5, 110, 18, "#d4f4f7", 2);
        makeWaveBand("wave-band-2", 446, 7, 140, 15, "#e2f8fa", 2.4);
        makeWaveBand("wave-band-3", 472, 8.5, 175, 13, "#f1fcfd", 2.8);

        // 3. Promenade Railing Posts (tile width = 75px)
        const railPosts = el("rail-posts");
        for (let x = -75; x <= 1350; x += 75) {
          const pg = svgEl("g", { transform: `translate(${x}, 494)` });
          pg.appendChild(svgEl("rect", { x: -4.5, y: 0, width: 9, height: 36, rx: 1.5, fill: "#f2ece0" }));
          pg.appendChild(svgEl("rect", { x: 1.5, y: 0, width: 3, height: 36, fill: "#cfc4b2" }));
          pg.appendChild(svgEl("rect", { x: -6, y: -3, width: 12, height: 4.5, rx: 1.5, fill: "#fffaf0" }));
          railPosts.appendChild(pg);
        }

        // 4. Promenade Palms, Coastal Lamps & Beach Umbrellas (tile width = 1400px)
        const props = el("promenade-props");
        const addPalm = (x, s = 1, lean = 1) => {
          const g = svgEl("g", { transform: `translate(${x}, 498) scale(${s})` });
          // Curved palm trunk with sculpted bark ring lines
          g.appendChild(svgEl("path", {
            d: `M 0 0 Q ${lean * 18} -70 ${lean * 28} -144`,
            fill: "none", stroke: "#8a684a", "stroke-width": "11", "stroke-linecap": "round"
          }));
          for (let k = 1; k <= 8; k++) {
            const u = k / 9;
            const bx = (1 - u) * (1 - u) * 0 + 2 * (1 - u) * u * (lean * 18) + u * u * (lean * 28);
            const by = 2 * (1 - u) * u * (-70) + u * u * (-144);
            g.appendChild(svgEl("line", {
              x1: (bx - 4.2).toFixed(1), y1: by.toFixed(1),
              x2: (bx + 4.2).toFixed(1), y2: (by - 1.2).toFixed(1),
              stroke: "#b8906a", "stroke-width": "2.2", "stroke-linecap": "round", opacity: "0.7"
            }));
          }
          // Palm fronds crown
          const cx = lean * 28, cy = -144;
          const fronds = [
            `M ${cx} ${cy} Q ${cx - 48} ${cy - 26} ${cx - 72} ${cy + 14}`,
            `M ${cx} ${cy} Q ${cx - 32} ${cy - 48} ${cx - 58} ${cy - 34}`,
            `M ${cx} ${cy} Q ${cx + 8} ${cy - 54} ${cx + 38} ${cy - 34}`,
            `M ${cx} ${cy} Q ${cx + 50} ${cy - 26} ${cx + 76} ${cy + 12}`,
            `M ${cx} ${cy} Q ${cx + 34} ${cy + 2} ${cx + 52} ${cy + 32}`,
            `M ${cx} ${cy} Q ${cx - 28} ${cy + 4} ${cx - 46} ${cy + 30}`,
          ];
          fronds.forEach((fd, idx) => {
            g.appendChild(svgEl("path", {
              d: fd, fill: "none",
              stroke: idx % 2 === 0 ? "#437d5c" : "#56966d",
              "stroke-width": "9.5", "stroke-linecap": "round"
            }));
            g.appendChild(svgEl("path", {
              d: fd, fill: "none", stroke: "#7aba82",
              "stroke-width": "2.2", "stroke-linecap": "round", opacity: "0.55"
            }));
          });
          props.appendChild(g);
        };

        const addLampPost = (x) => {

      // =========================================================================

      let audioCtx = null;
      function getAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function playBellSound() {
        const ctx = getAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        // Authentic double metallic bicycle bell ring ("tring-tring!")
        [0, 0.13].forEach((delay) => {
          [2140, 4295, 5810].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + delay);
            const peak = idx === 0 ? 0.11 : idx === 1 ? 0.055 : 0.025;
            gain.gain.setValueAtTime(0.0001, now + delay);
            gain.gain.exponentialRampToValueAtTime(peak, now + delay + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + (idx === 0 ? 0.65 : 0.32));
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + 0.7);
          });
        });
      }

      function playGulpSound() {
        const ctx = getAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.11);
        osc.frequency.exponentialRampToValueAtTime(190, now + 0.24);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }

      function updateSimulation(dt) {
        state.time += dt;

        // Base crank cadence: ~6.7 rad/s (~64 rpm) at speedMult=1.0
        const targetCrankOmega = state.coasting ? 0 : 6.7 * state.speedMult;
        const wheelOmega = (state.coasting ? 5.2 * state.speedMult : targetCrankOmega) * GEAR_RATIO;

        if (!state.coasting) {
          state.crankAngle += targetCrankOmega * dt;
          state.chainOffset += targetCrankOmega * BIKE.R_CHAINRING * dt;
        } else {
          // Smoothly ease crank to relaxed level cruising stance while freewheeling
          const targetAngle = 0.14;
          const diff = Math.atan2(Math.sin(targetAngle - state.crankAngle), Math.cos(targetAngle - state.crankAngle));
          state.crankAngle += diff * Math.min(1, dt * 4.5);
        }

        state.wheelAngle += wheelOmega * dt;
        // Exact rolling distance along pavement (pixel-perfect no-slip contact!)
        // Visual scale factor 0.56 so high cadence reads gracefully without strobing road lines
        const visualRollSpeed = wheelOmega * BIKE.R_TIRE * 0.56;
        state.groundDist += visualRollSpeed * dt;

        // Secondary motion: Spring-damper for elastic gular pouch!
        const cadenceDrive = state.coasting ? 0 : Math.sin(state.crankAngle * 2 - 0.6) * 24 * state.speedMult;
        const kSpring = 64, cDamp = 6.2;
        const accel = -kSpring * state.pouchDisp - cDamp * state.pouchVel + cadenceDrive;
        state.pouchVel += accel * dt;
        state.pouchDisp += state.pouchVel * dt;
        state.pouchBulge = Math.max(0, state.pouchBulge - dt * 1.4);

        // Natural blinking
        state.blinkTimer -= dt;
        if (state.blinkTimer <= 0) {
          state.blinkProgress = 1.0;
          state.blinkTimer = 3.0 + Math.random() * 2.8;
        }
        if (state.blinkProgress > 0) {
          state.blinkProgress = Math.max(0, state.blinkProgress - dt * 5.8);
        }

        // Bell sound-wave timer
        if (state.bellTimer > 0) {
          state.bellTimer = Math.max(0, state.bellTimer - dt);
        }

        // Fish toss parabolic flight & pelican snap-gulp!
        let targetJaw = 0;
        if (state.bellTimer > 0.55) {
          // Happy squawk when ringing the bell!
          targetJaw = Math.sin(((state.bellTimer - 0.55) / 0.6) * Math.PI) * 14;
        }

        if (state.fishAnim >= 0) {
          const prevAnim = state.fishAnim;
          state.fishAnim += dt * 0.92;
          if (state.fishAnim < 0.68) {
            // Anticipate & open giant beak wide as fish arcs toward mouth!
            if (state.fishAnim > 0.25) {
              targetJaw = Math.max(targetJaw, Math.sin(((state.fishAnim - 0.25) / 0.43) * Math.PI) * 28);
            }
          } else if (prevAnim < 0.68 && state.fishAnim >= 0.68) {
            // Gulp! Fish lands right in the pouch -> big bouncy spring impulse!
            state.pouchVel += 125;
            state.pouchBulge = 1.0;
            state.blinkProgress = 1.0;
            playGulpSound();
          }
          if (state.fishAnim >= 1.25) {
            state.fishAnim = -1;
          }
        }
        state.jawOpen += (targetJaw - state.jawOpen) * Math.min(1, dt * 16);

        // Update HUD stats
        const mph = (wheelOmega / (6.7 * GEAR_RATIO)) * 14.2;
        const rpm = state.coasting ? 0 : Math.round((targetCrankOmega * 60) / (Math.PI * 2));
        dom.statSpeed.textContent = `${mph.toFixed(1)} mph`;
        dom.statRpm.textContent = state.coasting ? "coasting" : `${rpm} rpm`;
      }

      function renderScene() {
        const t = state.time;

        // Distant coast & lighthouse (0.09x, wrap nicely across 1600px)

        dom.coastStrip.setAttribute("transform", `translate(${coastShift.toFixed(1)}, 0)`);

        // Lighthouse sweeping beam rotation
        const beamSweep = Math.sin(t * 0.7) * 16;
        dom.lighthouseBeam.setAttribute("transform", `translate(0, -68) rotate(${beamSweep.toFixed(1)})`);

        // Sun rays subtle gentle turn
        dom.sunRays.setAttribute("transform", `rotate(${(t * 4.5) % 360})`);

        // Clouds (0.055x)
        clouds.forEach((c) => {
          const bx = parseFloat(c.getAttribute("data-x"));
          const by = parseFloat(c.getAttribute("data-y"));
          const s = parseFloat(c.getAttribute("data-s"));
          const cx = (((bx - d * 0.055 - t * 6) % 1620) + 1620) % 1620 - 150;
          c.setAttribute("transform", `translate(${cx.toFixed(1)}, ${by}) scale(${s})`);
        });

        // Distant gulls flapping & gliding
        gulls.forEach((g) => {
          const bx = parseFloat(g.getAttribute("data-x"));
          const by = parseFloat(g.getAttribute("data-y"));
          const ph = parseFloat(g.getAttribute("data-phase"));
          const s = parseFloat(g.getAttribute("data-s"));
          const gx = (((bx - d * 0.08 - t * 18) % 1400) + 1400) % 1400 - 100;
          const gy = by + Math.sin(t * 1.8 + ph) * 6;
          const flap = Math.sin(t * 5.6 + ph) * 6.5;
          g.setAttribute("transform", `translate(${gx.toFixed(1)}, ${gy.toFixed(1)}) scale(${s})`);
          g.firstChild.setAttribute("d", `M -14 ${flap.toFixed(1)} Q -7 ${(-5 - flap * 0.4).toFixed(1)} 0 0 Q 7 ${(-5 - flap * 0.4).toFixed(1)} 14 ${flap.toFixed(1)}`);
        });

        // Distant sailboats gently bobbing on water
        sailboats.forEach((b, idx) => {
          const bx = parseFloat(b.getAttribute("data-x"));
          const by = parseFloat(b.getAttribute("data-y"));
          const s = parseFloat(b.getAttribute("data-s"));
          const sx = (((bx - d * 0.14) % 1440) + 1440) % 1440 - 120;
          const rock = Math.sin(t * 1.7 + idx * 2.1) * 3.2;
          const bob = Math.sin(t * 2.1 + idx) * 1.4;
          b.setAttribute("transform", `translate(${sx.toFixed(1)}, ${(by + bob).toFixed(1)}) rotate(${rock.toFixed(1)}) scale(${s})`);
        });

        // Ocean wave bands undulating
        dom.wave1.setAttribute("transform", `translate(${-((d * 0.18 + t * 12) % 110)}, ${(Math.sin(t * 1.9) * 1.4).toFixed(1)})`);
        dom.wave2.setAttribute("transform", `translate(${-((d * 0.25 + t * 18) % 140)}, ${(Math.sin(t * 2.3 + 1) * 1.8).toFixed(1)})`);
        dom.wave3.setAttribute("transform", `translate(${-((d * 0.34 + t * 24) % 175)}, ${(Math.sin(t * 2.7 + 2) * 2.2).toFixed(1)})`);

        // Shimmering sunlight bars on water
        shimmerBars.forEach((bar) => {
          const bx = parseFloat(bar.getAttribute("data-base-x"));
          const bw = parseFloat(bar.getAttribute("data-base-w"));
          const ph = parseFloat(bar.getAttribute("data-phase"));
          const wave = Math.sin(t * 3.1 + ph);
          bar.setAttribute("x", (bx + wave * 9).toFixed(1));
          bar.setAttribute("width", (bw * (0.86 + Math.cos(t * 2.4 + ph) * 0.16)).toFixed(1));
        });

        // Wind streaks
        const windOp = Math.max(0.06, Math.min(0.36, state.speedMult * 0.17));
        windStreaks.forEach((ws, i) => {
          const bx = parseFloat(ws.getAttribute("data-x"));
          const by = parseFloat(ws.getAttribute("data-y"));
          const len = parseFloat(ws.getAttribute("data-len")) * (0.7 + state.speedMult * 0.35);
          const wx = (((bx - d * 1.45 - t * 120) % 1450) + 1450) % 1450 - 150;
          const wy = by + Math.sin(t * 2 + i) * 4;
          ws.setAttribute("d", `M ${wx.toFixed(1)} ${wy.toFixed(1)} Q ${(wx + len * 0.5).toFixed(1)} ${(wy - 3).toFixed(1)} ${(wx + len).toFixed(1)} ${wy.toFixed(1)}`);
          ws.setAttribute("opacity", (windOp * (0.6 + 0.4 * Math.sin(t * 3 + i))).toFixed(2));
        });

        // -----------------------------------------------------------------------
        // B. BICYCLE WHEELS & DRIVETRAIN
        // -----------------------------------------------------------------------
        dom.rearWheelSpin.setAttribute("transform", `rotate(${waDeg.toFixed(2)})`);
        dom.frontWheelSpin.setAttribute("transform", `rotate(${waDeg.toFixed(2)})`);
        dom.rearCogSpin.setAttribute("transform", `rotate(${waDeg.toFixed(2)})`);
        dom.chainringSpin.setAttribute("transform", `rotate(${caDeg.toFixed(2)})`);
        dom.chainLinks.setAttribute("stroke-dashoffset", (-state.chainOffset).toFixed(2));

        // Subtle cadence weight-transfer bob for pelican torso (wheels stay 100% tangent to road!)
        const cadenceAmp = state.coasting ? 0.35 : 1.0;
        const bodyBobY = Math.sin(ca * 2) * 3.4 * cadenceAmp + Math.sin(t * 3.2) * 0.9;
        const bodyLeanX = Math.cos(ca) * 1.8 * cadenceAmp;
        const bodyTilt = Math.sin(ca * 2 - 0.5) * 1.4 * cadenceAmp;

        // Ground shadow subtly breathes with rider weight transfer
        dom.shadowMain.setAttribute("rx", (268 - bodyBobY * 1.6).toFixed(1));

        // -----------------------------------------------------------------------
        // C. CRANK ARMS & PEDALS (Near at theta, Far at theta + PI)
        // -----------------------------------------------------------------------
        const nearPx = BIKE.BB.x + Math.cos(ca) * BIKE.L_CRANK;
        const nearPy = BIKE.BB.y + Math.sin(ca) * BIKE.L_CRANK;
        const farPx = BIKE.BB.x + Math.cos(ca + Math.PI) * BIKE.L_CRANK;
        const farPy = BIKE.BB.y + Math.sin(ca + Math.PI) * BIKE.L_CRANK;

        dom.nearCrankArm.setAttribute("d", buildTaperedLimbPath(BIKE.BB.x, BIKE.BB.y, nearPx, nearPy, 6.2, 4.8, 0));
        dom.nearCrankShine.setAttribute("x2", nearPx.toFixed(1));
        dom.nearCrankShine.setAttribute("y2", nearPy.toFixed(1));

        dom.farCrankArm.setAttribute("x2", farPx.toFixed(1));
        dom.farCrankArm.setAttribute("y2", farPy.toFixed(1));

        // Realistic cycling ankling (toes dip slightly through top/push, heel drops slightly at bottom)
        const nearFootTilt = -Math.sin(ca - 0.55) * 12 * cadenceAmp;
        const farFootTilt = -Math.sin(ca + Math.PI - 0.55) * 12 * cadenceAmp;

        dom.nearPedal.setAttribute("transform", `translate(${nearPx.toFixed(1)}, ${nearPy.toFixed(1)}) rotate(${(nearFootTilt * 0.65).toFixed(1)})`);
        dom.farPedal.setAttribute("transform", `translate(${farPx.toFixed(1)}, ${farPy.toFixed(1)}) rotate(${(farFootTilt * 0.65).toFixed(1)})`);

        // -----------------------------------------------------------------------
        // D. 2-BONE INVERSE KINEMATICS: PELICAN LEGS + WEBBED FEET ON PEDALS
        // -----------------------------------------------------------------------
        const hipNearX = BIKE.HIP_NEAR.x + bodyLeanX * 0.5;
        const hipNearY = BIKE.HIP_NEAR.y + bodyBobY * 0.7;
        const hipFarX = BIKE.HIP_FAR.x + bodyLeanX * 0.5;
        const hipFarY = BIKE.HIP_FAR.y + bodyBobY * 0.7;

        // Ankle connects right onto the heel/top of pedal platform
        const nearAnkleX = nearPx - 7;
        const nearAnkleY = nearPy - 7;
        const farAnkleX = farPx - 7;
        const farAnkleY = farPy - 7;

        // bendSign = -1 bends knee forward over pedal spindle (classic cyclist KOPS!)
        const nearKnee = solveIK(hipNearX, hipNearY, nearAnkleX, nearAnkleY, BIKE.L_THIGH, BIKE.L_SHIN, -1);
        const farKnee = solveIK(hipFarX, hipFarY, farAnkleX, farAnkleY, BIKE.L_THIGH, BIKE.L_SHIN, -1);

        // Near Leg Paths (plump feathered drumstick + scaly golden lower leg)
        dom.nearThigh.setAttribute("d", buildTaperedLimbPath(hipNearX, hipNearY, nearKnee.x, nearKnee.y, 20, 9.5, 5));
        dom.nearHipBlend.setAttribute("cx", (hipNearX - 2).toFixed(1));
        dom.nearHipBlend.setAttribute("cy", (hipNearY - 2).toFixed(1));
        // Subtle feathered tuft accent arc near lower thigh
        const tdx = nearKnee.x - hipNearX, tdy = nearKnee.y - hipNearY;
        const tlen = Math.hypot(tdx, tdy) || 1;
        const tnx = -tdy / tlen, tny = tdx / tlen;
        const cx1 = hipNearX + tdx * 0.78, cy1 = hipNearY + tdy * 0.78;
        dom.nearThighCuff.setAttribute(
          "d",
          `M ${(cx1 - tnx * 8.5).toFixed(1)} ${(cy1 - tny * 8.5).toFixed(1)}
           Q ${(cx1 + tdx * 0.05).toFixed(1)} ${(cy1 + tdy * 0.05).toFixed(1)}
           ${(cx1 + tnx * 8.5).toFixed(1)} ${(cy1 + tny * 8.5).toFixed(1)}`
        );

        dom.nearShin.setAttribute("d", buildTaperedLimbPath(nearKnee.x, nearKnee.y, nearAnkleX, nearAnkleY, 6.2, 4.8, 0.8));
        dom.nearShinShine.setAttribute("d", `M ${(nearKnee.x + 2).toFixed(1)} ${(nearKnee.y - 1).toFixed(1)} L ${(nearAnkleX + 2).toFixed(1)} ${(nearAnkleY - 1).toFixed(1)}`);

        // Subtle bird-leg tarsometatarsus scale ticks along shin
        const sdx = nearAnkleX - nearKnee.x, sdy = nearAnkleY - nearKnee.y;
        const slen = Math.hypot(sdx, sdy) || 1;
        const snx = -sdy / slen, sny = sdx / slen;
        let scalesD = "";
        for (let s = 1; s <= 6; s++) {
          const f = 0.14 + s * 0.12;
          const sx = nearKnee.x + sdx * f;
          const sy = nearKnee.y + sdy * f;
          scalesD += `M ${(sx - snx * 3.4).toFixed(1)} ${(sy - sny * 3.4).toFixed(1)} L ${(sx + snx * 3.4).toFixed(1)} ${(sy + sny * 3.4).toFixed(1)} `;
        }
        dom.nearShinScales.setAttribute("d", scalesD);

        dom.nearKnee.setAttribute("cx", nearKnee.x.toFixed(1));
        dom.nearKnee.setAttribute("cy", nearKnee.y.toFixed(1));
        dom.nearFoot.setAttribute("transform", `translate(${nearPx.toFixed(1)}, ${(nearPy - 5.5).toFixed(1)}) rotate(${nearFootTilt.toFixed(1)})`);

        // Far Leg Paths
        dom.farThigh.setAttribute("d", buildTaperedLimbPath(hipFarX, hipFarY, farKnee.x, farKnee.y, 17, 8.5, 3.5));
        dom.farShin.setAttribute("d", buildTaperedLimbPath(farKnee.x, farKnee.y, farAnkleX, farAnkleY, 5.5, 4.4, 0.5));
        dom.farKnee.setAttribute("cx", farKnee.x.toFixed(1));
        dom.farKnee.setAttribute("cy", farKnee.y.toFixed(1));
        dom.farFoot.setAttribute("transform", `translate(${farPx.toFixed(1)}, ${(farPy - 5).toFixed(1)}) rotate(${farFootTilt.toFixed(1)})`);

        // -----------------------------------------------------------------------
        // E. PELICAN UPPER BODY, HEAD, ELASTIC GULAR POUCH, SCARF & BLINK
        // -----------------------------------------------------------------------
        dom.pelicanUpper.setAttribute(
          "transform",
          `translate(${bodyLeanX.toFixed(2)}, ${bodyBobY.toFixed(2)}) rotate(${bodyTilt.toFixed(2)}, 520, 320)`
        );

        // Tail feathers gentle counter-bob
        const tailWag = Math.sin(ca * 2 + 0.8) * 3.8 * cadenceAmp + Math.sin(t * 5) * 1.2;
        dom.pelicanTail.setAttribute("transform", `translate(460, 304) rotate(${tailWag.toFixed(1)})`);

        // Head natural stabilization + joyful tilt when ringing bell or catching fish
        let headRot = -bodyTilt * 0.7 + Math.sin(ca * 2 - 1.1) * 1.8 * cadenceAmp;
        if (state.bellTimer > 0.3) {
          headRot -= Math.sin(((state.bellTimer - 0.3) / 0.85) * Math.PI) * 8;
        }
        if (state.fishAnim >= 0 && state.fishAnim < 0.9) {
          headRot -= Math.sin((state.fishAnim / 0.9) * Math.PI) * 14;
        }
        dom.pelicanHead.setAttribute("transform", `translate(582, 128) rotate(${headRot.toFixed(2)})`);

        // Windswept crest feathers flutter faster with bike speed
        const crestFlutter = Math.sin(t * (7 + state.speedMult * 5)) * (2.5 + state.speedMult * 1.8);
        dom.headCrest.setAttribute("transform", `rotate(${crestFlutter.toFixed(1)})`);

        // Hinged Lower Jaw & Spring-Physics Elastic Gular Pouch!
        dom.jawGroup.setAttribute("transform", `translate(26, -1) rotate(${state.jawOpen.toFixed(2)})`);
        const gapeOp = Math.min(0.95, Math.max(0, (state.jawOpen - 2) / 10));
        dom.mouthGape.setAttribute("opacity", gapeOp.toFixed(2));
        const gapeDrop = 4 + state.jawOpen * 1.35;
        dom.mouthGape.setAttribute("d", `M 24 -2 L 76 1 Q 64 ${(gapeDrop * 0.6).toFixed(1)} 58 ${gapeDrop.toFixed(1)} L 24 12 Z`);

        const pBounce = Math.max(-10, Math.min(18, state.pouchDisp * 0.55));
        const pBulge = state.pouchBulge * 18;
        const pDepth = 76 + pBounce + pBulge;
        const pMidY = 58 + pBounce * 0.85 + pBulge * 0.65;
        const pFrontY = 52 + pBounce * 0.75 + pBulge * 0.9;

        dom.pouchPath.setAttribute(
          "d",
          `M -16 16 C 4 ${pMidY.toFixed(1)}, 56 ${pDepth.toFixed(1)}, 102 ${pFrontY.toFixed(1)} C 128 ${(38 + pBounce * 0.4).toFixed(1)}, 142 22, 148 12 L 0 2 Z`
        );
        dom.pouchHighlight.setAttribute(
          "d",
          `M 10 20 C 34 ${(48 + pBounce * 0.6 + pBulge * 0.5).toFixed(1)}, 72 ${(56 + pBounce * 0.7 + pBulge * 0.7).toFixed(1)}, 114 ${(34 + pBounce * 0.35).toFixed(1)} C 84 ${(44 + pBounce * 0.4).toFixed(1)}, 42 ${(40 + pBounce * 0.35).toFixed(1)}, 10 20 Z`
        );
        dom.pouchFold1.setAttribute(
          "d",
          `M 2 12 C 26 ${(42 + pBounce * 0.6 + pBulge * 0.5).toFixed(1)}, 64 ${(52 + pBounce * 0.75 + pBulge * 0.7).toFixed(1)}, 118 26`
        );
        dom.pouchFold2.setAttribute(
          "d",
          `M 16 10 C 40 ${(30 + pBounce * 0.45 + pBulge * 0.35).toFixed(1)}, 74 ${(36 + pBounce * 0.5 + pBulge * 0.5).toFixed(1)}, 128 19`
        );

        // Eye blinking & playful pupil tracking of flying fish
        if (state.blinkProgress > 0.02) {
          const close = Math.sin(state.blinkProgress * Math.PI);
          const lidY = -8 + close * 16;
          dom.eyelidTop.setAttribute("opacity", "1");
          dom.eyelidTop.setAttribute("d", `M -8 -8 Q 1 -10 10 -8 L 10 ${lidY.toFixed(1)} Q 1 ${(lidY + 2).toFixed(1)} -8 ${lidY.toFixed(1)} Z`);
        } else {
          dom.eyelidTop.setAttribute("opacity", "0");
        }

        if (state.fishAnim >= 0 && state.fishAnim < 0.7) {
          const lookX = 2.0;
          const lookY = -2.2 * Math.sin((state.fishAnim / 0.7) * Math.PI);
          dom.eyePupil.setAttribute("transform", `translate(${lookX.toFixed(1)}, ${lookY.toFixed(1)})`);
        } else {
          dom.eyePupil.setAttribute("transform", "translate(0, 0)");
        }

        // Dynamic Wind-Fluttering Nautical Scarf Tails (Multi-Harmonic Travelling Sine Wave)
        const wf = 6.5 + state.speedMult * 5.5;
        const wa = 5.5 + state.speedMult * 4.5;
        const w1 = Math.sin(t * wf) * wa;
        const w2 = Math.sin(t * wf - 1.5) * (wa * 1.35);
        const w3 = Math.sin(t * wf - 2.9) * (wa * 1.65);

        dom.scarfTailFront.setAttribute(
          "d",
          `M 528 206 C 492 ${(198 + w1).toFixed(1)}, 458 ${(210 + w2).toFixed(1)}, 416 ${(202 + w3).toFixed(1)} L 420 ${(218 + w3).toFixed(1)} C 460 ${(226 + w2).toFixed(1)}, 494 ${(214 + w1).toFixed(1)}, 530 218 Z`
        );
        dom.scarfStripe.setAttribute(
          "d",
          `M 527 212 C 492 ${(206 + w1).toFixed(1)}, 459 ${(218 + w2).toFixed(1)}, 418 ${(210 + w3).toFixed(1)}`
        );
        dom.scarfTailBack.setAttribute(
          "d",
          `M 526 210 C 494 ${(206 - w1 * 0.7).toFixed(1)}, 466 ${(218 + w2 * 0.85).toFixed(1)}, 434 ${(213 + w3 * 0.85).toFixed(1)} L 438 ${(226 + w3 * 0.85).toFixed(1)} C 468 ${(231 + w2 * 0.85).toFixed(1)}, 496 ${(219 - w1 * 0.7).toFixed(1)}, 528 221 Z`
        );

        // -----------------------------------------------------------------------
        // F. 2-BONE INVERSE KINEMATICS: PELICAN WINGS LOCKED ON HANDLEBAR GRIPS!
        // -----------------------------------------------------------------------
        const shNearX = BIKE.SHOULDER_NEAR.x + bodyLeanX;
        const shNearY = BIKE.SHOULDER_NEAR.y + bodyBobY;
        const shFarX = BIKE.SHOULDER_FAR.x + bodyLeanX;
        const shFarY = BIKE.SHOULDER_FAR.y + bodyBobY;

        // bendSign = +1 bends elbow smoothly downward-back like a relaxed beach cruiser arm!
        const elbowNear = solveIK(shNearX, shNearY, BIKE.GRIP_NEAR.x, BIKE.GRIP_NEAR.y, BIKE.L_UPPER_WING, BIKE.L_LOWER_WING, +1);
        const elbowFar = solveIK(shFarX, shFarY, BIKE.GRIP_FAR.x, BIKE.GRIP_FAR.y, BIKE.L_UPPER_WING, BIKE.L_LOWER_WING, +1);

        // Near Wing: ONE seamless organic sculpted feathered bird-wing silhouette!
        dom.nearWingBody.setAttribute("d", buildUnifiedWingPath(shNearX, shNearY + 8, elbowNear.x, elbowNear.y, BIKE.GRIP_NEAR.x, BIKE.GRIP_NEAR.y, 19, 15.5, 8.5));
        dom.nearShoulderBlend.setAttribute("cx", (shNearX - 5).toFixed(1));
        dom.nearShoulderBlend.setAttribute("cy", (shNearY + 13).toFixed(1));

        // Soft dove-grey secondary feather shading tucked along lower half of wing
        const midUpperX = (shNearX + elbowNear.x) * 0.5;
        const midUpperY = (shNearY + elbowNear.y) * 0.5;
        const midForeX = (elbowNear.x + BIKE.GRIP_NEAR.x) * 0.5;
        const midForeY = (elbowNear.y + BIKE.GRIP_NEAR.y) * 0.5;
        dom.nearWingSecondary.setAttribute(
          "d",
          `M ${(shNearX - 14).toFixed(1)} ${(shNearY + 12).toFixed(1)}
           Q ${(midUpperX - 18).toFixed(1)} ${(midUpperY + 18).toFixed(1)} ${(elbowNear.x - 10).toFixed(1)} ${(elbowNear.y + 18).toFixed(1)}
           Q ${(midForeX - 2).toFixed(1)} ${(midForeY + 17).toFixed(1)} ${(BIKE.GRIP_NEAR.x - 6).toFixed(1)} ${(BIKE.GRIP_NEAR.y + 7).toFixed(1)}
           Q ${(midForeX - 2).toFixed(1)} ${(midForeY + 4).toFixed(1)} ${(elbowNear.x + 2).toFixed(1)} ${(elbowNear.y + 4).toFixed(1)}
           Q ${(midUpperX - 4).toFixed(1)} ${(midUpperY + 4).toFixed(1)} ${(shNearX - 14).toFixed(1)} ${(shNearY + 12).toFixed(1)} Z`
        );

        // Layered scalloped covert feather lines along the wing arch
        dom.nearWingCoverts.setAttribute(
          "d",
          `M ${(shNearX - 10).toFixed(1)} ${(shNearY + 12).toFixed(1)}
           Q ${(midUpperX - 12).toFixed(1)} ${(midUpperY + 13).toFixed(1)} ${(elbowNear.x - 6).toFixed(1)} ${(elbowNear.y + 11).toFixed(1)}
           Q ${(midForeX).toFixed(1)} ${(midForeY + 10).toFixed(1)} ${(BIKE.GRIP_NEAR.x - 14).toFixed(1)} ${(BIKE.GRIP_NEAR.y + 5).toFixed(1)}`
        );

        // Trailing dark charcoal primary flight feathers fanning gracefully behind elbow/forearm!
        const flutter = Math.sin(t * (8 + state.speedMult * 5)) * (2.5 + state.speedMult * 1.4);
        const makePrimaryFeather = (bx, by, len, spread, phaseOff) => {
          const fFlut = Math.sin(t * (8 + state.speedMult * 5) + phaseOff) * (2.2 + state.speedMult * 1.2);
          const tx = bx - len;
          const ty = by + spread + fFlut;
          return `M ${(bx + 4).toFixed(1)} ${(by - 2).toFixed(1)}
                  Q ${(bx - len * 0.48).toFixed(1)} ${(by + spread * 0.32 - 5).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)}
                  Q ${(bx - len * 0.52).toFixed(1)} ${(by + spread * 0.78 + 7).toFixed(1)} ${(bx + 3).toFixed(1)} ${(by + 11).toFixed(1)} Z`;
        };
        dom.wingPrim1.setAttribute("d", makePrimaryFeather(elbowNear.x - 10, elbowNear.y + 2, 72, 10, 0.0));
        dom.wingPrim2.setAttribute("d", makePrimaryFeather(elbowNear.x + 8, elbowNear.y + 6, 68, 18, 0.5));
        dom.wingPrim3.setAttribute("d", makePrimaryFeather(elbowNear.x + 26, elbowNear.y + 6, 60, 22, 1.0));
        dom.wingPrim4.setAttribute("d", makePrimaryFeather(elbowNear.x + 44, elbowNear.y + 5, 50, 22, 1.5));
        dom.wingPrim5.setAttribute("d", makePrimaryFeather(elbowNear.x + 60, elbowNear.y + 3, 38, 18, 2.0));
        dom.nearWingGrip.setAttribute("transform", `translate(${BIKE.GRIP_NEAR.x}, ${BIKE.GRIP_NEAR.y}) rotate(${(flutter * 0.4).toFixed(1)})`);

        // Far Wing (Unified Organic Silhouette)
        dom.farWingBody.setAttribute("d", buildUnifiedWingPath(shFarX, shFarY, elbowFar.x, elbowFar.y, BIKE.GRIP_FAR.x, BIKE.GRIP_FAR.y, 17, 12, 7));
        dom.farWingTip.setAttribute("cx", BIKE.GRIP_FAR.x);
        dom.farWingTip.setAttribute("cy", BIKE.GRIP_FAR.y);

        // -----------------------------------------------------------------------
        // G. BELL SOUND-WAVE RINGS & FLYING SARDINE ARC
        // -----------------------------------------------------------------------
        if (state.bellTimer > 0) {
          const p = 1 - state.bellTimer / 1.15; // 0 -> 1
          const strikeRot = Math.sin(p * Math.PI * 8) * (1 - p) * 24;
          dom.bellStriker.setAttribute("transform", `translate(-8, 1) rotate(${strikeRot.toFixed(1)})`);

          const r1 = 16 + p * 44;
          const r2 = 10 + Math.max(0, p - 0.18) * 48;
          const op1 = Math.max(0, (1 - p) * 0.9);
          const op2 = Math.max(0, (1 - Math.max(0, p - 0.18) / 0.82) * 0.75);
          const noteY = -18 - p * 44;
          const noteX = 16 + Math.sin(p * 10) * 8;
          dom.bellFx.setAttribute("opacity", "1");
          dom.bellFx.innerHTML = `
            <path d="M ${(-r1 * 0.7).toFixed(1)} ${(-r1 * 0.7).toFixed(1)} A ${r1.toFixed(1)} ${r1.toFixed(1)} 0 0 1 ${(r1 * 0.7).toFixed(1)} ${(-r1 * 0.7).toFixed(1)}" fill="none" stroke="#fff3b8" stroke-width="2.6" stroke-linecap="round" opacity="${op1.toFixed(2)}" />
            <path d="M ${(-r2 * 0.75).toFixed(1)} ${(-r2 * 0.65).toFixed(1)} A ${r2.toFixed(1)} ${r2.toFixed(1)} 0 0 1 ${(r2 * 0.75).toFixed(1)} ${(-r2 * 0.65).toFixed(1)}" fill="none" stroke="#ffd166" stroke-width="2" stroke-linecap="round" opacity="${op2.toFixed(2)}" />
            <text x="${noteX.toFixed(1)}" y="${noteY.toFixed(1)}" font-size="18" fill="#fff4bd" opacity="${op1.toFixed(2)}" font-weight="bold">♪</text>
            <text x="${(-noteX - 10).toFixed(1)}" y="${(noteY + 8).toFixed(1)}" font-size="15" fill="#ffd470" opacity="${op2.toFixed(2)}" font-weight="bold">♫</text>
          `;
        } else {
          dom.bellStriker.setAttribute("transform", "translate(-8, 1)");
          dom.bellFx.setAttribute("opacity", "0");
        }

        // Flying Sardine Parabolic Trajectory from Wicker Basket -> Open Pelican Beak!
        if (state.fishAnim >= 0 && state.fishAnim < 0.68) {
          const u = state.fishAnim / 0.68; // 0 -> 1
          const x0 = 768, y0 = 302;
          const x1 = 716, y1 = 152;
          // Parabolic arc sweeping forward out of basket and curving cleanly into the open jaws!
          const fx = x0 + (x1 - x0) * u + Math.sin(u * Math.PI) * 58;
          const fy = y0 + (y1 - y0) * u - Math.sin(u * Math.PI) * 112;
          const frot = -72 - u * 275;
          const fscale = u > 0.85 ? 1 - (u - 0.85) / 0.15 * 0.5 : 1;
          dom.flyingFish.setAttribute("opacity", "1");
          dom.flyingFish.setAttribute("transform", `translate(${fx.toFixed(1)}, ${fy.toFixed(1)}) rotate(${frot.toFixed(1)}) scale(${fscale.toFixed(2)})`);
          dom.basketFish2.setAttribute("opacity", "0");
        } else {
          dom.flyingFish.setAttribute("opacity", "0");
          // Gently reappear fresh fish in basket after gulp completes
          dom.basketFish2.setAttribute("opacity", state.fishAnim >= 0.68 ? Math.min(1, (state.fishAnim - 0.9) * 3).toFixed(2) : "1");
        }
      }

      // =========================================================================
      // 8. INITIALIZATION, ANIMATION LOOP & CONTROLS
      // =========================================================================
      applyMood(0);
      renderScene();

      // Expose deterministic hook for headless verification / frame inspection
      window.__pelicanBench = {
        setPhase(crankRad, moodIdx = 0, options = {}) {
          state.crankAngle = crankRad;
          state.wheelAngle = crankRad * GEAR_RATIO;
          state.chainOffset = crankRad * BIKE.R_CHAINRING;
          state.groundDist = state.wheelAngle * BIKE.R_TIRE * 0.56;
          state.time = crankRad * 0.4;
          state.fishAnim = options.fishAnim ?? -1;
          state.jawOpen = options.jawOpen ?? 0;
          state.bellTimer = options.bellTimer ?? 0;
          state.pouchBulge = options.pouchBulge ?? 0;
          applyMood(moodIdx);
          renderScene();
        }
      };

      let lastTs = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, Math.max(0, (now - lastTs) / 1000));
        lastTs = now;
        if (state.playing) {
          updateSimulation(dt);
          renderScene();
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      // UI Button Bindings
      const btnPlay = el("btnPlay");
      const btnCoast = el("btnCoast");
      const speedSlider = el("speedSlider");
      const stage = el("stage");

      function togglePlay() {
        state.playing = !state.playing;
        btnPlay.textContent = state.playing ? "❚❚ Pause" : "▶ Play";
        btnPlay.classList.toggle("active", !state.playing);
      }

      function toggleCoast() {
        state.coasting = !state.coasting;
        btnCoast.classList.toggle("active", state.coasting);
        btnCoast.textContent = state.coasting ? "🚴 Pedal" : "⛵ Coast";
      }

      btnPlay.addEventListener("click", togglePlay);
      btnCoast.addEventListener("click", toggleCoast);
      speedSlider.addEventListener("input", (e) => {
        state.speedMult = parseFloat(e.target.value);
      });
      el("btnBell").addEventListener("click", triggerBell);
      el("bike-bell").addEventListener("click", (e) => {
        e.stopPropagation();
        triggerBell();
      });
      el("btnFish").addEventListener("click", triggerFishToss);
      el("pelican-upper").addEventListener("click", triggerFishToss);
      el("btnMood").addEventListener("click", () => applyMood(currentMoodIdx + 1));
      el("btnHud").addEventListener("click", () => stage.classList.add("hud-hidden"));
      el("btnHudRestore").addEventListener("click", () => stage.classList.remove("hud-hidden"));

      // Keyboard Shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        const k = e.key.toLowerCase();
        if (k === " ") { e.preventDefault(); togglePlay(); }
        else if (k === "c") toggleCoast();
        else if (k === "b") triggerBell();
        else if (k === "g") triggerFishToss();
        else if (k === "t") applyMood(currentMoodIdx + 1);
        else if (k === "h") stage.classList.toggle("hud-hidden");
        else if (e.key === "ArrowUp") {
          state.speedMult = Math.min(2.4, +(state.speedMult + 0.15).toFixed(2));
          speedSlider.value = state.speedMult;
        } else if (e.key === "ArrowDown") {
          state.speedMult = Math.max(0.25, +(state.speedMult - 0.15).toFixed(2));
          speedSlider.value = state.speedMult;
        }
      });
    })();
  </script>
</body>
</html>
