<title>A Pelican Riding a Bicycle</title>
<style>
  :root {
    --ink: #f6ead6;
    --ink-dim: #c9b8a0;
    --warm: #f7b662;
    --deep: #0d1b2a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 640px at 76% 8%, #2c4560 0%, transparent 62%),
      radial-gradient(900px 600px at 12% 96%, #33404e 0%, transparent 60%),
      #0b1420;
    color: var(--ink);
    font-family: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    display: grid;
    place-items: center;
    padding: clamp(14px, 3.2vw, 40px);
    min-height: 100%;
  }
  .frame {
    width: min(1180px, 100%);
    display: grid;
    gap: clamp(14px, 2vw, 22px);
  }
  .art {
    position: relative;
    border-radius: clamp(14px, 2vw, 22px);
    overflow: hidden;
    background: #12294a;
    box-shadow:
      0 1px 0 rgba(255, 236, 208, .28) inset,
      0 30px 70px -28px rgba(0, 0, 0, .85),
      0 10px 30px -14px rgba(0, 0, 0, .6);
    isolation: isolate;
  }
  .art svg { display: block; width: 100%; height: auto; }
  .art::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    box-shadow: 0 0 0 1px rgba(255, 230, 200, .16) inset;
    pointer-events: none;
  }
  .caption {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 20px;
    padding: 0 clamp(2px, .6vw, 8px);
  }
  h1 {
    font-size: clamp(19px, 2.5vw, 30px);
    font-weight: 600;
    letter-spacing: .012em;
    margin: 0;
    color: var(--ink);
  }
  h1 em { font-style: italic; color: var(--warm); }
  .meta {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(10px, 1.15vw, 12px);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0;
    white-space: nowrap;
  }
  .plain { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .art svg { animation: none; }
  }
  @media (max-width: 560px) {
    .meta { width: 100%; }
  }
</style>
