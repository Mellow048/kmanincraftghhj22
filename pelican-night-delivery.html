<title>Night Delivery &mdash; a pelican riding a bicycle</title>
<!--
  A pelican riding a bicycle, on a wet harbour street at night, in the rain.
  One HTML file, one inline SVG. No JavaScript, no images, no fonts, no
  libraries, no network. Every movement is a native SVG <animate> element.

  The numbers in the picture are the numbers of the machine:

    wheel      r = 118 px. One turn is 2*pi*118 = 741.42 px of road, so the
               road tile is exactly that long and it slips out from under the
               tyres once every 0.60 s. The tyres never skate.
    speed      741.42 px per 0.60 s = 1235.7 px/s. At 337 px to the metre
               (a 0.70 m tyre) that is 3.7 m/s, or 13 km/h.
    gearing    38 teeth on the chainring, 22 on the cog: 1.727 wheel turns per
               turn of the cranks, so the cranks turn once every 1.036 s and
               the pelican pedals at 58 rpm. The chain runs at the chainring's
               surface speed, 2*pi*28 px per crank turn, and its links are
               spaced so the loop closes exactly.
    legs       solved, not drawn: two-bone inverse kinematics, thigh 155,
               shin 145, sampled every 7.5 degrees of the crank, so each
               webbed foot stays on its pedal through the whole stroke. The
               pedals counter-rotate to stay level; the far leg is half a turn
               behind. The hips never move; the body rocks on them instead.
    frame      71 degree seat tube, 75 degree head tube, 330 px wheelbase,
               bottom bracket 88 px off the ground, 62 px cranks, 700c wheels.

  Light: a cold moon from the upper left, warm sodium lamps in the town behind
  the railing, and the bicycle's own dynamo lamp ahead, which is what you see
  on the wet road and in the rain.
-->
