<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Saltwater Ride — a pelican on a bicycle</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d9e6df; padding: clamp(12px, 3vw, 38px); }
    main { width: min(100%, 1200px); }
    svg { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: 0 18px 60px #315c5526; }
  </style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
    <title id="title">Saltwater Ride</title>
    <desc id="description">A white pelican with a long golden bill and webbed feet rides a teal bicycle beside the sea, under a warm sun.</desc>
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c7e8df"/><stop offset="1" stop-color="#f8e8c9"/></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#82c3b7"/><stop offset="1" stop-color="#b5d9c4"/></linearGradient>
      <linearGradient id="plumage" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fffef5"/><stop offset="1" stop-color="#d7e4dd"/></linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#f4b35d"/><stop offset="1" stop-color="#e68a51"/></linearGradient>
      <pattern id="spokes" patternUnits="userSpaceOnUse" width="20" height="20"><circle cx="2" cy="2" r="1" fill="#f8e7c7"/></pattern>
      <g id="wheel">
        <circle r="113" fill="#f5e3c4" stroke="#344b49" stroke-width="16"/>
        <circle r="100" fill="none" stroke="#eee8d9" stroke-width="5"/>
        <g stroke="#799b94" stroke-width="2.5" opacity=".85">
          <path d="M-99 0H99 M0-99V99 M-70-70L70 70 M70-70L-70 70 M-92-38L92 38 M-92 38L92-38 M-38-92L38 92 M38-92L-38 92"/>
        </g>
        <circle r="13" fill="#344b49"/><circle r="5" fill="#f7db9d"/>
      </g>
    </defs>

    <!-- A quiet coastal setting; every shape is native SVG. -->
    <rect width="1200" height="800" fill="url(#sky)"/>
    <circle cx="929" cy="174" r="87" fill="#f5c77e" opacity=".75"/>
    <circle cx="929" cy="174" r="69" fill="#f9d99b"/>
    <path d="M0 350 Q164 326 321 353 T640 348 T943 350 T1200 336 V565 H0Z" fill="url(#sea)"/>
    <path d="M0 398 Q182 385 347 402 T694 399 T1042 396 T1200 398" fill="none" stroke="#e8f2dc" stroke-width="3" opacity=".7"/>
    <g fill="none" stroke="#e9f2df" stroke-width="3" stroke-linecap="round" opacity=".8">
      <path d="M65 441h90 m28 0h30 M935 430h100 m25 0h45 M135 480h58 M1007 477h75"/>
      <path d="M320 377h66 M740 385h75"/>
    </g>
    <g fill="none" stroke="#709e94" stroke-width="3" stroke-linecap="round" opacity=".65">
      <path d="M187 171q11-11 22 0q11-11 22 0 M262 207q8-8 16 0q8-8 16 0"/>
    </g>
    <path d="M0 531 Q191 510 367 530 T758 529 T1200 516 V800 H0Z" fill="#e7d8b2"/>
    <path d="M0 628 Q282 614 562 630 T1200 619 V800 H0Z" fill="#d7bc92"/>
    <path d="M0 634 Q282 620 562 636 T1200 625" fill="none" stroke="#f6e6c5" stroke-width="6" opacity=".7"/>
    <ellipse cx="594" cy="708" rx="390" ry="22" fill="#846f57" opacity=".15"/>

    <!-- Bicycle: the two hubs, frame, fork, chainring and pedals are drawn as separate parts. -->
    <use href="#wheel" x="345" y="567"/>
    <use href="#wheel" x="830" y="567"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M345 567 L463 385 L567 567 Z M463 385 L735 400 L567 567 M735 400 L830 567" stroke="#294c49" stroke-width="18"/>
      <path d="M345 567 L463 385 L567 567 Z M463 385 L735 400 L567 567 M735 400 L830 567" stroke="#519c89" stroke-width="11"/>
      <path d="M728 389 L714 346 Q710 332 727 329 L772 329 Q785 329 785 317" stroke="#344b49" stroke-width="10"/>
      <path d="M770 316h30" stroke="#a55d45" stroke-width="13"/>
      <path d="M458 387 L448 363" stroke="#344b49" stroke-width="10"/>
      <path d="M420 359 Q449 347 485 355 Q493 357 488 365 Q464 370 425 367 Q417 366 420 359Z" fill="#6e493e" stroke="#344b49" stroke-width="4"/>
      <path d="M355 567h201" stroke="#a5a69a" stroke-width="3"/>
      <circle cx="567" cy="567" r="34" stroke="#344b49" stroke-width="6"/>
      <circle cx="567" cy="567" r="24" stroke="#d7c9a6" stroke-width="3"/>
      <path d="M567 567l39 26 M567 567l-39-26" stroke="#344b49" stroke-width="7"/>
      <path d="M594 595h30 M511 540h31" stroke="#344b49" stroke-width="9"/>
      <path d="M734 407 Q753 418 763 438" stroke="#d9f0d7" stroke-width="3" opacity=".8"/>
    </g>
    <!-- Small front lamp and a bell make the machine feel used. -->
    <path d="M755 364h31" stroke="#344b49" stroke-width="5"/>
    <rect x="782" y="354" width="26" height="20" rx="7" fill="#e3ae64" stroke="#344b49" stroke-width="4"/>
    <circle cx="742" cy="319" r="8" fill="#e4c376" stroke="#344b49" stroke-width="3"/>

    <!-- The far leg is behind the body. Its webbed foot rests on the rear pedal. -->
    <path d="M491 410 Q477 446 495 486 L525 537" fill="none" stroke="#bd724c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M526 534 q-8-5-15 1 l-12 10 q15 4 28 1 l20 1 q5-4 0-8z" fill="#e09a58" stroke="#965b42" stroke-width="3" stroke-linejoin="round"/>

    <!-- Pelican silhouette: body, curved neck, head, very long bill and generous pouch. -->
    <path d="M407 326 Q373 303 356 312 Q371 337 395 348 Q374 344 355 352 Q375 371 403 369" fill="#e1ebe3" stroke="#56736b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M388 338 C407 291 477 270 552 285 C595 294 619 322 618 351 C617 393 580 425 522 435 C463 446 404 426 388 389 C381 373 382 354 388 338Z" fill="url(#plumage)" stroke="#56736b" stroke-width="4"/>
    <path d="M552 318 C588 309 607 290 613 265 C620 237 607 215 616 185 C623 158 649 145 675 151 C706 158 718 184 709 211 C705 224 694 233 680 240 C670 245 666 258 671 274 C682 312 668 350 628 367 C602 377 580 370 561 353Z" fill="url(#plumage)" stroke="#56736b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M617 269 C620 305 609 326 586 338" fill="none" stroke="#b7cec4" stroke-width="5" stroke-linecap="round"/>
    <!-- The lower bill hangs as a pouch, not a second beak. -->
    <path d="M695 204 C746 205 819 215 913 232 C869 243 826 258 779 268 C740 277 714 268 699 250 C692 241 689 222 695 204Z" fill="url(#pouch)" stroke="#9c6647" stroke-width="4" stroke-linejoin="round"/>
    <path d="M694 202 C744 198 845 210 932 227 Q940 229 932 233 C847 231 765 229 699 220Z" fill="#f8c76f" stroke="#9c6647" stroke-width="4" stroke-linejoin="round"/>
    <path d="M704 222 Q799 227 906 232" fill="none" stroke="#ba774d" stroke-width="2.5"/>
    <circle cx="683" cy="183" r="11" fill="#f5d4a0"/>
    <circle cx="686" cy="183" r="5.5" fill="#344b49"/>
    <circle cx="688" cy="181" r="1.8" fill="#fff"/>
    <path d="M666 169 Q677 163 687 168" fill="none" stroke="#91aaa0" stroke-width="3" stroke-linecap="round"/>
    <path d="M420 337 C444 311 514 308 561 331 Q579 342 587 357 C569 381 540 397 504 401 C465 405 431 387 420 365 Q414 352 420 337Z" fill="#f7f8eb" stroke="#92ada3" stroke-width="3"/>
    <g fill="none" stroke="#cadbd1" stroke-width="3" stroke-linecap="round">
      <path d="M435 364 Q463 387 497 387 M451 351 Q478 371 510 373 M472 341 Q497 355 525 358"/>
    </g>
    <!-- Near leg bends forward to the pedal; the broad toes sit on it. -->
    <path d="M544 417 Q560 453 589 480 Q605 494 597 520 L605 589" fill="none" stroke="#d58b50" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M604 583 Q598 580 591 585 L579 595 Q591 601 605 598 L625 599 Q631 595 624 590Z" fill="#f0ac62" stroke="#965b42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M593 593l6 2 M604 590l6 4 M614 590l5 4" fill="none" stroke="#b9794e" stroke-width="2" stroke-linecap="round"/>

    <!-- Foreground dune grasses frame the rider without obscuring the wheels. -->
    <g fill="none" stroke="#73957e" stroke-width="5" stroke-linecap="round">
      <path d="M77 690 Q73 646 54 614 M77 690 Q86 650 104 626 M77 690 Q59 666 37 658 M1097 693 Q1094 650 1078 623 M1097 693 Q1112 652 1135 630 M1097 693 Q1115 672 1151 664"/>
    </g>
    <g fill="#73957e"><ellipse cx="53" cy="612" rx="5" ry="15" transform="rotate(-30 53 612)"/><ellipse cx="104" cy="623" rx="5" ry="15" transform="rotate(32 104 623)"/><ellipse cx="1078" cy="620" rx="5" ry="15" transform="rotate(-25 1078 620)"/><ellipse cx="1135" cy="627" rx="5" ry="15" transform="rotate(35 1135 627)"/></g>
    <g fill="#a88968" opacity=".65"><circle cx="178" cy="711" r="3"/><circle cx="194" cy="720" r="2"/><circle cx="961" cy="718" r="3"/><circle cx="976" cy="710" r="2"/></g>
    <text x="70" y="83" fill="#426e65" font-family="Georgia, serif" font-size="28" letter-spacing="1">Saltwater Ride</text>
    <text x="71" y="107" fill="#658d80" font-family="Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="3">A LITTLE COASTAL DETOUR</text>
  </svg>
</main>
</body>
</html>
