<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A pelican riding a bicycle at sunrise</title>
<!--
  A pelican riding a bicycle at sunrise. HTML + one inline SVG. No JavaScript,
  no images, no fonts, no libraries, no network. All motion is native SVG
  <animate> / <animateTransform> elements.

  Original work, drawn from scratch for this test. It is not based on the two
  pelican files already in this repo (a white pelican in a blue helmet on a
  pink bike by the coast, and a white pelican in a red scarf on a red bike on
  a pier). This one is a brown pelican on a teal step-through city bike with
  a flower basket, riding a dirt path between rice terraces at sunrise, in
  vertical 9:16 (1080x1920) to match the framework's shorts.

  What is exact in it:
    - The wheels roll without slipping: one wheel turn (2.0 s) scrolls the
      dirt path by one tyre circumference (2*pi*135 = 848.2 px).
    - The gearing is 2:1 (chainring r34, cog r17): the cranks turn once per
      4.0 s, the wheels once per 2.0 s.
    - The legs are solved, not guessed: two-bone inverse kinematics
      (thigh 150, shin 150), 48 keyframes per crank turn, so each webbed
      foot stays planted on its pedal. The far leg is half a turn behind.
    - The pedals counter-rotate so they stay level.
    - Parallax: terraces drift slowest, then the near field, the path at
      ground speed, and the foreground grass fastest.

  All keyframes were computed beforehand and written down as plain values.
  Nothing is computed while the page runs.
-->

  html, body { height: 100%; margin: 0; background: #1a2b4a; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
