<!--
  Framework studied before this file was drawn:
  ─────────────────────────────────────────────
  AGENTS.md  — The Director's Contract. Base film is 20s, 3D only, one world,
               camera never teleports, hook in 1.5s, 13 hard rules. Topics
               (InThisTown / Explainer / WhatIf) each have their own starter,
               pack, topic.json lint, and sound pipeline. A film named
               "In This Town …" must be built with --topic, not as a base short.
  README.md  — ZackCraft Films: one folder per video, Remotion + R3F + Three,
               strict 3D, GodRay/LightPool/Glow/Dust, 8×8 pixel faces, look presets.
  docs/CAMERA-BIBLE.md — Six shots, 9:16 framing, FOV 30–60, one move per shot,
               cut budget, continuity (from == previous to).
  docs/STYLE.md        — Night vs day palettes, three-light rule, materials,
               detail hierarchy, Vox blocks for outdoors.
  docs/SCENE-CONTRACT.md — film.tsx / world.tsx / sceneN.tsx API, Shot fields,
               actor contract, determinism.
  docs/NARRATION-RULES.md / NARRATION.md — One teller, plain words, banned phrases.
  docs/STORY-FILMS.md  — narration.md → timing.json → storyScene → captions → sound.py
  Topics/README.md + InThisTown/README.md — Reference films (same-face 1:45 is THE
               reference), short vs long cuts, PACK.md, SOUND.md.
  Topics/Explainer/README.md — Provisional, flightScene, unbroken, stops not shots.
  Topics/WhatIf/README.md    — Provisional, built like InThisTown, power has one look.

  What you are looking at:
  ─────────────────────────
  A pelican riding a bicycle. One file. One inline SVG. Nothing else.

  No JavaScript. No <img>. No external font, image, library, or network request.
  Two CSS rules only (to make the SVG fill the window). Every movement is a native
  SVG <animate> or <animateTransform> element.

  Things that are physically true in this picture:
    • Wheels roll without slipping. One wheel turn (1.2 s) moves the boardwalk
      exactly one tyre circumference (2·π·88 = 552.9 px). The mooring posts are
      spaced at half that (276.45 px), so two bays = one turn.
    • Gearing is 36T chainring → 24T cog = 3:2. Cranks turn once per 1.8 s,
      wheels once per 1.2 s. Chain has 100 links and visibly advances.
    • Legs are solved with two-bone IK (thigh 126, shin 110). 48 keyframes per
      crank turn keep each webbed foot planted on its pedal. Pedals counter-rotate
      so they stay level; far leg is half a turn behind.
    • Frame is a real roadster: 73° seat tube, 72° head tube, 55 mm rake,
      ~1080 mm wheelbase, 700c wheels.
    • Reflection is the pier + rider drawn a second time, flipped, then veiled
      by the sea — so it pedals in perfect sync.

  How to inspect: open this file, View Source. Search for <animateTransform>.
  Every motion is there as plain keyframes, computed beforehand, not at runtime.
-->
