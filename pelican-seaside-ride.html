<!doctype html>

<title>A Pelican's Seaside Ride</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 20px; background: #e9e2d0; }
  svg { display: block; width: min(100%, 1100px); height: auto; border-radius: 8px; box-shadow: 0 18px 55px #52696538; }

<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc">
<title id="title">A pelican's seaside ride</title>
<desc id="desc">A white pelican with a long golden bill pedals a teal bicycle along a sunny seaside road, carrying a fish in its basket.</desc>
<defs>

  <linearGradient id="pouch" x2=".4" y2="1"><stop stop-color="#f8c558"/><stop offset="1" stop-color="#e18a38"/></linearGradient>
  <linearGradient id="feather" x2="1" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#c4d4cd"/></linearGradient>
  <pattern id="basket" width="18" height="15" patternUnits="userSpaceOnUse"><path d="M0 1H18 M0 8H18 M4 1V8 M13 8V15" fill="none" stroke="#8d5e39" stroke-width="2" opacity=".45"/></pattern>
</defs>

 <g stroke="#394e4e" stroke-width="17"><circle cx="310" cy="567" r="113"/><circle cx="762" cy="567" r="113"/></g>

<circle cx="592" cy="170" r="8" fill="#344947"/><circle cx="594" cy="167" r="2.5" fill="#fffdf3"/>
<circle cx="627" cy="177" r="2.5" fill="#9f693a"/>

<g fill="none" stroke="#789e96" stroke-width="3" stroke-linecap="round" opacity=".75"><path d="M140 274q9-9 18 0 9-9 18 0M246 230q7-7 14 0 7-7 14 0M851 253q8-8 16 0 8-8 16 0"/><path d="M178 401h43m-63 15h50"/></g>
