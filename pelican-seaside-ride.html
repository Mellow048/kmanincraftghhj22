<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pelican's Seaside Ride</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d3e6e1; padding: 18px; }
  svg { display: block; width: min(100%, 1100px); height: auto; border-radius: 8px; box-shadow: 0 18px 55px #254a4a38; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">

  <desc id="description">A white pelican with a long golden beak pedals a red bicycle along a sunny coastal road, carrying a fish in its basket.</desc>

    <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#74b9b5"/><stop offset="1" stop-color="#b5d7ca"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#c4d4cf"/></linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8c66b"/><stop offset="1" stop-color="#df8b4b"/></linearGradient>
    <pattern id="spokes" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#e8e2c9"/></pattern>

      </g>
      <circle r="11" fill="#d7a157" stroke="#415750" stroke-width="4"/><circle r="3" fill="#f8e9c8"/>
    </g>
  </defs>

  <circle cx="794" cy="112" r="55" fill="#fff2c8" opacity=".85"/>

    <path d="M630 382 L615 346 Q611 334 625 334 H656 Q672 334 672 318" stroke="#3b5551" stroke-width="9"/>
    <path d="M655 318h29" stroke="#835343" stroke-width="11"/>

  <path d="M410 334 Q432 378 418 414 L454 548" fill="none" stroke="#e4a061" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M452 541 Q463 537 475 543 L493 547 Q499 549 495 553 Q483 558 468 555 L445 555 Q438 552 443 547Z" fill="#e4a061" stroke="#a96543" stroke-width="3"/>
  <!-- Small roadside details. -->
  <g fill="none" stroke="#77947a" stroke-width="3" stroke-linecap="round"><path d="M70 573q-3-21-14-29 M70 573q3-24 15-32 M70 573v-24 M929 565q-4-19-13-26 M929 565q5-23 16-30 M929 565v-22"/></g>
  <g fill="#fff3d6"><circle cx="55" cy="543" r="4"/><circle cx="85" cy="541" r="4"/><circle cx="946" cy="534" r="4"/></g>
  <text x="500" y="675" text-anchor="middle" fill="#806d58" font-family="Georgia, serif" font-style="italic" font-size="17" letter-spacing="2">a little ride by the sea</text>
</svg>
</body>
</html>
