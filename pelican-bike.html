<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican on a bike</title>
<style>
  :root { --ink: #23272e; --frame: #d9504a; --tyre: #23262b; --rim: #9aa4ad; --plume: #f8f5ec; --shade: #ded7c8; --beak: #f2a93b; --pouch: #f4bd62; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(120% 120% at 50% 0%, #f6efe4 0%, #e7dccb 60%, #d9cbb6 100%); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); }
  figure { margin: 0; width: min(94vw, 980px); }
  svg { width: 100%; height: auto; display: block; border-radius: 22px; box-shadow: 0 26px 60px -28px rgba(40, 30, 15, .55), 0 2px 0 #fff inset; }
  figcaption { margin-top: 14px; text-align: center; font-size: 14px; letter-spacing: .01em; color: #6a6053; }

  /* ---- motion ---- */
  .spin { animation: spin 1.15s linear infinite; }
  .spin-slow { animation: spin 2.3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bob { animation: bob .58s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0px); } to { transform: translateY(-4px); } }

  .road { animation: road .5s linear infinite; }
  @keyframes road { to { stroke-dashoffset: -120; } }

  .cloud-a { animation: drift 26s linear infinite; }
  .cloud-b { animation: drift 38s linear infinite; }
  @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(60px); } }

  .pouch { animation: jiggle 1.15s ease-in-out infinite; transform-origin: 556px 214px; }
  @keyframes jiggle { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.08) translateY(2px); } }

  .tail-fish { animation: wiggle 1.6s ease-in-out infinite; transform-origin: 604px 246px; }
  @keyframes wiggle { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }

  .lid { animation: blink 5.2s ease-in-out infinite; transform-origin: 512px 150px; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(0); } 95%, 96% { transform: scaleY(1); } }

  .tip { animation: tip 1.15s ease-in-out infinite; transform-origin: 470px 196px; }
  @keyframes tip { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 900 560" role="img" aria-labelledby="t d">
  <title id="t">A pelican riding a bicycle</title>
  <desc id="d">A white pelican with a large orange beak pedals a red bicycle along a road, with a fish tail poking out of its pouch.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9ddf7" />
      <stop offset=".62" stop-color="#d9eef9" />
      <stop offset="1" stop-color="#f6efe1" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbbfa6" />
      <stop offset="1" stop-color="#b3a487" />
    </linearGradient>
    <linearGradient id="plume" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fffdf6" />
      <stop offset=".55" stop-color="#f6f1e4" />
      <stop offset="1" stop-color="#e2dbcb" />
    </linearGradient>
    <linearGradient id="beakg" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#f7b84a" />
      <stop offset=".7" stop-color="#f0a231" />
      <stop offset="1" stop-color="#d9862a" />
    </linearGradient>
    <linearGradient id="pouchg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9cb74" />
      <stop offset="1" stop-color="#e59a3c" />
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8" />
      <stop offset=".6" stop-color="#ffe9a8" />
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <!-- sky + sun + clouds -->
  <rect width="900" height="470" fill="url(#sky)" />
  <circle cx="742" cy="96" r="120" fill="url(#sun)" />
  <circle cx="742" cy="96" r="42" fill="#fff3c4" />

  <g class="cloud-a" opacity=".85">
    <ellipse cx="180" cy="96" rx="66" ry="24" fill="#fff" opacity=".9" />
    <ellipse cx="222" cy="86" rx="42" ry="26" fill="#fff" opacity=".95" />
    <ellipse cx="140" cy="104" rx="36" ry="18" fill="#fff" opacity=".8" />
  </g>
  <g class="cloud-b" opacity=".7">
    <ellipse cx="640" cy="168" rx="54" ry="18" fill="#fff" />
    <ellipse cx="674" cy="160" rx="32" ry="20" fill="#fff" />
  </g>

  <!-- distant hills -->
  <path d="M0 424 Q 120 352 250 424 T 520 424 Q 640 366 760 424 T 900 410 L 900 470 L 0 470 Z" fill="#c9d9c4" opacity=".75" />
  <path d="M0 440 Q 150 392 320 440 T 640 440 Q 780 404 900 440 L 900 470 L 0 470 Z" fill="#b6cbb0" opacity=".8" />

  <!-- ground + road -->
  <rect y="440" width="900" height="120" fill="url(#ground)" />
  <rect y="470" width="900" height="76" fill="#7d7466" />
  <rect y="470" width="900" height="6" fill="#6a6255" opacity=".55" />
  <line class="road" x1="-60" y1="512" x2="960" y2="512" stroke="#f3ead7" stroke-width="9" stroke-linecap="round" stroke-dasharray="58 62" opacity=".9" />

  <!-- shadow -->
  <ellipse cx="470" cy="486" rx="250" ry="20" fill="#4a4438" opacity=".28" filter="url(#soft)" />

  <!-- ============ BICYCLE ============ -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- rear wheel -->
    <g>
      <circle cx="300" cy="400" r="76" fill="none" stroke="var(--tyre)" stroke-width="15" />
      <circle cx="300" cy="400" r="62" fill="none" stroke="var(--rim)" stroke-width="5" />
      <g class="spin" style="transform-origin:300px 400px" stroke="#b9c1c8" stroke-width="3">
        <line x1="300" y1="338" x2="300" y2="462" />
        <line x1="238" y1="400" x2="362" y2="400" />
        <line x1="256" y1="356" x2="344" y2="444" />
        <line x1="344" y1="356" x2="256" y2="444" />
        <line x1="272" y1="342" x2="328" y2="458" />
        <line x1="328" y1="342" x2="272" y2="458" />
      </g>
      <circle cx="300" cy="400" r="9" fill="#59616a" stroke="#3a4048" stroke-width="3" />
    </g>

    <!-- front wheel -->
    <g>
      <circle cx="628" cy="400" r="76" fill="none" stroke="var(--tyre)" stroke-width="15" />
      <circle cx="628" cy="400" r="62" fill="none" stroke="var(--rim)" stroke-width="5" />
      <g class="spin" style="transform-origin:628px 400px" stroke="#b9c1c8" stroke-width="3">
        <line x1="628" y1="338" x2="628" y2="462" />
        <line x1="566" y1="400" x2="690" y2="400" />
        <line x1="584" y1="356" x2="672" y2="444" />
        <line x1="672" y1="356" x2="584" y2="444" />
        <line x1="600" y1="342" x2="656" y2="458" />
        <line x1="656" y1="342" x2="600" y2="458" />
      </g>
      <circle cx="628" cy="400" r="9" fill="#59616a" stroke="#3a4048" stroke-width="3" />
    </g>

    <!-- frame -->
    <g fill="none" stroke="var(--frame)" stroke-width="13">
      <path d="M462 404 L402 292" />            <!-- seat tube -->
      <path d="M462 404 L592 300" />            <!-- down tube -->
      <path d="M402 292 L592 296" />            <!-- top tube -->
      <path d="M462 404 L304 400" />            <!-- chain stay -->
      <path d="M402 292 L304 400" />            <!-- seat stay -->
      <path d="M592 296 L628 400" />            <!-- fork -->
      <path d="M592 296 L590 258" />            <!-- steerer -->
    </g>
    <g fill="none" stroke="#b8433e" stroke-width="13" stroke-linecap="round" opacity=".55">
      <path d="M600 292 L614 300" />
    </g>

    <!-- handlebar -->
    <path d="M590 258 Q 606 240 636 250" fill="none" stroke="#3d434b" stroke-width="11" stroke-linecap="round" />
    <path d="M628 247 L646 252" fill="none" stroke="#22262c" stroke-width="15" stroke-linecap="round" />
    <!-- bell -->
    <circle cx="600" cy="248" r="9" fill="#e9c25a" stroke="#a8873a" stroke-width="3" />

    <!-- saddle -->
    <path d="M372 288 Q 400 278 428 288 Q 404 300 372 288 Z" fill="#3f4550" stroke="#2b3038" stroke-width="3" />

    <!-- chainring + chain + crank -->
    <circle cx="462" cy="404" r="26" fill="none" stroke="#8b949c" stroke-width="6" />
    <circle cx="462" cy="404" r="25" fill="none" stroke="#5d656d" stroke-width="2" stroke-dasharray="4 5" />
    <path d="M304 388 L462 380 M304 412 L462 428" fill="none" stroke="#6b737b" stroke-width="4" stroke-dasharray="5 4" />

    <g>
      <line x1="462" y1="404" x2="462" y2="446" stroke="#4b535b" stroke-width="9" stroke-linecap="round" />
      <line x1="462" y1="404" x2="462" y2="362" stroke="#3a4249" stroke-width="9" stroke-linecap="round" />
      <rect x="444" y="441" width="36" height="10" rx="3" fill="#2f353c" />
      <rect x="444" y="357" width="36" height="10" rx="3" fill="#3a4249" />
    </g>
  </g>

  <!-- ============ PELICAN ============ -->
  <g class="bob">
    <!-- legs first, so the body sits over them -->
    <!-- far leg, to the raised pedal -->
    <g>
      <path d="M392 300 Q 428 330 452 356" fill="none" stroke="#c9801f" stroke-width="10" stroke-linecap="round" />
      <path d="M446 350 q 20 -4 30 6 q -16 12 -30 -6 Z" fill="#b5701a" />
    </g>
    <!-- near leg, to the low pedal: the strong one, in front -->
    <g>
      <path d="M404 300 Q 446 372 456 434" fill="none" stroke="#e59a34" stroke-width="12" stroke-linecap="round" />
      <path d="M442 430 q 24 -6 36 8 q -18 14 -36 -8 Z" fill="#d98c2e" />
    </g>

    <!-- tail -->
    <path d="M318 268 q -44 -6 -58 14 q 26 16 60 4 Z" fill="#e7e0d1" stroke="#cfc7b5" stroke-width="2" />

    <!-- body -->
    <path d="M330 292 q -16 -70 40 -92 q 62 -24 96 22 q 28 40 4 74 q -30 40 -78 30 q -50 -10 -62 -34 Z"
          fill="url(#plume)" stroke="#d7cfbe" stroke-width="2.5" />
    <!-- chest feathering -->
    <path d="M356 288 q 22 26 58 24 q 30 -2 48 -20" fill="none" stroke="#e4ddcd" stroke-width="3" stroke-linecap="round" />

    <!-- neck -->
    <path d="M430 216 q 26 -30 56 -44 q 26 -12 44 2 q 16 14 6 32" fill="none" stroke="#f4efe2" stroke-width="34" stroke-linecap="round" />
    <path d="M430 216 q 26 -30 56 -44 q 26 -12 44 2 q 16 14 6 32" fill="none" stroke="#d7cfbe" stroke-width="34" stroke-linecap="round" opacity="0" />

    <!-- head -->
    <circle cx="520" cy="156" r="28" fill="#fbf8f0" stroke="#d7cfbe" stroke-width="2.5" />
    <path d="M500 138 q 20 -14 42 -4" fill="none" stroke="#e9e2d2" stroke-width="4" stroke-linecap="round" />

    <!-- eye -->
    <circle cx="528" cy="150" r="7.5" fill="#fff" stroke="#2b3038" stroke-width="2" />
    <circle cx="529.5" cy="150.5" r="3.6" fill="#1d2228" />
    <circle cx="531" cy="149" r="1.2" fill="#fff" />
    <path class="lid" d="M519 150 h 18" stroke="#f3ede0" stroke-width="12" stroke-linecap="round" style="transform-origin:528px 150px" />

    <!-- the beak: long upper mandible + hanging pouch -->
    <path class="pouch" d="M542 158 q 62 8 88 30 q 12 10 2 22 q -14 16 -46 14 q -34 -2 -50 -22 q -14 -18 6 -44 Z"
          fill="url(#pouchg)" stroke="#cf8724" stroke-width="2.5" />
    <path d="M540 154 q 54 0 92 22 q -34 12 -92 4 Z" fill="url(#beakg)" stroke="#c9801f" stroke-width="2.5" />
    <path d="M548 160 q 40 4 74 16" fill="none" stroke="#c9801f" stroke-width="2" opacity=".6" />
    <!-- nostril + hook -->
    <ellipse cx="566" cy="166" rx="4.5" ry="2.6" fill="#a9661a" opacity=".7" />
    <path d="M630 176 q 10 4 6 12" fill="none" stroke="#b4701c" stroke-width="4" stroke-linecap="round" />

    <!-- fish tail poking out of the pouch -->
    <g class="tail-fish" style="transform-origin:604px 246px">
      <path d="M604 246 q 16 10 10 24 l 14 -6 q -4 12 -16 14 q -10 -14 -8 -32 Z" fill="#7fc4e8" stroke="#4f9fc9" stroke-width="2" />
    </g>

    <!-- wing, reaching for the handlebar -->
    <path class="tip" d="M392 250 q 74 -34 148 -4 q 30 14 34 30 q -18 12 -44 0 q -48 -22 -84 -6 q -34 14 -54 -20 Z"
          fill="#efe9db" stroke="#c9c1ae" stroke-width="2.5" />
    <path d="M420 264 q 60 22 118 8" fill="none" stroke="#d8d0be" stroke-width="3" stroke-linecap="round" />
    <path d="M446 276 q 52 16 96 2" fill="none" stroke="#ddd5c3" stroke-width="2.5" stroke-linecap="round" />
    <!-- wingtip feathers gripping the bar -->
    <path d="M560 246 q 26 -6 40 8 q -18 16 -42 8 q -12 -6 2 -16 Z" fill="#e7e0ce" stroke="#c9c1ae" stroke-width="2" />

    <!-- a tiny scarf, because it is moving fast -->
    <path d="M470 196 q -30 -6 -56 10 q 22 8 46 2 q 8 -6 10 -12 Z" fill="#5aa6c9" stroke="#3f88a8" stroke-width="2" />
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-linecap="round" opacity=".75">
    <line x1="150" y1="300" x2="212" y2="300" stroke-width="6" />
    <line x1="118" y1="330" x2="196" y2="330" stroke-width="5" opacity=".7" />
    <line x1="162" y1="360" x2="216" y2="360" stroke-width="4" opacity=".55" />
  </g>
</svg>
<figcaption>A pelican riding a bicycle — pure inline SVG, animated with CSS. Wheels turn, the road runs, the pouch wobbles, the fish flaps.</figcaption>
</figure>
</body>
</html>
