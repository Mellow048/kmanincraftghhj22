<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican on a bike</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #7ec8ea;
    }
    body {
      display: grid;
      place-items: center;
    }
    svg {
      width: min(100vw, 160vh);
      height: auto;
      display: block;
    }
    @media (prefers-reduced-motion: reduce) {
      svg animate,
      svg animateTransform {
        display: none;
      }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pelican riding a bicycle along a seaside boardwalk">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6eb6e0"/>
        <stop offset="0.55" stop-color="#b9e4f5"/>
        <stop offset="1" stop-color="#ffe9c2"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3aa0c8"/>
        <stop offset="1" stop-color="#1d6f96"/>
      </linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffb15a"/>
        <stop offset="1" stop-color="#ef7a3a"/>
      </linearGradient>
      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffdf8"/>
        <stop offset="1" stop-color="#efe4d2"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#16384a" flood-opacity="0.18"/>
      </filter>
    </defs>

    <rect width="960" height="540" fill="url(#sky)"/>
    <circle cx="790" cy="92" r="42" fill="#ffe56a"/>
    <circle cx="790" cy="92" r="58" fill="#ffe56a" opacity="0.28"/>

    <!-- drifting clouds, two copies so the loop is seamless -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="36s" repeatCount="indefinite"/>
      <g fill="#fff" opacity="0.92">
        <g>
          <ellipse cx="140" cy="78" rx="46" ry="22"/>
          <ellipse cx="178" cy="70" rx="34" ry="20"/>
          <ellipse cx="112" cy="84" rx="28" ry="16"/>
        </g>
        <g>
          <ellipse cx="520" cy="54" rx="38" ry="16"/>
          <ellipse cx="552" cy="48" rx="26" ry="14"/>
        </g>
        <g transform="translate(960,0)">
          <ellipse cx="140" cy="78" rx="46" ry="22"/>
          <ellipse cx="178" cy="70" rx="34" ry="20"/>
          <ellipse cx="112" cy="84" rx="28" ry="16"/>
        </g>
        <g transform="translate(960,0)">
          <ellipse cx="520" cy="54" rx="38" ry="16"/>
          <ellipse cx="552" cy="48" rx="26" ry="14"/>
        </g>
      </g>
    </g>

    <!-- sea -->
    <rect x="0" y="292" width="960" height="150" fill="url(#sea)"/>
    <g fill="none" stroke="#e8f7ff" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="2.4s" repeatCount="indefinite"/>
      <path d="M-80 330 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path d="M-40 358 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" opacity="0.55"/>
    </g>

    <!-- sand and a scrolling boardwalk, so the bike reads as moving -->
    <rect x="0" y="400" width="960" height="140" fill="#e7c98a"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-48 0" dur="0.55s" repeatCount="indefinite"/>
      <g fill="#c4a06a">
        <!-- planks, pitched at 48px so the loop lands on the next board -->
        <g id="planks">
          <rect x="-48" y="438" width="36" height="78" rx="2"/>
          <rect x="0" y="438" width="36" height="78" rx="2"/>
          <rect x="48" y="438" width="36" height="78" rx="2"/>
          <rect x="96" y="438" width="36" height="78" rx="2"/>
          <rect x="144" y="438" width="36" height="78" rx="2"/>
          <rect x="192" y="438" width="36" height="78" rx="2"/>
          <rect x="240" y="438" width="36" height="78" rx="2"/>
          <rect x="288" y="438" width="36" height="78" rx="2"/>
          <rect x="336" y="438" width="36" height="78" rx="2"/>
          <rect x="384" y="438" width="36" height="78" rx="2"/>
          <rect x="432" y="438" width="36" height="78" rx="2"/>
          <rect x="480" y="438" width="36" height="78" rx="2"/>
          <rect x="528" y="438" width="36" height="78" rx="2"/>
          <rect x="576" y="438" width="36" height="78" rx="2"/>
          <rect x="624" y="438" width="36" height="78" rx="2"/>
          <rect x="672" y="438" width="36" height="78" rx="2"/>
          <rect x="720" y="438" width="36" height="78" rx="2"/>
          <rect x="768" y="438" width="36" height="78" rx="2"/>
          <rect x="816" y="438" width="36" height="78" rx="2"/>
          <rect x="864" y="438" width="36" height="78" rx="2"/>
          <rect x="912" y="438" width="36" height="78" rx="2"/>
          <rect x="960" y="438" width="36" height="78" rx="2"/>
        </g>
      </g>
    </g>
    <rect x="0" y="434" width="960" height="8" fill="#8d6b43"/>

    <!-- shadow that squishes with the pedal stroke -->
    <ellipse cx="470" cy="512" rx="168" ry="12" fill="#16384a" opacity="0.18">
      <animate attributeName="rx" values="168;150;168;176;168" dur="0.55s" repeatCount="indefinite"/>
    </ellipse>

    <g filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0; 0 3; 0 0" dur="0.55s" repeatCount="indefinite"/>

      <!-- bicycle. hubs sit on the boardwalk. -->
      <g fill="none" stroke="#e23d3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M360 292 L430 430"/>
        <path d="M360 292 L548 278"/>
        <path d="M548 278 L430 430"/>
        <path d="M430 430 L300 436"/>
        <path d="M360 292 L300 436"/>
        <path d="M548 278 L620 436"/>
      </g>
      <!-- chain -->
      <path d="M300 436 C340 470, 400 470, 430 430" fill="none" stroke="#2a2a2a" stroke-width="3" opacity="0.55"/>

      <!-- rear wheel -->
      <g transform="translate(300,436)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
          <circle r="64" fill="none" stroke="#241c18" stroke-width="12"/>
          <circle r="52" fill="none" stroke="#f4efe6" stroke-width="3"/>
          <g stroke="#f4efe6" stroke-width="2">
            <line y1="-50" y2="50"/>
            <line x1="-50" x2="50"/>
            <line x1="-35" y1="-35" x2="35" y2="35"/>
            <line x1="35" y1="-35" x2="-35" y2="35"/>
          </g>
          <rect x="46" y="-4" width="8" height="8" fill="#e23d3d"/>
          <circle r="7" fill="#2a2a2a"/>
        </g>
      </g>

      <!-- front wheel -->
      <g transform="translate(620,436)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
          <circle r="64" fill="none" stroke="#241c18" stroke-width="12"/>
          <circle r="52" fill="none" stroke="#f4efe6" stroke-width="3"/>
          <g stroke="#f4efe6" stroke-width="2">
            <line y1="-50" y2="50"/>
            <line x1="-50" x2="50"/>
            <line x1="-35" y1="-35" x2="35" y2="35"/>
            <line x1="35" y1="-35" x2="-35" y2="35"/>
          </g>
          <rect x="46" y="-4" width="8" height="8" fill="#e23d3d"/>
          <circle r="7" fill="#2a2a2a"/>
        </g>
      </g>

      <!-- chainring and crank. feet stay upright while they orbit. -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 430 430" to="360 430 430" dur="1.1s" repeatCount="indefinite"/>
        <circle cx="430" cy="430" r="18" fill="none" stroke="#2a2a2a" stroke-width="5" stroke-dasharray="4 3"/>
        <line x1="398" y1="430" x2="462" y2="430" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
        <g transform="translate(398,430)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.1s" repeatCount="indefinite"/>
          <rect x="-11" y="-4" width="22" height="8" rx="2" fill="#3a3a3a"/>
          <path d="M-12 2 Q0 16 14 2 Q8 8 -12 2" fill="#f0b429"/>
        </g>
        <g transform="translate(462,430)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.1s" repeatCount="indefinite"/>
          <rect x="-11" y="-4" width="22" height="8" rx="2" fill="#3a3a3a"/>
          <path d="M-12 2 Q0 16 14 2 Q8 8 -12 2" fill="#e09a18"/>
        </g>
      </g>

      <!-- seat and bars -->
      <path d="M332 286 q28 -16 58 0 q-20 12 -58 0" fill="#2a2a2a"/>
      <path d="M548 278 q18 -28 46 -18" fill="none" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round"/>
      <circle cx="592" cy="258" r="7" fill="#f4efe6" stroke="#2a2a2a" stroke-width="3"/>
      <circle cx="568" cy="252" r="5" fill="#ffe56a" stroke="#2a2a2a" stroke-width="2"/>

      <!-- pelican -->
      <g>
        <!-- tail -->
        <path d="M318 228 l-28 8 24 10 z" fill="#efe4d2" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M322 240 l-24 14 22 6 z" fill="#e7d7c0" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>

        <!-- far wing, tucked -->
        <path d="M360 214 q40 -8 52 28 q-30 8 -52 -8 z" fill="#5c4a3a" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>

        <!-- legs, four poses matched to the crank. d is set so the first frame is not blank. -->
        <g fill="none" stroke="#f0b429" stroke-width="10" stroke-linecap="round">
          <path d="M392 292 Q370 360 398 430">
            <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
              values="M392 292 Q370 360 398 430; M392 292 Q360 340 430 462; M392 292 Q400 360 462 430; M392 292 Q420 340 430 398; M392 292 Q370 360 398 430"/>
          </path>
          <path d="M408 296 Q450 360 462 430" opacity="0.9">
            <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
              values="M408 296 Q450 360 462 430; M408 296 Q430 350 430 398; M408 296 Q380 360 398 430; M408 296 Q400 370 430 462; M408 296 Q450 360 462 430"/>
          </path>
        </g>

        <!-- body -->
        <ellipse cx="392" cy="232" rx="62" ry="46" fill="url(#body)" stroke="#2a2a2a" stroke-width="3.5"/>

        <!-- near wing on the bars -->
        <path d="M410 214 C470 188, 540 196, 574 246 C530 236, 470 248, 414 240 Z" fill="#fffdf8" stroke="#2a2a2a" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M500 214 l46 28" fill="none" stroke="#5c4a3a" stroke-width="3" stroke-linecap="round"/>
        <path d="M478 226 l40 22" fill="none" stroke="#5c4a3a" stroke-width="3" stroke-linecap="round"/>

        <!-- neck and head. a filled shape, not a stroke with a line down the middle. -->
        <path d="M424 208 C458 170, 496 146, 522 156 C508 176, 476 198, 436 224 Z" fill="#fffdf8" stroke="#2a2a2a" stroke-width="3.5" stroke-linejoin="round"/>
        <circle cx="534" cy="158" r="24" fill="#fffdf8" stroke="#2a2a2a" stroke-width="3.5"/>

        <!-- beak and pouch. the pouch is the whole joke. -->
        <path d="M552 150 L692 158 L552 170 Z" fill="#f6b24a" stroke="#2a2a2a" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M552 166 Q630 214 688 162 Q640 186 552 174 Z" fill="url(#pouch)" stroke="#2a2a2a" stroke-width="3.5" stroke-linejoin="round">
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0; 0 -1; 0 0" dur="1.1s" repeatCount="indefinite"/>
        </path>
        <path d="M600 168 q8 10 0 16" fill="none" stroke="#c85a28" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

        <!-- a fish tail that will not stay in the pouch -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 612 188; 8 612 188; 0 612 188; -6 612 188; 0 612 188" dur="1.1s" repeatCount="indefinite"/>
          <path d="M612 186 l16 8 -16 8 z" fill="#5aa7c8" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
        </g>

        <!-- eye, with a slow blink -->
        <ellipse cx="544" cy="154" rx="6.5" ry="7" fill="#1a1a1a"/>
        <circle cx="546" cy="152" r="2" fill="#fff"/>
        <ellipse cx="544" cy="154" rx="7" ry="0" fill="#fffdf8">
          <animate attributeName="ry" values="0;0;0;7;0;0" keyTimes="0;0.86;0.9;0.93;0.97;1" dur="3.4s" repeatCount="indefinite"/>
        </ellipse>

        <!-- tiny helmet, so it is clearly a ride and not a perch -->
        <path d="M514 142 q20 -22 40 0 q-8 -6 -40 0" fill="#e23d3d" stroke="#2a2a2a" stroke-width="3" stroke-linejoin="round"/>
      </g>
    </g>
  </svg>
</body>
</html>
