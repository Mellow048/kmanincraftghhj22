<!DOCTYPE html>

<title>A pelican riding a bicycle</title>
<!--
  A pelican riding a bicycle. One file: HTML + one inline SVG.
  No JavaScript, no images, no fonts, no libraries, no network. Every shape is an
  SVG path and every movement is a native <animate> / <animateTransform>. The CSS
  below only makes the picture fill the window.

  What is exact in this picture:
    - The wheels roll without slipping. One wheel turn (1.2 s) carries the bike one
      tyre circumference (2*pi*105 = 659.73 px). The gravel dashes scroll one tile
      of 8 * 659.73 px every 4.0 s, so 549.78 px/s; times 1.2 s is exactly one
      circumference. Nothing skates.
    - The gearing is 36 : 24, so the cranks turn once per 1.8 s while the wheels
      turn once per 1.2 s. Chain speed is 2*pi*36 / 1.8 s = 125.66 px/s and the
      chain's dash period (12.566 px) divides its travel per crank turn (226.19 px)
      exactly 18 times, so the chain never jumps at the loop point.
    - The foot rides the pedal. The near leg is a two-bone chain (thigh 92, shin
      128) solved with inverse kinematics against the real pedal circle at 22.5
      degree steps, in the same clockwise direction as the crank, so the webbed
      foot stays fixed on the pedal plate and the knee bends the right way.
    - The pedals, foot, cranks and chainring share the 1.8 s clock; the cog, tyre,
      rim, spokes and gravel share the 1.2 s clock.

  Golden hour on a desert trail. Water in the bottle, lunch in the basket.
-->

  html, body { height: 100%; margin: 0; background: #ffb27a; }
  svg { display: block; width: 100%; height: 100%; }
</style>
