<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A pelican takes the scenic route on a bicycle. An original, self-contained SVG animation. No JavaScript, images, libraries, or network requests.">
  <title>The Sunday ride — a pelican on a bicycle</title>
  <!--
    THE SUNDAY RIDE
    A standalone HTML + inline-SVG illustration. Open this file directly.
    No JavaScript. No canvas. No bitmap images. No downloaded fonts or assets.
    Inline CSS provides presentation, animation, and the native pause checkbox.

    Drawing order: sky → coast → road → far leg → bicycle → near leg → bird.
    All moving parts have class="motion" and share the same CSS pause state.
    Reduced-motion and print styles show the deliberately composed initial pose.

    MECHANICS, in SVG user units:
      wheel centres (390,650), (797,650); outside tyre radius 104
      crank (552,654); crank radius 44; hip (488,501)
      thigh 108; shin 114; ankle (-14,-11) relative to its pedal
      3.6 s crank / 2.4 s wheel = 36T / 24T gearing
      road advances 2π × 104 = 653.451272 units per wheel revolution

    Limb keyframes were solved BEFORE publishing with the two-bone cosine rule.
    There is no runtime code. scripts/check-pelican.py checks the baked geometry.
    This artwork replaces the earlier pier illustration; the film engine is untouched.
  -->
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f1e7;
      --ink: #294b47;
      --muted: #65756b;
      --accent: #c46046;
      --wheel-time: 2.4s;
      --pedal-time: 3.6s;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    .page { width: min(1120px, calc(100% - 64px)); margin: 34px auto 24px; }
    .heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 0 0 24px; }
    .eyebrow, .edition, .motion-control { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; }
    .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    h1 { font-size: clamp(32px, 4.5vw, 49px); line-height: 1.08; letter-spacing: -1.8px; font-weight: normal; margin: 12px 0 0; }
    .motion-control { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 11px 16px; border: 1px solid #c4ccc0; border-radius: 30px; font-size: 11px; cursor: pointer; user-select: none; white-space: nowrap; }
    .motion-control:hover { background: #e9eddf; border-color: var(--ink); }
    .motion-control svg { width: 12px; height: 12px; flex-shrink: 0; }
    .resume-icon, .resume-label, .reduced-label { display: none; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    #pause-motion:focus-visible ~ .page .motion-control { outline: 3px solid var(--accent); outline-offset: 5px; }
    figure { margin: 0; }
    .artwork { width: 100%; aspect-ratio: 5 / 3; border-radius: 6px; overflow: hidden; background: #dfeadb; isolation: isolate; }
    .scene { display: block; width: 100%; height: 100%; }
    figcaption { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 20px; }
    .caption { margin: 0; font-size: 17px; font-style: italic; }
    .edition { font-size: 9px; line-height: 1.7; letter-spacing: 1.4px; text-align: right; color: var(--muted); text-transform: uppercase; }

    /* Separate placement wrappers from animated groups: transforms never fight. */
    .motion { transform-box: view-box; transform-origin: 0 0; }
    .wheel-turn { animation: wheel-turn var(--wheel-time) linear infinite; }
    .crank-near, .ring-turn { animation: crank-near var(--pedal-time) linear infinite; }
    .crank-far { animation: crank-far var(--pedal-time) linear infinite; }
    .counter-near { animation: counter-near var(--pedal-time) linear infinite; }
    .counter-far { animation: counter-far var(--pedal-time) linear infinite; }
    .thigh-near { animation: thigh-near var(--pedal-time) linear infinite; }
    .shin-near { animation: shin-near var(--pedal-time) linear infinite; }
    .thigh-far { animation: thigh-far var(--pedal-time) linear infinite; }
    .shin-far { animation: shin-far var(--pedal-time) linear infinite; }
    .chain-travel { animation: chain-travel var(--pedal-time) linear infinite; }
    .road-travel { animation: road-travel var(--wheel-time) linear infinite; }
    .cloud-travel { animation: cloud-travel 120s linear infinite; }
    .water-travel { animation: water-travel 12s linear infinite; }
    .boat-rock { animation: boat-rock 5.4s ease-in-out infinite; }
    .gull-float { animation: gull-float 4.8s ease-in-out infinite; }
    .gull-wing { animation: gull-wing 1.8s ease-in-out infinite; }
    .scarf-long { animation: scarf-long 1.8s ease-in-out infinite; }
    .scarf-short { animation: scarf-short 1.2s ease-in-out infinite; }
    .fish-tail { animation: fish-tail 3.6s ease-in-out infinite; }
    .bird-breathe { transform-origin: 488px 501px; animation: bird-breathe 3.6s ease-in-out infinite; }
    .eye-blink { animation: eye-blink 6.4s linear infinite; }
    .tuft { animation: tuft 1.8s ease-in-out infinite; }

    @keyframes gull-wing { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(-0.45); } }
