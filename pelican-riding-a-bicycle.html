<title>A pelican riding a bicycle</title>
<!--
  A PELICAN RIDING A BICYCLE
  One inline SVG. No JavaScript, no images, no fonts, no libraries, no network.
  Every movement is a native SVG <animate>/<animateTransform>/<animateMotion>.
  The two CSS rules below only let the drawing fill the window.

  The scene: a white pelican in a red scarf and a navy cap, two fish in the
  basket, pedalling a teal roadster along a wooden pier on a still morning.

  Details that are true in the picture:
  • The wheels roll without slipping. One wheel turn (2.4 s) is four pier
    tiles; a tile holds four planks, so the deck scrolls exactly one tile
    (2πr/4 = 175.93 units) every 0.6 s. The pilings repeat every two tiles,
    once every 1.2 s.
  • The legs are solved, not eyeballed. A bent-leg curve is recomputed at 24
    points around the pedal circle; each webbed foot rides its pedal with
    <animateMotion>, so it never leaves the crank. The pedals counter-rotate
    inside the crank so their platforms stay level.
  • The frame uses roadster proportions: 73° seat and head tubes, a wheelbase
    of 1.45 wheel diameters, and a 2.4 s drive clock (a deliberate cartoon
    1:1 gear, so the wheels and the crank never drift apart).
  • The pier, the rider and the bike all agree: 2.4 s per wheel turn.
  • No filters. The only gradients are flat SVG gradients, and the glow is a
    radial gradient card. That keeps it cheap on a phone.

  Built with the scene discipline in AGENTS.md and docs/STYLE.md: a real
  place, three light jobs (low sun key, warm bill/wood bounce, cool sea rim),
  foreground pilings, midground rider, background coast, and one subject.
-->
