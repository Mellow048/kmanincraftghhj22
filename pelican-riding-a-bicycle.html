<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A pelican riding a bicycle</title>
<!--
  A pelican riding a bicycle. One inline SVG, nothing else.

  No JavaScript, no images, no fonts, no libraries, no network. Every movement
  is a native SVG <animate> or <animateTransform> element. The two CSS rules
  below only make the drawing fill the window.

  Things that are true in this picture:
    • The wheels roll without slipping. One wheel turn (1.2 s) moves the pier
      exactly one tyre circumference, which is two bays of mooring posts.
    • 36-tooth chainring, 24-tooth cog, 100-link chain. The cranks turn once
      every 1.8 s and the wheels once every 1.2 s, which is that 3:2 ratio.
    • The legs are solved, not guessed. Thigh 126, shin 110, 48 keyframes per
      turn of the cranks, so each webbed foot stays planted on its pedal.
    • The frame is a real roadster's: 73° seat tube, 70° head tube, 55 mm fork
      rake, 1080 mm wheelbase, 700c wheels.
    • The reflection is the pier and the rider themselves, drawn a second
      time upside down, so it pedals in step.

  All of these numbers were worked out beforehand and written down as plain
  keyframes. Nothing is computed while the page runs.
-->
<style>
  html, body { height: 100%; margin: 0; background: #2b8cc6; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
