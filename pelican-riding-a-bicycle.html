<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A pelican riding a bicycle</title>
<!--
  A pelican riding a bicycle. One inline SVG. No JavaScript, no images, no
  fonts, no libraries, no network. Every movement is a native SVG <animate> or
  <animateTransform>, and the two CSS rules below only make the drawing fill
  the window. 63 animations, no script, nothing random: at a given instant
  the picture is always the same.

  The motion is SMIL, so it needs a browser or another engine that runs SMIL:
  open the file in Chrome, Safari or Firefox and it rides; a still-image
  converter will only show the pose at t=0.

  What is true in this drawing:

    * The wheels roll without slipping. Tyre circumference is 603 px and one
      turn takes 3.0 s, so the deck scrolls at 201 px/s: a 120 px plank seam
      passes every 0.597 s and a 880 px stretch of bollards every 4.38 s.
      Both are the same ground speed as the tread.
    * 18-tooth chainring, 9-tooth cog: the cranks turn once every 2.0 s while
      the wheels turn once every 3.0 s, and the chain's links crawl at the
      chainring's rim speed.
    * The legs are solved, not guessed: a two-bone solve from hip to pedal at
      48 samples per revolution, written out as literal keyframes, with the
      thigh and shin held at constant length. The audit script measures the
      webbed feet as 0.0 px off their pedals at every sample.
    * A step-through cruiser, built the way the real thing is built: frame
      behind the far crank and the far leg, chainring and near crank in front,
      near leg over the frame, basket bolted to the fork. Sprung saddle,
      swept-back bars, a bell, cream mudguards with stays, 16 crossed spokes a
      wheel, an 18-tooth ring and a 9-tooth cog.
    * The rider is an American white pelican: white body, charcoal primaries
      along the wing's trailing edge, a yellow bill a third longer than the
      head, an orange pouch slung under it, webbed orange feet on the pedals,
      and one red scarf with two tails in the wind.
    * The light has a source you can see. The sun sits in the sky behind his
      shoulder; a rim light runs along his back and crown, warm shafts cross
      the deck, the water carries the sun's glitter, and every shadow on the
      deck falls away from the sun.
    * Depth, front to back: clouds in three drifting depths, three gulls, a
      band of sea with the sun's glitter on it, a row of bollards tied with
      rope, the deck the bike is on, and haze between each pair.

  The numbers above were solved in a build script and verified afterwards; the
  shipped file contains only literals.
-->
<style>
  /* the SVG element always fills the window and preserveAspectRatio centres
     the drawing inside it, so nothing is ever cropped (dvh keeps a phone's
     address bar from eating the bottom of the pier) */
  html, body { margin: 0; background: #123a5c; }
  svg { display: block; width: 100%; height: 100vh; height: 100dvh; }
</style>
</head>
