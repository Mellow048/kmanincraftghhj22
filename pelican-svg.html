<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican riding a bicycle</title>
<style>
  html, body { height: 100%; margin: 0; background: #142033; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A pelican riding a bicycle along a coastal road">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa3e8"/>
      <stop offset="0.55" stop-color="#9ad4f0"/>
      <stop offset="1" stop-color="#ffe9c4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec8dc"/>
      <stop offset="1" stop-color="#1f6aa8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d6a7e"/>
      <stop offset="1" stop-color="#4a4758"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff4c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="980" cy="120" r="90" fill="url(#sunGlow)"/>
  <circle cx="980" cy="120" r="38" fill="#ffe27a"/>

  <!-- drifting clouds -->
  <g fill="#fff" opacity="0.92">
    <g>
      <ellipse cx="180" cy="110" rx="70" ry="22"/>
      <ellipse cx="150" cy="96" rx="32" ry="20"/>
      <ellipse cx="210" cy="90" rx="40" ry="24"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 0; 0 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="520" cy="70" rx="80" ry="20"/>
      <ellipse cx="490" cy="58" rx="36" ry="18"/>
      <ellipse cx="560" cy="52" rx="42" ry="22"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -50 0; 0 0" dur="22s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="860" cy="150" rx="90" ry="24"/>
      <ellipse cx="820" cy="136" rx="38" ry="20"/>
      <ellipse cx="910" cy="128" rx="46" ry="26"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- hills + lighthouse -->
  <path d="M620 470 C700 430 790 420 880 440 C960 415 1060 450 1200 470 L1200 520 L620 520 Z" fill="#7fb89a"/>
  <path d="M0 500 C80 470 160 480 240 500 C300 478 380 490 460 510 L0 520 Z" fill="#8fc4a6"/>
  <g transform="translate(980 390)">
    <rect x="-10" y="0" width="20" height="80" fill="#f7f1e4" stroke="#2b2440" stroke-width="2"/>
    <rect x="-10" y="28" width="20" height="16" fill="#e23e6b"/>
    <rect x="-8" y="-16" width="16" height="16" fill="#ffe27a" stroke="#2b2440" stroke-width="2"/>
    <path d="M-12 -16 L0 -32 L12 -16 Z" fill="#e23e6b" stroke="#2b2440" stroke-width="2"/>
  </g>

  <!-- sea -->
  <rect y="500" width="1200" height="90" fill="url(#sea)"/>
  <path d="M0 510 Q60 500 120 510 T240 510 T360 510 T480 510 T600 510 T720 510 T840 510 T960 510 T1080 510 T1200 510" fill="none" stroke="#c8f0ff" stroke-width="3" opacity="0.55">
    <animate attributeName="d" dur="3s" repeatCount="indefinite"
      values="M0 510 Q60 500 120 510 T240 510 T360 510 T480 510 T600 510 T720 510 T840 510 T960 510 T1080 510 T1200 510;
              M0 510 Q60 520 120 510 T240 510 T360 510 T480 510 T600 510 T720 510 T840 510 T960 510 T1080 510 T1200 510;
              M0 510 Q60 500 120 510 T240 510 T360 510 T480 510 T600 510 T720 510 T840 510 T960 510 T1080 510 T1200 510"/>
  </path>

  <!-- road -->
  <rect y="560" width="1200" height="240" fill="url(#road)"/>
  <rect y="560" width="1200" height="10" fill="#c9c4b0"/>
  <g>
    <g>
      <rect x="-200" y="680" width="80" height="12" rx="4" fill="#f4e27a"/>
      <rect x="80" y="680" width="80" height="12" rx="4" fill="#f4e27a"/>
      <rect x="360" y="680" width="80" height="12" rx="4" fill="#f4e27a"/>
      <rect x="640" y="680" width="80" height="12" rx="4" fill="#f4e27a"/>
      <rect x="920" y="680" width="80" height="12" rx="4" fill="#f4e27a"/>
      <rect x="1200" y="680" width="80" height="12" rx="4" fill="#f4e27a"/>
      <rect x="1480" y="680" width="80" height="12" rx="4" fill="#f4e27a"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-280 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bicycle + pelican, slight bounce -->
  <g transform="translate(520 430)">
    <animateTransform attributeName="transform" type="translate" values="520 430; 520 424; 520 430" dur="0.6s" repeatCount="indefinite"/>

    <!-- far wheel -->
    <g transform="translate(-170 150)">
      <circle r="78" fill="none" stroke="#2b2440" stroke-width="10"/>
      <circle r="12" fill="#2b2440"/>
      <g>
        <line x1="0" y1="-70" x2="0" y2="70" stroke="#2b2440" stroke-width="3"/>
        <line x1="-70" y1="0" x2="70" y2="0" stroke="#2b2440" stroke-width="3"/>
        <line x1="-50" y1="-50" x2="50" y2="50" stroke="#2b2440" stroke-width="3"/>
        <line x1="50" y1="-50" x2="-50" y2="50" stroke="#2b2440" stroke-width="3"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle r="78" fill="none" stroke="#e23e6b" stroke-width="8"/>
    </g>

    <!-- near wheel -->
    <g transform="translate(170 150)">
      <circle r="78" fill="none" stroke="#2b2440" stroke-width="10"/>
      <circle r="12" fill="#2b2440"/>
      <g>
        <line x1="0" y1="-70" x2="0" y2="70" stroke="#2b2440" stroke-width="3"/>
        <line x1="-70" y1="0" x2="70" y2="0" stroke="#2b2440" stroke-width="3"/>
        <line x1="-50" y1="-50" x2="50" y2="50" stroke="#2b2440" stroke-width="3"/>
        <line x1="50" y1="-50" x2="-50" y2="50" stroke="#2b2440" stroke-width="3"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle r="78" fill="none" stroke="#e23e6b" stroke-width="8"/>
    </g>

    <!-- frame -->
    <g fill="none" stroke="#f4a6c1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-170 150 L-20 150 L70 40 L170 150"/>
      <path d="M-20 150 L70 40 L-10 20"/>
      <path d="M70 40 L40 -10"/>
    </g>
    <circle cx="40" cy="-18" r="18" fill="none" stroke="#2b2440" stroke-width="8"/>
    <path d="M40 -18 L90 -70" stroke="#2b2440" stroke-width="8" stroke-linecap="round"/>
    <path d="M70 -78 L110 -62" stroke="#2b2440" stroke-width="8" stroke-linecap="round"/>
    <!-- seat -->
    <ellipse cx="-8" cy="12" rx="34" ry="12" fill="#2b2440"/>

    <!-- chainring + pedals -->
    <g transform="translate(-20 150)">
      <circle r="22" fill="none" stroke="#2b2440" stroke-width="6"/>
      <g>
        <line x1="0" y1="-48" x2="0" y2="48" stroke="#2b2440" stroke-width="8" stroke-linecap="round"/>
        <rect x="-14" y="-58" width="28" height="12" rx="3" fill="#ffe27a" stroke="#2b2440" stroke-width="3"/>
        <rect x="-14" y="46" width="28" height="12" rx="3" fill="#ffe27a" stroke="#2b2440" stroke-width="3"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- pelican body -->
    <g transform="translate(-10 -40)">
      <!-- wing -->
      <ellipse cx="-30" cy="20" rx="70" ry="28" fill="#f4f1ea" stroke="#2b2440" stroke-width="4" transform="rotate(-18)"/>
      <g>
        <ellipse cx="-30" cy="8" rx="62" ry="22" fill="#e8e2d6" stroke="#2b2440" stroke-width="3" transform="rotate(-12)"/>
        <animateTransform attributeName="transform" type="rotate" values="-6; 8; -6" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <!-- body -->
      <ellipse cx="10" cy="30" rx="78" ry="48" fill="#fffdf8" stroke="#2b2440" stroke-width="4"/>
      <!-- tail -->
      <path d="M-60 40 L-110 20 L-95 50 Z" fill="#fffdf8" stroke="#2b2440" stroke-width="3"/>
      <!-- neck -->
      <path d="M60 10 C90 -40 70 -90 40 -100" fill="none" stroke="#fffdf8" stroke-width="28" stroke-linecap="round"/>
      <path d="M60 10 C90 -40 70 -90 40 -100" fill="none" stroke="#2b2440" stroke-width="4" stroke-linecap="round"/>
      <!-- head -->
      <g transform="translate(28 -118)">
        <ellipse cx="0" cy="0" rx="36" ry="28" fill="#fffdf8" stroke="#2b2440" stroke-width="4"/>
        <!-- helmet -->
        <path d="M-28 -6 C-20 -34 20 -34 28 -6 L20 2 C8 -10 -8 -10 -20 2 Z" fill="#3aa0e8" stroke="#2b2440" stroke-width="3"/>
        <rect x="-6" y="-28" width="12" height="8" rx="2" fill="#ffe27a" stroke="#2b2440" stroke-width="2"/>
        <!-- eye -->
        <circle cx="10" cy="-2" r="6" fill="#2b2440"/>
        <circle cx="12" cy="-4" r="2" fill="#fff"/>
        <!-- beak -->
        <g>
          <path d="M28 4 L92 18 L30 22 Z" fill="#f4b24a" stroke="#2b2440" stroke-width="3"/>
          <path d="M30 22 L88 38 L28 16 Z" fill="#e08932" stroke="#2b2440" stroke-width="3"/>
          <animateTransform attributeName="transform" type="rotate" values="0; 6; 0" dur="1.6s" repeatCount="indefinite"/>
        </g>
      </g>
      <!-- far leg (simplified cycle) -->
      <g stroke="#2b2440" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M20 70 L0 120">
          <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
            values="M20 70 L0 120; M20 70 L40 110; M20 70 L0 120"/>
        </path>
      </g>
      <!-- near leg -->
      <g stroke="#2b2440" stroke-width="10" stroke-linecap="round" fill="none">
        <path d="M30 72 L-20 140">
          <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
            values="M30 72 L-20 140; M30 72 L50 130; M30 72 L-20 140"/>
        </path>
      </g>
      <!-- webbed feet flashes on pedals -->
      <ellipse cx="-20" cy="198" rx="16" ry="8" fill="#f4b24a" stroke="#2b2440" stroke-width="3">
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 -70; 0 0" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
</body>
</html>
