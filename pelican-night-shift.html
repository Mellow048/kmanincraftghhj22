<title>Night Shift — a pelican riding a bicycle</title>
<!--
  NIGHT SHIFT — a pelican riding a bicycle.
  One HTML file, one inline SVG. No JavaScript, no images, no fonts, no
  libraries, no network requests. Every movement is a native SMIL element.

  THE PICTURE
  A rain-soaked town at two in the morning. A pelican in a sou'wester is on
  the fish run: a green step-through bicycle, a basket of two fish, a brass
  lamp, a cat on a windowsill, a gull on the lamp post. Vertical, 720 x 1280.

  THE BICYCLE IS BUILT, NOT SUGGESTED
  - Tyre radius 96 px, so one turn of the wheel is 2*pi*96 = 603.1858 px of
    road. The wheel turns once per 0.84 s, so the road must run at 718.078 px/s.
  - The road is a 720 px tile that crosses the frame in 720/718.078 = 1.00268 s.
    Tyre and ground agree exactly: one wheel turn moves the road one
    circumference. Nothing slides.
  - 40-tooth chainring (r 34) and 20-tooth cog (r 17): the cranks turn once
    per 1.68 s, exactly two wheel turns. 35.7 rpm, a lazy cruise.
  - Both sprockets share the same chain pitch (5.3407 px), so the links are
    the same size front and rear. The chain is a path scaled to whole links
    whose dash offset moves at omega*r = 127.16 px/s — the speed of the chain.
  - The legs are solved, not drawn. Two bones (118 px + 118 px) from a fixed
    hip, 72 samples per crank turn, the ankle pinned to the pedal axle, the
    hock bending backwards like a bird's. The feet sit inside the pedal groups
    and counter-rotate with them, so a foot never slips off a pedal. The far
    leg is exactly half a turn behind.

  THE WEATHER IS A TILE
  - Rain is a field generated on a 360 x 1280 torus. The whole field is slid by
    (360, 1280), which is a lattice vector of that torus, so it wraps without a
    seam at any moment. Three depths fall at different speeds.
  - Parallax is exact: distant town 0.05 of the ground speed, back houses 0.09,
    shop row 0.105, road 1.0. Each layer is a seamless 720 px loop.

  LIGHT
  - Cool key: the moon, high right, rimming the bill, pouch and wheel rims.
  - Warm practicals: the street lamp, the shop windows, the bicycle's brass
    headlamp, and their long reflections in the wet road.
  - Bounce: the wet road throws a low amber light back up into the frame.

  SMALL THINGS (all of them do work)
  cat on the sill, gull on the lamp, fish in the basket, rain dripping off the
  hat brim, ripples in the puddles, a drain by the kerb, a bell on the bar, a
  saddle bag, the brass valve cap and spoke reflector that make the wheel's
  rotation readable.

  Palette: navy night, warm sodium, teal bicycle, cream bird, mustard hat,
  coral bill and feet.
-->
