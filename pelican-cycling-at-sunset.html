<title>A Pelican Riding a Bicycle at Sunset</title>
<!--
  A pelican riding a bicycle. One inline SVG, in one HTML file.

  No JavaScript. No images, no fonts, no libraries, no network. Every
  movement is a native SVG <animate> or <animateTransform>. The three CSS
  rules below only make the drawing fill the window.

  Things that are true in this picture:

  THE BICYCLE was laid out in millimetres, as a Dutch roadster is, and then
  projected to pixels (1 mm = 0.53 px, so the 1080 mm wheelbase is 570 px):
    1080 mm wheelbase, 350 mm wheels (700c), 72 mm bottom-bracket drop,
    446 mm chainstays, 600 mm seat tube at 73 deg, 180 mm head tube at 70 deg,
    395 mm fork with 55 mm rake, 170 mm cranks, 110 mm of seatpost showing.
    Every tube length, both angles and the rake are what the drawing says
    they are; they were not nudged to look better.

  IT ROLLS. One wheel turn takes 1.4 s and carries the world exactly one
  tyre circumference (2*pi*184.72 = 1160.64 px). No slipping.

  THE GEARING is real. 40-tooth chainring, 16-tooth cog, 2.5 to 1, so the
  cranks turn once every 3.5 s while the wheels turn once every 1.4 s. The
  chain is the two common external tangents between an 80.85 mm and an 32.34 mm
  pitch circle, and its links travel at exactly the speed of the road.

  THAT MAKES A SPEED: 829.03 px/s = 1.57 m/s = 5.65 km/h. A slow, pleased roll.

  THE PARALLAX is one number used four times. Each layer scrolls at its own
  fraction of the road speed -- hills 0.03, far bank 0.07, road 1, verge
  1.75 -- so the hills crawl and the grass tears past for the same reason,
  not because each looked nice. The road's own repeat distance is exactly
  one circumference, so the same crack meets the same tread every turn.

  THE LEGS ARE SOLVED, not posed. Hip to pedal at this saddle height needs
  a reach of 266.12 to 448.96 px, so the leg is 480 px of bone (265 + 215). A two-bone
  inverse kinematic is run at 48 keyframes per crank turn and the answers
  written down; the knee never unlocks past 93.53% of straight, and the joint
  is solved on the rear normal because a bird's visible joint is its ANKLE
  and it bends backwards. The far leg is the same solve, half a turn behind.

  THE FEET ARE FREE. Each pedal counter-rotates inside its crank, and the
  foot is bolted to the pedal and drawn in the pedal's own frame -- so both
  feet stay level through the whole stroke without one keyframe spent on
  them. The wing is solved the same way, shoulder to grip.

  All of it was worked out beforehand, in Python, and written down as plain
  numbers. Nothing is computed while the page runs.
-->

  svg { display: block; height: 100vh; width: auto; }
  @media (max-aspect-ratio: 9/16) { svg { width: 100vw; height: auto; } }
</style>
</head>
