<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>A Little Ride by the Sea</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #e8e2d2; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(10px, 2.2vw, 30px);
      background: #e8e2d2;
    }
    main { position: relative; width: min(100%, 1500px); }
    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 20px 55px #53675b25, 0 2px 8px #53675b18;
      overflow: hidden;
    }

    /* The control is a real, keyboard-accessible checkbox; no script is needed. */
    .motion-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    #motion-reduced { display: none; }
    .motion-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 10px 16px;
      margin-top: 12px;
      color: #385b56;
      font: 600 14px/1.4 Arial, sans-serif;
    }
    .motion-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid #a9baaa;
      border-radius: 999px;
      background: #fff9ec;
      box-shadow: 0 2px 5px #53675b14;
      cursor: pointer;
      user-select: none;
    }
    .motion-toggle:hover { background: #fffdf6; }
    #motion-normal:focus-visible ~ .motion-bar .control-normal,
    #motion-reduced:focus-visible ~ .motion-bar .control-reduced {
      outline: 3px solid #b86447;
      outline-offset: 3px;
    }
    .control-reduced, .when-stopped, .motion-explanation { display: none; }
    .motion-explanation { margin: 0; font-weight: 400; }
    #motion-normal:not(:checked) ~ .motion-bar .control-normal .when-playing,
    #motion-reduced:not(:checked) ~ .motion-bar .control-reduced .when-playing { display: none; }
    #motion-normal:not(:checked) ~ .motion-bar .control-normal .when-stopped,
    #motion-reduced:not(:checked) ~ .motion-bar .control-reduced .when-stopped { display: inline; }

    /* The rider rocks about the grip, so the wing stays on the handlebar.
       Pedals, wheels, and legs share the same SVG clock and two-second cycle. */
    .rider-rock, .head-nod, .wing-flap, .scarf-ends { transform-box: view-box; }
    .rider-rock { transform-origin: 930px 424px; animation: ride 2s ease-in-out infinite; }
    .head-nod { transform-origin: 785px 319px; animation: nod 2s ease-in-out infinite; }
    .wing-flap { transform-origin: 730px 390px; animation: flap 2s ease-in-out infinite; }
    .scarf-ends { transform-origin: 777px 313px; animation: scarf 2.2s ease-in-out infinite alternate; }
    .cloud-drift { animation: drift 16s ease-in-out infinite alternate; }
    .water-drift { animation: water 5s ease-in-out infinite alternate; }
    .road-marks { animation: road 1.8s linear infinite; }
    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4s linear infinite;
    }
    .still-pedaling, .still-rotation { display: none; }
    @keyframes ride {
      0%, 50%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(2.8deg); }
      75% { transform: rotate(-2deg); }
    }
    @keyframes nod {
      0%, 50%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(3deg); }
      75% { transform: rotate(-2.5deg); }
    }
    @keyframes flap {
      0%, 50%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(5deg); }
      75% { transform: rotate(-4deg); }
    }
    @keyframes scarf { from { transform: rotate(-8deg); } to { transform: rotate(6deg); } }
    @keyframes drift { from { transform: translateX(-10px); } to { transform: translateX(22px); } }
    @keyframes water { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-180px); } }
    @keyframes blink { 0%, 88%, 94%, 100% { transform: scaleY(1); } 91% { transform: scaleY(.08); } }

    /* SVG animations cannot be paused with CSS, so show a matching still pose
       while motion is off. Reduced-motion users can explicitly opt in. */
    @media (prefers-reduced-motion: no-preference) {
      #motion-normal:not(:checked) ~ svg * { animation: none !important; }
      #motion-normal:not(:checked) ~ svg .animated-pedaling,
      #motion-normal:not(:checked) ~ svg .animated-rotation { display: none; }
      #motion-normal:not(:checked) ~ svg .still-pedaling,
      #motion-normal:not(:checked) ~ svg .still-rotation { display: inline; }
    }
    @media (prefers-reduced-motion: reduce) {
      #motion-normal, .control-normal { display: none; }
      #motion-reduced { display: block; }
      .control-reduced { display: inline-flex; }
      #motion-reduced:not(:checked) ~ svg * { animation: none !important; }
      #motion-reduced:not(:checked) ~ svg .animated-pedaling,
      #motion-reduced:not(:checked) ~ svg .animated-rotation { display: none; }
      #motion-reduced:not(:checked) ~ svg .still-pedaling,
      #motion-reduced:not(:checked) ~ svg .still-rotation { display: inline; }
      #motion-reduced:not(:checked) ~ .motion-bar .motion-explanation { display: block; }
    }
  </style>
</head>
<body>

  <input class="motion-input" id="motion-reduced" type="checkbox" aria-label="Animation" aria-controls="pelican-art">
