name: Render one film (single job)

# Fallback single-job renderer AND parallel surgical snip-render-and-glue splicer!
# Pass `frames` as one of:
#   - "" or "0-140"                                      -> single-job render (original behavior)
#   - "SPLICE:<release-tag>:<from1>-<to1>,<from2>-<to2>" -> parallel render of ONLY changed ranges,
#     frame-accurately spliced into the lossless master from <release-tag> + fresh mix.mp3 audio!
#   - "GLUE:<release-tag>:<source-run-id>"               -> re-splice already-rendered splice-seg-*
#     artifacts from <source-run-id> onto <release-tag> + fresh mix.mp3 audio (no re-rendering)!
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: true
      commit_to:
        description: "renders/<name>.mp4 to commit back to the branch (leave empty to upload artifact instead)"
        required: false
        default: ""
      frames:
        description: "Optional frame range e.g. 0-140 OR SPLICE:<tag>:<r1>,<r2>,... OR GLUE:<tag>:<run_id>"
        required: false
        default: ""
      concurrency:
        description: "Remotion concurrency (4 is optimal on ubuntu-latest swangle)"
        required: false
        default: "4"

permissions:
  contents: write
  actions: write

jobs:
  plan:
    name: Verify and plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.parse.outputs.mode }}
      base_release: ${{ steps.parse.outputs.base_release }}
      source_run_id: ${{ steps.parse.outputs.source_run_id }}
      matrix: ${{ steps.parse.outputs.matrix }}
      segments: ${{ steps.parse.outputs.segments }}

    steps:
      - name: Parse render plan
        id: parse
        env:
          FRAMES: ${{ inputs.frames }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          spec = os.environ.get("FRAMES", "").strip()
          out_path = os.environ["GITHUB_OUTPUT"]
          if spec.startswith("SPLICE:"):
              parts = spec.split(":", 2)
              if len(parts) != 3 or not parts[1] or not parts[2]:
                  sys.exit(f"Invalid SPLICE spec: {spec!r}")
              base_release = parts[1]
              raw_ranges = [r.strip() for r in parts[2].split(",") if r.strip()]
              include = []
              for idx, r in enumerate(raw_ranges):
                  a_s, b_s = r.split("-", 1)
                  include.append({"index": f"{idx:02d}", "from": int(a_s), "to": int(b_s)})
              with open(out_path, "a") as fh:
                  fh.write("mode=splice\n")
                  fh.write(f"base_release={base_release}\n")
                  fh.write("source_run_id=\n")
                  fh.write(f"segments={len(include)}\n")
                  fh.write(f"matrix={json.dumps({'include': include})}\n")
          elif spec.startswith("GLUE:"):
              parts = spec.split(":", 2)
              if len(parts) != 3 or not parts[1] or not parts[2]:
                  sys.exit(f"Invalid GLUE spec: {spec!r}")
              base_release, source_run_id = parts[1], parts[2]
              with open(out_path, "a") as fh:
                  fh.write("mode=glue\n")
                  fh.write(f"base_release={base_release}\n")
                  fh.write(f"source_run_id={source_run_id}\n")
                  fh.write("segments=0\n")
                  fh.write("matrix={\"include\":[]}\n")
          else:
              with open(out_path, "a") as fh:
                  fh.write("mode=single\n")
                  fh.write("base_release=\n")
                  fh.write("source_run_id=\n")
                  fh.write("segments=0\n")
                  fh.write("matrix={\"include\":[]}\n")
          PY

      - uses: actions/checkout@v4
        if: steps.parse.outputs.mode != 'glue'
      - uses: actions/setup-node@v4
        if: steps.parse.outputs.mode != 'glue'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.parse.outputs.mode != 'glue'

      - name: Verify contract
        if: steps.parse.outputs.mode != 'glue'
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: npm run typecheck && npm run check && npm run test:direction && npm run rehearse -- "$COMPOSITION" --pre-render

  render_ranges:
    name: Splice ${{ matrix.from }}-${{ matrix.to }}
    needs: plan
    if: needs.plan.outputs.mode == 'splice'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Render changed range ${{ matrix.from }}-${{ matrix.to }}
        env:
          COMPOSITION: ${{ inputs.composition }}
          CONCURRENCY: ${{ inputs.concurrency }}
          INDEX: ${{ matrix.index }}
          FROM: ${{ matrix.from }}
          TO: ${{ matrix.to }}
        run: |
          set -o pipefail
          mkdir -p out
          if ! npx remotion render src/index.ts "$COMPOSITION" "out/seg-${INDEX}_${FROM}-${TO}.mov" \
            --frames="${FROM}-${TO}" --codec=h264 --crf=18 --audio-codec=pcm-16 --enforce-audio-track \
            --concurrency="$CONCURRENCY" --gl=swangle --timeout=240000 2>&1 | tee render.log; then
            MSG=$(grep -v "Rendered\|Encoded\|Stitching" render.log | tail -c 2500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Splice range $FROM-$TO failed::$MSG"
            exit 1
          fi

      - name: Upload rendered range
        uses: actions/upload-artifact@v4
        with:
          name: splice-seg-${{ matrix.index }}
          path: out/seg-${{ matrix.index }}_${{ matrix.from }}-${{ matrix.to }}.mov
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  splice_deliver:
    name: Splice into master and deliver
    needs: [plan, render_ranges]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'glue' || (needs.plan.outputs.mode == 'splice' && needs.render_ranges.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg and ffprobe are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 1

      - name: Download base 1080x1920 master from release ${{ needs.plan.outputs.base_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_RELEASE: ${{ needs.plan.outputs.base_release }}
        run: |
          mkdir -p base
          gh release download "$BASE_RELEASE" --pattern "*.mp4" --dir base
          ls -la base/

      - name: Download rendered ranges (same run)
        if: needs.plan.outputs.mode == 'splice'
        uses: actions/download-artifact@v4
        with:
          pattern: splice-seg-*
          path: clips
          merge-multiple: true

      - name: Download rendered ranges (from run ${{ needs.plan.outputs.source_run_id }})
        if: needs.plan.outputs.mode == 'glue'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
        run: |
          mkdir -p clips
          gh run download "$SOURCE_RUN_ID" --pattern "splice-seg-*" --dir clips
          find clips -type f | sort

      - name: Frame-accurate splice + audio mux
        env:
          COMPOSITION: ${{ inputs.composition }}
          SEGMENTS: ${{ needs.plan.outputs.segments }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -o pipefail
          {
            set -euo pipefail
            master=$(ls base/*.mp4 | head -n 1)
            audio="public/audio/${COMPOSITION}/mix.mp3"
            args=(--master "$master" --audio "$audio" --out "out/${COMPOSITION}.mp4" --crf 18)
            count=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              base_name=$(basename "$f" .mov)
              rng="${base_name#*_}"
              args+=(--clip "${rng}:${f}")
              count=$((count + 1))
            done < <(find clips -type f -name 'seg-*.mov' | sort)
            echo "Found $count splice clip(s) (mode=$MODE, expected=$SEGMENTS)"
            if [ "$count" -eq 0 ]; then
              echo "No seg-*.mov clips found under clips/" >&2
              exit 1
            fi
            if [ "$MODE" = "splice" ] && [ "$count" -ne "$SEGMENTS" ]; then
              echo "Expected $SEGMENTS splice segments, found $count" >&2
              exit 1
            fi
            python3 scripts/splice-video.py "${args[@]}"
            ls -la "out/${COMPOSITION}.mp4"
          } 2>&1 | tee splice.log || {
            MSG=$(tail -c 3000 splice.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Splice failed::$MSG"
            exit 1
          }

      - name: Upload spliced master artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.composition }}-mp4"
          path: "out/${{ inputs.composition }}.mp4"
          retention-days: 30
          compression-level: 0

      - name: Commit a copy to the current branch
        if: ${{ inputs.commit_to != '' && github.ref_name != 'main' }}
        env:
          COMPOSITION: ${{ inputs.composition }}
          DESTINATION: ${{ inputs.commit_to }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          master="out/$COMPOSITION.mp4"
          copy="out/copy-to-commit.mp4"
          MAX_MB=45
          note="1080x1920 spliced"
          if [ "$(stat -c %s "$master")" -le $((MAX_MB * 1024 * 1024)) ]; then
            cp "$master" "$copy"
          else
            seconds=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$master" | tr -dc '0-9.')
            video_k=$(awk -v mb="$MAX_MB" -v s="$seconds" 'BEGIN { printf "%d", mb * 8192 * 0.94 / s - 128 }')
            if [ "$video_k" -ge 3000 ]; then wide=1080; else wide=720; fi
            echo "Spliced master over ${MAX_MB} MB: re-encoding branch copy at ${video_k}k (width <= $wide)."
            ffmpeg -hide_banner -loglevel error -y -i "$master" \
              -vf "scale='min($wide,iw)':-2" -c:v libx264 -preset slow \
              -b:v "${video_k}k" -maxrate "$((video_k * 3 / 2))k" -bufsize "$((video_k * 3))k" \
              -c:a aac -b:a 128k -movflags +faststart "$copy"
            note="1080x1920 spliced master, branch copy <= ${MAX_MB} MB"
          fi
          ls -la "$copy"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --depth=1 origin "$REF_NAME"
            git checkout --quiet --detach FETCH_HEAD
            mkdir -p "$(dirname "$DESTINATION")"
            cp "$copy" "$DESTINATION"
            git add -f -- "$DESTINATION"
            if git diff --cached --quiet; then
              echo "The branch already has this exact file."; exit 0
            fi
            git commit --quiet -m "Deliver ${COMPOSITION} spliced render (${note})"
            if git push origin "HEAD:refs/heads/${REF_NAME}"; then exit 0; fi
            echo "Push refused (attempt $attempt); retrying on new tip..."
            sleep 5
          done
          exit 1

      - name: Publish full-quality spliced master release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "splice-${{ github.run_number }}-${{ github.run_id }}"
          target_commitish: ${{ github.sha }}
          name: "${{ inputs.composition }} — spliced master ${{ github.run_number }} (1080x1920)"
          body: |
            Surgical snip-render-and-glue 1080x1920 master spliced onto `${{ needs.plan.outputs.base_release }}`.
            - Composition: `${{ inputs.composition }}`
            - Spec: `${{ inputs.frames }}`
            - Commit: `${{ github.sha }}`
          files: "out/${{ inputs.composition }}.mp4"
          token: ${{ secrets.GITHUB_TOKEN }}

  render:
    name: Single render
    needs: plan
    if: needs.plan.outputs.mode == 'single'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Render
        env:
          COMPOSITION: ${{ inputs.composition }}
          CONCURRENCY: ${{ inputs.concurrency }}
          FRAMES: ${{ inputs.frames }}
        run: |
          set -o pipefail
          mkdir -p out
          FRAME_FLAG=""
          if [ -n "$FRAMES" ]; then FRAME_FLAG="--frames=$FRAMES"; fi
          npx remotion render src/index.ts "$COMPOSITION" out/film.mp4 \
            --codec=h264 --crf=20 --concurrency=$CONCURRENCY --gl=swangle --timeout=240000 $FRAME_FLAG \
            2>&1 | tail -40

      - name: Size
        run: ls -la out/film.mp4 && ffprobe -hide_banner out/film.mp4 2>&1 | head -6 || true

      - name: Upload clip artifact
        if: inputs.commit_to == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-clip
          path: out/film.mp4
          retention-days: 3

      - name: Commit it to the branch
        if: inputs.commit_to != ''
        env:
          DEST: ${{ inputs.commit_to }}
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          mkdir -p "$(dirname "$DEST")"
          cp out/film.mp4 "$DEST"
          git add "$DEST"
          git commit -m "Deliver $(basename "$DEST" .mp4) render (1080x1920)" || echo "nothing to commit"
          git push
