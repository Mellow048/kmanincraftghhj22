name: Render one film (artifact only)

# Renders a single composition and hands back the mp4 as a build artifact.
# Nothing is committed back to the branch: the agent downloads it, checks it,
# and commits the file itself. Use this when nobody has a Chrome in their box.
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: true
      concurrency:
        description: "Remotion concurrency (4 is safe on a hosted runner)"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run typecheck && npm run check

      - name: Render
        env:
          COMPOSITION: ${{ inputs.composition }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMPOSITION" out/film.mp4 \
            --codec=h264 --crf=20 --concurrency=$CONCURRENCY --gl=swangle --timeout=300000 \
            2>&1 | tail -40

      - name: Size
        run: ls -la out/film.mp4 && (ffprobe -hide_banner out/film.mp4 2>&1 | head -8 || true)

      - name: Hand it back
        uses: actions/upload-artifact@v4
        with:
          name: film
          path: out/film.mp4
          if-no-files-found: error
          retention-days: 7
