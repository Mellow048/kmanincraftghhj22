name: Render stills

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: true
        default: "the-hallway"
      frames:
        description: "Comma separated frame numbers to render as PNG"
        required: false
        default: "30,100,150,210,270,330,420,480,520,590"
      commit_review:
        description: "Temporarily commit diagnostic stills to this branch for offline review"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify contract
        run: npm run typecheck && npm run check

      - name: Render stills
        run: node scripts/stills.mjs "${{ inputs.composition }}" "${{ inputs.frames }}" out/stills

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "stills-${{ inputs.composition }}"
          path: out/stills
          retention-days: 30

      # For sandboxes that can fetch the repository but not Actions' external
      # artifact-storage host. The frames land in review/<composition>/ on the
      # branch that ran the workflow. Delete that folder before delivery.
      - name: Temporarily commit review frames
        if: ${{ inputs.commit_review && github.ref_name != 'main' }}
        env:
          REF_NAME: ${{ github.ref_name }}
          COMPOSITION: ${{ inputs.composition }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "review/${COMPOSITION}"
          cp out/stills/*.png "review/${COMPOSITION}/"
          git add "review/${COMPOSITION}/"
          git commit -m "Diagnostic review frames for ${COMPOSITION}"
          git push origin "HEAD:${REF_NAME}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "stills-${{ inputs.composition }}-${{ github.run_number }}"
          name: "${{ inputs.composition }} — stills ${{ github.run_number }}"
          body: |
            Diagnostic stills rendered by GitHub Actions at 720x1280.

            - Composition: `${{ inputs.composition }}`
            - Frames: `${{ inputs.frames }}`
            - Commit: `${{ github.sha }}`
          files: "out/stills/*.png"
          token: ${{ secrets.GITHUB_TOKEN }}
