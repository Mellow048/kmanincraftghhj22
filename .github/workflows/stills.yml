name: Render stills

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: true
        default: "the-hallway"
      frames:
        description: "Comma separated frame numbers to render as PNG"
        required: false
        default: "30,100,150,210,270,330,420,480,520,590"
      commit_review:
        description: "Temporarily commit diagnostic stills to this branch for offline review"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify contract
        run: npm run typecheck && npm run check

      - name: Render stills
        id: render
        continue-on-error: true
        run: |
          set +e
          node scripts/stills.mjs "${{ inputs.composition }}" "${{ inputs.frames }}" out/stills > /tmp/stills.log 2>&1
          echo "exit=$?" >> /tmp/stills.log
          tail -80 /tmp/stills.log
          exit 0

      - name: Upload artifact
        if: ${{ steps.render.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: "stills-${{ inputs.composition }}"
          path: out/stills
          retention-days: 30

      # For sandboxes that can fetch the repository but not Actions' external
      # artifact-storage host. The frames land in review/<composition>/ on the
      # branch that ran the workflow. Delete that folder before delivery.
      #
      # This also runs when the render fails, so the reason is readable: Actions' own logs are not
      # always reachable from the sandbox, and "Render stills failed" with no message is unworkable.
      - name: Temporarily commit review frames
        if: ${{ always() && github.ref_name != 'main' && (inputs.commit_review || steps.render.outcome == 'failure') }}
        env:
          REF_NAME: ${{ github.ref_name }}
          COMPOSITION: ${{ inputs.composition }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "review/${COMPOSITION}"
          cp out/stills/*.png "review/${COMPOSITION}/" 2>/dev/null || true
          cp /tmp/stills.log "review/${COMPOSITION}/LAST_RUN.txt" 2>/dev/null || true
          git add "review/${COMPOSITION}/"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Diagnostic review frames for ${COMPOSITION}"
          # Somebody may have pushed while the stills rendered: take their commits first, or the push is refused
          # and ten minutes of frames are lost.
          # The branch moves under this job all the time -- a render finishing, a source push -- so rebase
          # and push with retries rather than throwing away ten minutes of frames on the first collision.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${REF_NAME}" || true
            if git push origin "HEAD:${REF_NAME}"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "Could not push review frames after 5 attempts" >&2
          exit 1

      - name: Fail if the render failed
        if: ${{ steps.render.outcome == 'failure' }}
        run: |
          echo "The stills render failed; see review/${{ inputs.composition }}/LAST_RUN.txt" >&2
          exit 1

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "stills-${{ inputs.composition }}-${{ github.run_number }}"
          name: "${{ inputs.composition }} — stills ${{ github.run_number }}"
          body: |
            Diagnostic stills rendered by GitHub Actions at 720x1280.

            - Composition: `${{ inputs.composition }}`
            - Frames: `${{ inputs.frames }}`
            - Commit: `${{ github.sha }}`
          files: "out/stills/*.png"
          token: ${{ secrets.GITHUB_TOKEN }}
