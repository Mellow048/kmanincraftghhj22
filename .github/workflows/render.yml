name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: true
        default: "the-hallway"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Ensure ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Render MP4 at 720x1280
        run: >
          npx remotion render src/index.ts
          "${{ inputs.composition }}"
          "out/${{ inputs.composition }}-720p.mp4"
          --codec=h264
          --crf=20
          --scale=0.6667
          --concurrency=4
          --gl=swangle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.composition }}-720p-mp4"
          path: "out/${{ inputs.composition }}-720p.mp4"
          retention-days: 30

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "render-720p-${{ github.run_number }}"
          name: "${{ inputs.composition }} — GitHub 720p test render ${{ github.run_number }}"
          body: |
            Rendered automatically by GitHub Actions at 720x1280.

            - Composition: `${{ inputs.composition }}`
            - Scale: `0.6667` (1080x1920 -> 720x1280)
            - Commit: `${{ github.sha }}`
          files: "out/${{ inputs.composition }}-720p.mp4"
          token: ${{ secrets.GITHUB_TOKEN }}
