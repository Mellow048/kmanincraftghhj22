name: Render short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        required: true
        default: "the-hallway"
      commit_to:
        description: "Optional renders/<name>.mp4 destination; commit the MP4 to this non-main branch (for sandboxes that cannot reach release assets)"
        required: false
        type: string
        default: ""
      scale:
        description: "Output scale, 0.25 to 1. Leave at 1 for a 20-second short. A three-minute 1080x1920 film: 0.667 gives 720x1280 in about a third of the time"
        required: false
        type: string
        default: "1"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    # A three-minute story film is 5,300 frames of software WebGL. Twenty-second shorts finish in a few minutes.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify contract
        run: npm run typecheck && npm run check

      - name: Ensure ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Render MP4
        env:
          COMPOSITION: ${{ inputs.composition }}
          SCALE: ${{ inputs.scale }}
        run: |
          case "$SCALE" in
            1|0.[2-9]|0.[2-9][0-9]|0.[2-9][0-9][0-9]) ;;
            *) echo "scale must be a number from 0.25 to 1, got '$SCALE'" >&2; exit 1 ;;
          esac
          npx remotion render src/index.ts "$COMPOSITION" "out/${COMPOSITION}-720p.mp4" \
            --codec=h264 --crf=20 --concurrency=4 --gl=swangle --scale="$SCALE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.composition }}-720p-mp4"
          path: "out/${{ inputs.composition }}-720p.mp4"
          retention-days: 30

      # Actions' artifact host is not accessible in some sandboxes. A requested
      # reference is delivered inside the repository instead of only as a URL.
      - name: Commit the MP4 to the current branch
        if: ${{ inputs.commit_to != '' && github.ref_name != 'main' }}
        env:
          COMPOSITION: ${{ inputs.composition }}
          DESTINATION: ${{ inputs.commit_to }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$DESTINATION" in
            renders/*.mp4) ;;
            *) echo "Destination must be renders/<name>.mp4" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$(dirname "$DESTINATION")"
          cp "out/${COMPOSITION}-720p.mp4" "$DESTINATION"
          git add -f -- "$DESTINATION"
          git commit -m "Deliver ${COMPOSITION} render"
          git push origin "HEAD:${REF_NAME}"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "render-720p-${{ github.run_number }}"
          name: "${{ inputs.composition }} — GitHub 720p test render ${{ github.run_number }}"
          body: |
            Rendered automatically by GitHub Actions at 720x1280.

            - Composition: `${{ inputs.composition }}`
            - Resolution: 720x1280 (test render)
            - Commit: `${{ github.sha }}`
          files: "out/${{ inputs.composition }}-720p.mp4"
          token: ${{ secrets.GITHUB_TOKEN }}
