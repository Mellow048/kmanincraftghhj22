name: Review shots (fast)

# TEMPORARY, for the sandbox that cannot open a browser: one still per shot, from ONE browser
# session (scripts/shots.mjs), committed back to the branch so they can be looked at offline.
# Delete this file and review-shots/ before delivery.

on:
  workflow_dispatch:
    inputs:
      film:
        description: "Film folder under src/videos"
        required: true
        default: "in-this-town-our-golem-died"
      at:
        description: "Where in each shot, as fractions of the shot"
        required: false
        default: "0.3,0.75"
      scale:
        description: "Output scale of 1080x1920"
        required: false
        default: "0.35"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Render one still per shot
        env:
          FILM: ${{ inputs.film }}
          AT: ${{ inputs.at }}
          SCALE: ${{ inputs.scale }}
        run: node scripts/shots.mjs "$FILM" --at "$AT" --scale "$SCALE" --out "out/shots/$FILM"

      - name: Commit them to the branch
        env:
          REF_NAME: ${{ github.ref_name }}
          FILM: ${{ inputs.film }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "review-shots/${FILM}"
          rm -f "review-shots/${FILM}"/*.jpg
          cp "out/shots/${FILM}"/*.jpg "review-shots/${FILM}/"
          git add "review-shots/${FILM}"
          git commit -m "Review shots for ${FILM}"
          git pull --rebase origin "${REF_NAME}" || true
          git push origin "HEAD:${REF_NAME}"
