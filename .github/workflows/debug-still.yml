name: Debug still
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Try
        run: |
          npx remotion still src/index.ts what-if-everybody-forgot-you-the-moment-you-left-the-room /tmp/f.png --frame=430 --gl=swangle 2>&1 | tail -40
