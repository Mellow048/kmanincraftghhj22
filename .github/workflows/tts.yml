name: Generate TTS narration and audio mix

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Film slug under src/videos/<composition>"
        required: true
      voice:
        description: "Edge TTS voice"
        required: false
        default: "en-US-GuyNeural"
      rate:
        description: "Edge TTS speaking rate"
        required: false
        default: "+10%"

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python audio tools
        run: pip install --no-cache-dir edge-tts numpy pocketsphinx pillow imageio-ffmpeg

      - name: Synthesize Edge TTS clips
        env:
          COMPOSITION: ${{ inputs.composition }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
        run: python3 scripts/tts.py "$COMPOSITION" --voice "$VOICE" --rate "$RATE"

      - name: Align narration words and build timing.json
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: python3 scripts/narration.py build "$COMPOSITION" --require-alignment

      - name: Build mixed audio track
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: |
          if [ -f "src/videos/$COMPOSITION/sound.json" ]; then
            python3 scripts/sound.py build "$COMPOSITION"
          else
            echo "No sound.json yet; skipping mix.mp3 build"
          fi

      - name: Upload generated audio and timing
        uses: actions/upload-artifact@v4
        with:
          name: tts-${{ inputs.composition }}
          path: |
            public/audio/${{ inputs.composition }}/
            src/videos/${{ inputs.composition }}/timing.json
            src/videos/${{ inputs.composition }}/sound.lock.json
          if-no-files-found: warn
