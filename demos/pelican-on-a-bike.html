<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican on a bike</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 120% at 50% 0%, #16223a 0%, #0a0f1a 60%, #05070c 100%);
    font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
    color: #8fa3bd;
  }
  figure { margin: 0; width: min(96vw, 1200px); }
  svg { display: block; width: 100%; height: auto; border-radius: 18px; overflow: visible; }
  figcaption { padding: 10px 4px 0; text-align: center; letter-spacing: .02em; }

  /* the bike moves; the world does not */
  .wheel { animation: spin 1.1s linear infinite; }
  #wheel-rear { transform-origin: 370px 610px; }
  #wheel-front { transform-origin: 830px 610px; }
  .crank { animation: spin 1.1s linear infinite; transform-origin: 600px 615px; }
  .rider { animation: bob 1.1s ease-in-out infinite; transform-origin: 560px 470px; }
  .road-dash { animation: dash 0.9s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  @keyframes dash { to { transform: translateX(-80px); } }

  @media (prefers-reduced-motion: reduce) {
    .wheel, .crank, .rider, .road-dash { animation: none; }
  }
</style>
</head>
<body>
<figure>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">A pelican riding a bicycle</title>
  <desc id="d">A white pelican with a long orange beak and a full throat pouch sits on the saddle of a blue bicycle, its wings on the handlebars and its webbed feet on the pedals, rolling along a road at sunset.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20335c" />
      <stop offset="0.55" stop-color="#3f5a86" />
      <stop offset="1" stop-color="#c98a63" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#ffab5e" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffab5e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bird" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#eef2f7" />
      <stop offset="1" stop-color="#c6d1de" />
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ebf2" />
      <stop offset="1" stop-color="#aeb9c8" />
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffc25a" />
      <stop offset="0.6" stop-color="#f2952f" />
      <stop offset="1" stop-color="#d9741b" />
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffb84d" />
      <stop offset="1" stop-color="#e07c22" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0d8" />
      <stop offset="1" stop-color="#2e93a3" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3c31" />
      <stop offset="1" stop-color="#141c18" />
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- sky, sun, hills -->
  <rect width="1200" height="800" fill="url(#sky)" />
  <circle cx="975" cy="286" r="230" fill="url(#sunGlow)" />
  <circle cx="975" cy="286" r="72" fill="#ffe3b4" />
  <path d="M0 560 Q 190 470 380 545 T 760 530 T 1200 505 V 800 H 0 Z" fill="#1d2b3f" opacity="0.85" />
  <path d="M0 600 Q 240 540 520 590 T 1200 565 V 800 H 0 Z" fill="#16202f" />

  <!-- clouds -->
  <g fill="#dfe7f3" opacity="0.22">
    <ellipse cx="235" cy="215" rx="92" ry="30" />
    <ellipse cx="300" cy="196" rx="58" ry="24" />
    <ellipse cx="180" cy="200" rx="48" ry="20" />
    <ellipse cx="1010" cy="168" rx="74" ry="24" />
    <ellipse cx="1060" cy="150" rx="44" ry="18" />
  </g>

  <!-- road -->
  <rect y="700" width="1200" height="100" fill="url(#ground)" />
  <rect y="700" width="1200" height="6" fill="#3d5142" />
  <g class="road-dash" stroke="#7b8b4a" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <line x1="20" y1="758" x2="120" y2="758" />
    <line x1="220" y1="758" x2="320" y2="758" />
    <line x1="420" y1="758" x2="520" y2="758" />
    <line x1="620" y1="758" x2="720" y2="758" />
    <line x1="820" y1="758" x2="920" y2="758" />
    <line x1="1020" y1="758" x2="1120" y2="758" />
    <line x1="1220" y1="758" x2="1320" y2="758" />
  </g>

  <!-- ground shadow -->
  <ellipse cx="600" cy="716" rx="330" ry="26" fill="url(#shadow)" />

  <!-- speed lines -->
  <g stroke="#cfe3ff" stroke-width="6" stroke-linecap="round" opacity="0.20">
    <line x1="120" y1="330" x2="235" y2="330" />
    <line x1="70" y1="410" x2="200" y2="410" />
    <line x1="130" y1="492" x2="230" y2="492" />
  </g>

  <!-- ============ BICYCLE ============ -->
  <g id="bike">
    <!-- far crank + far pedal (behind the frame) -->
    <g opacity="0.85">
      <line x1="600" y1="615" x2="558" y2="574" stroke="#8d98a8" stroke-width="9" stroke-linecap="round" />
      <rect x="536" y="566" width="44" height="12" rx="5" fill="#5c6675" transform="rotate(-8 558 572)" />
    </g>

    <!-- wheels -->
    <g id="wheel-rear" class="wheel">
      <circle cx="370" cy="610" r="110" fill="none" stroke="#22262e" stroke-width="19" />
      <circle cx="370" cy="610" r="97" fill="none" stroke="#b9c2cf" stroke-width="5" opacity="0.9" />
      <g stroke="#c8d1de" stroke-width="2.6" opacity="0.85">
        <line x1="370" y1="513" x2="370" y2="707" />
        <line x1="273" y1="610" x2="467" y2="610" />
        <line x1="302" y1="542" x2="438" y2="678" />
        <line x1="438" y1="542" x2="302" y2="678" />
      </g>
      <circle cx="370" cy="610" r="12" fill="#8d98a8" />
    </g>

    <g id="wheel-front" class="wheel">
      <circle cx="830" cy="610" r="110" fill="none" stroke="#22262e" stroke-width="19" />
      <circle cx="830" cy="610" r="97" fill="none" stroke="#b9c2cf" stroke-width="5" opacity="0.9" />
      <g stroke="#c8d1de" stroke-width="2.6" opacity="0.85">
        <line x1="830" y1="513" x2="830" y2="707" />
        <line x1="733" y1="610" x2="927" y2="610" />
        <line x1="762" y1="542" x2="898" y2="678" />
        <line x1="898" y1="542" x2="762" y2="678" />
      </g>
      <circle cx="830" cy="610" r="12" fill="#8d98a8" />
    </g>

    <!-- frame -->
    <g stroke="url(#frame)" stroke-width="15" stroke-linecap="round" fill="none">
      <line x1="600" y1="615" x2="500" y2="448" />   <!-- seat tube -->
      <line x1="500" y1="448" x2="772" y2="452" />   <!-- top tube -->
      <line x1="600" y1="615" x2="780" y2="470" />   <!-- down tube -->
      <line x1="600" y1="615" x2="370" y2="610" />   <!-- chain stay -->
      <line x1="500" y1="448" x2="370" y2="610" />   <!-- seat stay -->
      <line x1="781" y1="470" x2="790" y2="424" stroke-width="13" /> <!-- head tube -->
      <line x1="788" y1="440" x2="830" y2="610" stroke-width="12" /> <!-- fork -->
    </g>

    <!-- saddle -->
    <path d="M455 440 q 46 -18 92 -2 q 12 5 4 14 q -50 16 -96 4 q -10 -6 0 -16 Z" fill="#2b3138" />
    <path d="M470 437 q 34 -10 68 0" stroke="#454d57" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- handlebar + bell -->
    <g stroke="#9aa6b4" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="790" y1="424" x2="800" y2="392" />
      <path d="M770 392 q 30 -14 56 4" />
    </g>
    <circle cx="828" cy="396" r="9" fill="#e0b04a" stroke="#b98c2f" stroke-width="3" />

    <!-- chain -->
    <path d="M600 588 L370 598 M600 642 L370 622" stroke="#6b7684" stroke-width="4" stroke-dasharray="7 5" fill="none" />
    <!-- chainring + near crank -->
    <g class="crank">
      <circle cx="600" cy="615" r="30" fill="none" stroke="#aab4c2" stroke-width="7" />
      <circle cx="600" cy="615" r="7" fill="#7d8795" />
      <line x1="600" y1="615" x2="642" y2="653" stroke="#8d98a8" stroke-width="10" stroke-linecap="round" />
      <rect x="620" y="648" width="46" height="13" rx="5" fill="#4d5765" transform="rotate(-8 643 654)" />
    </g>
    <!-- seat post -->
    <line x1="500" y1="448" x2="498" y2="436" stroke="#9aa6b4" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- ============ PELICAN ============ -->
  <g class="rider">
    <!-- tail -->
    <path d="M470 372 q -46 6 -58 34 q 34 12 62 -6 Z" fill="#cfd8e4" />

    <!-- body -->
    <path d="M470 356
             q 10 -74 92 -84
             q 86 -10 118 62
             q 20 46 -12 76
             q -34 32 -96 26
             q -76 -8 -100 -40
             q -16 -22 -2 -40 Z"
          fill="url(#bird)" stroke="#aab6c6" stroke-width="3" />

    <!-- neck -->
    <path d="M628 322 q 10 -66 56 -94" stroke="#f2f5f9" stroke-width="46" stroke-linecap="round" fill="none" />
    <path d="M628 322 q 10 -66 56 -94" stroke="#c3cedb" stroke-width="46" stroke-linecap="round" fill="none" opacity="0.25" transform="translate(6 4)" />

    <!-- head -->
    <circle cx="702" cy="226" r="43" fill="#fbfdff" stroke="#b7c2d1" stroke-width="3" />
    <path d="M666 200 q 22 -22 48 -12" stroke="#d8e1ec" stroke-width="8" fill="none" stroke-linecap="round" />

    <!-- beak: upper mandible -->
    <path d="M737 208 q 96 12 152 40 q 10 5 0 12 q -70 6 -152 -8 Z" fill="url(#beak)" stroke="#c76f18" stroke-width="3" />
    <line x1="741" y1="216" x2="880" y2="250" stroke="#ffd899" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <!-- pouch -->
    <path d="M741 234 q 12 68 86 76 q 56 6 60 -54 q -74 -2 -146 -22 Z" fill="url(#pouch)" stroke="#c76f18" stroke-width="3" />
    <path d="M757 256 q 42 44 106 50" stroke="#c1651a" stroke-width="2.5" fill="none" opacity="0.5" />

    <!-- eye -->
    <circle cx="716" cy="212" r="7.5" fill="#1b2230" />
    <circle cx="718" cy="209" r="2.4" fill="#ffffff" />

    <!-- wing, reaching the handlebar -->
    <path d="M556 330
             q 34 -46 96 -30
             q 76 20 128 74
             q 12 12 -4 18
             q -46 10 -96 -6
             q -70 -22 -108 -30
             q -22 -8 -16 -26 Z"
          fill="url(#wing)" stroke="#9dabbb" stroke-width="3" />
    <g stroke="#98a6b6" stroke-width="2.5" fill="none" opacity="0.75">
      <path d="M600 336 q 60 6 118 46" />
      <path d="M586 352 q 58 8 112 50" />
      <path d="M572 368 q 52 12 100 48" />
    </g>
    <!-- wingtip "fingers" on the grip -->
    <path d="M770 392 q 18 -8 30 2 q -12 12 -30 6 Z" fill="#c9d3e0" stroke="#9dabbb" stroke-width="2.5" />

    <!-- legs: far leg first -->
    <g stroke="#e08a2a" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M528 452 q -6 62 -32 116" opacity="0.75" />
    </g>
    <path d="M530 566 q 26 -6 44 6 q -16 12 -44 6 Z" fill="#e08a2a" opacity="0.75" />

    <!-- near leg, onto the near pedal -->
    <path d="M556 458 q 34 60 82 108" stroke="#f0952f" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M628 556 q 30 6 40 24 q -22 12 -44 -2 q -6 -14 4 -22 Z" fill="#f0952f" stroke="#c76f18" stroke-width="3" />
    <g stroke="#d97f24" stroke-width="2.5" fill="none" opacity="0.8">
      <path d="M636 566 l 24 10" />
      <path d="M642 560 l 24 12" />
    </g>
  </g>
</svg>
<figcaption>pelican · bicycle · 9:16-safe nothing, just a test</figcaption>
</figure>
</body>
</html>
