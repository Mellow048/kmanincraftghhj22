<title>Pelican on a Bicycle</title>
<!--
  A pelican riding a bicycle. One HTML file, one inline SVG. No JavaScript, no
  images, no fonts, no libraries, no network. Every motion is an SVG <animate>.

  What is measured here rather than guessed:
    - Gearing is exactly 2:1 (chainring 26, cog 13): the crank turns once per 2.4 s,
      the wheel once per 1.2 s.
    - Nothing slips. One wheel turn (1.2 s) rolls the road 2*pi*100 = 628.32 px, and
      every scrolling layer repeats on that same distance. Clouds and the far sand
      run at half speed (2.4 s a tile) because they are further away.
    - Each leg is solved by two-bone inverse kinematics (thigh 100, shin 100) at 24
      keys per crank turn, so the webbed foot stays on its pedal through the whole
      stroke: hip -> thigh -> knee -> shin -> ankle -> foot, each joint nested in the
      one before it. The ankle flexes 18 degrees a turn so the toes dip on the down
      stroke.
    - The chain is the two true tangent lines between the sprockets plus the wrap arc
      on each one, and it travels at the ring's surface speed, 68.07 px/s, which is
      exactly what the cog and the wheel are already doing.
    - The pedal counter-rotates against the crank, so it stays level.
  Framing: 1200 x 750. Ground line y = 700, horizon y = 505, wheel centres y = 598,
  contact patch y = 698.
-->

  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #0d1119;
    background-image: radial-gradient(120% 90% at 50% 10%, #1c2532 0%, #0d1119 62%, #06080c 100%);
  }
  .frame { width: min(100vw, 160vh); aspect-ratio: 1200 / 750; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
