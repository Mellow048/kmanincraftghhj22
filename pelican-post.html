  @media (max-width: 550px) { body { padding: 7px; } .rail { padding: 9px 2%; } .folio { font-size: 9px; letter-spacing: .08em; } }

  @media print { @page { size: landscape; margin: 8mm; } html, body { background: white; } body { display: block; min-height: 0; padding: 0; } main { width: 100%; } figure::before, .rail { display: none; } }

<script>
/* The still above is complete on its own. This one clock moves the same SVG, even from file://. */
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const sheet = byId('sheet'), phone = matchMedia('screen and (max-width: 700px) and (orientation: portrait)');
  function setFormat() {
    const tall = phone.matches, w = tall ? 720 : 1120, h = tall ? 848 : 704;
    sheet.classList.toggle('upright', tall);
    sheet.setAttribute('viewBox', `0 0 ${w} ${h}`);
    sheet.setAttribute('width', w); sheet.setAttribute('height', h);
  }
  setFormat(); phone.addEventListener('change', setFormat);
  const turn = 2 * Math.PI, deg = 180 / Math.PI;
  const period = 2.8, gear = 23.4 / 13, tyre = 89, arm = 32;
  const cx = 640, cy = 477, start = -35 / deg;
  const transform = (el, value) => el.setAttribute('transform', value);
  const n = value => value.toFixed(3);
  const move = (node, x, y = 0) => transform(node, `translate(${n(x)} ${n(y)})`);
  const rotate = (node, a) => transform(node, `rotate(${n(a)})`);
  const pose = (node, x, y, a) => transform(node, `translate(${n(x)} ${n(y)}) rotate(${n(a)})`);
  const legs = [['near', 573, 319, 0], ['far', 598, 321, Math.PI]].map(([side, x, y, offset]) => ({
    x, y, offset, upper: byId(side + '-upper'), lower: byId(side + '-lower'), foot: byId(side + '-foot'), crank: byId(side + '-arm')
  }));
  const wheels = [byId('back-spin'), byId('front-spin')], ring = byId('ring-spin'), links = byId('chain-links');
  const ripples = byId('ripples'), joints = byId('wall-joints'), road = byId('road-marks');
  const scarf = byId('scarf-tail'), eye = byId('eye'), letters = byId('letters');
  function draw(time) {
    const travel = time * turn / period, angle = start + travel, spin = travel * gear, distance = spin * tyre;
    for (const w of wheels) rotate(w, spin * deg % 360);
    rotate(ring, angle * deg % 360);
    links.setAttribute('stroke-dashoffset', n(-(travel * 23.4 % 6.5)));
    move(road, -(distance % 210)); move(joints, -(distance * .68 % 160)); move(ripples, -(distance * .045 % 222));
    for (const leg of legs) {
      const a = angle + leg.offset, px = cx + arm * Math.cos(a), py = cy + arm * Math.sin(a);
      // Intersect two circles. Choose the rearward hock; the ankle is always inside the webbed foot.
      const dx = px - 14 - leg.x, dy = py - 11 - leg.y, d = Math.hypot(dx, dy), thigh = 87, shin = 110;
      const along = (thigh * thigh - shin * shin + d * d) / (2 * d), across = Math.sqrt(Math.max(0, thigh * thigh - along * along));
      const kx = leg.x + (dx * along - dy * across) / d, ky = leg.y + (dy * along + dx * across) / d;
      pose(leg.upper, leg.x, leg.y, Math.atan2(ky - leg.y, kx - leg.x) * deg);
      pose(leg.lower, kx, ky, Math.atan2(py - 11 - ky, px - 14 - kx) * deg);
      pose(leg.crank, cx, cy, a * deg % 360); move(leg.foot, px, py);
    }
    transform(scarf, `rotate(${n(2.6 * Math.sin(travel * 2) + .9 * Math.sin(travel * 3))} 605 195)`);
    transform(letters, `rotate(${n(.75 * Math.sin(travel * 2))} 414 324)`);
    const blink = Math.max(0, 1 - Math.abs(time % 5.3 - 4.55) / .115);
    transform(eye, `scale(1 ${n(1 - .94 * blink)})`);
  }
  const button = byId('ride-control'), label = byId('control-text'), reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reduced.matches, elapsed = 0, last = null, request = null;
  function tick(now) {
    if (last !== null) elapsed += (now - last) / 1000;
    last = now; draw(elapsed); request = requestAnimationFrame(tick);
  }
  function sync() {
    if (request !== null) cancelAnimationFrame(request);
    request = null; last = null;
    button.dataset.playing = String(playing); label.textContent = playing ? 'Pause ride' : 'Play ride';
    if (playing && !document.hidden) request = requestAnimationFrame(tick);
  }
  button.hidden = false;
  button.addEventListener('click', () => { playing = !playing; sync(); });
  reduced.addEventListener('change', event => { playing = !event.matches; sync(); });
  document.addEventListener('visibilitychange', sync);
  sync();
})();
</script>
