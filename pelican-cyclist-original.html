<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bicycle — Original SVG</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1c2e;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: min(1100px, 100%);
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .card svg { display: block; width: 100%; height: auto; }
  .caption {
    padding: 14px 20px 18px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  .caption h1 { font-size: 20px; margin: 0; color: #123; }
  .caption p { margin: 0; color: #5a6b7d; font-size: 13px; }

  /* ---- animation (pure CSS, still SVG+HTML only) ---- */
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.1s linear infinite;
  }
  .crank-spin {
    transform-origin: 580px 590px;
    animation: spin 1.1s linear infinite;
  }
  .bob { animation: bob 1.1s ease-in-out infinite; }
  .head-bob { animation: headbob 1.1s ease-in-out infinite; transform-origin: 700px 260px; }
  .scarf { animation: scarf 1.1s ease-in-out infinite; transform-origin: 690px 285px; }
  .pouch { animation: pouch 1.1s ease-in-out infinite; transform-origin: 800px 260px; }
  .cloud-a { animation: drift 26s linear infinite; }
  .cloud-b { animation: drift 38s linear infinite; }
  .cloud-c { animation: drift 48s linear infinite; }
  .road-dash { animation: roadmove 0.55s linear infinite; }
  .tuft { animation: tuftmove 2.2s linear infinite; }
  .tuft2 { animation: tuftmove 2.2s linear infinite; animation-delay: -1.1s; }
  .leg-a { animation: legA 1.1s ease-in-out infinite; transform-origin: 585px 455px; }
  .leg-b { animation: legB 1.1s ease-in-out infinite; transform-origin: 575px 455px; }
  .fish { animation: fishwig 1.1s ease-in-out infinite; transform-origin: 820px 430px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes headbob { 0%,100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-2deg) translateY(-3px); } }
  @keyframes scarf { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(7deg); } }
  @keyframes pouch { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
  @keyframes roadmove { from { transform: translateX(0); } to { transform: translateX(-90px); } }
  @keyframes tuftmove { from { transform: translateX(0); } to { transform: translateX(-1250px); } }
  @keyframes legA { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-8deg); } }
  @keyframes legB { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(6deg); } }
  @keyframes fishwig { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="card">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">A pelican riding a bicycle</title>
  <desc id="d">Original hand-drawn SVG illustration: a white pelican with a long orange beak and pouch pedals a teal bicycle along a seaside road, with a basket of fish on the handlebars.</desc>

  <!-- DISTANT HILLS + SEA -->

  <!-- GRASS VERGE + ROAD -->

    <circle cx="2200" cy="590" r="6" fill="#ff6b9d"/><circle cx="2200" cy="590" r="2.5" fill="#ffe066"/>

  <!-- GROUND SHADOW -->
  <ellipse cx="600" cy="682" rx="330" ry="22" fill="#000000" opacity="0.18"/>

  <!-- ================= BICYCLE ================= -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- rear wheel -->
    <g>

      <circle cx="430" cy="575" r="100" fill="none" stroke="#4a4f57" stroke-width="6" opacity="0.6"/>

        <line x1="770" y1="575" x2="770" y2="657"/>
