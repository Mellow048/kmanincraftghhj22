<title>Pelican on a Bicycle — Sunset Boardwalk</title>
<!--
  A pelican riding a bicycle along a seaside boardwalk at golden hour.
  One HTML file, one inline SVG. No JavaScript, no images, no fonts, no
  libraries, no network. Every movement is a native SVG <animate> or
  <animateTransform>; the CSS below only lets the drawing fill the window.

  What actually moves
    * Wheels 1.44 s a turn, cranks 2.88 s (2:1), legs solved every frame.
    * The ground scrolls at 479.97 px/s and the deck planks are 240 px
      apart, so one passes every 0.5 s. Nothing slides.
    * Boardwalk, railing, dune grass, clouds, gulls, the swell, the sail-
      boat and the scarf all run on their own loops, all tiling seamlessly.

  What is true in the drawing
    * Wheel radius 110 => one turn covers 2*pi*110 = 691.15 px.
    * Each leg is a two-bar hip -> knee -> ankle chain (thigh 116,
      shin 128) solved 48 times per crank turn, so a webbed foot lands on
      the pedal at every angle of the stroke.
    * The pedals counter-rotate against the cranks, so they stay level.
    * The pelican's beak and pouch are drawn as separate parts: the bill
      runs the full length, the pouch hangs behind it and tapers to the
      tip.
-->
<style>
  html, body { height: 100%; margin: 0; background: #141c2b; }
  body { display: grid; place-items: center; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
