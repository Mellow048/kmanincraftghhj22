<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Coast — a pelican riding a bicycle</title>
<!--
  Sunset Coast — an original pelican-on-a-bicycle, drawn from scratch for this test.
  One self-contained file: HTML + one inline SVG. No JavaScript, no images,
  no libraries, no fonts, no network. Every moving part is SVG SMIL (<animate> /
  <animateTransform>); the only CSS sizes the picture to the window.

  The mechanics are kept honest:
    · Wheels: r105, so one turn = 2·π·105 ≈ 660 units of road.
      Wheels turn once per 1.6s → the road dashes scroll 660 units in 1.6s.
    · Gearing 2:1 (chainring r26, rear cog r13): the cranks turn once per 3.2s,
      exactly half wheel speed.
    · Each webbed foot is keyframed round the pedal circle (r38 about the bottom
      bracket), 8 frames per crank turn, and the knees were placed with two-bone
      IK (thigh 92, shin 88) so the feet stay on the pedals instead of sliding.
    · Pedals counter-rotate inside the crank group so they stay level.
    · Near leg starts at top-dead-centre; far leg is half a turn behind it.
-->
<style>
  html, body { height: 100%; margin: 0; background: #20303e; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">A pelican riding a bicycle along the coast at sunset</title>
  <desc id="dsc">A white pelican with a long orange beak and a sagging pouch, wearing a coral scarf, pedals a teal bicycle. Its webbed feet turn the pedals, a fish and a baguette ride in the front basket, and the coast road scrolls beneath the wheels.</desc>

  <defs>

      <stop offset="0" stop-color="#6ec6e8"/>
      <stop offset=".55" stop-color="#bfe6ef"/>
      <stop offset=".82" stop-color="#ffe3ae"/>
      <stop offset="1" stop-color="#ffc98f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa9b8"/>
      <stop offset="1" stop-color="#1f7d95"/>
    </linearGradient>
    <radialGradient id="sunCore" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".7" stop-color="#ffd968"/>
      <stop offset="1" stop-color="#ffb347"/>
    </radialGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa04d"/>
      <stop offset="1" stop-color="#f07f2e"/>
    </linearGradient>
  </defs>

  <!-- sun with slow-turning rays -->

      <line x1="972" y1="62" x2="972" y2="34"/>
      <line x1="972" y1="234" x2="972" y2="262"/>
      <line x1="886" y1="148" x2="858" y2="148"/>
      <line x1="1058" y1="148" x2="1086" y2="148"/>
      <line x1="911" y1="87" x2="891" y2="67"/>
      <line x1="1033" y1="209" x2="1053" y2="229"/>
      <line x1="1033" y1="87" x2="1053" y2="67"/>
      <line x1="911" y1="209" x2="891" y2="229"/>
    </g>
    <circle cx="972" cy="148" r="52" fill="url(#sunCore)"/>
    <circle cx="972" cy="148" r="66" fill="none" stroke="#ffe9a8" stroke-width="3" opacity=".5"/>

      <ellipse cx="82" cy="84" rx="36" ry="16"/>
    </g>
    <g opacity=".65">

      <ellipse cx="452" cy="47" rx="32" ry="17"/>
    </g>
    <g opacity=".8">

      <ellipse cx="700" cy="118" rx="54" ry="17"/>
      <ellipse cx="736" cy="105" rx="36" ry="19"/>
    </g>
  </g>

  <!-- distant birds, wings flapping -->
  <g fill="none" stroke="#3d5a6b" stroke-width="3.4" stroke-linecap="round">
    <path d="M300,150 q9,-9 18,0 q9,-9 18,0">
      <animate attributeName="d" values="M300,150 q9,-9 18,0 q9,-9 18,0; M300,154 q9,5 18,0 q9,5 18,0; M300,150 q9,-9 18,0 q9,-9 18,0" dur="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 46 -14" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M382,116 q7,-7 14,0 q7,-7 14,0">
      <animate attributeName="d" values="M382,116 q7,-7 14,0 q7,-7 14,0; M382,119 q7,4 14,0 q7,4 14,0; M382,116 q7,-7 14,0 q7,-7 14,0" dur="0.8s" begin="-0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 52 -10" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- headland hills -->
  <path d="M0,428 L150,356 L300,408 L470,338 L640,414 L820,352 L1000,420 L1200,366 L1200,470 L0,470 Z" fill="#7d90b8" opacity=".55"/>
  <path d="M0,452 L190,392 L390,442 L590,382 L800,446 L1010,394 L1200,448 L1200,490 L0,490 Z" fill="#5d7ba6" opacity=".7"/>

  <!-- ======================= SEA & SHORE ======================= -->
  <rect x="0" y="452" width="1200" height="92" fill="url(#sea)"/>
  <g stroke="#dff6f7" stroke-width="3" stroke-linecap="round" opacity=".65" fill="none">
    <path d="M60,486 q18,-8 36,0 t36,0">
      <animateTransform attributeName="transform" type="translate" values="0 0; -72 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M420,508 q18,-8 36,0 t36,0 t36,0">
      <animateTransform attributeName="transform" type="translate" values="0 0; -72 0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M830,482 q18,-8 36,0 t36,0">

    </path>
    <path d="M1020,514 q18,-8 36,0 t36,0">

    </path>
  </g>
  <!-- sun glitter on the water -->
  <g stroke="#ffe9a8" stroke-width="3.5" stroke-linecap="round" opacity=".8">

    <line x1="936" y1="512" x2="1010" y2="512"><animate attributeName="opacity" values=".8;.3;.8" dur="2.1s" repeatCount="indefinite"/></line>
  </g>

  <!-- ======================= ROAD ======================= -->
  <rect x="0" y="540" width="1200" height="160" fill="#8a97a3"/>
  <rect x="0" y="540" width="1200" height="14" fill="#c9b18a"/>
  <rect x="0" y="612" width="1200" height="88" fill="#6d7a86"/>
  <!-- centre dashes: 660 units per 1.6s, matching the wheels -->

    <rect x="40" y="646" width="72" height="9" rx="4"/>
    <rect x="205" y="646" width="72" height="9" rx="4"/>
    <rect x="370" y="646" width="72" height="9" rx="4"/>
    <rect x="535" y="646" width="72" height="9" rx="4"/>
    <rect x="700" y="646" width="72" height="9" rx="4"/>
    <rect x="865" y="646" width="72" height="9" rx="4"/>
    <rect x="1030" y="646" width="72" height="9" rx="4"/>
    <rect x="1195" y="646" width="72" height="9" rx="4"/>
    <rect x="1360" y="646" width="72" height="9" rx="4"/>
    <rect x="1525" y="646" width="72" height="9" rx="4"/>
    <rect x="1690" y="646" width="72" height="9" rx="4"/>
    <rect x="1855" y="646" width="72" height="9" rx="4"/>
  </g>
  <!-- passing verge tufts -->
  <g stroke="#4e7d4a" stroke-width="4" stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="translate" values="1260 0; -80 0" dur="3.3s" repeatCount="indefinite"/>
      <path d="M0,560 q-3,-18 -10,-24 M0,560 q0,-20 3,-28 M0,560 q5,-16 13,-22"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1260 0; -80 0" dur="3.3s" begin="-1.6s" repeatCount="indefinite"/>
      <path d="M0,566 q-3,-15 -9,-20 M0,566 q1,-17 4,-23 M0,566 q6,-13 12,-18"/>
    </g>
  </g>
  <!-- a signpost whips past -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="1290 0; -260 0" dur="3.85s" repeatCount="indefinite"/>
    <rect x="0" y="452" width="10" height="108" fill="#7a5230"/>
    <path d="M-6,458 h104 l16,13 -16,13 h-104 z" fill="#a4713e" stroke="#7a5230" stroke-width="3"/>
    <text x="8" y="479" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#fff3d6">COAST →</text>
  </g>

  <!-- soft shadow under the bike -->
  <ellipse cx="585" cy="622" rx="330" ry="13" fill="#000000" opacity=".18"/>

  <!-- ======================= BICYCLE ======================= -->
  <!-- far crank + far leg live behind the frame; drawn with the pelican below -->

  <!-- rear wheel -->
  <g>
    <circle cx="365" cy="512" r="105" fill="none" stroke="#26333b" stroke-width="15"/>
    <circle cx="365" cy="512" r="88" fill="none" stroke="#cfd9de" stroke-width="6"/>
    <g stroke="#9fb2ba" stroke-width="3.4">
      <animateTransform attributeName="transform" type="rotate" from="0 365 512" to="360 365 512" dur="1.6s" repeatCount="indefinite"/>
      <path d="M365,512 L365,427 M365,512 L438.5,470.5 M365,512 L450,512 M365,512 L438.5,553.5 M365,512 L365,597 M365,512 L291.5,553.5 M365,512 L280,512 M365,512 L291.5,470.5"/>
      <path d="M365,512 L402,447.5 M365,512 L450,549 M365,512 L328,576.5 M365,512 L280,475" opacity=".75"/>
      <circle cx="365" cy="440" r="7" fill="#ffcf4d" stroke="none"/>
    </g>
    <circle cx="365" cy="512" r="11" fill="#54656e"/>
    <circle cx="365" cy="512" r="5" fill="#26333b"/>
  </g>

  <!-- front wheel -->
  <g>
    <circle cx="805" cy="512" r="105" fill="none" stroke="#26333b" stroke-width="15"/>
    <circle cx="805" cy="512" r="88" fill="none" stroke="#cfd9de" stroke-width="6"/>
    <g stroke="#9fb2ba" stroke-width="3.4">
      <animateTransform attributeName="transform" type="rotate" from="0 805 512" to="360 805 512" dur="1.6s" repeatCount="indefinite"/>
      <path d="M805,512 L805,427 M805,512 L878.5,470.5 M805,512 L890,512 M805,512 L878.5,553.5 M805,512 L805,597 M805,512 L731.5,553.5 M805,512 L720,512 M805,512 L731.5,470.5"/>
      <path d="M805,512 L842,447.5 M805,512 L890,549 M805,512 L768,576.5 M805,512 L720,475" opacity=".75"/>
      <circle cx="805" cy="440" r="7" fill="#ffcf4d" stroke="none"/>
    </g>
    <circle cx="805" cy="512" r="11" fill="#54656e"/>
    <circle cx="805" cy="512" r="5" fill="#26333b"/>
  </g>

  <!-- mudguards -->
  <path d="M272,470 A104,104 0 0 1 452,452" fill="none" stroke="#7c4dff" stroke-width="9" stroke-linecap="round"/>
  <path d="M712,452 A104,104 0 0 1 898,470" fill="none" stroke="#7c4dff" stroke-width="9" stroke-linecap="round"/>

  <!-- chain (behind the frame tubes) -->
  <path d="M365,499 L575,479 M365,525 L575,531" stroke="#3b474f" stroke-width="5.5" stroke-dasharray="8 5" fill="none">
    <animate attributeName="stroke-dashoffset" values="0; -52" dur="0.42s" repeatCount="indefinite"/>
  </path>

  <!-- frame: teal diamond -->
  <g stroke="#0e9594" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="505" y1="398" x2="752" y2="408"/>   <!-- top tube -->
    <line x1="575" y1="505" x2="762" y2="424"/>   <!-- down tube -->
    <line x1="505" y1="398" x2="575" y2="505"/>   <!-- seat tube -->
    <line x1="505" y1="398" x2="365" y2="512"/>   <!-- seat stay -->
    <line x1="575" y1="505" x2="365" y2="512"/>   <!-- chain stay -->
    <line x1="752" y1="408" x2="770" y2="448"/>   <!-- head tube -->
    <line x1="770" y1="448" x2="805" y2="512"/>   <!-- fork -->
  </g>
  <line x1="752" y1="408" x2="742" y2="372" stroke="#54656e" stroke-width="8" stroke-linecap="round"/>
  <!-- handlebar -->
  <path d="M742,372 q-16,-12 -30,-4 M742,372 q4,-14 20,-16" fill="none" stroke="#26333b" stroke-width="7.5" stroke-linecap="round"/>
  <rect x="704" y="360" width="20" height="9" rx="4.5" fill="#26333b" transform="rotate(18 714 364)"/>
  <!-- lamp + bell -->
  <circle cx="778" cy="430" r="10" fill="#ffd968" stroke="#b8892e" stroke-width="3"/>
  <circle cx="742" cy="356" r="7" fill="#ffcf4d" stroke="#b8892e" stroke-width="2.5"/>
  <!-- seat post + saddle -->
  <line x1="505" y1="398" x2="500" y2="382" stroke="#54656e" stroke-width="7" stroke-linecap="round"/>
  <path d="M462,384 q38,-13 76,-2 q4,8 -6,10 q-38,5 -66,-1 q-8,-3 -4,-7z" fill="#26333b"/>
  <!-- rear reflector -->
  <rect x="352" y="470" width="9" height="15" rx="3" fill="#e5484d" transform="rotate(24 356 477)"/>

  <!-- rear cog + chainring -->
  <circle cx="365" cy="512" r="13" fill="none" stroke="#3b474f" stroke-width="5"/>
  <circle cx="575" cy="505" r="26" fill="none" stroke="#3b474f" stroke-width="6"/>
  <circle cx="575" cy="505" r="5" fill="#3b474f"/>

  <!-- cranks + pedals (pedals counter-rotate to stay level) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 575 505" to="360 575 505" dur="3.2s" repeatCount="indefinite"/>
    <line x1="575" y1="505" x2="575" y2="467" stroke="#26333b" stroke-width="7" stroke-linecap="round"/>
    <line x1="575" y1="505" x2="575" y2="543" stroke="#26333b" stroke-width="7" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 575 467" to="-360 575 467" dur="3.2s" repeatCount="indefinite"/>
      <rect x="559" y="461" width="32" height="9" rx="4" fill="#26333b"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 575 543" to="-360 575 543" dur="3.2s" repeatCount="indefinite"/>
      <rect x="559" y="537" width="32" height="9" rx="4" fill="#26333b"/>
    </g>
  </g>

  <!-- front basket with the shopping -->
  <g>
    <!-- fish, tail still flicking -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 838 372; -7 838 372; 0 838 372" dur="0.7s" repeatCount="indefinite"/>
      <path d="M806,388 q26,-24 52,-8 q-8,14 -26,16 q-18,1 -26,-8z" fill="#b9cdd4"/>
      <path d="M806,388 l-17,-13 q-2,13 3,24 z" fill="#8fa9b3"/>
      <circle cx="846" cy="382" r="3" fill="#26333b"/>
    </g>
    <!-- baguette -->
    <g transform="rotate(24 866 380)">
      <rect x="852" y="338" width="17" height="66" rx="8.5" fill="#e2aa5e"/>
      <path d="M856,356 l9,5 M855,374 l9,5 M856,392 l9,5" stroke="#c07f35" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- basket -->
    <path d="M812,398 h96 l-11,54 h-72 z" fill="#b7793b" stroke="#8a5a28" stroke-width="3"/>
    <path d="M818,414 h84 M822,430 h76 M826,444 h68" stroke="#8a5a28" stroke-width="3" fill="none"/>
    <path d="M830,398 l5,54 M855,398 l2,54 M880,398 l-3,54" stroke="#8a5a28" stroke-width="3" fill="none"/>
    <path d="M812,398 q-8,-20 -24,-30 M908,398 q10,-18 4,-34" stroke="#54656e" stroke-width="5" fill="none"/>
    <!-- tulip -->
    <path d="M884,398 q-2,-16 -10,-24" stroke="#4e7d4a" stroke-width="3.5" fill="none"/>
    <path d="M866,368 q8,-11 16,0 q-8,7 -16,0z" fill="#e5484d"/>
  </g>

  <!-- ======================= PELICAN ======================= -->
  <!-- far leg: half a turn behind, darker, behind the body -->
  <g stroke="#d96f27" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="15" d="M524,356 L544,447 L575,543">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
        values="M524,356 L544,447 L575,543;
                M524,356 L532,450 L548,532;
                M524,356 L563,438 L537,505;
                M524,356 L586,422 L548,478;
                M524,356 L602,401 L575,467;
                M524,356 L604,399 L602,478;
                M524,356 L587,421 L613,505;
                M524,356 L557,441 L602,532;
                M524,356 L544,447 L575,543"/>
    </path>
    <path stroke="none" fill="#d96f27" d="M575,543 h26 l-10,8 h-16 z">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
        values="M575,543 h26 l-10,8 h-16 z;
                M548,532 h26 l-10,8 h-16 z;
                M537,505 h26 l-10,8 h-16 z;
                M548,478 h26 l-10,8 h-16 z;
                M575,467 h26 l-10,8 h-16 z;
                M602,478 h26 l-10,8 h-16 z;
                M613,505 h26 l-10,8 h-16 z;
                M602,532 h26 l-10,8 h-16 z;
                M575,543 h26 l-10,8 h-16 z"/>
    </path>
  </g>

  <!-- everything above the hips bobs twice per crank turn -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0; 0 -6; 0 0" dur="3.2s" repeatCount="indefinite"/>

    <!-- tail feathers -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 410 268; 3 410 268; 0 410 268; -2 410 268; 0 410 268" dur="1.6s" repeatCount="indefinite"/>
      <path d="M416,258 L336,224 q-8,20 8,30 L412,282 Z" fill="#ffffff" stroke="#c3d2da" stroke-width="2.5"/>
      <path d="M412,276 L330,262 q-4,21 14,26 L410,296 Z" fill="#eef5f8" stroke="#c3d2da" stroke-width="2.5"/>
      <path d="M416,292 L344,300 q2,20 20,20 L414,308 Z" fill="#ffffff" stroke="#c3d2da" stroke-width="2.5"/>
      <path d="M336,224 L356,240 L344,254 L330,262 L352,272 L348,300 L368,306 L362,320 L340,300 q-14,-16 -4,-26 L324,246 q0,-16 12,-22z" fill="#5d7ba6" opacity=".85"/>
    </g>

    <!-- body: one big egg, breast forward -->
    <ellipse cx="528" cy="302" rx="148" ry="93" fill="#ffffff" stroke="#c3d2da" stroke-width="3" transform="rotate(-13 528 302)"/>
    <path d="M420,344 q60,52 150,44 q-70,22 -122,-6 q-28,-16 -28,-38z" fill="#dcebf2" opacity=".8"/>

    <!-- folded wing on the body, breathing a little -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 560 262; 2.2 560 262; 0 560 262" dur="1.6s" repeatCount="indefinite"/>

    <path d="M596,282 C640,252 628,208 672,178" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
    <path d="M606,286 C644,256 634,214 674,186" fill="none" stroke="#dcebf2" stroke-width="9" stroke-linecap="round" opacity=".8"/>
