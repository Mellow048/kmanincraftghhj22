<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A pelican riding a bicycle</title>
<!--
  A pelican riding a bicycle — one inline SVG, self-contained.

  No JavaScript. No images. No fonts. No libraries. No network requests.
  Every movement is a native SVG <animate> / <animateTransform>. The only CSS
  is four rules that let the drawing fill the window.

  The drawing is built to fixed numbers, not eyeballed:

    Wheelbase      490 px  (rear axle 455,705 → front axle 945,705)
    Wheels         172 px radius, 24 spokes, one turn every 1.6 s
    Drivetrain     40-tooth ring, 22-tooth cog: 3 wheel turns for every
                   2 crank turns, so the cranks turn once every 2.4 s
    Cranks         60 px, pedals held level by a −360° counter-rotation
    Legs           two-bone IK, baked to 8 keyframes per revolution, so each
                   webbed foot stays planted on its pedal through the stroke
    Chain          dashed stroke with an animated offset, running the way
                   the wheels turn
    Sun            low ahead at (1175, 470): the key comes from the right,
                   the sky fills from above, the boards bounce warm light up
    Horizon        560 · sea 560–800 · deck 800 · tyres meet the boards at 877

  The animation is quiet on purpose: a bob on the rider once per pedal stroke,
  a scarf in the slipstream, a fish that will not settle, two gulls, dust in
  the light, and a lighthouse that keeps its own time.
-->
<style>
  html, body { height: 100%; margin: 0; background: #08202f; overflow: hidden; }
  body { display: grid; place-items: center; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="A white pelican with a blue scarf rides a red bicycle along a wooden pier at sunset, a basket of fish on the handlebars.">

  <defs>
    <!-- sky: deep evening blue overhead, apricot at the waterline -->
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="580">
      <stop offset="0"   stop-color="#143f68"/>
      <stop offset=".3"  stop-color="#356f92"/>
      <stop offset=".58" stop-color="#79a9ad"/>
      <stop offset=".83" stop-color="#dcc59c"/>
      <stop offset="1"   stop-color="#ffd79c"/>
    </linearGradient>

    <!-- sea: lit at the horizon, deep under the pier -->
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="800">
      <stop offset="0"   stop-color="#a9c6b4"/>
      <stop offset=".12" stop-color="#6fa196"/>
      <stop offset=".45" stop-color="#356f7c"/>
      <stop offset="1"   stop-color="#173f52"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0"   stop-color="#fff8d6" stop-opacity=".95"/>
      <stop offset=".24" stop-color="#ffdc93" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffbb6d" stop-opacity=".2"/>
      <stop offset="1"   stop-color="#ffa85c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisc">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset=".7" stop-color="#ffeec0"/>
      <stop offset="1" stop-color="#ffdf9e"/>
    </radialGradient>
    <linearGradient id="sunPath" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="800">
      <stop offset="0"   stop-color="#ffe4ab" stop-opacity=".8"/>
      <stop offset=".5"  stop-color="#ffcb86" stop-opacity=".35"/>
      <stop offset="1"   stop-color="#ffb877" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizonHaze" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="0" y2="620">
      <stop offset="0" stop-color="#ffdfae" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffe8c3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffdfae" stop-opacity="0"/>
    </linearGradient>

    <!-- deck: warm boards, darker toward the near edge -->
    <linearGradient id="deck" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="1000">
      <stop offset="0"   stop-color="#a27049"/>
      <stop offset=".3"  stop-color="#8a5b3b"/>
      <stop offset=".7"  stop-color="#6b4229"/>
      <stop offset="1"   stop-color="#42281b"/>
    </linearGradient>
    <linearGradient id="deckLight" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1400" y2="0">
      <stop offset="0"   stop-color="#1d0f08" stop-opacity=".5"/>
      <stop offset=".5"  stop-color="#1d0f08" stop-opacity=".1"/>
      <stop offset=".82" stop-color="#ffcf92" stop-opacity=".12"/>
      <stop offset="1"   stop-color="#ffcf92" stop-opacity=".3"/>
    </linearGradient>

    <radialGradient id="castShadow">
      <stop offset="0"   stop-color="#1b0c06" stop-opacity=".66"/>
      <stop offset=".5"  stop-color="#1b0c06" stop-opacity=".36"/>
      <stop offset="1"   stop-color="#1b0c06" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contact">
      <stop offset="0" stop-color="#120803" stop-opacity=".85"/>
      <stop offset="1" stop-color="#120803" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette">
      <stop offset=".52" stop-color="#04121c" stop-opacity="0"/>
      <stop offset="1"   stop-color="#04121c" stop-opacity=".5"/>
    </radialGradient>

    <!-- the pelican: cool sky above, warm sunset from the right,
         warm bounce off the boards from below -->
    <linearGradient id="plumage" gradientUnits="userSpaceOnUse" x1="540" y1="330" x2="820" y2="580">
      <stop offset="0"   stop-color="#fffdf4"/>
      <stop offset=".45" stop-color="#f4efe0"/>
      <stop offset=".75" stop-color="#dedfcf"/>
      <stop offset="1"   stop-color="#bcc7c6"/>
    </linearGradient>
    <linearGradient id="plumageWarm" gradientUnits="userSpaceOnUse" x1="620" y1="300" x2="900" y2="560">
      <stop offset="0"   stop-color="#fff8e6"/>
      <stop offset=".5"  stop-color="#f7e8cb"/>
      <stop offset="1"   stop-color="#e6cba8"/>
    </linearGradient>
    <linearGradient id="billTop" gradientUnits="userSpaceOnUse" x1="890" y1="280" x2="1110" y2="340">
      <stop offset="0"   stop-color="#ffd479"/>
      <stop offset=".5"  stop-color="#f8b048"/>
      <stop offset="1"   stop-color="#de8f2c"/>
    </linearGradient>
    <linearGradient id="pouch" gradientUnits="userSpaceOnUse" x1="900" y1="320" x2="1090" y2="400">
      <stop offset="0"   stop-color="#f9a25a"/>
      <stop offset=".45" stop-color="#ec7f3e"/>
      <stop offset="1"   stop-color="#c05a2c"/>
    </linearGradient>
    <linearGradient id="primary" gradientUnits="userSpaceOnUse" x1="890" y1="0" x2="620" y2="0">
      <stop offset="0"   stop-color="#fbf4e2"/>
      <stop offset=".3"  stop-color="#f0e6cd"/>
      <stop offset=".58" stop-color="#cfc6ae"/>
      <stop offset=".74" stop-color="#5f646d"/>
      <stop offset="1"   stop-color="#33373f"/>
    </linearGradient>
    <linearGradient id="wingTone" gradientUnits="userSpaceOnUse" x1="700" y1="380" x2="880" y2="540">
      <stop offset="0"   stop-color="#fdf6e6"/>
      <stop offset=".55" stop-color="#f2e6cd"/>
      <stop offset="1"   stop-color="#e0cfae"/>
    </linearGradient>
    <linearGradient id="legSkin" gradientUnits="userSpaceOnUse" x1="700" y1="540" x2="740" y2="800">
      <stop offset="0" stop-color="#eda052"/>
      <stop offset="1" stop-color="#b96c2c"/>
    </linearGradient>
    <linearGradient id="framePaint" gradientUnits="userSpaceOnUse" x1="700" y1="560" x2="700" y2="760">
      <stop offset="0" stop-color="#e2593f"/>
      <stop offset=".5" stop-color="#cf4a34"/>
      <stop offset="1" stop-color="#a5341f"/>
    </linearGradient>
    <linearGradient id="scarf" gradientUnits="userSpaceOnUse" x1="620" y1="270" x2="810" y2="390">
      <stop offset="0" stop-color="#2a5c95"/>
      <stop offset=".45" stop-color="#4480c4"/>
      <stop offset="1" stop-color="#7fb0e4"/>
    </linearGradient>
  </defs>

  <!-- ============================ SKY ============================ -->
  <rect x="0" y="0" width="1400" height="580" fill="url(#sky)"/>
  <circle cx="1175" cy="470" r="330" fill="url(#sunGlow)"/>

  <!-- thin clouds, lit from below because the sun is beneath them -->

    <path d="M110 240 C 210 222, 330 224, 412 240" stroke="#ffd9a6" stroke-width="11" opacity=".16"/>
    <path d="M150 252 C 240 240, 336 242, 400 252" stroke="#ffe6bd" stroke-width="6" opacity=".2"/>
    <path d="M470 168 C 560 150, 664 152, 720 168" stroke="#f7cfa0" stroke-width="9" opacity=".15"/>
    <path d="M890 262 C 976 248, 1064 250, 1118 262" stroke="#ffdfb2" stroke-width="7" opacity=".15"/>
    <path d="M300 352 C 380 342, 464 344, 512 352" stroke="#ffe3ba" stroke-width="5" opacity=".1"/>
    <path d="M1010 148 C 1080 138, 1152 140, 1194 150" stroke="#f7cfa0" stroke-width="6" opacity=".12"/>
    <path d="M620 300 C 690 292, 758 294, 800 302" stroke="#ffe3ba" stroke-width="4" opacity=".09"/>
  </g>
  <!-- gulls, keeping their own slow time -->
  <g fill="none" stroke="#2c4a5c" stroke-width="4" stroke-linecap="round" opacity=".6">

        values="0 0; -70 -16; -150 6; -70 -16; 0 0" dur="34s" repeatCount="indefinite"/>
      <path d="M836 246 q 14 -12 28 0 q 14 -12 28 0"/>
    </g>
    <g opacity=".8">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 50 -10; 110 4; 50 -10; 0 0" dur="27s" repeatCount="indefinite"/>
      <path d="M1000 300 q 10 -9 20 0 q 10 -9 20 0"/>
    </g>
  </g>

  <!-- ============================ SEA ============================ -->
  <rect x="0" y="560" width="1400" height="240" fill="url(#sea)"/>
  <rect x="0" y="516" width="1400" height="104" fill="url(#horizonHaze)"/>

  <!-- distant headland with its lighthouse -->

  <g>

    <path d="M743 542 L743 510 L726 538 Z" fill="#e5d3b4" opacity=".75"/>
  </g>

  <!-- the sun's path, broken by the chop -->
  <ellipse cx="1150" cy="566" rx="150" ry="26" fill="url(#sunPath)" opacity=".75"/>
  <g stroke="#ffe0a4" stroke-linecap="round">
    <line x1="1112" y1="578" x2="1196" y2="578" stroke-width="4" opacity=".9">

    </line>
    <line x1="1120" y1="622" x2="1192" y2="622" stroke-width="4" opacity=".6">
      <animate attributeName="opacity" values=".7;.2;.7" dur="3.7s" repeatCount="indefinite"/>
    </line>
    <line x1="1088" y1="654" x2="1224" y2="654" stroke-width="5" opacity=".45"/>
    <line x1="1110" y1="694" x2="1200" y2="694" stroke-width="5" opacity=".3"/>
    <line x1="1132" y1="738" x2="1178" y2="738" stroke-width="4" opacity=".18"/>
  </g>
  <g fill="none" stroke="#a8cdc6" stroke-linecap="round" opacity=".26">
    <path d="M150 618 q 34 -7 68 0" stroke-width="3"/>
    <path d="M330 664 q 44 -8 88 0" stroke-width="3"/>
    <path d="M600 630 q 36 -6 72 0" stroke-width="3"/>
    <path d="M820 682 q 48 -9 96 0" stroke-width="3"/>
    <path d="M1240 636 q 38 -7 76 0" stroke-width="3"/>
    <path d="M420 742 q 40 -7 80 0" stroke-width="3"/>
    <path d="M980 714 q 38 -7 76 0" stroke-width="3"/>
  </g>

  <!-- ============================ PIER ============================ -->
  <g>
    <rect x="0" y="800" width="1400" height="200" fill="url(#deck)"/>
    <rect x="0" y="800" width="1400" height="200" fill="url(#deckLight)"/>
    <!-- board seams, spacing opening up toward the near edge -->
    <g stroke="#3a2216" stroke-width="3" opacity=".85">
      <line x1="0" y1="806" x2="1400" y2="806"/>
      <line x1="0" y1="818" x2="1400" y2="818"/>
      <line x1="0" y1="834" x2="1400" y2="834"/>
      <line x1="0" y1="856" x2="1400" y2="856"/>
      <line x1="0" y1="884" x2="1400" y2="884"/>
      <line x1="0" y1="920" x2="1400" y2="920"/>
      <line x1="0" y1="962" x2="1400" y2="962"/>
    </g>
    <!-- board joints, staggered row to row -->
    <g stroke="#3a2216" stroke-width="2.5" opacity=".6">
      <line x1="160" y1="806" x2="160" y2="818"/><line x1="640" y1="806" x2="640" y2="818"/><line x1="1120" y1="806" x2="1120" y2="818"/>
      <line x1="400" y1="818" x2="400" y2="834"/><line x1="880" y1="818" x2="880" y2="834"/><line x1="1320" y1="818" x2="1320" y2="834"/>
      <line x1="90"  y1="834" x2="90"  y2="856"/><line x1="552" y1="834" x2="552" y2="856"/><line x1="1024" y1="834" x2="1024" y2="856"/>
      <line x1="300" y1="856" x2="300" y2="884"/><line x1="788" y1="856" x2="788" y2="884"/><line x1="1240" y1="856" x2="1240" y2="884"/>
      <line x1="196" y1="884" x2="196" y2="920"/><line x1="700" y1="884" x2="700" y2="920"/><line x1="1156" y1="884" x2="1156" y2="920"/>
      <line x1="420" y1="920" x2="420" y2="962"/><line x1="960" y1="920" x2="960" y2="962"/>
    </g>
    <!-- grain, nails and wear -->
    <g stroke="#63402a" stroke-width="2" fill="none" opacity=".5">
      <path d="M120 812 q 170 -3 310 1"/>
      <path d="M480 828 q 120 -2 210 1"/>
      <path d="M60 848 q 200 3 380 -1"/>
      <path d="M610 872 q 180 -4 320 1"/>
      <path d="M180 902 q 250 4 430 -2"/>
      <path d="M860 944 q 200 -4 380 2"/>
      <path d="M340 986 q 220 3 400 -2"/>
    </g>
    <g fill="#2c1a10" opacity=".5">
      <circle cx="204" cy="812" r="2.5"/><circle cx="712" cy="812" r="2.5"/><circle cx="1180" cy="812" r="2.5"/>
      <circle cx="446" cy="846" r="2.5"/><circle cx="922" cy="846" r="2.5"/><circle cx="1322" cy="846" r="2.5"/>
      <circle cx="244" cy="900" r="3"/><circle cx="768" cy="900" r="3"/><circle cx="1214" cy="900" r="3"/>
      <circle cx="500" cy="956" r="3.5"/><circle cx="1060" cy="956" r="3.5"/>
    </g>
    <!-- a knot in the boards, and a little moss in the joint -->
    <g opacity=".65">
      <ellipse cx="1000" cy="936" rx="13" ry="5" fill="#3b2416"/>
      <ellipse cx="1000" cy="935" rx="7" ry="2.4" fill="#241309"/>
      <path d="M330 858 q 22 -3 40 0 q -18 4 -40 0" fill="#4e5c39" opacity=".7"/>
      <path d="M1180 886 q 18 -3 34 0 q -16 4 -34 0" fill="#4e5c39" opacity=".5"/>
    </g>
    <!-- the front lip of the pier -->
    <rect x="0" y="798" width="1400" height="6" fill="#b88054"/>
    <rect x="0" y="804" width="1400" height="4" fill="#2a1810" opacity=".7"/>
  </g>

  <!-- the pier railing, backlit, behind the rider -->
  <g>
    <g fill="#3d2618">
      <rect x="26" y="746" width="13" height="56" rx="2"/>
      <rect x="232" y="746" width="13" height="56" rx="2"/>
      <rect x="438" y="746" width="13" height="56" rx="2"/>
      <rect x="644" y="746" width="13" height="56" rx="2"/>
      <rect x="850" y="746" width="13" height="56" rx="2"/>
      <rect x="1056" y="746" width="13" height="56" rx="2"/>
      <rect x="1262" y="746" width="13" height="56" rx="2"/>
    </g>
    <g fill="#b8804f" opacity=".55">
      <rect x="36" y="746" width="3" height="56"/>
      <rect x="242" y="746" width="3" height="56"/>
      <rect x="448" y="746" width="3" height="56"/>
      <rect x="654" y="746" width="3" height="56"/>
      <rect x="860" y="746" width="3" height="56"/>
      <rect x="1066" y="746" width="3" height="56"/>
      <rect x="1272" y="746" width="3" height="56"/>
    </g>
    <rect x="0" y="742" width="1400" height="7" fill="#4a2f1e"/>
    <rect x="0" y="742" width="1400" height="2" fill="#c08a58" opacity=".6"/>
    <path d="M26 772 Q 142 786, 245 772" fill="none" stroke="#8a6238" stroke-width="4" opacity=".8"/>
    <path d="M232 772 Q 340 786, 445 772" fill="none" stroke="#8a6238" stroke-width="4" opacity=".8"/>
    <path d="M438 772 Q 544 786, 651 772" fill="none" stroke="#8a6238" stroke-width="4" opacity=".8"/>
    <path d="M644 772 Q 750 786, 857 772" fill="none" stroke="#8a6238" stroke-width="4" opacity=".8"/>
    <path d="M850 772 Q 956 786, 1063 772" fill="none" stroke="#8a6238" stroke-width="4" opacity=".8"/>
    <path d="M1056 772 Q 1162 786, 1269 772" fill="none" stroke="#8a6238" stroke-width="4" opacity=".8"/>
  </g>

  <!-- the long shadow the low sun throws to the left -->
  <ellipse cx="520" cy="906" rx="440" ry="38" fill="url(#castShadow)"/>

  <!-- ============================ BICYCLE ============================ -->
  <!-- rear wheel -->
  <g>
    <circle cx="455" cy="705" r="172" fill="none" stroke="#232329" stroke-width="17"/>
    <circle cx="455" cy="705" r="160" fill="none" stroke="#e6d6b2" stroke-width="5"/>
    <circle cx="455" cy="705" r="150" fill="none" stroke="#cdbb95" stroke-width="2" opacity=".5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 455 705" to="360 455 705" dur="1.6s" repeatCount="indefinite"/>
      <g stroke="#f2e6c6" stroke-width="1.5" opacity=".6">
        <line x1="455" y1="558" x2="455" y2="852"/>

      </g>
      <rect x="596" y="699" width="16" height="12" rx="3" fill="#d8ae57"/>

    <circle cx="455" cy="705" r="15" fill="#d8b060"/>
    <circle cx="455" cy="705" r="6" fill="#8a6528"/>

  <!-- front wheel -->
  <g>
    <circle cx="945" cy="705" r="172" fill="none" stroke="#232329" stroke-width="17"/>
    <circle cx="945" cy="705" r="160" fill="none" stroke="#e6d6b2" stroke-width="5"/>

      <animateTransform attributeName="transform" type="rotate" from="0 945 705" to="360 945 705" dur="1.6s" repeatCount="indefinite"/>

        <line x1="945" y1="558" x2="945" y2="852" transform="rotate(15 945 705)"/>

        <line x1="945" y1="558" x2="945" y2="852" transform="rotate(75 945 705)"/>
        <line x1="945" y1="558" x2="945" y2="852" transform="rotate(90 945 705)"/>
        <line x1="945" y1="558" x2="945" y2="852" transform="rotate(105 945 705)"/>
        <line x1="945" y1="558" x2="945" y2="852" transform="rotate(120 945 705)"/>
        <line x1="945" y1="558" x2="945" y2="852" transform="rotate(135 945 705)"/>
        <line x1="945" y1="558" x2="945" y2="852" transform="rotate(150 945 705)"/>
