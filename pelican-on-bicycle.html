<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle — Pure SVG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }
    .frame {
      width: min(960px, 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.12);
      background: #fff;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="frame">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="A pelican riding a teal beach cruiser bicycle along a sunny coastal boardwalk">
      <defs>
        <!-- Sky & Ocean -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="52%" stop-color="#bae6fd" />
          <stop offset="86%" stop-color="#fef3c7" />
          <stop offset="100%" stop-color="#fde68a" />
        </linearGradient>

        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95" />
          <stop offset="35%" stop-color="#fef08a" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#fde68a" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0284c7" />
          <stop offset="45%" stop-color="#0ea5e9" />
          <stop offset="100%" stop-color="#0369a1" />
        </linearGradient>

        <linearGradient id="deckGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d6a77a" />
          <stop offset="22%" stop-color="#c08b5c" />
          <stop offset="100%" stop-color="#9b6a43" />
        </linearGradient>

        <!-- Bike Frame & Metallic -->
        <linearGradient id="frameTeal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2dd4bf" />
          <stop offset="45%" stop-color="#0d9488" />
          <stop offset="100%" stop-color="#0f766e" />
        </linearGradient>

        <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="50%" stop-color="#cbd5e1" />
          <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <linearGradient id="leatherGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b45309" />
          <stop offset="60%" stop-color="#78350f" />
          <stop offset="100%" stop-color="#451a03" />
        </linearGradient>

        <!-- Pelican -->
        <linearGradient id="pelicanBody" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="68%" stop-color="#f8f4ea" />
          <stop offset="100%" stop-color="#e5ddd0" />
        </linearGradient>

        <linearGradient id="pelicanWing" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="72%" stop-color="#ede7da" />
          <stop offset="100%" stop-color="#d6cfc2" />
        </linearGradient>

        <linearGradient id="beakTop" x1="0" y1="0" x2="1" y2="0.3">
          <stop offset="0%" stop-color="#fde68a" />
          <stop offset="55%" stop-color="#fbbf24" />
          <stop offset="90%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0.2" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#fdba74" />
          <stop offset="45%" stop-color="#fb923c" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <linearGradient id="fishGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="50%" stop-color="#e2e8f0" />
          <stop offset="100%" stop-color="#94a3b8" />
        </linearGradient>

        <!-- Reusable Wheel Definition -->
        <g id="wheel">
          <circle cx="0" cy="0" r="108" fill="none" stroke="#27272a" stroke-width="14" />
          <circle cx="0" cy="0" r="99" fill="none" stroke="#f5efe0" stroke-width="5" />
          <circle cx="0" cy="0" r="93" fill="none" stroke="#94a3b8" stroke-width="5" />
          <circle cx="0" cy="0" r="90.5" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
          <line x1="0" y1="-90" x2="0" y2="-79" stroke="#475569" stroke-width="3" stroke-linecap="round" />
          <g stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
          <line x1="10.3" y1="3.8" x2="91.0" y2="0.0" />
          <line x1="11.0" y1="0.5" x2="84.1" y2="34.8" />
          <line x1="4.6" y1="10.0" x2="64.3" y2="64.3" />
          <line x1="7.4" y1="8.1" x2="34.8" y2="84.1" />
          <line x1="-3.8" y1="10.3" x2="0.0" y2="91.0" />
          <line x1="-0.5" y1="11.0" x2="-34.8" y2="84.1" />
          <line x1="-10.0" y1="4.6" x2="-64.3" y2="64.3" />
          <line x1="-8.1" y1="7.4" x2="-84.1" y2="34.8" />
          <line x1="-10.3" y1="-3.8" x2="-91.0" y2="0.0" />
          <line x1="-11.0" y1="-0.5" x2="-84.1" y2="-34.8" />
          <line x1="-4.6" y1="-10.0" x2="-64.3" y2="-64.3" />
          <line x1="-7.4" y1="-8.1" x2="-34.8" y2="-84.1" />
          <line x1="3.8" y1="-10.3" x2="-0.0" y2="-91.0" />
          <line x1="0.5" y1="-11.0" x2="34.8" y2="-84.1" />
          <line x1="10.0" y1="-4.6" x2="64.3" y2="-64.3" />
          <line x1="8.1" y1="-7.4" x2="84.1" y2="-34.8" />
          </g>
          <circle cx="0" cy="0" r="13" fill="#cbd5e1" stroke="#64748b" stroke-width="2" />
        </g>

        <!-- Reusable Pedal -->
        <g id="pedal">
          <rect x="-18" y="-4" width="36" height="8" rx="3" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
          <rect x="-14" y="-6" width="28" height="3" rx="1.5" fill="#94a3b8" />
          <rect x="-10" y="-1" width="20" height="2" rx="1" fill="#f59e0b" />
          <circle cx="0" cy="0" r="3" fill="#e2e8f0" />
        </g>

        <!-- Reusable Webbed Pelican Foot (origin at ankle, sole rests cleanly at y = +7 on top of pedal) -->
        <g id="webbedFoot">
          <!-- Webbing -->
          <path d="M -6 4 Q 4 8 24 8 L 20 5 Q 11 1 2 -1 Z" fill="#f59e0b" />
          <path d="M -6 5 C 2 8, 13 8, 25 7 C 19 4, 11 1, 2 -1 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.4" stroke-linejoin="round" />
          <!-- Three splayed toes resting on pedal top -->
          <path d="M -3 3 L 22 7 M -2 1 L 25 6 M 1 -1 L 20 2" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
          <!-- Ankle joint -->
          <circle cx="0" cy="0" r="4.8" fill="#f59e0b" stroke="#b45309" stroke-width="1.2" />
        </g>

        <clipPath id="boardwalkClip">
          <rect x="0" y="516" width="960" height="124" />
        </clipPath>
        <clipPath id="seaClip">
          <rect x="0" y="405" width="960" height="113" />
        </clipPath>
      </defs>

      <!-- ================= 1. COASTAL SKY & SUN ================= -->

      <circle cx="775" cy="128" r="145" fill="url(#sunGlow)" />
      <circle cx="775" cy="128" r="38" fill="#fffbeb" opacity="0.95" />

      <!-- Ground Contact Shadows -->
