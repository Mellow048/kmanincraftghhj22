<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #dff3ff 0%, #f7fbff 100%);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .canvas-wrap {
      width: 100%;
      max-width: 900px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(22, 62, 92, 0.16);
      background: #ffffff;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Subtle, smooth animations */
    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 2.2s linear infinite;
    }
    .bike-bob {
      animation: bob 1.1s ease-in-out infinite;
    }
    .cloud-drift-1 {
      animation: drift 28s linear infinite;
    }
    .cloud-drift-2 {
      animation: drift 38s linear infinite reverse;
    }
    .road-dash {
      animation: roadMove 1.1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes drift {
      from { transform: translateX(-40px); }
      to { transform: translateX(40px); }
    }
    @keyframes roadMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -72; }
    }
  </style>
</head>
<body>
  <div class="canvas-wrap">
    <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pelican riding a bicycle along a coastal road">
      <defs>
        <!-- Sky gradient -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#87CEFA" />
          <stop offset="65%" stop-color="#CBEBFF" />
          <stop offset="100%" stop-color="#FFF5DC" />
        </linearGradient>

        <!-- Ocean gradient -->
        <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3CA0D0" />
          <stop offset="100%" stop-color="#1E6B96" />
        </linearGradient>

        <!-- Road gradient -->
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#535D6B" />
          <stop offset="100%" stop-color="#39414C" />
        </linearGradient>

        <!-- Pelican beak & pouch -->
        <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.4">
          <stop offset="0%" stop-color="#FFB347" />
          <stop offset="100%" stop-color="#FF7E29" />
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFC75F" />
          <stop offset="100%" stop-color="#F2851D" />
        </linearGradient>

        <!-- Pelican body shading -->
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="75%" stop-color="#F2EFE9" />
          <stop offset="100%" stop-color="#DED8CE" />
        </linearGradient>

        <!-- Bike frame -->
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E63946" />
          <stop offset="100%" stop-color="#B81D2A" />
        </linearGradient>
      </defs>

      <!-- Sky -->
      <rect width="900" height="390" fill="url(#skyGrad)" />

      <!-- Sun -->
      <circle cx="760" cy="95" r="44" fill="#FFE885" opacity="0.95" />
      <circle cx="760" cy="95" r="58" fill="#FFE885" opacity="0.28" />

      <!-- Clouds -->
      <g class="cloud-drift-1" fill="#FFFFFF" opacity="0.9">
        <ellipse cx="170" cy="95" rx="52" ry="22" />
        <ellipse cx="205" cy="85" rx="38" ry="24" />
        <ellipse cx="140" cy="98" rx="30" ry="18" />
      </g>
      <g class="cloud-drift-2" fill="#FFFFFF" opacity="0.82">
        <ellipse cx="520" cy="70" rx="46" ry="18" />
        <ellipse cx="552" cy="62" rx="32" ry="20" />
        <ellipse cx="495" cy="73" rx="26" ry="14" />
      </g>

      <!-- Distant Ocean -->
      <rect x="0" y="340" width="900" height="55" fill="url(#seaGrad)" />
      <!-- Water shimmer -->
      <g stroke="#9BE0FF" stroke-width="2" stroke-linecap="round" opacity="0.55">
        <line x1="80" y1="355" x2="150" y2="355" />
        <line x1="260" y1="366" x2="340" y2="366" />
        <line x1="610" y1="358" x2="700" y2="358" />
        <line x1="740" y1="372" x2="820" y2="372" />
      </g>

      <!-- Boardwalk / Curb -->
      <rect x="0" y="390" width="900" height="16" fill="#D9C3A3" />
      <line x1="0" y1="390" x2="900" y2="390" stroke="#B89F7D" stroke-width="2" />

      <!-- Road -->
      <rect x="0" y="406" width="900" height="154" fill="url(#roadGrad)" />
      <line
        class="road-dash"
        x1="0" y1="482" x2="900" y2="482"
        stroke="#F6D55C"
        stroke-width="6"
        stroke-dasharray="40 32"
        stroke-linecap="round"
      />

      <!-- Ground Shadow under Bike -->
      <ellipse cx="450" cy="456" rx="185" ry="14" fill="#1F242B" opacity="0.35" />

      <!-- MAIN BICYCLE + PELICAN GROUP -->
      <g class="bike-bob">

        <!-- ==================== BICYCLE ==================== -->
        <!-- Rear Wheel (center 315, 385, r=68) -->
        <g id="rear-wheel">
          <g class="wheel-spin">
            <!-- Tire -->
            <circle cx="315" cy="385" r="68" fill="none" stroke="#22262B" stroke-width="11" />
            <!-- Rim -->
            <circle cx="315" cy="385" r="61" fill="none" stroke="#D1D8E0" stroke-width="4" />
            <!-- Spokes -->
            <g stroke="#B8C2CC" stroke-width="1.8">
              <line x1="315" y1="324" x2="315" y2="446" />
              <line x1="254" y1="385" x2="376" y2="385" />
              <line x1="272" y1="342" x2="358" y2="428" />
              <line x1="358" y1="342" x2="272" y2="428" />
              <line x1="292" y1="329" x2="338" y2="441" />
              <line x1="338" y1="329" x2="292" y2="441" />
            </g>
            <!-- Hub -->
            <circle cx="315" cy="385" r="9" fill="#495057" stroke="#E9ECEF" stroke-width="2" />
          </g>
        </g>

        <!-- Front Wheel (center 585, 385, r=68) -->
        <g id="front-wheel">
          <g class="wheel-spin">
            <!-- Tire -->
            <circle cx="585" cy="385" r="68" fill="none" stroke="#22262B" stroke-width="11" />
            <!-- Rim -->
            <circle cx="585" cy="385" r="61" fill="none" stroke="#D1D8E0" stroke-width="4" />
            <!-- Spokes -->
            <g stroke="#B8C2CC" stroke-width="1.8">
              <line x1="585" y1="324" x2="585" y2="446" />
              <line x1="524" y1="385" x2="646" y2="385" />
              <line x1="542" y1="342" x2="628" y2="428" />
              <line x1="628" y1="342" x2="542" y2="428" />
              <line x1="562" y1="329" x2="608" y2="441" />
              <line x1="608" y1="329" x2="562" y2="441" />
            </g>
            <!-- Hub -->
            <circle cx="585" cy="385" r="9" fill="#495057" stroke="#E9ECEF" stroke-width="2" />
          </g>
        </g>

        <!-- Chainring & Chain -->
        <path d="M 315 377 L 432 372 A 18 18 0 0 1 432 406 L 315 393 Z" fill="none" stroke="#2B3036" stroke-width="3" />
        <circle cx="432" cy="389" r="18" fill="#ADB5BD" stroke="#343A40" stroke-width="3" />
        <circle cx="432" cy="389" r="6" fill="#495057" />

        <!-- Bicycle Frame (Diamond Geometry) -->
        <g stroke-linecap="round" stroke-linejoin="round">
          <!-- Seatstay & Chainstay -->
          <line x1="315" y1="385" x2="398" y2="288" stroke="url(#frameGrad)" stroke-width="8" />
          <line x1="315" y1="385" x2="432" y2="389" stroke="url(#frameGrad)" stroke-width="8" />
          <!-- Seat tube -->
          <line x1="432" y1="389" x2="392" y2="275" stroke="url(#frameGrad)" stroke-width="10" />
          <!-- Down tube -->
          <line x1="432" y1="389" x2="528" y2="292" stroke="url(#frameGrad)" stroke-width="10" />
          <!-- Top tube -->
          <line x1="398" y1="288" x2="524" y2="278" stroke="url(#frameGrad)" stroke-width="9" />
          <!-- Head tube & Front fork -->
          <line x1="520" y1="268" x2="534" y2="300" stroke="url(#frameGrad)" stroke-width="11" />
          <line x1="534" y1="300" x2="585" y2="385" stroke="url(#frameGrad)" stroke-width="8" />
        </g>

        <!-- Seat Post & Saddle -->
        <line x1="392" y1="275" x2="384" y2="250" stroke="#CED4DA" stroke-width="7" stroke-linecap="round" />
        <path d="M 358 248 Q 386 240 412 248 Q 405 258 364 256 Z" fill="#2B3036" />

        <!-- Handlebar Stem & Handlebars -->
        <line x1="520" y1="268" x2="508" y2="232" stroke="#CED4DA" stroke-width="7" stroke-linecap="round" />
        <path d="M 508 232 Q 528 224 542 232" fill="none" stroke="#CED4DA" stroke-width="6" stroke-linecap="round" />
        <!-- Grips -->
        <line x1="534" y1="229" x2="550" y2="235" stroke="#2B3036" stroke-width="9" stroke-linecap="round" />
        <!-- Little Brass Bell -->
        <path d="M 518 226 A 6 6 0 0 1 530 226 Z" fill="#F4A261" stroke="#B5651D" stroke-width="1.2" />

        <!-- ==================== PELICAN ==================== -->
        <!-- Far Leg (pedaling behind frame) -->
        <g id="far-leg">
          <path d="M 412 252 L 444 316 L 456 355" fill="none" stroke="#E87A24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Far Foot on upper pedal -->
          <path d="M 448 355 L 472 358 L 462 366 L 446 362 Z" fill="#F48C2A" stroke="#C96414" stroke-width="1.5" />
          <!-- Pedal -->
          <line x1="432" y1="389" x2="458" y2="358" stroke="#6C757D" stroke-width="5" stroke-linecap="round" />
          <rect x="448" y="355" width="22" height="6" rx="2" fill="#2B3036" />
        </g>

        <!-- Tail Feathers -->
        <path d="M 340 228 Q 302 222 292 238 Q 312 246 338 242 Z" fill="#E3DDD3" stroke="#C4BCB0" stroke-width="1.5" />
        <path d="M 336 236 Q 300 242 298 254 Q 320 256 344 246 Z" fill="#5C6773" />

        <!-- Pelican Plump Body -->
        <path
          d="M 336 226
             C 340 182, 390 166, 434 180
             C 464 190, 470 228, 444 252
             C 418 272, 354 264, 336 226 Z"
          fill="url(#bodyGrad)"
          stroke="#D3CCC0"
          stroke-width="2"
        />

        <!-- S-Curved Neck & Head -->
        <path
          d="M 424 192
             C 444 176, 456 144, 452 114
             C 450 96, 462 80, 482 80
             C 502 80, 514 94, 512 112
             C 510 130, 488 136, 482 158
             C 476 180, 464 214, 438 228 Z"
          fill="url(#bodyGrad)"
          stroke="#D3CCC0"
          stroke-width="2"
        />

        <!-- Head Crest Feathers -->
        <path d="M 468 83 Q 450 68 442 78 Q 454 84 462 88 Z" fill="#FFFFFF" stroke="#D3CCC0" stroke-width="1.5" />
        <path d="M 462 88 Q 444 82 438 92 Q 450 95 460 94 Z" fill="#F2EFE9" stroke="#D3CCC0" stroke-width="1.5" />

        <!-- Iconic Pelican Beak & Gular Pouch -->
        <!-- Lower Pouch -->
        <path
          d="M 505 112
             Q 556 120, 616 122
             Q 592 162, 540 164
             Q 506 164, 496 130 Z"
          fill="url(#pouchGrad)"
          stroke="#D96B14"
          stroke-width="2"
        />
        <!-- Upper Bill with Hooked Tip -->
        <path
          d="M 506 100
             Q 568 102, 628 116
             Q 636 122, 624 129
             Q 618 124, 614 122
             Q 560 116, 505 114 Z"
          fill="url(#beakGrad)"
          stroke="#D96B14"
          stroke-width="2"
        />
        <!-- Nostril -->
        <ellipse cx="526" cy="107" rx="3" ry="1.5" fill="#C4580B" />

        <!-- Eye -->
        <circle cx="490" cy="100" r="7.5" fill="#FFE082" stroke="#D9A441" stroke-width="1.2" />
        <circle cx="491" cy="100" r="4.2" fill="#1D2228" />
        <circle cx="492.5" cy="98.5" r="1.5" fill="#FFFFFF" />

        <!-- Wing (bent forward, holding the handlebar!) -->
        <g id="pelican-wing">
          <!-- Main Wing -->
          <path
            d="M 382 194
               C 406 184, 438 194, 468 214
               C 494 228, 524 232, 540 233
               C 526 244, 486 246, 450 242
               C 412 238, 376 226, 374 208 Z"
            fill="#F7F4EE"
            stroke="#C8C0B4"
            stroke-width="2"
          />
          <!-- Dark Slate Wingtips -->
          <path
            d="M 375 210
               Q 398 228, 438 236
               Q 412 246, 378 232
               Q 368 220, 375 210 Z"
            fill="#4A5568"
          />
          <!-- Wingtip gripping handlebar -->
          <ellipse cx="540" cy="233" rx="8" ry="5" fill="#EFEAE0" stroke="#C8C0B4" stroke-width="1.5" />
        </g>

        <!-- Near Leg (pedaling in front) -->
        <g id="near-leg">
          <path d="M 398 256 L 404 336 L 406 408" fill="none" stroke="#FF8C2E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Crank Arm -->
          <line x1="432" y1="389" x2="406" y2="416" stroke="#ADB5BD" stroke-width="6" stroke-linecap="round" />
          <!-- Pedal -->
          <rect x="394" y="413" width="24" height="7" rx="2.5" fill="#2B3036" />
          <!-- Webbed Foot on Pedal -->
          <path d="M 396 413 L 424 413 L 418 403 L 400 404 Z" fill="#FF9F38" stroke="#D96B14" stroke-width="1.5" />
        </g>

      </g>
    </svg>
  </div>
</body>
</html>
