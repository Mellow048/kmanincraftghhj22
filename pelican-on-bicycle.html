<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle — Pure SVG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, #1d2c3b 0%, #0e1620 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .frame {
      width: min(94vw, 1240px);
      aspect-ratio: 3 / 2;
      max-height: 92vh;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 30px 75px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(255, 255, 255, 0.14);
      background: #8ed0f7;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Pure-CSS ambient motion: wheels coast smoothly while frame 0 is a complete still */
    .wheel-spin {
      animation: spinWheel 2.2s linear infinite;
    }

    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .cloud-slow {
      animation: driftCloud 44s linear infinite;
    }

    .cloud-mid {
      animation: driftCloud 30s linear infinite;
    }

    @keyframes driftCloud {
      0%   { transform: translateX(0px); }
      50%  { transform: translateX(-32px); }
      100% { transform: translateX(0px); }
    }

    .road-dashes {
      animation: scrollRoad 1.35s linear infinite;
    }

    @keyframes scrollRoad {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: 120; }
    }

    .wind-line {
      animation: windPulse 1.75s ease-in-out infinite;
    }

    .wind-line-delay {
      animation: windPulse 1.75s ease-in-out 0.65s infinite;
    }

    @keyframes windPulse {
      0%, 100% { opacity: 0.25; transform: translateX(6px); }
      50%      { opacity: 0.72; transform: translateX(-14px); }
    }

    .crest-flutter {
      transform-origin: 575px 146px;
      animation: flutter 1.5s ease-in-out infinite;
    }

    @keyframes flutter {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-4.2deg); }
    }

    .pelican-blink {
      transform-origin: 614px 151px;
      animation: blinkEye 5.2s ease-in-out infinite;
    }

    @keyframes blinkEye {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.08); }
    }

    .fish-bob {
      transform-origin: 786px 308px;
      animation: bobFish 2.1s ease-in-out infinite;
    }

    @keyframes bobFish {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(2.4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel-spin, .cloud-slow, .cloud-mid, .road-dashes,
      .wind-line, .wind-line-delay, .crest-flutter,
      .pelican-blink, .fish-bob {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A pelican riding a vintage cherry-red bicycle along a sunny coastal boardwalk with two fresh fish in the front wicker basket">

        <!-- Coastal Promenade Road -->

          <stop offset="100%" stop-color="#CCB186" />

        <!-- Bicycle Frame Crimson -->

        <!-- Reusable Bicycle Wheel (centered at 0,0, outer radius = 115) -->

              <line x1="-10.2" y1="4.2" x2="-85" y2="35.2" />
              <line x1="10.2" y1="4.2" x2="85" y2="35.2" />
              <line x1="-10.2" y1="-4.2" x2="-85" y2="-35.2" />
              <line x1="4.2" y1="10.2" x2="35.2" y2="85" />

          <!-- Brass valve stem -->

          <!-- Hub flange & axle -->
          <circle cx="0" cy="0" r="13" fill="url(#chromeGrad)" stroke="#4C5866" stroke-width="1.8" />
          <circle cx="0" cy="0" r="7.5" fill="#788696" stroke="#36404B" stroke-width="1.2" />

      </defs>

      <!-- ========================================================= -->

        <line x1="92"  y1="569" x2="190" y2="569" stroke-width="2" />

      <!-- ========================================================= -->
