<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle — SVG + HTML only</title>
<!--
  Pelican on a Bicycle. One HTML file, one inline SVG. No JavaScript, no images,
  no fonts, no libraries, no network. All motion is native SVG <animate> /
  <animateTransform> elements plus two CSS rules that make the SVG fill the window.

  This is an original drawing, made from scratch for this task. It does not copy
  or improve the two pelican files already in the repository
  (pelican-bicycle.html, pelican-riding-a-bicycle.html): different canvas,
  different bike, different pelican, different scene, different numbers.

  What is true in this picture (all numbers worked out before drawing):
    - Canvas 1000 x 700. Wheels: radius 90, centres (340,470) and (660,470),
      so the tyres touch the boardwalk at y = 560.
    - Rolling without slipping: one wheel turn (1.1 s) scrolls the boardwalk by
      one tyre circumference, 2*pi*90 = 565.49 px. Boardwalk planks repeat every
      565.49/6 = 94.25 px, railing posts every 565.49/4 = 141.37 px, so the
      scroll loops exactly.
    - Gearing 2.2 : 1 (chainring radius 22, rear cog radius 10). The cranks turn
      once every 2.42 s while the wheels turn once every 1.1 s.
    - Pedalling legs are solved, not guessed: hip fixed at (430,300), bottom
      bracket at (475,460), crank radius 22, thigh 95, shin 95. The knee for each
      of 24 crank positions was computed with two-bone inverse kinematics
      (knee forward) and written out as plain keyframes. Each webbed foot is
      translated to its pedal position and kept level. The far leg is half a
      turn behind the near leg.
    - Frame: diamond cruiser. Rear axle (340,470), front axle (660,470),
      bottom bracket (475,460), seat top (435,335), head top (625,340),
      head bottom (640,380). Saddle over the seat top, handlebar over the head top.
-->
<style>
  html, body { height: 100%; margin: 0; background: #2e2a4a; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
