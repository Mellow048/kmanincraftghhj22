<!--
  A pelican riding a bicycle — night harbour quay.

  One file. No JavaScript, no images, no fonts, no network. The whole piece is a
  single inline SVG whose every motion is a declarative SMIL <animate> /
  <animateTransform>, so it runs anywhere that renders SVG.

  The mechanics are real rather than suggested:
    * Two-bone IK legs. Thigh and tarsus angles are solved on the CPU for 24 crank
      positions, unwrapped so no joint ever flips, then each joint is emitted as a
      nested rotate about the previous joint. The feet therefore stay on the pedals.
    * Pedals are counter-rotated against the crank, so they stay level.
    * 2:1 gearing. Chainring r46, cog r23. The crank turns once every 3.5 s and the
      wheel once every 1.75 s, so the numbers on screen agree with the mechanism.
    * No slip. The road passes at exactly 2*pi*R/WHEEL_T px per second, and the
      stones on the deck slide at that same speed.
    * Chain pitch is derived, not drawn: PITCH = RING_R*2*pi/26, giving 26 whole
      pitches per crank revolution, so the chain never smears or accumulates drift.
    * One loop. Every one of the 212 animations has a duration that divides 14 s
      exactly (4 crank turns = 8 wheel turns), so the whole scene closes seamlessly.

  Light: a cold moon key from the upper right, a warm harbour lamp practical on the
  left with its beam and pool, plus one warm rim and one cool rim on the bird.
-->

</head>
