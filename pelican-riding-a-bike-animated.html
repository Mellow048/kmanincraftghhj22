<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bike — Animated SVG</title>
  <style>
    :root {
      --bg-outer: #0d1b2a;
      --panel-bg: rgba(15, 29, 44, 0.82);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text-main: #f4f7fb;
      --text-muted: #9eb3c7;
      --accent: #ff8c42;
      --accent-hover: #ffa263;
      --teal: #38b2ac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 25%, #1d3557 0%, #0d1b2a 75%, #071019 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      padding: 18px;
      overflow-x: hidden;
    }

    .stage-shell {
      width: min(1160px, 100%);
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.12);
      background: #13293d;
      position: relative;
    }

    .svg-viewport {
      width: 100%;
      aspect-ratio: 1200 / 720;
      display: block;
      cursor: pointer;
      user-select: none;
    }

    .svg-viewport svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 20px;
      padding: 13px 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--panel-border);
    }

    .title-cluster {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .title-cluster h1 {
      font-size: 0.96rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      color: var(--text-main);
    }

    .title-cluster span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.12s ease, border-color 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.28);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    button.primary-action {
      background: linear-gradient(135deg, #ff8c42, #f46036);
      border-color: rgba(255, 200, 160, 0.45);
      color: #fff;
      box-shadow: 0 4px 14px rgba(244, 96, 54, 0.35);
    }

    button.primary-action:hover {
      background: linear-gradient(135deg, #ff9d5c, #ff6f47);
    }

    .slider-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .slider-group input[type="range"] {
      width: 96px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .speed-readout {
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 34px;
      text-align: right;
    }

    @media (max-width: 720px) {
      body {
        padding: 8px;
      }
      .hud-bar {
        padding: 12px 14px;
      }
      .title-cluster span {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage-shell">
    <div class="svg-viewport" id="svgViewport" title="Click anywhere on the scene to ring the bell & toss a fish!">
      <svg id="sceneSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Animated SVG illustration of a coastal white pelican riding a vintage seafoam cruiser bicycle along a seaside boardwalk">
        <defs>
          <!-- Sky Gradients (updated dynamically for Day / Sunset / Night) -->
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="skyStop0" offset="0%" stop-color="#3a86c8" />
            <stop id="skyStop1" offset="52%" stop-color="#7ec8e3" />
            <stop id="skyStop2" offset="100%" stop-color="#dff3f8" />
          </linearGradient>

          <radialGradient id="sunGlowGrad" cx="50%" cy="50%" r="50%">
            <stop id="sunGlow0" offset="0%" stop-color="#fff8d6" stop-opacity="0.95" />
            <stop id="sunGlow1" offset="38%" stop-color="#ffe082" stop-opacity="0.45" />
            <stop id="sunGlow2" offset="100%" stop-color="#ffe082" stop-opacity="0" />
          </radialGradient>

          <!-- Ocean Gradient -->
          <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="seaStop0" offset="0%" stop-color="#1b6ca8" />
            <stop id="seaStop1" offset="55%" stop-color="#2989b8" />
            <stop id="seaStop2" offset="100%" stop-color="#4cb5c3" />
          </linearGradient>

          <!-- Boardwalk & Promenade Gradients -->
          <linearGradient id="seawallGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d9cbb8" />
            <stop offset="100%" stop-color="#b5a38d" />
          </linearGradient>

          <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="roadStop0" offset="0%" stop-color="#c99b6b" />
            <stop id="roadStop1" offset="22%" stop-color="#b88756" />
            <stop id="roadStop2" offset="86%" stop-color="#9c6e42" />
            <stop id="roadStop3" offset="100%" stop-color="#7d5530" />
          </linearGradient>

          <linearGradient id="grassVergeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6b9e62" />
            <stop offset="100%" stop-color="#487344" />
          </linearGradient>

          <!-- Bicycle Frame & Metal Gradients -->
          <linearGradient id="frameTealGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4fd1c5" />
            <stop offset="50%" stop-color="#2c9c95" />
            <stop offset="100%" stop-color="#1b6966" />
          </linearGradient>

          <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="45%" stop-color="#cfd8e3" />
            <stop offset="75%" stop-color="#8fa0b3" />
            <stop offset="100%" stop-color="#eef3f8" />
          </linearGradient>

          <linearGradient id="brassGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe57f" />
            <stop offset="55%" stop-color="#e0a82e" />
            <stop offset="100%" stop-color="#9c6c11" />
          </linearGradient>

          <linearGradient id="leatherGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b86b35" />
            <stop offset="55%" stop-color="#8c471c" />
            <stop offset="100%" stop-color="#592a0d" />
          </linearGradient>

          <linearGradient id="wickerGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e7be7e" />
            <stop offset="55%" stop-color="#c9954c" />
            <stop offset="100%" stop-color="#9a6b2b" />
          </linearGradient>

          <linearGradient id="tireGrad" x1="0" y1="0" x2="0" y2="1">

            <stop offset="50%" stop-color="#222730" />
            <stop offset="100%" stop-color="#161a20" />
          </linearGradient>

          <!-- Pelican Gradients -->
          <linearGradient id="pelicanBodyGrad" x1="0.15" y1="0.05" x2="0.75" y2="0.95">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="62%" stop-color="#f7f4ec" />
            <stop offset="100%" stop-color="#ded9ce" />
          </linearGradient>

          <linearGradient id="pelicanNeckGrad" x1="0" y1="0" x2="1" y2="0.6">

            <stop offset="68%" stop-color="#f6f2e8" />
            <stop offset="100%" stop-color="#dcd6c8" />
          </linearGradient>

          <linearGradient id="pelicanWingGrad" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="65%" stop-color="#f2eee4" />
            <stop offset="100%" stop-color="#d5cfc2" />
          </linearGradient>

          <linearGradient id="pelicanFarWingGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e5e1d8" />
            <stop offset="100%" stop-color="#c2bcb0" />
          </linearGradient>

          <linearGradient id="upperBillGrad" x1="0" y1="0" x2="1" y2="0.25">
            <stop offset="0%" stop-color="#ffd56b" />
            <stop offset="58%" stop-color="#ffa93a" />
            <stop offset="92%" stop-color="#f26b38" />
            <stop offset="100%" stop-color="#d9432e" />
          </linearGradient>

          <linearGradient id="pouchGrad" x1="0.3" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#ffb563" />
            <stop offset="48%" stop-color="#f68b42" />
            <stop offset="88%" stop-color="#d96732" />
            <stop offset="100%" stop-color="#b84d24" />
          </linearGradient>

          <linearGradient id="nearLegGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff9f38" />
            <stop offset="65%" stop-color="#f0781e" />

          <linearGradient id="farLegGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#d97a24" />
            <stop offset="100%" stop-color="#a64f10" />
          </linearGradient>

          <linearGradient id="scarfGrad" x1="0" y1="0" x2="1" y2="0.2">
            <stop offset="0%" stop-color="#ef476f" />
            <stop offset="55%" stop-color="#d92b52" />
            <stop offset="100%" stop-color="#ad1d3f" />
          </linearGradient>

          <linearGradient id="fishGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5c8ab8" />
            <stop offset="45%" stop-color="#cbe2f5" />
            <stop offset="100%" stop-color="#ffffff" />
          </linearGradient>

          <linearGradient id="headlampBeamGrad" x1="0" y1="0.5" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#fff4b8" stop-opacity="0.58" />
            <stop offset="55%" stop-color="#ffe484" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#ffe484" stop-opacity="0" />
          </linearGradient>

          <!-- Reusable 16-spoke pattern for wheel rims -->
          <g id="wheelSpokesUnit">
            <line x1="0" y1="-73" x2="0" y2="73" stroke="#dce5ee" stroke-width="1.5" stroke-opacity="0.88" />
            <line x1="-73" y1="0" x2="73" y2="0" stroke="#dce5ee" stroke-width="1.5" stroke-opacity="0.88" />
            <line x1="-51.6" y1="-51.6" x2="51.6" y2="51.6" stroke="#dce5ee" stroke-width="1.5" stroke-opacity="0.88" />
            <line x1="-51.6" y1="51.6" x2="51.6" y2="-51.6" stroke="#dce5ee" stroke-width="1.5" stroke-opacity="0.88" />
            <line x1="-27.9" y1="-67.4" x2="27.9" y2="67.4" stroke="#c4d1de" stroke-width="1.35" stroke-opacity="0.8" />
            <line x1="27.9" y1="-67.4" x2="-27.9" y2="67.4" stroke="#c4d1de" stroke-width="1.35" stroke-opacity="0.8" />
            <line x1="-67.4" y1="-27.9" x2="67.4" y2="27.9" stroke="#c4d1de" stroke-width="1.35" stroke-opacity="0.8" />
            <line x1="-67.4" y1="27.9" x2="67.4" y2="-27.9" stroke="#c4d1de" stroke-width="1.35" stroke-opacity="0.8" />
            <!-- Brass valve stem + rim reflector -->
            <rect x="-2" y="-73" width="4" height="9" rx="1.2" fill="#e0a82e" />
            <rect x="-7" y="54" width="14" height="5" rx="2.5" fill="#ff922b" />
          </g>
        </defs>

        <!-- ==================== 1. SKY, STARS & CELESTIAL BODY ==================== -->
        <rect x="0" y="0" width="1200" height="465" fill="url(#skyGrad)" />

        <!-- Night Stars (opacity controlled by theme) -->
        <g id="nightStars" opacity="0">
          <circle cx="95" cy="64" r="1.6" fill="#fff" opacity="0.9" />
          <circle cx="182" cy="118" r="1.2" fill="#fff" opacity="0.7" />
          <circle cx="268" cy="48" r="2.0" fill="#fffbe6" opacity="0.95" />
          <circle cx="354" cy="92" r="1.4" fill="#fff" opacity="0.75" />
          <circle cx="445" cy="56" r="1.7" fill="#fff" opacity="0.85" />
          <circle cx="530" cy="110" r="1.2" fill="#fff" opacity="0.65" />
          <circle cx="642" cy="44" r="1.9" fill="#fffbe6" opacity="0.9" />
          <circle cx="748" cy="84" r="1.4" fill="#fff" opacity="0.8" />
          <circle cx="835" cy="52" r="1.6" fill="#fff" opacity="0.85" />
          <circle cx="1040" cy="66" r="1.8" fill="#fff" opacity="0.9" />
          <circle cx="1132" cy="112" r="1.3" fill="#fff" opacity="0.75" />
          <circle cx="140" cy="188" r="1.3" fill="#fff" opacity="0.6" />
          <circle cx="890" cy="148" r="1.5" fill="#fff" opacity="0.7" />
        </g>

        <!-- Sun / Moon Group -->
        <g id="celestialGroup" transform="translate(948, 128)">
          <circle cx="0" cy="0" r="118" fill="url(#sunGlowGrad)" />
          <g id="sunRaysGroup">
            <circle cx="0" cy="0" r="56" fill="none" stroke="#fff3b0" stroke-width="2" stroke-dasharray="6 14" opacity="0.55" />
          </g>
          <circle id="sunDisc" cx="0" cy="0" r="38" fill="#fff5ba" />
          <path id="moonCrescent" d="M-8,-36 A37,37 0 1,0 32,18 A29.5,29.5 0 1,1 -8,-36 Z" fill="#fff8d6" opacity="0" />
        </g>

        <!-- Parallax Clouds -->
        <g id="cloudsLayer">
          <g id="cloud0" transform="translate(130, 108)" opacity="0.88">
            <path id="cloudFill0" d="M-58,18 C-74,18 -84,7 -82,-6 C-80,-19 -66,-27 -52,-24 C-45,-41 -24,-50 -4,-44 C11,-54 35,-48 44,-31 C61,-31 75,-18 74,-2 C74,11 62,18 48,18 Z" fill="#ffffff" />
            <path d="M-64,18 C-40,12 20,12 58,18 Z" fill="#dceef7" opacity="0.45" />
          </g>
          <g id="cloud1" transform="translate(520, 78) scale(0.82)" opacity="0.8">
            <path id="cloudFill1" d="M-58,18 C-74,18 -84,7 -82,-6 C-80,-19 -66,-27 -52,-24 C-45,-41 -24,-50 -4,-44 C11,-54 35,-48 44,-31 C61,-31 75,-18 74,-2 C74,11 62,18 48,18 Z" fill="#ffffff" />
          </g>
          <g id="cloud2" transform="translate(1020, 146) scale(0.92)" opacity="0.84">
            <path id="cloudFill2" d="M-58,18 C-74,18 -84,7 -82,-6 C-80,-19 -66,-27 -52,-24 C-45,-41 -24,-50 -4,-44 C11,-54 35,-48 44,-31 C61,-31 75,-18 74,-2 C74,11 62,18 48,18 Z" fill="#ffffff" />
          </g>
        </g>

        <!-- Distant Seabirds -->
        <g id="distantGulls" stroke="#2d5a7b" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.55">
          <path id="gull1" d="M230,175 Q240,165 250,174 Q260,165 270,175" />
          <path id="gull2" d="M282,192 Q289,185 296,191 Q303,185 310,192" />
        </g>

        <!-- ==================== 2. OCEAN, HEADLAND LIGHTHOUSE & SAILBOATS ==================== -->
        <!-- Distant Coastal Hills -->
        <g id="headlandGroup" transform="translate(160, 455)">
          <path d="M-190,4 L-110,-26 Q-55,-44 10,-28 Q75,-12 135,-36 Q180,-52 215,-20 L255,4 Z" fill="#5e8c9e" opacity="0.68" />
          <!-- Classic Striped Lighthouse on Point -->
          <g transform="translate(168, -22)">
            <polygon points="-9,22 -5,-34 5,-34 9,22" fill="#f8fafc" />
            <polygon points="-7.6,4 -6.4,-12 6.4,-12 7.6,4" fill="#e63946" />
            <polygon points="-5.5,-24 -5,-34 5,-34 5.5,-24" fill="#e63946" />
            <rect x="-7" y="-38" width="14" height="4" rx="1" fill="#1d3557" />
            <rect x="-4.5" y="-45" width="9" height="7" fill="#fff3b0" />
            <polygon points="-6,-45 0,-52 6,-45" fill="#e63946" />
            <!-- Rotating Night Lighthouse Beam -->
            <polygon id="lighthouseBeam" points="4,-42 240,-95 240,12" fill="url(#headlampBeamGrad)" opacity="0" />

        </g>

        <!-- Ocean Band -->
        <rect x="0" y="454" width="1200" height="76" fill="url(#seaGrad)" />

        <!-- Shimmering Ocean Waves & Sailboats -->
        <g id="seaDetails">
          <!-- Sailboat 1 -->
          <g id="sailboat1" transform="translate(860, 466)">
            <path d="M-18,0 L18,0 L12,6 L-13,6 Z" fill="#f1faee" />

          </g>
          <!-- Sailboat 2 -->
          <g id="sailboat2" transform="translate(310, 462) scale(0.75)">
            <path d="M-18,0 L18,0 L12,6 L-13,6 Z" fill="#e63946" />
            <path d="M-1,-2 L-1,-34 L15,-5 Z" fill="#ffffff" />
            <path d="M-3,-4 L-3,-26 L-14,-5 Z" fill="#f1faee" />
          </g>
          <!-- Animated Wave Shimmers -->
          <g id="waveShimmers" stroke="#b8f2ff" stroke-width="2" stroke-linecap="round" opacity="0.55">
            <line x1="60" y1="474" x2="118" y2="474" />
            <line x1="210" y1="492" x2="284" y2="492" />
            <line x1="410" y1="478" x2="465" y2="478" />
            <line x1="590" y1="498" x2="668" y2="498" />
            <line x1="780" y1="472" x2="842" y2="472" />
            <line x1="935" y1="488" x2="1015" y2="488" />
            <line x1="1105" y1="476" x2="1168" y2="476" />

        </g>

        <!-- ==================== 3. COASTAL SEAWALL, BOARDWALK RAILING & ROAD ==================== -->
        <!-- Low Stone Seawall Cap -->
        <rect x="0" y="520" width="1200" height="30" fill="url(#seawallGrad)" />
        <line x1="0" y1="520" x2="1200" y2="520" stroke="#efe6d8" stroke-width="2.5" />

        <!-- Scrolling Wooden Promenade Posts & Nautical Rope Railing (period = 150px) -->
        <g id="railingScrollGroup" transform="translate(0, 0)">
          <path d="M-150,492 Q-75,503 0,492 Q75,503 150,492 Q225,503 300,492 Q375,503 450,492 Q525,503 600,492 Q675,503 750,492 Q825,503 900,492 Q975,503 1050,492 Q1125,503 1200,492 Q1275,503 1350,492"
                fill="none" stroke="#d8be96" stroke-width="3.4" />
          <g id="railingPosts">
            <g transform="translate(-150, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(0, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(150, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(300, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(450, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(600, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(750, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(900, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(1050, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(1200, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
            <g transform="translate(1350, 480)"><rect x="-5" y="0" width="10" height="42" rx="2" fill="#8d6b48" /><circle cx="0" cy="0" r="6" fill="#a9845c" /></g>
          </g>
        </g>

        <!-- Timber Boardwalk / Bike Path Surface -->
        <rect x="0" y="548" width="1200" height="114" fill="url(#roadGrad)" />

      // ==================== ANALYTICAL 2-BONE INVERSE KINEMATICS ====================
      /**
       * Solves 2D two-bone IK from start (ax, ay) to target (bx, by).
       * bendDir = -1 bends counter-clockwise from A->B vector (forward cyclist knee!).
       * bendDir = +1 bends clockwise from A->B vector (tucked bird wing elbow!).
       */
      function solveTwoBoneIK(ax, ay, bx, by, L1, L2, bendDir) {
        const dx = bx - ax;
        const dy = by - ay;
        const rawDist = Math.hypot(dx, dy) || 0.0001;
        const minDist = Math.abs(L1 - L2) + 0.5;
        const maxDist = L1 + L2 - 0.5;
        const d = Math.max(minDist, Math.min(maxDist, rawDist));

        const baseAngle = Math.atan2(dy, dx);
        const cosBeta = Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
        const beta = Math.acos(cosBeta);
        const theta1 = baseAngle + bendDir * beta;

        const jx = ax + L1 * Math.cos(theta1);
        const jy = ay + L1 * Math.sin(theta1);
        const theta2 = Math.atan2(by - jy, bx - jx);

        return {
          jx,
          jy,
          deg1: (theta1 * 180) / Math.PI,
          deg2: (theta2 * 180) / Math.PI
        };
      }

      function wrapRange(val, span, padLeft) {
        return (((val % span) + span) % span) - padLeft;
      }

      function rotatePointAround(px, py, cx, cy, rad) {
        const c = Math.cos(rad);
        const s = Math.sin(rad);
        const dx = px - cx;
        const dy = py - cy;
        return {
          x: cx + dx * c - dy * s,
          y: cy + dx * s + dy * c
        };
      }

      // ==================== MASTER KINEMATIC FRAME RENDERER ====================
      function renderFrame(theta, timeSec) {
        // 1. Wheel rotation & exact no-slip linear road distance
        const wheelTheta = theta * GEAR_RATIO;
        const wheelDeg = (wheelTheta * 180) / Math.PI;
        const crankDeg = (theta * 180) / Math.PI;
        const groundScroll = wheelTheta * R_TIRE; // Exact arc-length s = r * phi!

        // Spin both wheels & front chainring
        els.rearWheelSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.frontWheelSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.chainringGroup.setAttribute("transform", `translate(${BB.x}, ${BB.y}) rotate(${crankDeg.toFixed(2)})`);

        // Roller chain dash travel synchronized to chainring pitch circle
        const chainOffset = -(theta * R_CHAINRING);
        els.chainLinksPath.setAttribute("stroke-dashoffset", chainOffset.toFixed(2));

        // 2. Parallax Environment Updates
        els.sunRaysGroup.setAttribute("transform", `rotate(${(timeSec * 8) % 360})`);

        const c0x = wrapRange(130 - groundScroll * 0.045, 1560, 180);
        const c1x = wrapRange(620 - groundScroll * 0.032, 1560, 180);
        const c2x = wrapRange(1120 - groundScroll * 0.055, 1560, 180);
        els.cloud0.setAttribute("transform", `translate(${c0x.toFixed(1)}, 108)`);
        els.cloud1.setAttribute("transform", `translate(${c1x.toFixed(1)}, 78) scale(0.82)`);
        els.cloud2.setAttribute("transform", `translate(${c2x.toFixed(1)}, 146) scale(0.92)`);

        // Distant gulls gently flapping
        const gullX = wrapRange(260 - groundScroll * 0.07 + timeSec * 14, 1500, 150);
        const flap = Math.sin(timeSec * 5.2) * 5;
        els.gull1.setAttribute("d", `M${(gullX).toFixed(1)},${(175 + flap).toFixed(1)} Q${(gullX + 10).toFixed(1)},165 ${(gullX + 20).toFixed(1)},174 Q${(gullX + 30).toFixed(1)},165 ${(gullX + 40).toFixed(1)},${(175 + flap).toFixed(1)}`);
        els.gull2.setAttribute("d", `M${(gullX + 52).toFixed(1)},${(192 - flap * 0.8).toFixed(1)} Q${(gullX + 59).toFixed(1)},185 ${(gullX + 66).toFixed(1)},191 Q${(gullX + 73).toFixed(1)},185 ${(gullX + 80).toFixed(1)},${(192 - flap * 0.8).toFixed(1)}`);

        // Headland lighthouse & sailboats
        const headX = wrapRange(220 - groundScroll * 0.12, 1800, 300);
        els.headlandGroup.setAttribute("transform", `translate(${headX.toFixed(1)}, 455)`);

        const boat1X = wrapRange(880 - groundScroll * 0.16, 1600, 160);
        const boat2X = wrapRange(340 - groundScroll * 0.11, 1600, 160);
        const boatBob1 = Math.sin(timeSec * 2.3) * 1.8;
        const boatBob2 = Math.cos(timeSec * 2.0) * 1.4;
        els.sailboat1.setAttribute("transform", `translate(${boat1X.toFixed(1)}, ${(466 + boatBob1).toFixed(1)}) rotate(${(Math.sin(timeSec * 1.8) * 2).toFixed(2)})`);
        els.sailboat2.setAttribute("transform", `translate(${boat2X.toFixed(1)}, ${(462 + boatBob2).toFixed(1)}) scale(0.75)`);

        const shimmerShift = -((groundScroll * 0.22) % 120);
        els.waveShimmers.setAttribute("transform", `translate(${shimmerShift.toFixed(1)}, 0)`);

        // Boardwalk railing (0.58x parallax, seamless 150px period)
        const railShift = -(((groundScroll * 0.58) % 150 + 150) % 150);
        els.railingScrollGroup.setAttribute("transform", `translate(${railShift.toFixed(2)}, 0)`);

        // Road planks & center dashes (1.00x exact wheel speed, seamless 120px period)
        const roadShift = -(((groundScroll) % 120 + 120) % 120);
        els.roadPlanksScrollGroup.setAttribute("transform", `translate(${roadShift.toFixed(2)}, 0)`);

        // 3. Subtle Frame Micro-Suspension & Ground Shadow Breathing
        const frameBounceY = -1.4 * Math.sin(2 * theta);
        els.bicycleFrameGroup.setAttribute("transform", `translate(0, ${frameBounceY.toFixed(2)})`);
        els.fendersGroup.setAttribute("transform", `translate(0, ${(frameBounceY * 0.6).toFixed(2)})`);

        const shadowScale = 1 + 0.018 * Math.sin(2 * theta);
        els.bikeGroundShadow.setAttribute("transform", `translate(600, 591) scale(${shadowScale.toFixed(3)}, 1)`);

        // 4. Cranks & Level Pedals (Near = theta, Far = theta + PI)
        const nearPedalX = BB.x + L_CRANK * Math.cos(theta);
        const nearPedalY = BB.y + L_CRANK * Math.sin(theta);
        const farPedalX = BB.x + L_CRANK * Math.cos(theta + Math.PI);
        const farPedalY = BB.y + L_CRANK * Math.sin(theta + Math.PI);

        els.nearCrankArm.setAttribute("x2", nearPedalX.toFixed(2));
        els.nearCrankArm.setAttribute("y2", nearPedalY.toFixed(2));
        els.nearPedalGroup.setAttribute("transform", `translate(${nearPedalX.toFixed(2)}, ${nearPedalY.toFixed(2)})`);

        els.farCrankArm.setAttribute("x2", farPedalX.toFixed(2));
        els.farCrankArm.setAttribute("y2", farPedalY.toFixed(2));
        els.farPedalGroup.setAttribute("transform", `translate(${farPedalX.toFixed(2)}, ${farPedalY.toFixed(2)})`);

        // 5. Pelican Torso Bounce, Forward Cadence Lean & Secondary Follow-Through
        const bodyBobY = -4.6 * Math.sin(2 * theta - 0.35) + frameBounceY;
        const speedLean = Math.min(4.2, Math.max(0, (speedMultiplier - 0.8) * 2.2));
        const bodyPitchDeg = 1.6 * Math.sin(2 * theta - 0.1) + speedLean;
        const bodyPitchRad = (bodyPitchDeg * Math.PI) / 180;
        const pivotHip = { x: 525, y: 342 };

        els.pelicanBodyGroup.setAttribute(
          "transform",
          `translate(0, ${bodyBobY.toFixed(2)}) rotate(${bodyPitchDeg.toFixed(2)}, ${pivotHip.x}, ${pivotHip.y})`
        );

        // Tail feather lively counter-flick
        const tailFlickDeg = -4.5 * Math.sin(2 * theta - 0.9);
        els.pelicanTailGroup.setAttribute("transform", `translate(476, 322) rotate(${tailFlickDeg.toFixed(2)})`);

        // Flowing scarf sine-wave cloth physics
        const wavePhase = timeSec * 9.5 * Math.max(0.35, speedMultiplier);
        const s1 = Math.sin(wavePhase) * 6;
        const s2 = Math.cos(wavePhase - 0.9) * 8;
        els.scarfTailBack.setAttribute(
          "d",
          `M594,268 Q554,${(256 + s1).toFixed(1)} 516,${(267 - s1).toFixed(1)} Q492,${(274 + s2).toFixed(1)} 474,${(262 + s2).toFixed(1)}`
        );
        els.scarfTailFront.setAttribute(
          "d",
          `M596,272 Q552,${(273 - s1 * 0.8).toFixed(1)} 512,${(285 + s1).toFixed(1)} Q488,${(293 - s2).toFixed(1)} 468,${(282 - s2 * 0.9).toFixed(1)}`
        );
        els.scarfTailStripe.setAttribute(
          "d",
          `M582,273 Q546,${(275 - s1 * 0.8).toFixed(1)} 508,${(286 + s1).toFixed(1)}`
        );

        // Head, Crest, Bill, Pouch Jiggle & Fish-Catch Kinematics
        let headExtraDeg = -2.2 * Math.sin(2 * theta - 1.0);
        let upperBillDeg = 1.2 * Math.sin(2 * theta - 1.3);
        let lowerJawDeg = 1.8 * Math.max(0, Math.sin(2 * theta - 1.5));
        let pouchJiggle = 3.2 * Math.sin(2 * theta - 1.7);
        let gulpBulge = 0;

        // Interactive Fish Toss Arc & Gulp Sequence!
        let mouthGapeAlpha = 0;
        if (fishEvent.active) {
          const p = fishEvent.progress;
          if (p < 0.64) {
            // Quadratic Bezier arc from front wicker basket P0=(756,290) out ahead of beak P1=(874,174) right into open mouth P2=(732,190)!
            const u = p / 0.64;
            const om = 1 - u;
            const fx = om * om * 756 + 2 * om * u * 874 + u * u * 732;
            const fy = om * om * 290 + 2 * om * u * 174 + u * u * 190;
            const fRot = -55 + u * 225;
            els.tossedFishGroup.setAttribute("opacity", "1");
            els.tossedFishGroup.setAttribute("transform", `translate(${fx.toFixed(1)}, ${fy.toFixed(1)}) rotate(${fRot.toFixed(1)})`);
            els.basketFishPeek.setAttribute("opacity", "0");

            // Pelican eagerly tilts head up and opens massive gular pouch wide!
            const openCurve = Math.sin(u * Math.PI);
            headExtraDeg -= 7.5 * openCurve;
            upperBillDeg -= 11.5 * openCurve;
            lowerJawDeg += 21 * openCurve;
            pouchJiggle += 12 * openCurve;
            mouthGapeAlpha = openCurve * 0.92;
          } else {
            // Fish lands inside pouch -> happy snap & elastic pouch bulge!
            els.tossedFishGroup.setAttribute("opacity", "0");
            const v = (p - 0.64) / 0.36;
            gulpBulge = Math.sin(v * Math.PI) * 18;
            headExtraDeg += Math.sin(v * Math.PI * 2) * 4;
            els.basketFishPeek.setAttribute("opacity", v > 0.72 ? ((v - 0.72) / 0.28).toFixed(2) : "0");
          }
        } else {
          els.tossedFishGroup.setAttribute("opacity", "0");
          els.basketFishPeek.setAttribute("opacity", "1");
        }

        els.pelicanHeadGroup.setAttribute("transform", `translate(632, 174) rotate(${headExtraDeg.toFixed(2)})`);
        els.upperBillGroup.setAttribute("transform", `translate(20, -4) rotate(${upperBillDeg.toFixed(2)})`);
        els.lowerJawGroup.setAttribute("transform", `translate(20, 4) rotate(${lowerJawDeg.toFixed(2)})`);

        if (mouthGapeAlpha > 0.02) {
          const topTipY = (-4 + 132 * Math.sin((upperBillDeg * Math.PI) / 180)).toFixed(1);
          const botTipY = (5 + 128 * Math.sin((lowerJawDeg * Math.PI) / 180)).toFixed(1);
          els.mouthInteriorPath.setAttribute("d", `M18,-3 L142,${topTipY} Q116,${((parseFloat(topTipY) + parseFloat(botTipY)) * 0.5).toFixed(1)} 138,${botTipY} L18,5 Z`);
          els.mouthInteriorPath.setAttribute("opacity", mouthGapeAlpha.toFixed(2));
        } else {
          els.mouthInteriorPath.setAttribute("opacity", "0");
        }

        // Crest feathers fluttering in coastal wind
        const crestFlutter = Math.sin(timeSec * 8.2) * 3.5;
        els.crestFeathersGroup.setAttribute("transform", `rotate(${crestFlutter.toFixed(2)}, -14, -8)`);

        // Elastic gular throat pouch spline
        const pouchDip = (58 + pouchJiggle + gulpBulge).toFixed(1);
        const pouchMid = (52 + pouchJiggle * 0.8 + gulpBulge * 0.85).toFixed(1);
        els.gularPouchPath.setAttribute(
          "d",
          `M-6,2 C2,38 34,${pouchDip} 76,${pouchMid} C108,47 132,26 142,4 L0,2 Z`
        );
        els.pouchCrease1.setAttribute(
          "d",
          `M8,14 C28,${(34 + pouchJiggle * 0.5 + gulpBulge * 0.6).toFixed(1)} 62,${(42 + pouchJiggle * 0.5 + gulpBulge * 0.6).toFixed(1)} 104,26`
        );

        // Periodic natural eye blink (~every 3.8s for 140ms)
        const blinkCycle = timeSec % 3.8;
        const isBlinking = blinkCycle > 3.64 && blinkCycle < 3.78;
        els.pelicanEyelid.setAttribute("opacity", isBlinking ? "1" : "0");

        // Brass bell sound rings
        if (bellRingTimer > 0) {
          const bellAlpha = Math.min(1, bellRingTimer * 1.8) * (0.5 + 0.5 * Math.sin(timeSec * 45));
          els.bellRings.setAttribute("opacity", bellAlpha.toFixed(2));
        } else {
          els.bellRings.setAttribute("opacity", "0");
        }

        // 6. Exact 2-Bone IK for BOTH Pelican Legs & Webbed Feet!
        // Compute world positions of Near & Far Hips attached to moving/pitching torso
        const nearHipWorld = rotatePointAround(542, 354, pivotHip.x, pivotHip.y, bodyPitchRad);
        nearHipWorld.y += bodyBobY;
        const farHipWorld = rotatePointAround(550, 350, pivotHip.x, pivotHip.y, bodyPitchRad);
        farHipWorld.y += bodyBobY;

        // Natural cyclist ankling angle across pedal stroke
        const nearFootDeg = 11 * Math.sin(theta - 0.55);
        const farFootDeg = 11 * Math.sin(theta + Math.PI - 0.55);

        // Ankle sits right above pedal platform so webbed sole plants squarely on pedal!
        const nearAnkleX = nearPedalX - 10;
        const nearAnkleY = nearPedalY - 14;
        const farAnkleX = farPedalX - 10;
        const farAnkleY = farPedalY - 14;

        const nearLegIK = solveTwoBoneIK(nearHipWorld.x, nearHipWorld.y, nearAnkleX, nearAnkleY, LEG_L1, LEG_L2, -1);
        const farLegIK = solveTwoBoneIK(farHipWorld.x, farHipWorld.y, farAnkleX, farAnkleY, LEG_L1, LEG_L2, -1);

        // Update Near Leg DOM
        els.nearThighTuft.setAttribute(
          "transform",
          `translate(${(nearHipWorld.x - 542).toFixed(2)}, ${(nearHipWorld.y - 354).toFixed(2)})`
        );
        els.nearUpperLeg.setAttribute("x1", nearHipWorld.x.toFixed(2));
        els.nearUpperLeg.setAttribute("y1", nearHipWorld.y.toFixed(2));
        els.nearUpperLeg.setAttribute("x2", nearLegIK.jx.toFixed(2));
        els.nearUpperLeg.setAttribute("y2", nearLegIK.jy.toFixed(2));
        els.nearKneeJoint.setAttribute("cx", nearLegIK.jx.toFixed(2));
        els.nearKneeJoint.setAttribute("cy", nearLegIK.jy.toFixed(2));
        els.nearLowerLeg.setAttribute("x1", nearLegIK.jx.toFixed(2));
        els.nearLowerLeg.setAttribute("y1", nearLegIK.jy.toFixed(2));
        els.nearLowerLeg.setAttribute("x2", nearAnkleX.toFixed(2));
        els.nearLowerLeg.setAttribute("y2", nearAnkleY.toFixed(2));
        els.nearFootGroup.setAttribute(
          "transform",
          `translate(${nearAnkleX.toFixed(2)}, ${nearAnkleY.toFixed(2)}) rotate(${nearFootDeg.toFixed(2)})`
        );

        // Update Far Leg DOM
        els.farThighTuft.setAttribute(
          "transform",
          `translate(${(farHipWorld.x - 550).toFixed(2)}, ${(farHipWorld.y - 350).toFixed(2)})`
        );
        els.farUpperLeg.setAttribute("x1", farHipWorld.x.toFixed(2));
        els.farUpperLeg.setAttribute("y1", farHipWorld.y.toFixed(2));
        els.farUpperLeg.setAttribute("x2", farLegIK.jx.toFixed(2));
        els.farUpperLeg.setAttribute("y2", farLegIK.jy.toFixed(2));
        els.farKneeJoint.setAttribute("cx", farLegIK.jx.toFixed(2));
        els.farKneeJoint.setAttribute("cy", farLegIK.jy.toFixed(2));
        els.farLowerLeg.setAttribute("x1", farLegIK.jx.toFixed(2));
        els.farLowerLeg.setAttribute("y1", farLegIK.jy.toFixed(2));
        els.farLowerLeg.setAttribute("x2", farAnkleX.toFixed(2));
        els.farLowerLeg.setAttribute("y2", farAnkleY.toFixed(2));
        els.farFootGroup.setAttribute(
          "transform",
          `translate(${farAnkleX.toFixed(2)}, ${farAnkleY.toFixed(2)}) rotate(${farFootDeg.toFixed(2)})`
        );

        // 7. Exact 2-Bone IK for BOTH Wings Locked onto Handlebar Grips!
        const nearShoulderWorld = rotatePointAround(566, 298, pivotHip.x, pivotHip.y, bodyPitchRad);
        nearShoulderWorld.y += bodyBobY;
        const farShoulderWorld = rotatePointAround(582, 294, pivotHip.x, pivotHip.y, bodyPitchRad);
        farShoulderWorld.y += bodyBobY;

        const gripNearY = GRIP_NEAR_BASE.y + frameBounceY;
        const gripFarY = GRIP_FAR_BASE.y + frameBounceY;

        const nearWingIK = solveTwoBoneIK(
          nearShoulderWorld.x,
          nearShoulderWorld.y,
          GRIP_NEAR_BASE.x,
          gripNearY,
          WING_NEAR_L1,
          WING_NEAR_L2,
          +1
        );
        els.nearUpperWingGroup.setAttribute(
          "transform",
          `translate(${nearShoulderWorld.x.toFixed(2)}, ${nearShoulderWorld.y.toFixed(2)}) rotate(${nearWingIK.deg1.toFixed(2)})`
        );
        els.nearForeWingGroup.setAttribute(
          "transform",
          `translate(${nearWingIK.jx.toFixed(2)}, ${nearWingIK.jy.toFixed(2)}) rotate(${nearWingIK.deg2.toFixed(2)})`
        );

        const farWingIK = solveTwoBoneIK(
          farShoulderWorld.x,
          farShoulderWorld.y,
          GRIP_FAR_BASE.x,
          gripFarY,
          WING_FAR_L1,
          WING_FAR_L2,
          +1
        );
        els.farWingPath.setAttribute(
          "d",
          `M${farShoulderWorld.x.toFixed(1)},${farShoulderWorld.y.toFixed(1)} Q${farWingIK.jx.toFixed(1)},${farWingIK.jy.toFixed(1)} ${GRIP_FAR_BASE.x},${gripFarY.toFixed(1)}`
        );
        els.farWingTip.setAttribute("transform", `translate(${GRIP_FAR_BASE.x}, ${gripFarY.toFixed(1)})`);

        // 8. Foreground Breeze Speed Wisps
        const wispAlpha = Math.min(0.65, 0.22 * speedMultiplier);
        els.breezeWisps.setAttribute("opacity", wispAlpha.toFixed(2));
        const w0 = wrapRange(360 - groundScroll * 1.35, 900, 120);
        const w1 = wrapRange(640 - groundScroll * 1.55, 900, 120);
        const w2 = wrapRange(120 - groundScroll * 1.25, 900, 120);
        els.wisp0.setAttribute("x1", w0.toFixed(1));
        els.wisp0.setAttribute("x2", (w0 + 56).toFixed(1));
        els.wisp1.setAttribute("x1", w1.toFixed(1));
        els.wisp1.setAttribute("x2", (w1 + 68).toFixed(1));
        els.wisp2.setAttribute("x1", w2.toFixed(1));
        els.wisp2.setAttribute("x2", (w2 + 46).toFixed(1));
      }

      // ==================== ANIMATION LOOP & CONTROLS ====================
      function tick(now) {
        if (lastTimestamp === null) {
          lastTimestamp = now;
        }
        const dt = Math.min(0.05, (now - lastTimestamp) / 1000);
        lastTimestamp = now;

        if (playing) {
          const effDt = dt * speedMultiplier;
          elapsedSec += dt;
          crankTheta += BASE_CRANK_OMEGA * effDt;

          if (bellRingTimer > 0) {
            bellRingTimer = Math.max(0, bellRingTimer - dt);
          }
          if (fishEvent.active) {
            fishEvent.progress += dt / 1.32;
            if (fishEvent.progress >= 1) {
              fishEvent.active = false;
              fishEvent.progress = 0;
            }
          }

          renderFrame(crankTheta, elapsedSec);
        }

        requestAnimationFrame(tick);
      }

      // Expose deterministic hook for frame testing if desired
      window.__setPelicanFrame = function (thetaRad, sec, triggerFishProgress) {
        if (typeof triggerFishProgress === "number") {
          fishEvent.active = true;
          fishEvent.progress = triggerFishProgress;
          bellRingTimer = 0.5;
        } else {
          fishEvent.active = false;
        }
        crankTheta = thetaRad;
        elapsedSec = sec || 0;
        renderFrame(crankTheta, elapsedSec);
      };

      // Wire UI Controls
      els.playPauseBtn.addEventListener("click", function () {
        playing = !playing;
        els.playPauseBtn.textContent = playing ? "Pause" : "Play";
      });

      els.speedSlider.addEventListener("input", function (e) {
        speedMultiplier = parseFloat(e.target.value);
        els.speedReadout.textContent = `${speedMultiplier.toFixed(1)}x`;
        if (!playing && speedMultiplier > 0) {
          playing = true;
          els.playPauseBtn.textContent = "Pause";
        }
      });

      els.themeBtn.addEventListener("click", function () {
        themeIndex = (themeIndex + 1) % THEMES.length;
        applyTheme(themeIndex);
        renderFrame(crankTheta, elapsedSec);
      });

      els.fishBtn.addEventListener("click", triggerBellAndFish);
      els.svgViewport.addEventListener("click", triggerBellAndFish);

      // Initial render & start loop
      applyTheme(0);
      renderFrame(crankTheta, elapsedSec);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
